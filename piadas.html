<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark" data-skin="rabisco" data-layout="notebook">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#1f2c2b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fff3d6'/%3E%3Ctext x='32' y='46' font-size='38' text-anchor='middle'%3E%F0%9F%98%82%3C/text%3E%3C/svg%3E">
<title>Caderno de Piadas</title>
<style>
/* =====================================================================
   ESTILOS — as cores vêm das variáveis (--bg, --accent…), trocadas pelo seletor de visuais
   ===================================================================== */
:root{
  --radius:16px; --radius-sm:11px; --danger:#ef4444; --warn:#f59e0b;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --bg:#120d1c; --header:#1a1230; --surface:#1f1638; --surface2:#2a1f4a; --border:#44357a;
  --text:#f4efff; --muted:#a99bd6; --accent:#ffc83d; --accent-ink:#2a1f00; --accent-soft:rgba(255,200,61,.16);
  --shadow:0 8px 28px rgba(0,0,0,.45); --glow:none; --header-img:none; --body-img:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);background-image:var(--body-img);background-attachment:fixed;color:var(--text);font-family:var(--font);line-height:1.45;font-size:15px;transition:background .2s,color .2s}
h1,h2,h3,h4{margin:0;line-height:1.2;font-family:var(--font-head,var(--font))}
h1{letter-spacing:var(--head-ls,0);text-transform:var(--head-tt,none)}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.muted{color:var(--muted)} .small{font-size:13px} .hidden{display:none!important}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
body.locked #app-header,body.locked #notices,body.locked #tabs,body.locked #view{display:none}
body.blur #view,body.blur #tabs{filter:blur(16px);pointer-events:none;user-select:none}

/* ---------- Cabeçalho e abas ---------- */
.app-header{position:sticky;top:0;z-index:20;background:var(--header);background-image:var(--header-img);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
.header-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}
.logo{width:36px;height:36px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:20px;box-shadow:var(--glow)}
.header-actions{margin-left:auto;display:flex;gap:8px}
.icon-btn{border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:var(--radius-sm);min-width:40px;min-height:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;position:relative}
.icon-btn:hover{border-color:var(--accent)}
.badge-dot{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:var(--warn);border:2px solid var(--header)}
.tabs{max-width:1100px;margin:0 auto;display:flex;overflow-x:auto;gap:4px;padding:0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:none;color:var(--muted);padding:11px 14px;border-bottom:3px solid transparent;font-weight:600;white-space:nowrap;min-height:44px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
html[data-tabs="pills"] .tabs{padding:8px 10px;gap:6px}
html[data-tabs="pills"] .tab{border-bottom:0;border-radius:999px;padding:8px 16px;min-height:0;background:var(--surface2);border:1px solid var(--border)}
html[data-tabs="pills"] .tab.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:var(--glow)}
main{max-width:1100px;margin:0 auto;padding:18px 16px calc(90px + env(safe-area-inset-bottom))}
.notice{max-width:1100px;margin:10px auto 0;padding:0 16px}
.notice-in{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--warn);border-radius:var(--radius-sm);padding:8px 12px}
.notice-in.err{border-left-color:var(--danger);color:var(--text)}
button.link{background:none;border:0;color:var(--accent);padding:4px 2px;text-decoration:underline;font-size:inherit}

/* ---------- Botões, cartões, grades ---------- */
.btn{border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:var(--radius-sm);padding:9px 14px;min-height:40px;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:var(--glow)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 50%,var(--border))}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;min-height:34px;font-size:13px}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card.elev{box-shadow:var(--shadow)}
.card h3{font-size:16px;margin-bottom:10px}
.page-head{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:2px}
.page-head h1{font-size:25px}
.grid{display:grid;gap:12px}
.grid.stats{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.grid.cards{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.stat .v{font-size:26px;font-weight:800;line-height:1.1}
.stat .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:99px;font-size:12px;background:var(--accent-soft);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.chip.plain{background:var(--surface2);color:var(--muted);border-color:var(--border)}
.chip.warn{background:rgba(245,158,11,.14);color:var(--warn);border-color:rgba(245,158,11,.4)}
.chip.bad{background:rgba(239,68,68,.14);color:var(--danger);border-color:rgba(239,68,68,.4)}
.chip.ok{background:rgba(52,211,153,.14);color:#34d399;border-color:rgba(52,211,153,.4)}
button.chip{cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:26px 12px}
.empty .big{font-size:40px;margin-bottom:6px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.list li{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--surface2);border-radius:var(--radius-sm);border:1px solid var(--border);flex-wrap:wrap}
.list li .t{flex:1;min-width:0}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;color:var(--muted);font-weight:600}
.seg button.active{background:var(--accent);color:var(--accent-ink)}
.seg-scroll{overflow-x:auto;max-width:100%;padding-bottom:2px}
.seg-scroll .seg{white-space:nowrap}
.note{background:var(--accent-soft);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px}
.text-block{white-space:pre-wrap;word-wrap:break-word}
hr.sep{border:0;border-top:1px solid var(--border);margin:16px 0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--border);font-size:14px}
.kv:last-child{border-bottom:0}
.pbar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--border)}
.pbar i{display:block;height:100%;border-radius:99px;transition:width .3s}

/* ---------- Piadas ---------- */
.joke{position:relative;background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--cc,var(--accent));border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.joke .favbtn{position:absolute;top:8px;right:8px}
.joke .jt{padding-right:42px}
.joke.fav{box-shadow:0 0 0 1px var(--accent) inset}
.joke .jt{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.joke .setup{font-size:16px;font-weight:600}
.joke .punch{font-size:16px;color:var(--accent);font-weight:700;background:var(--accent-soft);border-radius:var(--radius-sm);padding:8px 10px}
.joke .punch.hide{color:transparent;text-shadow:0 0 12px var(--muted);cursor:pointer;user-select:none}
.joke .tagline{font-size:14px;color:var(--muted);font-style:italic}
.stars{letter-spacing:2px;color:var(--accent);font-size:14px}
.joke-actions{display:flex;gap:6px;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters .input{width:auto;flex:1 1 140px;min-width:120px}
.catbar{display:flex;gap:6px;flex-wrap:wrap}
.catbar .btn{border-radius:999px}
.catdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;flex:0 0 auto;border:1px solid rgba(128,128,128,.5)}
.catbar.sub{padding:6px 0 6px 12px;margin-left:6px;border-left:4px solid var(--cc,var(--accent));align-items:center}
.catbar.sub .sublbl{margin-right:2px}
.catbar-edit{flex-direction:column;align-items:flex-start}
.btn.part{border-style:dashed;border-color:var(--cc,var(--accent))}
.btn.on .catdot{border-color:var(--accent-ink)}
.swatches{display:flex;flex-wrap:wrap;gap:9px;align-items:center;padding:2px}
.sw{width:30px;height:30px;min-height:0;border-radius:50%;border:2px solid rgba(128,128,128,.55);background:var(--sw);padding:0;cursor:pointer;flex:0 0 auto}
.sw:hover{transform:scale(1.12)}
.sw.on{border-color:var(--text);box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--text)}
.sw-custom{width:38px;height:30px;padding:0;border:2px dashed rgba(128,128,128,.7);border-radius:8px;background:none;cursor:pointer}
.sw-custom.on{border:2px solid var(--text)}

/* ---------- Formulários ---------- */
.form{display:flex;flex-direction:column;gap:14px}
.form-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;grid-column:span 6}
.fld.w3{grid-column:span 3} .fld.w2{grid-column:span 2}
@media (max-width:520px){.fld.w3{grid-column:span 6}}
.fld label{font-size:13px;font-weight:600;color:var(--muted)}
.fld .hint{font-size:12px;color:var(--muted)}
.fld input[type=text],.fld input[type=number],.fld input[type=date],.fld input[type=time],.fld input[type=password],.fld select,.fld textarea,.input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:16px;min-height:42px;outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus,.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fld textarea,textarea.input{resize:vertical;min-height:80px}
.fld.check{flex-direction:row;align-items:center;gap:10px}
.fld.check input{width:20px;height:20px;accent-color:var(--accent)}
.fld.check label{color:var(--text);font-size:14px}
.fld .info{padding:10px 12px;border-radius:var(--radius-sm);background:var(--accent-soft);font-size:13px;line-height:1.5}
.fld .info b{color:var(--text)}
.multi{display:flex;gap:6px;flex-wrap:wrap}
.multi button{border:1px solid var(--border);background:var(--surface2);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;min-height:36px}
.multi button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rating{display:flex;gap:4px}
.rating button{border:0;background:none;font-size:28px;line-height:1;color:var(--border);padding:2px;min-width:36px;min-height:40px}
.rating button.on{color:var(--accent)}
.form-error{color:var(--danger);font-size:14px}
.form-error:empty{display:none}

/* ---------- Janelas, avisos ---------- */
.modal-back{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.modal{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:20px;width:100%;max-width:560px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.modal.wide{max-width:760px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal-head h2{font-size:18px}
.modal-body{padding:16px;overflow:auto}
.modal-foot{position:sticky;bottom:0;background:var(--surface);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px;padding-top:12px}
body.modal-open{overflow:hidden}
@media (max-width:560px){.modal-back{align-items:flex-end;padding:0}.modal{max-width:none;border-radius:20px 20px 0 0;max-height:92vh}}
#toast-root{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));z-index:300;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:var(--shadow);max-width:90vw;animation:pop .2s ease}
.toast.err{background:var(--danger);color:#fff}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* ---------- Modo palco e bloqueio ---------- */
#stage{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.stage-top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--header)}
.stage-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:20px clamp(16px,5vw,60px);max-width:1000px;margin:0 auto;width:100%;overflow:auto}
.stage-setup{font-size:clamp(24px,5.2vw,52px);font-weight:700;line-height:1.25}
.stage-punch{font-size:clamp(24px,5.2vw,52px);font-weight:800;color:var(--accent);line-height:1.25;min-height:1.3em}
.stage-tag{font-size:clamp(18px,3vw,30px);color:var(--muted);font-style:italic}
.stage-foot{display:flex;gap:10px;padding:14px 16px;border-top:1px solid var(--border);background:var(--header)}
.stage-foot .btn{flex:1;min-height:56px;font-size:18px}
#lock{position:fixed;inset:0;z-index:400;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.lockbox{width:100%;max-width:340px;text-align:center;display:flex;flex-direction:column;gap:14px}
.dots{display:flex;gap:12px;justify-content:center;min-height:20px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad button{min-height:60px;font-size:24px;font-weight:700;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface2)}
.keypad button:active{background:var(--accent);color:var(--accent-ink)}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

@media (max-width:480px){.header-actions .icon-btn .small{display:none}.header-actions{gap:6px}}
.catedit{gap:4px;cursor:default;align-items:center}
.cat-x{border:0;background:none;color:inherit;padding:0 4px;min-height:0;font-size:14px;cursor:pointer;opacity:.8}
.cat-x:hover{opacity:1}
.cat-x.danger{color:var(--danger)}
/* ---------- Notas do dia a dia ---------- */
.notas-grid{columns:260px;column-gap:12px}
.nota{break-inside:avoid;margin:0 0 12px;display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.ndot{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);padding:0}
.ndot.on{border-color:var(--text);box-shadow:0 0 0 2px var(--accent-soft)}
button.chip-btn{cursor:pointer;font:inherit;font-size:12px}
/* ---------- Gráficos e utilidades ---------- */
.hbar{display:grid;grid-template-columns:minmax(80px,160px) 1fr auto;gap:10px;align-items:center;padding:4px 0;font-size:14px}
.hbar .bar{height:14px;border-radius:99px;background:var(--surface2);overflow:hidden}
.hbar .bar i{display:block;height:100%;border-radius:99px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.chart-scroll{overflow-x:auto}
.ax{fill:var(--muted);font-size:11px} .gl{stroke:var(--border);stroke-width:1} .blab{fill:var(--text);font-size:10px;font-weight:700;text-anchor:middle}
.timer{font-size:46px;font-weight:800;font-variant-numeric:tabular-nums;text-align:center}
.skin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.skin-card{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface2);border:2px solid var(--border);border-radius:var(--radius);padding:10px;color:var(--text)}
.skin-card.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.skin-card .nm{font-weight:800;display:flex;justify-content:space-between;gap:6px;align-items:center}
.skin-card .ds{font-size:12px;color:var(--muted)}
.skin-prev{display:flex;flex-direction:column;gap:5px;border-radius:10px;padding:8px;height:84px;border:1px solid rgba(128,128,128,.35)}
.color-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.color-row input[type=color]{width:46px;height:40px;padding:0;border:1px solid var(--border);border-radius:10px;background:var(--surface2);cursor:pointer}
.welcome{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.welcome h1{font-size:30px}
.steps{counter-reset:s;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start}
.steps li::before{content:counter(s);flex:0 0 26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:13px}
.daydots{display:flex;gap:5px;flex-wrap:wrap}
.daydots i{width:16px;height:16px;border-radius:5px;background:var(--surface2);border:1px solid var(--border)}
.daydots i.on{background:var(--accent);border-color:var(--accent)}
.meter{height:12px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--border)}
.meter i{display:block;height:100%}
.check-ok{color:#34d399} .check-warn{color:var(--warn)}
.appsbar{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;padding:4px 8px;padding-top:calc(4px + env(safe-area-inset-top));background:var(--surface2,#15271f);border-bottom:1px solid var(--border,#244236);font-size:12.5px}.appsbar a{padding:3px 12px;border-radius:99px;color:var(--muted,#8fb3a1);text-decoration:none;white-space:nowrap}.appsbar a:hover{color:var(--text,#fff)}.appsbar a[aria-current=page]{background:var(--accent-soft,rgba(61,255,154,.14));color:var(--accent,#3dff9a);font-weight:700}@media print{.appsbar{display:none}}
/* =====================================================================
   IDENTIDADE VISUAL — Caderno de Piadas (layout "notebook": capa, abas de índice e folha pautada)
   ===================================================================== */
html[data-layout="notebook"]{--line:var(--text);--paper-line:rgba(70,120,210,.2);--paper-margin:rgba(235,70,90,.5);--tape:rgba(255,235,150,.75)}
html[data-layout="notebook"][data-theme="dark"]{--paper-line:rgba(240,236,220,.07);--paper-margin:rgba(255,120,130,.4);--tape:rgba(255,235,170,.28)}
html[data-layout="notebook"] body{font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
html[data-layout="notebook"] h1,html[data-layout="notebook"] h2,html[data-layout="notebook"] h3{font-family:var(--font-head);letter-spacing:0}
/* capa */
html[data-layout="notebook"] .app-header{border-bottom:4px solid var(--line);position:relative}
html[data-layout="notebook"][data-theme="light"][data-skin="rabisco"] .app-header{color:#1d1712}
html[data-layout="notebook"] .header-inner{max-width:1040px;padding:12px 18px}

<script>
'use strict';
/* =====================================================================
   CADERNO DE PIADAS — app pessoal em um único arquivo (offline)
   Módulos: 0 Utilitários · 1 Dados · 2 Interface base · 3 Visuais · 4 Bloqueio (PIN)

            11 Estatísticas · 12 Início · 13 Exemplos e inicialização
   ===================================================================== */
const APP_ID = 'caderno-de-piadas';
const STORAGE_KEY = 'piadas:dados';
const PREV_KEY = STORAGE_KEY + ':anterior';

   0. UTILITÁRIOS
   ===================================================================== */
const $ = (sel, root = document) => root.querySelector(sel);

function textMatch(hay, q) {
  const a = normText(hay).replace(/[^a-z0-9]+/g, ' '), b = normText(q).replace(/[^a-z0-9]+/g, ' ').trim();
  return !b || a.includes(b) || a.replace(/ /g, '').includes(b.replace(/ /g, ''));

const shuffled = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
/** número pseudo-aleatório estável a partir de um texto (para o "do dia") */
function seedFrom(str) { let hsh = 2166136261; for (let i = 0; i < str.length; i++) { hsh ^= str.charCodeAt(i); hsh = Math.imul(hsh, 16777619); } return hsh >>> 0; }

function toast(msg, kind) { const t = h('div', { class: 'toast ' + (kind || '') }, msg); $('#toast-root').appendChild(t); setTimeout(() => t.remove(), 3200); }

  document.body.appendChild(a); a.click();

/* =====================================================================
   1. DADOS (localStorage com versão do formato e migrações)
   ===================================================================== */
const DEFAULT_CATS = [['c_troca', 'Trocadilhos', '🧩', '#ffb703'], ['c_tio', 'Tiozão', '🧔', '#fb8500'], ['c_fut', 'Futebol', '⚽', '#3ddc84'], ['c_esc', 'Escola', '🎒', '#4aa3ff'],
  ['c_fam', 'Família', '🏠', '#ff7aa8'], ['c_obs', 'Observacional', '👀', '#a78bfa'], ['c_cur', 'Curtas', '⚡', '#ffd60a'], ['c_lon', 'Longas', '📜', '#c58b5a'],
  ['c_imp', 'Improviso', '🎲', '#2dd4bf'], ['c_can', 'Cantadas', '💘', '#ff4d6d'], ['c_nerd', 'Nerd & Tech', '🤓', '#7dd3fc'], ['c_out', 'Outras', '🎭', '#94a3b8']];
const STATUS = [['ideia', '💭 Ideia'], ['rascunho', '✏️ Rascunho'], ['testando', '🧪 Testando'], ['aprovada', '✅ Aprovada'], ['aposentada', '🪦 Aposentada']];

const ORIGINS = [['minha', 'Inventada por mim'], ['ouvida', 'Ouvida / vista'], ['adaptada', 'Adaptada']];
const REACTIONS = [[0, '🔁', 'Já conhecia'], [1, '😐', 'Silêncio'], [2, '🙂', 'Sorriso'], [3, '😄', 'Riso'], [4, '🤣', 'Gargalhada']];

function defaultState() {
  return {
    version: SCHEMA_VERSION,
    meta: { createdAt: new Date().toISOString(), lastBackup: null, theme: 'dark', skin: 'rabisco', look: 'v2', accent: '', autoBackup: true, name: '', welcomeDismissed: false,
      pinHash: '', pinSalt: '', pinLen: 4, lockOnHide: false, nav: { tab: 'inicio' } },
    categories: DEFAULT_CATS.map(([id, name, emoji, color]) => ({ id, name, emoji, color })),
    jokes: [],      // {id,title,setup,punch,tag,notes,categoryId,sub,tags[],status,rating,origin,source,date,audiences[],boldness,favorite,versions[],perfs[],createdAt,updatedAt}
    ideas: [],      // {id,text,date,done}
    sets: [],       // repertórios {id,name,context,notes,items:[idPiada],createdAt}
    daily: { log: [] },  // desafio diário {date,jokeId}
    notes: []       // blocos de notas do dia a dia {id,title,text,color,pinned,createdAt,updatedAt}
  };
}
const MIGRATIONS = { 0: d => d };
function migrate(d) { let v = Number(d.version) || 0; while (v < SCHEMA_VERSION) { if (MIGRATIONS[v]) d = MIGRATIONS[v](d) || d; v++; d.version = v; } return d; }

  for (const k in defs) {

    if (!(k in target) || target[k] == null) target[k] = clone(dv);
    else if (isObj(dv) && isObj(target[k])) fillDefaults(target[k], dv);
    else if (Array.isArray(dv) && !Array.isArray(target[k])) target[k] = clone(dv);
    else if (isObj(dv) && !isObj(target[k])) target[k] = clone(dv);

  if (!raw) return defaultState();

    let d = JSON.parse(raw);
    if (!isObj(d)) throw new Error('formato');
    if ((Number(d.version) || 0) > SCHEMA_VERSION) { storageStatus.tooNew = true; return fillDefaults(d, defaultState()); }
    if ((Number(d.version) || 0) < SCHEMA_VERSION) { try { localStorage.setItem(PREV_KEY, raw); } catch (e) {} d = migrate(d); }
    const oldLook = !d.meta || d.meta.look !== 'v2';      // 1ª abertura com o visual novo: quem ainda usava o visual original passa para o Caderno de Rabiscos
    d = fillDefaults(d, defaultState());
    if (oldLook) { if (d.meta.skin === 'palco') d.meta.skin = 'rabisco'; d.meta.look = 'v2'; }
    return d;
  } catch (e) {

  }

  if (storageStatus.tooNew) return;

let state = loadState();
function commit() { saveState(); render(); }
const hasAnyData = () => state.jokes.length > 0 || state.ideas.length > 0 || state.sets.length > 0 || state.notes.length > 0;

/* ---- modelo de piada: funções de apoio ---- */
const getCat = id => state.categories.find(c => c.id === id) || null;
/* ---- categorias aninhadas: categoria dentro de categoria (até 3 níveis) ---- */
const CAT_MAX_DEPTH = 3;
const catParent = c => (c && c.parentId && c.parentId !== c.id && getCat(c.parentId)) || null;

}

      ctx.fillStyle = col('--accent'); ctx.fillRect(0, 0, W, 16);

      (() => { const all = J.flatMap(j => (j.perfs || []).map(p => ({ j, p }))).sort((a, b) => b.p.date.localeCompare(a.p.date)).slice(0, 3); return all.length ? h('ul', { class: 'list' }, all.map(({ j, p }) => h('li', null, h('span', { style: { fontSize: '20px' } }, reactionOf(p.reaction)[1]), h('div', { class: 't' }, jokeTitle(j).slice(0, 50), h('div', { class: 'muted small' }, `${fmtDate(p.date)} · ${(AUDIENCES.find(a => a[0] === p.audience) || ['', p.audience])[1]}`))))) : h('p', { class: 'muted' }, 'Ainda sem registros. Use "🎭 Contei" numa piada.'); })())));
  wrap.appendChild(grid);
  if (!J.length) wrap.appendChild(h('div', { class: 'card' }, h('div', { class: 'empty' }, h('div', { class: 'big' }, '😂'), h('p', null, 'Seu caderno ainda está vazio.'), h('div', { class: 'row', style: { justifyContent: 'center', marginTop: '10px' } }, h('button', { class: 'btn primary', type: 'button', onclick: () => openJokeForm() }, '＋ Anotar uma piada'), h('button', { class: 'btn', type: 'button', onclick: () => loadSamples() }, '✨ Carregar exemplos')))));
  return wrap;
}

const SAMPLE_CATS = () => state.categories.filter(c => SAMPLES.some(s => s[0] === c.id));
function addSample(s, status) {
  const now = new Date().toISOString(), cat = getCat(s[0]) ? s[0] : 'c_out';
  state.jokes.push({ id: uid(), title: '', setup: s[2], punch: s[3], tag: s[4] || '', notes: '', categoryId: cat, sub: s[1] || '', tags: [], status: status || 'rascunho', rating: 0, origin: 'ouvida', source: 'Exemplo do app', date: todayISO(), audiences: s[5] || [], boldness: s[6] || 1, favorite: false, versions: [], perfs: [], createdAt: now, updatedAt: now });

function loadSamples(silent) {
  const key = j => normText(j.setup + '|' + j.punch), have = new Set(state.jokes.map(key)); let n = 0;

/* =====================================================================
   INSTALAR NO CELULAR (PWA) — manifesto, service worker e orientações
   ===================================================================== */
const PWA = { html: 'piadas.html', manifest: 'manifest-piadas.webmanifest', sw: 'sw-piadas.js', icon: 'icon-piadas', name: 'Caderno de Piadas' };
let deferredInstall = null;
const isStandalone = () => (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
function setupPwa() {
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (typeof renderHeader === 'function') renderHeader(); });
  window.addEventListener('appinstalled', () => { deferredInstall = null; toast('App instalado!'); });
  if (!/^https?:$/.test(location.protocol)) return;                    // só funciona hospedado (https ou localhost)
  const add = (rel, href) => { const l = document.createElement('link'); l.rel = rel; l.href = href; document.head.appendChild(l); };
  add('manifest', PWA.manifest); add('apple-touch-icon', PWA.icon + '-192.png');
  /* escopo próprio: assim os três apps da mesma pasta não se atrapalham */
  if ('serviceWorker' in navigator) navigator.serviceWorker.register(PWA.sw, { scope: './' + PWA.html }).catch(() => {});
}
function openInstallModal() {
  const hosted = /^https?:$/.test(location.protocol), ios = /iphone|ipad|ipod/i.test(navigator.userAgent), box = h('div', { class: 'stack' });
  const m = openModal({ title: '📲 Instalar no celular', body: box, size: 'wide' });
  const step = (n, t) => h('li', null, h('div', null, t));
  box.append(...[
    h('div', { class: 'note' }, isStandalone() ? '✅ Você já está usando o app instalado.' : hosted ? '🌐 Esta página está hospedada: dá para instalar como app.' : '📁 Você abriu o arquivo direto do aparelho (file://). Para instalar como app é preciso hospedar os arquivos — veja a opção B.'),
    deferredInstall && !isStandalone() ? h('button', { class: 'btn primary', type: 'button', onclick: async () => { try { deferredInstall.prompt(); await deferredInstall.userChoice; } catch (e) {} deferredInstall = null; m.close(); } }, '📲 Instalar agora') : null,

        step(3, 'No menu do navegador use "Adicionar à tela inicial" para criar um atalho.')),

    h('div', { class: 'card stack' }, h('h3', { style: { margin: 0 } }, 'Opção B — instalar como app de verdade (recomendado)'),
      h('ol', { class: 'steps' },
        step(1, `Use estes arquivos juntos, na mesma pasta: ${PWA.html}, ${PWA.manifest}, ${PWA.sw}, ${PWA.icon}-192.png e ${PWA.icon}-512.png (já estão na pasta do projeto). Pode subir a pasta inteira.`),
        step(2, `Hospede a pasta em um serviço gratuito de sites estáticos (GitHub Pages, Netlify, Cloudflare Pages…) e abra no celular o endereço que termina em /${PWA.html}.`),
        step(3, ios ? 'iPhone (Safari): botão Compartilhar → "Adicionar à Tela de Início".' : 'Android (Chrome): menu ⋮ → "Instalar app" (ou "Adicionar à tela inicial"). iPhone (Safari): botão Compartilhar → "Adicionar à Tela de Início".'),
        step(4, 'Abra uma vez com internet: depois disso o app funciona offline e atualiza sozinho quando você publicar uma versão nova (a atualização aparece na abertura seguinte).')),
      h('p', { class: 'muted small' }, 'Seus dados NÃO vão para a hospedagem: ficam só no aparelho que usa o app. Para levar os dados de um aparelho para outro, use 💾 Backup → exportar em um e importar no outro.')),
    h('div', { class: 'modal-foot' }, h('button', { class: 'btn', type: 'button', onclick: () => m.close() }, 'Fechar'))].filter(Boolean));
}
