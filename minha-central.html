<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark" data-area="ml" data-layout="dock">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0c1e14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Minha Central">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a1130'/%3E%3Ccircle cx='32' cy='32' r='22' fill='%23c8ff2e'/%3E%3Ctext x='32' y='42' font-family='Arial' font-size='28' font-weight='900' text-anchor='middle' fill='%23142000'%3EM%3C/text%3E%3C/svg%3E"><title>Minha Central</title>
<style>
/* =====================================================================
   ESTILOS — variáveis de tema (4 combinações: tema × área)
   ===================================================================== */
:root{
  --radius:14px; --radius-sm:10px;
  --danger:#ef4444; --warn:#f59e0b; --gold:#f5c542;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
/* Master League — escuro (verde campo) */
html[data-theme="dark"][data-area="ml"]{
  --bg:#08130d; --header:#0c1e14; --surface:#10241a; --surface2:#163023; --border:#25483a;
  --text:#e6f4ea; --muted:#8db3a0; --accent:#3ddc84; --accent-ink:#05210f; --accent-soft:rgba(61,220,132,.14);
  --shadow:0 6px 24px rgba(0,0,0,.35); --stripe:rgba(61,220,132,.05);
  --header-img:repeating-linear-gradient(90deg,var(--stripe) 0 36px,transparent 36px 72px);
}
/* Master League — claro */
html[data-theme="light"][data-area="ml"]{
  --bg:#eef5ef; --header:#ffffff; --surface:#ffffff; --surface2:#f1f7f2; --border:#cfe2d4;
  --text:#112a1b; --muted:#5b7a67; --accent:#12803f; --accent-ink:#ffffff; --accent-soft:rgba(18,128,63,.12);
  --shadow:0 4px 18px rgba(20,60,35,.10); --stripe:rgba(20,138,74,.06);
  --header-img:repeating-linear-gradient(90deg,var(--stripe) 0 36px,transparent 36px 72px);
}
/* Dia a dia — escuro (neutro) */
html[data-theme="dark"][data-area="dd"]{
  --bg:#0e1014; --header:#14171d; --surface:#171b22; --surface2:#1e232c; --border:#2a303b;
  --text:#e9ecf2; --muted:#98a0b0; --accent:#7b93ff; --accent-ink:#0b1030; --accent-soft:rgba(123,147,255,.15);
  --shadow:0 6px 24px rgba(0,0,0,.35); --stripe:transparent;
}
/* Dia a dia — claro */
html[data-theme="light"][data-area="dd"]{
  --bg:#f3f4f7; --header:#ffffff; --surface:#ffffff; --surface2:#f1f2f6; --border:#dcdfe6;
  --text:#1a1e27; --muted:#647084; --accent:#4a63e0; --accent-ink:#ffffff; --accent-soft:rgba(74,99,224,.12);
  --shadow:0 4px 18px rgba(30,40,70,.08); --stripe:transparent;
}

/* ---------- Base ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);background-image:var(--body-img,none);background-attachment:fixed;color:var(--text);font-family:var(--font);line-height:1.45;font-size:15px;transition:background .2s,color .2s}
h1,h2,h3,h4{margin:0;line-height:1.2;font-family:var(--font-head,var(--font))}
h1{text-transform:var(--head-tt,none);letter-spacing:var(--head-ls,0)}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.muted{color:var(--muted)}
.small{font-size:13px}
.hidden{display:none!important}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* ---------- Cabeçalho, área e abas ---------- */
.app-header{position:sticky;top:0;z-index:20;background:var(--header);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
.app-header{background-image:var(--header-img,none)}
.header-inner{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:.2px}
.logo{width:32px;height:32px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:900}
.area-switch{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px}
.area-switch button{border:0;background:none;color:var(--muted);padding:8px 16px;border-radius:999px;font-weight:600;min-height:38px}
.area-switch button.active{background:var(--accent);color:var(--accent-ink);box-shadow:var(--glow,none)}
.header-actions{margin-left:auto;display:flex;gap:8px}
.icon-btn{border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:var(--radius-sm);min-width:40px;min-height:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;position:relative}
.icon-btn:hover{border-color:var(--accent)}
.badge-dot{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:var(--warn);border:2px solid var(--header)}
.tabs{max-width:1120px;margin:0 auto;display:flex;overflow-x:auto;gap:2px;padding:0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:none;color:var(--muted);padding:11px 14px;border-bottom:3px solid transparent;font-weight:600;white-space:nowrap;min-height:44px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
/* abas em formato de pílula (estilos que usam data-tabs="pills") */
html[data-tabs="pills"] .tabs{padding:8px 10px;gap:6px}
html[data-tabs="pills"] .tab{border-bottom:0;border-radius:999px;padding:8px 16px;min-height:0;background:var(--surface2);border:1px solid var(--border)}
html[data-tabs="pills"] .tab.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:var(--glow,none)}
html[data-tabs="pills"] .tab .soon{background:rgba(0,0,0,.18);border-color:transparent;color:inherit}
.tab .soon{font-size:10px;margin-left:6px;padding:1px 6px;border-radius:99px;background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
main{max-width:1120px;margin:0 auto;padding:18px 16px calc(80px + env(safe-area-inset-bottom))}
.notice{max-width:1120px;margin:10px auto 0;padding:0 16px}
.notice-in{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--warn);border-radius:var(--radius-sm);padding:8px 12px}
.notice-in.err{border-left-color:var(--danger);color:var(--text)}
.notice-in button.link{margin-left:auto}
button.link{background:none;border:0;color:var(--accent);padding:4px 2px;text-decoration:underline;font-size:inherit}

/* ---------- Botões ---------- */
.btn{border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:var(--radius-sm);padding:9px 14px;min-height:40px;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:var(--glow,none)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 50%,var(--border))}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;min-height:34px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- Cartões e grades ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card.elev{box-shadow:var(--shadow)}
.card h3{font-size:16px;margin-bottom:10px}
.page-head{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:2px}
.page-head h1{font-size:24px}
.grid{display:grid;gap:12px}
.grid.stats{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.stat .v{font-size:26px;font-weight:800;line-height:1.1}
.stat .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-top:4px}
.hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.ring{width:120px;height:120px;flex:0 0 auto}
.ring-bg{stroke:var(--surface2)} .ring-fg{stroke:var(--accent)} .ring-text{fill:var(--text);font-weight:800;font-size:19px}
.hero-info{flex:1 1 220px;min-width:0}
.ved-bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface2);margin:8px 0}
.ved-bar i{display:block;height:100%}
.ved-w{background:var(--accent)} .ved-d{background:var(--warn)} .ved-l{background:var(--danger)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend b{color:var(--text)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:99px;font-size:12px;background:var(--accent-soft);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.chip.gold{background:rgba(245,197,66,.14);color:var(--gold);border-color:rgba(245,197,66,.4)}
.chip.plain{background:var(--surface2);color:var(--muted);border-color:var(--border)}
.empty{text-align:center;color:var(--muted);padding:26px 12px}
.empty .big{font-size:36px;margin-bottom:6px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.list li{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--surface2);border-radius:var(--radius-sm);border:1px solid var(--border)}
.list li .t{flex:1;min-width:0}
.steps{counter-reset:s;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start}
.steps li::before{content:counter(s);flex:0 0 26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:13px}

/* ---------- Clubes ---------- */
.club{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.club.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.club-top{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.club-title{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.club-title h3{font-size:18px}
.club-meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.club-actions{display:flex;gap:6px;flex-wrap:wrap}
.seasons{border-top:1px solid var(--border);background:var(--surface2);padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.season{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;flex-wrap:wrap}
.season .tn{flex:0 0 auto;min-width:46px;text-align:center;font-weight:800;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:6px 8px}
.season .body{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:4px}
.season .pct{font-weight:800;font-size:18px;text-align:right}
.season .notes{font-size:13px;color:var(--muted);white-space:pre-wrap}
.pos-1{color:var(--gold);font-weight:800}
.chips{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- Formulários ---------- */
.form{display:flex;flex-direction:column;gap:14px}
.form-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;grid-column:span 6}
.fld.w3{grid-column:span 3} .fld.w2{grid-column:span 2}
@media (max-width:480px){.fld.w3{grid-column:span 6}}
.fld label{font-size:13px;font-weight:600;color:var(--muted)}
.fld .hint{font-size:12px;color:var(--muted)}
.fld input[type=text],.fld input[type=number],.fld input[type=date],.fld input[type=time],.fld select,.fld textarea,.input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:16px;min-height:42px;outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus,.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fld textarea{resize:vertical;min-height:80px}
.fld.check{flex-direction:row;align-items:center;gap:10px}
.fld.check input{width:20px;height:20px;accent-color:var(--accent)}
.fld.check label{color:var(--text);font-size:14px}
.fld .info{padding:10px 12px;border-radius:var(--radius-sm);background:var(--accent-soft);color:var(--text);font-weight:600}
.form-error{color:var(--danger);font-size:14px;min-height:0}
.form-error:empty{display:none}

/* ---------- Janelas (modais) e avisos ---------- */
.modal-back{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.modal{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:18px;width:100%;max-width:560px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.modal.wide{max-width:720px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal-head h2{font-size:18px}
.modal-body{padding:16px;overflow:auto}
.modal-foot{position:sticky;bottom:0;background:var(--surface);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px;padding-top:12px}
body.modal-open{overflow:hidden}
@media (max-width:560px){.modal-back{align-items:flex-end;padding:0}.modal{max-width:none;border-radius:18px 18px 0 0;max-height:92vh}}
#toast-root{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:var(--shadow);max-width:90vw;animation:pop .2s ease}
.toast.err{background:var(--danger);color:#fff}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
hr.sep{border:0;border-top:1px solid var(--border);margin:16px 0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--border);font-size:14px}
.kv:last-child{border-bottom:0}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;color:var(--muted);font-weight:600}
.seg button.active{background:var(--accent);color:var(--accent-ink)}

/* ---------- Boas-vindas e "em breve" ---------- */
.welcome{display:flex;flex-direction:column;gap:16px;max-width:860px;margin:0 auto}
.welcome h1{font-size:30px}
.soon-card{text-align:center;padding:34px 18px}
.soon-card .big{font-size:44px}
.soon-card ul{display:inline-block;text-align:left;color:var(--muted);margin:14px 0 0;padding-left:20px}

/* ---------- Elenco ---------- */
.grid.hl{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.hl-card h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hl-card .list li{padding:7px 10px}
.linkish{background:none;border:0;padding:0;text-align:left;font-weight:600;color:var(--text);text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:3px}
.linkish:hover{text-decoration-color:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters .input{width:auto;flex:1 1 150px;min-width:130px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;min-width:760px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--surface2)}
.tbl .num{text-align:right;white-space:nowrap}
.tbl td .sub{font-size:12px;color:var(--muted)}
.ovr{display:inline-block;min-width:36px;text-align:center;padding:2px 7px;border-radius:8px;font-weight:800;background:var(--surface2);border:1px solid var(--border)}
.ovr-s{background:rgba(245,197,66,.18);color:var(--gold);border-color:rgba(245,197,66,.5)}
.ovr-a{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.ovr-b{background:rgba(74,163,255,.15);color:#4aa3ff;border-color:rgba(74,163,255,.4)}
.ovr-c{color:var(--text)} .ovr-d{color:var(--muted)}
.chip.warn{background:rgba(245,158,11,.14);color:var(--warn);border-color:rgba(245,158,11,.4)}
.chip.bad{background:rgba(239,68,68,.14);color:var(--danger);border-color:rgba(239,68,68,.4)}
@media (max-width:720px){
  .tbl-wrap{border:0;background:none;overflow:visible}
  .tbl{min-width:0}
  .tbl thead{display:none}
  .tbl,.tbl tbody{display:block}
  .tbl tr{display:block;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;padding:6px 12px}
  .tbl td{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--border);text-align:right}
  .tbl td::before{content:attr(data-l);color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.4px;text-align:left}
  .tbl td.first{font-size:16px;font-weight:700}
  .tbl td.first::before{content:none}
  .tbl .num{text-align:right}
}

/* ---------- Prancheta ---------- */
.board{display:grid;grid-template-columns:minmax(0,460px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.board{grid-template-columns:minmax(0,1fr)}}
.pitch{width:100%;max-width:460px;height:auto;display:block;margin:0 auto;border-radius:14px;box-shadow:var(--shadow);user-select:none;-webkit-user-select:none;background:#1f7a3a}
.token{cursor:grab;touch-action:none}
.token:active{cursor:grabbing}
.tk-name{fill:#fff;font-size:11px;font-weight:700;paint-order:stroke;stroke:rgba(0,0,0,.8);stroke-width:3px;text-anchor:middle;pointer-events:none}
.tk-in{font-size:12px;font-weight:800;text-anchor:middle;pointer-events:none}
.dirty{font-size:12px;color:var(--warn);font-weight:600}
.bench{display:flex;gap:6px;flex-wrap:wrap}
.pick-list{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto;margin-top:10px}
.pick{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;min-height:44px}
.pick:hover{border-color:var(--accent)}
.pick .t{flex:1;min-width:0}

/* ---------- Guia de táticas ---------- */
.mini{width:120px;height:auto;flex:0 0 auto;border-radius:8px;background:#1f7a3a}
.guide-top{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.guide-top .txt{flex:1 1 200px;min-width:0}
.pc{margin:4px 0 10px;padding-left:18px}
.pc li{margin:2px 0}
.guide h4{font-size:13px;margin:10px 0 2px;text-transform:uppercase;letter-spacing:.5px}
.guide h4.pro{color:var(--accent)} .guide h4.con{color:var(--danger)} .guide h4.neu{color:var(--muted)}
.note{background:var(--accent-soft);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px}
.seg-scroll{overflow-x:auto;max-width:100%;padding-bottom:2px}
.seg-scroll .seg{white-space:nowrap}
.seg.big button{padding:9px 18px}
.kv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 14px;margin:8px 0}
.kv-grid div{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px}
.kv-grid b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600}

/* ---------- Dashboard (gráficos em SVG) ---------- */
.chart-scroll{overflow-x:auto;padding-bottom:4px}
.chart-scroll svg{display:block}
.ax{fill:var(--muted);font-size:11px}
.gl{stroke:var(--border);stroke-width:1}
.blab{fill:var(--text);font-size:10px;font-weight:700;text-anchor:middle}

.stat-row{display:grid;grid-template-columns:64px 1fr 64px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.stat-row .lab{grid-column:1/-1;text-align:center;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:-4px}

.split{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--surface2)}
.split i:first-child{background:#4aa3ff} .split i:last-child{background:#ff6b6b}

/* ---------- Desafios e Road to Glory ---------- */

.medal-row{display:flex;gap:12px;flex-wrap:wrap}
.medal-box{flex:1 1 110px;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 8px}
.medal-box .m{font-size:34px;line-height:1}

.pbar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--border)}

<script>
'use strict';
/* =====================================================================
   MINHA CENTRAL — app pessoal em um único arquivo (offline)
   Módulos:  0 Utilitários · 1 Armazenamento · 2 Interface base ·
             3 Backup · 4 Áreas/abas/navegação · 5 Boas-vindas ·
             6 ML: dados e estatísticas · 7 ML: Início · 8 ML: Clubes ·
             9 ML: Elenco · 10 ML: Prancheta · 11 ML: Táticas (guia PES 2020) ·
             12 ML: Dashboard · 13 ML: Diário · 14 ML: Premiações ·
             15 ML: Táticas — vida real (análise de partidas) ·
             16 ML: Desafios (sorteador + Road to Glory) ·
             17 Dia a dia: Gastos · 18 Dia a dia: Rotina · 19 Dia a dia: Tarefas ·
             20 Dia a dia: Vocacional (RIASEC) · 21 Marcador "em breve" · 22 Inicialização ·
             23 Padrões · 24 Comparador · 25 Compartilhar/Relatório · 26 Tradução PES/Experimentos ·
             27 Painel geral · 28 Backup automático · 29 Instalar no celular (PWA)
   Para adicionar uma aba nova: crie a função render e registre-a em AREAS (módulo 4).
   ===================================================================== */

const APP_ID = 'minha-central';
const APP_PHASE = 5;

/* =====================================================================
   0. UTILITÁRIOS
   ===================================================================== */
const $ = (sel, root = document) => root.querySelector(sel);

/** Construtor de elementos DOM (h = HTML, sv = SVG). Textos nunca viram HTML => sem injeção. */
function mk(ns) {
  return function (tag, attrs, ...kids) {
    const el = ns ? document.createElementNS(ns, tag) : document.createElement(tag);
    if (attrs) {
      for (const k in attrs) {
        const v = attrs[k];
        if (v == null || v === false) continue;
        if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
        else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
        else if (!ns && (k === 'value' || k === 'checked' || k === 'selected')) el[k] = v;
        else el.setAttribute(k, v === true ? '' : String(v));
      }
    }
    appendKids(el, kids);
    return el;
  };
}
function appendKids(el, kids) {
  for (const k of kids) {
    if (k == null || k === false || k === true) continue;
    if (Array.isArray(k)) appendKids(el, k);
    else el.appendChild(k instanceof Node ? k : document.createTextNode(String(k)));
  }
}
const h = mk(null);
const sv = mk('http://www.w3.org/2000/svg');

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const clone = o => JSON.parse(JSON.stringify(o));
const isObj = o => o && typeof o === 'object' && !Array.isArray(o);

/** dd/mm/aaaa a partir de 'AAAA-MM-DD' ou de uma data ISO completa */
function fmtDate(v) {
  if (!v) return '—';
  const s = String(v);
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if (m) return `${m[3]}/${m[2]}/${m[1]}`;
  const d = new Date(s);
  if (isNaN(d)) return '—';
  return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
}
function fmtDateTime(v) {
  const d = new Date(v);
  if (isNaN(d)) return '—';
  return `${fmtDate(v)} às ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const fmtNum = (n, dec = 0) => Number(n).toLocaleString('pt-BR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
const fmtPct = p => (p == null ? '—' : fmtNum(p, 1) + '%');
/** inteiro >= 0 (vazio/ruim vira 0) */
const toInt = v => { const n = parseInt(v, 10); return Number.isFinite(n) && n >= 0 ? n : 0; };
const plural = (n, um, varios) => `${fmtNum(n)} ${n === 1 ? um : varios}`;

/* =====================================================================
   1. ARMAZENAMENTO (localStorage) + VERSÃO DO FORMATO + MIGRAÇÕES
   ===================================================================== */
const STORAGE_KEY = 'minha-central:dados';
const PREV_KEY = STORAGE_KEY + ':anterior';        // cópia de segurança antes de migrar/importar/apagar
const SCHEMA_VERSION = 1;                         // aumente quando o formato dos dados mudar
const storageStatus = { unavailable: false, tooNew: false, corrupt: false, saveFailed: false };

function defaultState() {
  return {
    version: SCHEMA_VERSION,
    meta: {
      createdAt: new Date().toISOString(), lastBackup: null,
      theme: 'dark', skin: 'transmissao', look: 'v2', accent: '', autoBackup: true, coachName: '', currency: '€', welcomeDismissed: false,
      nav: { area: 'home', tab: { home: 'painel', ml: 'inicio', dd: 'gastos' } }
    },
    ml: {                                          // Master League
      clubs: [],            // passagens: {id,name,league,country,startSeason,endSeason,current,seasons:[]}
      settings: { currentSeason: null },   // null = calculada automaticamente
      squad: [],            // jogadores do clube atual: {id,name,pos,age,ovr,pot,contractEnd,salary,value}
      squadArchive: [],     // elencos arquivados: {id,clubId,clubName,season,archivedAt,players:[]}
      tactics: [],          // táticas salvas da prancheta: {id,name,formation,notes,slots:[{pos,x,y,pid,pname}]}
      diary: [],            // {id,title,text,date,kind,clubId,clubName,season,createdAt,updatedAt}
      awards: {},           // por temporada: { "5": {craque:{name,club,note}, ..., selecao:{formation,players:[nomes]}} }
      analyses: [],         // análises táticas de partidas reais (aba Táticas > Vida real)
      patterns: [],         // biblioteca de padrões de jogo (quadros-modelo reaproveitáveis)
      experiments: [],      // diário de experimentos no PES {id,title,analysisId,hypothesis,settings,games:[],verdict,conclusion}
      challenges: { rolls: [], leagues: null, rules: null, nations: null },   // listas null = padrão do app; senão a lista editada por você
      glory: { manual: {}, custom: [] }                          // manual: {id:{done,date}} · custom: conquistas criadas por você
    },
    dd: {                                          // Dia a dia
      transactions: [],     // {id,type:'in'|'out',amount,date,category,note}
      goals: [],            // metas de economia {id,title,target,deadline,deposits:[{id,date,amount}]}
      routine: { blocks: [], checks: {} },   // blocks {id,day 0=seg..6=dom,start,end,title,type} · checks {"AAAA-MM-DD(segunda)|idBloco":true}
      tasks: [],            // {id,title,due,priority,subject,status,notes,createdAt,doneAt}
      vocational: [],       // resultados RIASEC {id,date,answers:[30],scores:{R,I,A,S,E,C}}
      vocDraft: null        // teste em andamento {answers:[...]}
    }
  };
}

/** Migrações: MIGRATIONS[n] converte o formato da versão n para n+1. Nunca apague dados aqui. */
const MIGRATIONS = {
  0: d => d            // 0 -> 1: formato inicial
};
function migrate(d) {
  let v = Number(d.version) || 0;
  while (v < SCHEMA_VERSION) {
    if (MIGRATIONS[v]) d = MIGRATIONS[v](d) || d;
    v++;
    d.version = v;
  }
  return d;
}
/** Completa chaves que faltam (campos novos de versões futuras) sem sobrescrever nada existente */
function fillDefaults(target, defs) {
  for (const k in defs) {
    const dv = defs[k];
    if (!(k in target) || target[k] == null) target[k] = clone(dv);
    else if (isObj(dv) && isObj(target[k])) fillDefaults(target[k], dv);
    else if (Array.isArray(dv) && !Array.isArray(target[k])) target[k] = clone(dv);
    else if (isObj(dv) && !isObj(target[k])) target[k] = clone(dv);
  }
  return target;
}

function loadState() {
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { storageStatus.unavailable = true; }
  if (!raw) return defaultState();
  try {
    let d = JSON.parse(raw);
    if (!isObj(d)) throw new Error('formato');
    if ((Number(d.version) || 0) > SCHEMA_VERSION) {       // dados de um app mais novo: não mexe e não salva
      storageStatus.tooNew = true;
      return fillDefaults(d, defaultState());
    }
    if ((Number(d.version) || 0) < SCHEMA_VERSION) {
      try { localStorage.setItem(PREV_KEY, raw); } catch (e) {}
      d = migrate(d);
    }
    const oldLook = !d.meta || d.meta.look !== 'v2';       // 1ª abertura com o visual novo: quem ainda usava o visual original passa para a Transmissão
    d = fillDefaults(d, defaultState());
    if (oldLook) { if (d.meta.skin === 'campo') d.meta.skin = 'transmissao'; d.meta.look = 'v2'; }
    return d;
  } catch (e) {
    storageStatus.corrupt = true;                           // guarda o texto original antes de qualquer sobrescrita
    try { localStorage.setItem(STORAGE_KEY + ':corrompido', raw); } catch (e2) {}
    return defaultState();
  }
}
function saveState() {
  if (storageStatus.tooNew) return;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    storageStatus.saveFailed = false;
  } catch (e) {
    storageStatus.saveFailed = true;
  }
}

let state = loadState();

/** Salva e redesenha. Chame depois de qualquer alteração em `state`. */
function commit() { saveState(); render(); }

/** Sem dados do usuário? (usado para decidir se o aviso de backup faz sentido) */
function hasAnyData() {
  const nonEmpty = v => Array.isArray(v) ? v.length > 0 : isObj(v) ? Object.values(v).some(nonEmpty) : false;
  return nonEmpty(state.ml) || nonEmpty(state.dd);
}

/* =====================================================================
   2. INTERFACE BASE: janelas, confirmações, formulários, avisos
   ===================================================================== */
const modalStack = [];

function openModal({ title, body, size = '', onClose }) {
  const lastFocus = document.activeElement;
  const back = h('div', { class: 'modal-back' });
  let closed = false;
  const close = () => {
    if (closed) return;
    closed = true;
    const i = modalStack.indexOf(api);
    if (i >= 0) modalStack.splice(i, 1);
    back.remove();
    if (!modalStack.length) document.body.classList.remove('modal-open');
    if (onClose) onClose();
    if (lastFocus && lastFocus.focus) try { lastFocus.focus(); } catch (e) {}
  };
  const box = h('div', { class: 'modal ' + size, role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
    h('div', { class: 'modal-head' },
      h('h2', null, title),
      h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Fechar', onclick: close }, '✕')),
    h('div', { class: 'modal-body' }, body));
  back.appendChild(box);
  $('#modal-root').appendChild(back);
  document.body.classList.add('modal-open');
  const api = { close, el: box };
  modalStack.push(api);
  const first = box.querySelector('input:not([type=checkbox]),textarea,select');
  if (first) setTimeout(() => { try { first.focus(); } catch (e) {} }, 30);
  return api;
}
function closeAllModals() { while (modalStack.length) modalStack[modalStack.length - 1].close(); }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modalStack.length) modalStack[modalStack.length - 1].close();
});

/** Confirmação (Promise<boolean>). cancelLabel:null => só um botão (aviso). */
function confirmDialog({ title = 'Confirmar', message, okLabel = 'Confirmar', cancelLabel = 'Cancelar', danger = false }) {
  return new Promise(resolve => {
    let answered = false;
    const answer = v => { if (!answered) { answered = true; resolve(v); } m.close(); };
    const msgs = Array.isArray(message) ? message : [message];
    const m = openModal({
      title,
      onClose: () => { if (!answered) { answered = true; resolve(false); } },
      body: h('div', { class: 'stack' },
        msgs.map(t => h('p', null, t)),
        h('div', { class: 'modal-foot' },
          cancelLabel ? h('button', { class: 'btn', type: 'button', onclick: () => answer(false) }, cancelLabel) : null,
          h('button', { class: 'btn ' + (danger ? 'danger solid' : 'primary'), type: 'button', onclick: () => answer(true) }, okLabel)))
    });
  });
}
const infoDialog = (title, message) => confirmDialog({ title, message, okLabel: 'OK', cancelLabel: null });

/**
 * Formulário em janela. fields: [{key,label,type,value,required,min,max,options,hint,
 *   placeholder,suggestions,width:'w2'|'w3'|'full',compute(values)->texto (type:'info')}]
 * onSubmit(values) devolve um texto de erro (mantém aberto) ou nada (fecha).
 */
function formModal({ title, fields, submitLabel = 'Salvar', cancelLabel = 'Cancelar', intro, onSubmit, onCancel, size = '' }) {
  const inputs = {};
  const infos = [];
  const errBox = h('div', { class: 'form-error', role: 'alert' });
  const grid = h('div', { class: 'form-grid' });

  fields.forEach(f => {
    const id = 'f_' + uid() + f.key;
    const wCls = f.width && f.width !== 'full' ? f.width : '';
    let input = null;
    const kids = [];
    if (f.type === 'info') {
      const box = h('div', { class: 'info' });
      infos.push(() => { box.textContent = f.compute(readValues(true)); });
      kids.push(h('label', null, f.label), box);
    } else if (f.type === 'checkbox') {
      input = h('input', { id, type: 'checkbox' });
      input.checked = !!f.value;
      kids.push(input, h('label', { for: id }, f.label));
    } else {
      if (f.type === 'textarea') input = h('textarea', { id, rows: f.rows || 3, placeholder: f.placeholder });
      else if (f.type === 'select') input = h('select', { id }, f.options.map(o => h('option', { value: o.value }, o.label)));
      else {
        const isNum = f.type === 'number';
        input = h('input', {
          id, type: f.type || 'text', placeholder: f.placeholder, autocomplete: 'off',
          min: f.min, max: f.max, step: isNum ? (f.decimal ? 'any' : 1) : null, inputmode: isNum ? (f.decimal ? 'decimal' : 'numeric') : null,
          maxlength: isNum ? null : (f.maxlength || 120)
        });
        if (f.suggestions) {
          const dl = 'dl_' + id;
          input.setAttribute('list', dl);
          kids.push(h('datalist', { id: dl }, f.suggestions.map(s => h('option', { value: s }))));
        }
      }
      input.value = f.value == null ? '' : f.value;
      kids.unshift(h('label', { for: id }, f.label + (f.required ? ' *' : '')));
      kids.splice(1, 0, input);
      if (f.hint) kids.push(h('div', { class: 'hint' }, f.hint));
    }
    if (input) inputs[f.key] = input;
    grid.appendChild(h('div', { class: 'fld ' + wCls + (f.type === 'checkbox' ? ' check' : '') }, kids));
  });

  function readValues(lenient) {
    const v = {};
    fields.forEach(f => {
      const el = inputs[f.key];
      if (!el) return;
      if (f.type === 'checkbox') v[f.key] = el.checked;
      else if (f.type === 'number') v[f.key] = el.value.trim() === '' ? null : Number(el.value);
      else v[f.key] = el.value.trim();
    });
    return v;
  }
  function validate(v) {
    for (const f of fields) {
      if (f.type === 'info' || f.type === 'checkbox') continue;
      const val = v[f.key];
      const empty = val == null || val === '';
      if (f.required && empty) return `Preencha o campo "${f.label}".`;
      if (f.type === 'number' && !empty) {
        if (!Number.isFinite(val) || (!f.decimal && !Number.isInteger(val))) return `"${f.label}" precisa ser um número${f.decimal ? '' : ' inteiro'}.`;
        if (f.min != null && val < f.min) return `"${f.label}" deve ser no mínimo ${f.min}.`;
        if (f.max != null && val > f.max) return `"${f.label}" deve ser no máximo ${f.max}.`;
      }
    }
    return '';
  }

  let submitted = false;
  const form = h('form', { class: 'form', novalidate: '' },
    intro ? h('p', { class: 'muted' }, intro) : null,
    grid, errBox,
    h('div', { class: 'modal-foot' },
      h('button', { class: 'btn', type: 'button', onclick: () => m.close() }, cancelLabel),
      h('button', { class: 'btn primary', type: 'submit' }, submitLabel)));
  form.addEventListener('input', () => infos.forEach(fn => fn()));
  form.addEventListener('submit', e => {
    e.preventDefault();
    const v = readValues();
    const err = validate(v) || onSubmit(v);
    if (err) { errBox.textContent = err; return; }
    submitted = true;
    m.close();
  });
  const m = openModal({ title, body: form, size, onClose: () => { if (!submitted && onCancel) onCancel(); } });
  infos.forEach(fn => fn());
  return m;
}

function toast(msg, kind) {
  const t = h('div', { class: 'toast ' + (kind || '') }, msg);
  $('#toast-root').appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

/* =====================================================================
   3. BACKUP: exportar / importar / status
   ===================================================================== */
function backupInfo() {
  const lb = state.meta.lastBackup;
  const info = { has: !!lb, days: null, overdue: false, text: 'Nenhum backup feito ainda' };
  if (lb) {
    const days = Math.max(0, Math.floor((Date.now() - Date.parse(lb)) / 864e5));
    info.days = days;
    info.text = `Último backup: ${fmtDateTime(lb)} (${days === 0 ? 'hoje' : days === 1 ? 'ontem' : 'há ' + days + ' dias'})`;
    info.overdue = days > 7;
  } else {
    info.overdue = hasAnyData();
  }
  return info;
}

function summarize(st) {
  const clubs = (st.ml && st.ml.clubs) || [];
  return {
    clubs: clubs.length,
    seasons: clubs.reduce((n, c) => n + ((c.seasons && c.seasons.length) || 0), 0),
    players: ((st.ml && st.ml.squad) || []).length,
    diary: ((st.ml && st.ml.diary) || []).length,
    patterns: ((st.ml && st.ml.patterns) || []).length,
    experiments: ((st.ml && st.ml.experiments) || []).length,
    transactions: ((st.dd && st.dd.transactions) || []).length,
    tasks: ((st.dd && st.dd.tasks) || []).length,
    analyses: ((st.ml && st.ml.analyses) || []).length
  };
}

function exportBackup() {
  const now = new Date();
  state.meta.lastBackup = now.toISOString();
  saveState();
  const payload = { app: APP_ID, schema: SCHEMA_VERSION, exportedAt: state.meta.lastBackup, data: state };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const name = `minha-central-backup-${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}_${pad(now.getHours())}-${pad(now.getMinutes())}.json`;
  const a = h('a', { href: URL.createObjectURL(blob), download: name, class: 'hidden' });
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('Backup exportado: ' + name);
  render();
}

function importBackupFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onerror = () => infoDialog('Não foi possível ler o arquivo', 'Tente novamente com outro arquivo.');
  reader.onload = async () => {
    let obj;
    try { obj = JSON.parse(reader.result); } catch (e) {
      return infoDialog('Arquivo inválido', 'Este arquivo não é um backup válido (não é um JSON legível).');
    }
    if (obj && obj.app === APP_ID && obj.kind) return importShareObject(obj);   // análise/tática/padrão compartilhados
    const data = obj && obj.app === APP_ID && isObj(obj.data) ? obj.data : (obj && isObj(obj.ml) && isObj(obj.meta) ? obj : null);
    if (!data) return infoDialog('Arquivo inválido', 'Este arquivo não parece ser um backup da Minha Central.');
    if ((Number(data.version) || 0) > SCHEMA_VERSION) {
      return infoDialog('Backup de versão mais nova', 'Este backup foi feito por uma versão mais nova do app. Use o arquivo HTML mais recente para importá-lo.');
    }
    let incoming;
    try { incoming = fillDefaults(migrate(clone(data)), defaultState()); } catch (e) {
      return infoDialog('Erro ao ler o backup', 'Os dados do arquivo estão em um formato inesperado.');
    }
    const a = summarize(incoming), b = summarize(state);
    const ok = await confirmDialog({
      title: 'Substituir os dados atuais?',
      message: [
        `Backup de ${obj.exportedAt ? fmtDateTime(obj.exportedAt) : 'data desconhecida'}: ${plural(a.clubs, 'clube', 'clubes')}, ${plural(a.seasons, 'temporada', 'temporadas')}, ${plural(a.players, 'jogador', 'jogadores')}.`,
        `Dados atuais: ${plural(b.clubs, 'clube', 'clubes')}, ${plural(b.seasons, 'temporada', 'temporadas')}, ${plural(b.players, 'jogador', 'jogadores')}.`,
        'Tudo o que está no app agora será substituído pelo conteúdo do backup. Se tiver dúvida, cancele e exporte um backup dos dados atuais primeiro.'
      ],
      okLabel: 'Substituir tudo', danger: true
    });
    if (!ok) return;
    try { localStorage.setItem(PREV_KEY, JSON.stringify(state)); } catch (e) {}
    state = incoming;
    storageStatus.tooNew = false; storageStatus.corrupt = false;
    saveState();
    closeAllModals();
    applyTheme();
    render();
    toast('Backup importado com sucesso.');
  };
  reader.readAsText(file);
}

      h('div', null,
        h('h3', null, 'Aparência e perfil'),
        h('div', { class: 'row', style: { margin: '10px 0' } },
          h('span', { class: 'muted' }, 'Tema:'), themeSeg(draw)),
        h('div', { class: 'row', style: { marginBottom: '10px' } },

        h('div', { class: 'fld' }, h('label', null, 'Nome do técnico (opcional)'), coach)),
      h('hr', { class: 'sep' }),
      h('div', null,
        h('h3', null, 'Resumo dos dados'),
        h('div', { class: 'kv', style: { marginTop: '8px' } }, h('span', null, 'Clubes'), h('b', null, fmtNum(s.clubs))),
        h('div', { class: 'kv' }, h('span', null, 'Temporadas registradas'), h('b', null, fmtNum(s.seasons))),
        h('div', { class: 'kv' }, h('span', null, 'Jogadores no elenco'), h('b', null, fmtNum(s.players))),
        h('div', { class: 'kv' }, h('span', null, 'Entradas no diário'), h('b', null, fmtNum(s.diary))),
        h('div', { class: 'kv' }, h('span', null, 'Análises de partidas'), h('b', null, fmtNum(s.analyses))),
        h('div', { class: 'kv' }, h('span', null, 'Padrões de jogo salvos'), h('b', null, fmtNum(s.patterns))),
        h('div', { class: 'kv' }, h('span', null, 'Experimentos no PES'), h('b', null, fmtNum(s.experiments))),
        h('div', { class: 'kv' }, h('span', null, 'Lançamentos de gastos'), h('b', null, fmtNum(s.transactions))),
        h('div', { class: 'kv' }, h('span', null, 'Tarefas'), h('b', null, fmtNum(s.tasks))),
        h('div', { class: 'kv' }, h('span', null, 'Versão do app / formato dos dados'), h('b', null, `Fase ${APP_PHASE} / v${state.version}`))),
      h('hr', { class: 'sep' }),
      h('div', { class: 'row' },
        h('button', { class: 'btn ghost sm', type: 'button', onclick: () => { state.meta.welcomeDismissed = false; closeAllModals(); commit(); } }, 'Rever boas-vindas'),
        h('button', { class: 'btn danger sm', type: 'button', onclick: askWipe }, '🗑 Apagar todos os dados')));
  }
  draw();
  openModal({ title: 'Dados e backup', body: box, size: 'wide' });
}

function askWipe() {
  formModal({
    title: 'Apagar todos os dados',
    intro: 'Isso apaga tudo o que está salvo neste navegador (clubes, temporadas, elenco etc.). Exporte um backup antes, se quiser guardar algo. Os backups automáticos diários continuam guardados (você pode restaurá-los ou apagá-los em Dados e backup).',
    submitLabel: 'Apagar tudo',
    fields: [{ key: 'ok', label: 'Digite APAGAR para confirmar', type: 'text', required: true }],
    onSubmit: v => {
      if (v.ok !== 'APAGAR') return 'Digite exatamente APAGAR (em maiúsculas).';
      try { localStorage.setItem(PREV_KEY, JSON.stringify(state)); } catch (e) {}
      state = defaultState();
      storageStatus.tooNew = false;
      saveState();
      closeAllModals();
      applyTheme();
      render();
      toast('Todos os dados foram apagados.');
    }
  });
}

const HOOKS = { currentClubChanged: [] };   // fase 2 registra aqui o "arquivar elenco antigo"

function sStats(s) {
  const w = toInt(s.w), d = toInt(s.d), l = toInt(s.l), J = w + d + l;
  return { J, w, d, l, gf: toInt(s.gf), ga: toInt(s.ga), pts: 3 * w + d, pct: J ? (3 * w + d) / (3 * J) * 100 : null, titles: (s.titles || []).length };
}
function sumStats(list) {
  const t = { n: list.length, J: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0, titles: 0 };
  list.forEach(s => { const x = sStats(s); t.J += x.J; t.w += x.w; t.d += x.d; t.l += x.l; t.gf += x.gf; t.ga += x.ga; t.pts += x.pts; t.titles += x.titles; });
  t.pct = t.J ? t.pts / (3 * t.J) * 100 : null;
  return t;
}
const allSeasonRecords = () => state.ml.clubs.flatMap(c => c.seasons.map(s => ({ club: c, s })));
const getCurrentClub = () => state.ml.clubs.find(c => c.current) || null;

    sv('circle', { cx: 50, cy: 50, r, fill: 'none', class: 'ring-bg', 'stroke-width': 9 }),
    sv('circle', { cx: 50, cy: 50, r, fill: 'none', class: 'ring-fg', 'stroke-width': 9, 'stroke-linecap': 'round', 'stroke-dasharray': `${c * p / 100} ${c}`, transform: 'rotate(-90 50 50)' }),
    sv('text', { x: 50, y: 55, 'text-anchor': 'middle', class: 'ring-text' }, pct == null ? '—' : fmtNum(pct, 0) + '%'));
}

/* ---- ações sobre passagens ---- */
function insertClubSorted(c) {
  const arr = state.ml.clubs;
  const i = arr.findIndex(x => x.startSeason > c.startSeason);
  if (i < 0) arr.push(c); else arr.splice(i, 0, c);
}
function sortClubsByEntry() {
  state.ml.clubs.sort((a, b) => a.startSeason - b.startSeason);   // ordenação estável
  commit();
  toast('Passagens ordenadas pela temporada de entrada.');
}
function moveClub(id, dir) {
  const arr = state.ml.clubs;
  const i = arr.findIndex(c => c.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
  commit();
}
async function deleteClub(id) {
  const c = getClub(id);
  if (!c) return;
  const n = c.seasons.length;
  const ok = await confirmDialog({
    title: 'Excluir passagem?',
    message: `"${c.name}" será excluído${n ? ` junto com ${plural(n, 'temporada registrada', 'temporadas registradas')}` : ''}. Essa ação não pode ser desfeita (exporte um backup antes se tiver dúvida).`,
    okLabel: 'Excluir', danger: true
  });
  if (!ok) return;
  state.ml.clubs = state.ml.clubs.filter(x => x.id !== id);
  delete ui.expanded[id];
  commit();
  toast('Passagem excluída.');
}

/** Marca um clube como atual. Se havia outro atual sem temporada de saída, pergunta qual foi. */
function setCurrentClub(id) {
  const c = getClub(id);
  if (!c) return;
  const old = getCurrentClub();
  const finish = () => {
    state.ml.clubs.forEach(x => { x.current = x.id === id; });
    c.endSeason = null;
    HOOKS.currentClubChanged.forEach(fn => { try { fn(old ? old.id : null, id); } catch (e) { console.error(e); } });
    commit();
    toast(`${c.name} é agora o clube atual.`);
  };
  if (!old || old.id === id || old.endSeason != null) return finish();
  const lastRec = old.seasons.reduce((m, s) => Math.max(m, s.season), 0);
  const def = Math.max(old.startSeason, lastRec || (c.startSeason - 1));
  formModal({
    title: 'Saída do clube anterior',
    intro: `Você estava em ${old.name}. Em qual temporada terminou essa passagem?`,
    submitLabel: 'Salvar e continuar', cancelLabel: 'Pular',
    fields: [{ key: 'end', label: 'Última temporada em ' + old.name, type: 'number', min: old.startSeason, value: def }],
    onSubmit: v => { old.endSeason = v.end; finish(); },
    onCancel: finish
  });
}

const POSITIONS = [
  { code: 'GK', pt: 'Goleiro', grp: 'GOL' },
  { code: 'CB', pt: 'Zagueiro', grp: 'DEF' }, { code: 'LB', pt: 'Lateral-esquerdo', grp: 'DEF' }, { code: 'RB', pt: 'Lateral-direito', grp: 'DEF' },
  { code: 'DMF', pt: 'Volante', grp: 'MEI' }, { code: 'CMF', pt: 'Meio-campista', grp: 'MEI' },
  { code: 'LMF', pt: 'Meia-esquerda', grp: 'MEI' }, { code: 'RMF', pt: 'Meia-direita', grp: 'MEI' }, { code: 'AMF', pt: 'Meia-atacante', grp: 'MEI' },
  { code: 'LWF', pt: 'Ponta-esquerda', grp: 'ATA' }, { code: 'RWF', pt: 'Ponta-direita', grp: 'ATA' },
  { code: 'SS', pt: 'Segundo atacante', grp: 'ATA' }, { code: 'CF', pt: 'Centroavante', grp: 'ATA' }
];
const POS_BY = {};
POSITIONS.forEach((p, i) => { POS_BY[p.code] = { code: p.code, pt: p.pt, grp: p.grp, order: i }; });
const POS_GROUPS = [{ id: 'GOL', label: 'Goleiros' }, { id: 'DEF', label: 'Defensores' }, { id: 'MEI', label: 'Meio-campistas' }, { id: 'ATA', label: 'Atacantes' }];
/** Mínimo "saudável" por posição principal (regra prática; só avisa posições essenciais) */
const MIN_PER_POS = { GK: 2, CB: 3, LB: 2, RB: 2, DMF: 2, CMF: 2, CF: 2 };

Object.assign(ui, { squad: { q: '', pos: '', hl: '', sort: 'ovr', dir: 'desc' } });

/** Temporada atual da carreira: ajuste manual, ou (última temporada registrada no clube atual) + 1 */
function careerSeason() {
  const manual = state.ml.settings && state.ml.settings.currentSeason;
  if (manual) return manual;
  const cur = getCurrentClub();
  if (cur) {
    const mx = cur.seasons.reduce((m, x) => Math.max(m, x.season), 0);
    return mx ? mx + 1 : cur.startSeason;
  }
  const all = allSeasonRecords();
  return all.length ? Math.max(...all.map(r => r.s.season)) + 1 : 1;
}
function fmtMoney(n) {
  if (n == null) return '—';
  const cur = state.meta.currency || '€';
  const f = (v, d) => Number(v).toLocaleString('pt-BR', { maximumFractionDigits: d });
  if (n >= 1e6) return `${cur} ${f(n / 1e6, 2)} mi`;
  if (n >= 1e3) return `${cur} ${f(n / 1e3, 1)} mil`;
  return `${cur} ${f(n, 0)}`;
}
const ovrClass = o => o >= 85 ? 'ovr-s' : o >= 80 ? 'ovr-a' : o >= 75 ? 'ovr-b' : o >= 70 ? 'ovr-c' : 'ovr-d';
const ovrBadge = o => h('span', { class: 'ovr ' + ovrClass(o) }, o);
const normText = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const getPlayer = id => state.ml.squad.find(p => p.id === id) || null;

/** Situação do contrato: o contrato vai "até a temporada X" (T da carreira) */
function contractStatus(p) {
  if (p.contractEnd == null) return null;
  const cs = careerSeason();
  if (p.contractEnd < cs) return { level: 'bad', text: `venceu (T${p.contractEnd})` };
  if (p.contractEnd === cs) return { level: 'bad', text: `vence nesta temporada (T${cs})` };
  if (p.contractEnd === cs + 1) return { level: 'warn', text: `vence na T${p.contractEnd}` };
  return null;
}
const isOver30 = p => p.age > 30;
function positionShortages() {
  const sq = state.ml.squad;
  if (!sq.length) return [];
  return Object.keys(MIN_PER_POS).map(code => ({ code, have: sq.filter(p => p.pos === code).length, min: MIN_PER_POS[code] })).filter(x => x.have < x.min);
}
function squadSummary(list) {
  const n = list.length, sum = k => list.reduce((s, p) => s + (p[k] || 0), 0);
  return { n, ovr: n ? sum('ovr') / n : null, age: n ? sum('age') / n : null, payroll: sum('salary'), value: sum('value') };
}

const SQUAD_SORTERS = {
  name: (a, b) => a.name.localeCompare(b.name, 'pt-BR'),
  pos: (a, b) => (POS_BY[a.pos] ? POS_BY[a.pos].order : 99) - (POS_BY[b.pos] ? POS_BY[b.pos].order : 99),
  age: (a, b) => a.age - b.age, ovr: (a, b) => a.ovr - b.ovr,
  pot: (a, b) => (a.pot == null ? -1 : a.pot) - (b.pot == null ? -1 : b.pot),
  contract: (a, b) => (a.contractEnd == null ? 9999 : a.contractEnd) - (b.contractEnd == null ? 9999 : b.contractEnd),
  salary: (a, b) => (a.salary || 0) - (b.salary || 0), value: (a, b) => (a.value || 0) - (b.value || 0)
};
function filteredSquad() {
  const f = ui.squad, q = normText(f.q.trim());
  let list = state.ml.squad.filter(p => {
    if (q && !normText(p.name).includes(q)) return false;
    if (f.pos) {
      if (f.pos.startsWith('g:')) { if (!POS_BY[p.pos] || POS_BY[p.pos].grp !== f.pos.slice(2)) return false; }
      else if (p.pos !== f.pos) return false;
    }
    if (f.hl === 'contract' && !contractStatus(p)) return false;
    if (f.hl === 'age30' && !isOver30(p)) return false;
    if (f.hl === 'promessas' && !(p.pot != null && p.pot - p.ovr >= 5)) return false;
    return true;
  });
  const fn = SQUAD_SORTERS[f.sort] || SQUAD_SORTERS.ovr;
  list.sort((a, b) => (f.dir === 'asc' ? 1 : -1) * fn(a, b) || a.name.localeCompare(b.name, 'pt-BR'));
  return list;
}

const FORMATIONS = {
  '4-3-3':   [['GK', 50, 91], ['LB', 13, 72], ['CB', 37, 77], ['CB', 63, 77], ['RB', 87, 72], ['CMF', 27, 53], ['DMF', 50, 61], ['CMF', 73, 53], ['LWF', 17, 27], ['CF', 50, 20], ['RWF', 83, 27]],

  '4-1-2-1-2': [['GK', 50, 91], ['LB', 13, 72], ['CB', 37, 77], ['CB', 63, 77], ['RB', 87, 72], ['DMF', 50, 63], ['CMF', 28, 52], ['CMF', 72, 52], ['AMF', 50, 39], ['CF', 38, 21], ['CF', 62, 21]],
  '3-5-2':   [['GK', 50, 91], ['CB', 25, 77], ['CB', 50, 80], ['CB', 75, 77], ['LMF', 9, 50], ['DMF', 37, 59], ['DMF', 63, 59], ['RMF', 91, 50], ['AMF', 50, 40], ['CF', 38, 21], ['CF', 62, 21]],
  '3-4-3':   [['GK', 50, 91], ['CB', 25, 77], ['CB', 50, 80], ['CB', 75, 77], ['LMF', 13, 52], ['CMF', 38, 57], ['CMF', 62, 57], ['RMF', 87, 52], ['LWF', 19, 25], ['CF', 50, 19], ['RWF', 81, 25]],
  '5-3-2':   [['GK', 50, 91], ['LB', 9, 63], ['CB', 29, 77], ['CB', 50, 80], ['CB', 71, 77], ['RB', 91, 63], ['CMF', 28, 50], ['DMF', 50, 56], ['CMF', 72, 50], ['CF', 38, 22], ['CF', 62, 22]]
};
const FORMATION_NAMES = Object.keys(FORMATIONS);
const slotsFor = f => FORMATIONS[f].map(([pos, x, y]) => ({ pos, x, y, pid: null, pname: '' }));
const PITCH = { w: 400, h: 620, m: 10 };                        // viewBox e margem do campo
const GRP_COLOR = { GOL: '#f5c542', DEF: '#4aa3ff', MEI: '#c58bff', ATA: '#ff7a7a' };

Object.assign(ui, { board: { id: null, name: '', formation: '4-3-3', notes: '', slots: slotsFor('4-3-3'), dirty: false } });
const board = () => ui.board;
function markDirty() { board().dirty = true; const el = $('#board-dirty'); if (el) el.textContent = '● alterações não salvas'; }

function changeFormation(f) {
  const b = board(), old = b.slots.filter(s => s.pid || s.pname), next = slotsFor(f);
  const used = new Set();
  next.forEach(s => { const o = old.find((x, i) => !used.has(i) && x.pos === s.pos); if (o) { used.add(old.indexOf(o)); s.pid = o.pid; s.pname = o.pname; } });
  next.forEach(s => { if (s.pid || s.pname) return; const i = old.findIndex((x, k) => !used.has(k)); if (i >= 0) { used.add(i); s.pid = old[i].pid; s.pname = old[i].pname; } });
  b.formation = f; b.slots = next;
  markDirty();
}
function autoFillBoard() {
  const b = board(), used = new Set();
  const sq = state.ml.squad.slice().sort((x, y) => y.ovr - x.ovr);
  b.slots.forEach(s => { s.pid = null; s.pname = ''; });
  const passes = [(p, s) => p.pos === s.pos, (p, s) => POS_BY[p.pos] && POS_BY[s.pos] && POS_BY[p.pos].grp === POS_BY[s.pos].grp];
  passes.forEach(match => b.slots.forEach(s => {
    if (s.pid) return;
    const p = sq.find(x => !used.has(x.id) && match(x, s));
    if (p) { s.pid = p.id; s.pname = p.name; used.add(p.id); }
  }));
  markDirty();
}

/** Campo desenhado (sem jogadores). Reutilizado na prancheta, nas premiações e no laboratório de vida real. */
function pitchBase() {
  const { w, h: ph, m } = PITCH, fw = w - 2 * m, fh = ph - 2 * m;
  const svg = sv('svg', { viewBox: `0 0 ${w} ${ph}`, class: 'pitch', role: 'img', 'aria-label': 'Campo de futebol' });
  const line = { fill: 'none', stroke: 'rgba(255,255,255,.75)', 'stroke-width': 2 };
  svg.appendChild(sv('rect', { x: 0, y: 0, width: w, height: ph, fill: '#1f7a3a' }));
  for (let i = 0; i < 10; i += 2) svg.appendChild(sv('rect', { x: m, y: m + i * fh / 10, width: fw, height: fh / 10, fill: 'rgba(255,255,255,.045)' }));
  svg.appendChild(sv('rect', { x: m, y: m, width: fw, height: fh, ...line }));
  svg.appendChild(sv('line', { x1: m, y1: ph / 2, x2: w - m, y2: ph / 2, ...line }));
  svg.appendChild(sv('circle', { cx: w / 2, cy: ph / 2, r: 52, ...line }));
  svg.appendChild(sv('circle', { cx: w / 2, cy: ph / 2, r: 3, fill: 'rgba(255,255,255,.75)' }));
  [[m, 1], [ph - m, -1]].forEach(([y0, dir]) => {                    // grande área, pequena área, marca e arco
    const y = dir === 1 ? y0 : y0 - 80, y2 = dir === 1 ? y0 : y0 - 28;
    svg.appendChild(sv('rect', { x: w / 2 - 82, y, width: 164, height: 80, ...line }));
    svg.appendChild(sv('rect', { x: w / 2 - 37, y: y2, width: 74, height: 28, ...line }));
    svg.appendChild(sv('circle', { cx: w / 2, cy: y0 + dir * 56, r: 2.5, fill: 'rgba(255,255,255,.75)' }));
    svg.appendChild(sv('path', { d: dir === 1 ? `M153.9 90 A52 52 0 0 0 246.1 90` : `M153.9 530 A52 52 0 0 1 246.1 530`, ...line }));
  });
  return svg;
}
function buildPitch() {
  const svg = pitchBase();
  const layer = sv('g');
  svg.appendChild(layer);
  board().slots.forEach((s, i) => layer.appendChild(makeToken(s, i, svg)));
  return svg;
}
const px = x => PITCH.m + x / 100 * (PITCH.w - 2 * PITCH.m);
const py = y => PITCH.m + y / 100 * (PITCH.h - 2 * PITCH.m);

function makeToken(slot, idx, svg) {
  const p = slot.pid ? getPlayer(slot.pid) : null;
  const grp = POS_BY[slot.pos] ? POS_BY[slot.pos].grp : 'MEI';
  const filled = !!p;
  const mismatch = p && POS_BY[p.pos] && POS_BY[p.pos].grp !== grp;
  const label = p ? p.name : slot.pname;
  const short = label ? (label.trim().split(/\s+/).pop() || label).slice(0, 12) : '';
  const g = sv('g', { class: 'token', transform: `translate(${px(slot.x)} ${py(slot.y)})`, role: 'button', 'aria-label': `${slot.pos}${label ? ': ' + label : ' vazio'}` },
    sv('circle', { r: 20, fill: filled ? GRP_COLOR[grp] : 'rgba(0,0,0,.28)', stroke: mismatch ? '#f59e0b' : '#fff', 'stroke-width': mismatch ? 3.5 : 2, 'stroke-dasharray': filled || slot.pname ? null : '4 3', opacity: !filled && slot.pname ? 0.7 : 1 }),
    sv('text', { class: 'tk-in', y: 4.5, fill: filled ? '#111' : '#fff' }, filled ? p.ovr : slot.pos),
    short ? sv('text', { class: 'tk-name', y: 36 }, short) : null,
    filled ? sv('text', { class: 'tk-name', y: -25, style: 'font-size:9px;opacity:.9' }, slot.pos) : null);
  g.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
  g.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { g.setPointerCapture(e.pointerId); } catch (err) {}
    const sx = e.clientX, sy = e.clientY;
    let moved = false;
    const toPct = ev => {
      const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
      const q = pt.matrixTransform(svg.getScreenCTM().inverse());
      const k = v => Math.max(3, Math.min(97, v));
      return { x: k((q.x - PITCH.m) / (PITCH.w - 2 * PITCH.m) * 100), y: k((q.y - PITCH.m) / (PITCH.h - 2 * PITCH.m) * 100) };
    };
    const move = ev => {
      if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 6) return;
      moved = true;
      const c = toPct(ev);
      slot.x = Math.round(c.x * 10) / 10; slot.y = Math.round(c.y * 10) / 10;
      g.setAttribute('transform', `translate(${px(slot.x)} ${py(slot.y)})`);
    };
    const up = ev => {
      g.removeEventListener('pointermove', move); g.removeEventListener('pointerup', up); g.removeEventListener('pointercancel', up);
      try { g.releasePointerCapture(ev.pointerId); } catch (err) {}
      if (moved) markDirty(); else openPicker(idx);
    };
    g.addEventListener('pointermove', move); g.addEventListener('pointerup', up); g.addEventListener('pointercancel', up);
  });
  return g;
}

      ovrBadge(p.ovr))) : [h('p', { class: 'empty' }, state.ml.squad.length ? 'Nenhum jogador encontrado.' : 'O elenco está vazio. Cadastre jogadores na aba Elenco.')]));

      state.ml.squad.length ? null : h('button', { class: 'btn', type: 'button', onclick: () => { m.close(); go('ml', 'elenco'); } }, 'Ir para Elenco'),
      h('button', { class: 'btn', type: 'button', onclick: m.close }, 'Fechar')));
  draw();
}

function renderMLPrancheta() {
  const b = board();
  const saved = state.ml.tactics;
  const wrap = h('div', { class: 'stack' });
  wrap.appendChild(h('div', { class: 'page-head' },
    h('div', null, h('h1', null, 'Prancheta'), h('p', { class: 'muted' }, 'Toque num jogador para escolher quem joga ali. Arraste para mudar a posição no campo.'))));

  const nameIn = h('input', { class: 'input', type: 'text', maxlength: 60, placeholder: 'Nome da tática (ex.: Pressão alta 4-3-3)', 'aria-label': 'Nome da tática' });
  nameIn.value = b.name;
  nameIn.addEventListener('input', () => { b.name = nameIn.value; markDirty(); });
  const notes = h('textarea', { class: 'input', rows: 5, placeholder: 'Anotações: instruções, quem marca quem, bola parada…', 'aria-label': 'Anotações' });
  notes.value = b.notes;
  notes.addEventListener('input', () => { b.notes = notes.value; markDirty(); });
  const formSel = h('select', { class: 'input', 'aria-label': 'Formação' }, FORMATION_NAMES.map(f => h('option', { value: f }, f)));
  formSel.value = b.formation;
  formSel.addEventListener('change', () => { changeFormation(formSel.value); render(); });
  const savedSel = h('select', { class: 'input', 'aria-label': 'Táticas salvas' },
    h('option', { value: '' }, saved.length ? '— Nova tática (não salva) —' : 'Nenhuma tática salva ainda'),
    saved.map(t => h('option', { value: t.id }, `${t.name} (${t.formation})`)));
  savedSel.value = b.id || '';
  savedSel.addEventListener('change', () => {
    const t = saved.find(x => x.id === savedSel.value);
    ui.board = t ? { ...clone(t), dirty: false } : { id: null, name: '', formation: b.formation, notes: '', slots: slotsFor(b.formation), dirty: false };
    render();
  });

  const startersOvr = (() => { const ps = b.slots.map(s => s.pid && getPlayer(s.pid)).filter(Boolean); return ps.length ? ps.reduce((s, p) => s + p.ovr, 0) / ps.length : null; })();
  const used = new Set(b.slots.map(s => s.pid).filter(Boolean));
  const bench = state.ml.squad.filter(p => !used.has(p.id)).sort((x, y) => y.ovr - x.ovr);

  const side = h('div', { class: 'stack' },

        b.id ? h('button', { class: 'btn', type: 'button', onclick: () => saveBoard(true) }, 'Salvar como nova') : null,
        b.id ? h('button', { class: 'btn danger', type: 'button', onclick: deleteBoard }, '🗑 Excluir') : null,

        shareImportButton('📥 Importar tática'))),
    h('div', { class: 'card stack', style: { gap: '10px' } },
      h('div', { class: 'row' },
        h('button', { class: 'btn sm', type: 'button', onclick: () => { autoFillBoard(); render(); } }, '✨ Preencher com os melhores'),
        h('button', { class: 'btn sm', type: 'button', onclick: () => { b.slots.forEach(s => { s.pid = null; s.pname = ''; }); markDirty(); render(); } }, 'Limpar jogadores'),

        h('button', { class: 'btn sm', type: 'button', onclick: () => { ui.board = { id: null, name: '', formation: b.formation, notes: '', slots: slotsFor(b.formation), dirty: false }; render(); } }, '＋ Nova')),
      h('div', { class: 'muted small' }, startersOvr != null ? `Overall médio dos titulares escalados: ` : 'Nenhum titular escalado ainda.', startersOvr != null ? h('b', null, fmtNum(startersOvr, 1)) : null),
      h('div', null, h('div', { class: 'muted small', style: { marginBottom: '6px' } }, `Fora da escalação (${bench.length})`),

    h('div', { class: 'legend' },
      Object.keys(GRP_COLOR).map(k => h('span', null, h('span', { style: { display: 'inline-block', width: '10px', height: '10px', borderRadius: '50%', background: GRP_COLOR[k], marginRight: '5px' } }), POS_GROUPS.find(g => g.id === k).label)),
      h('span', null, '🟠 contorno laranja = jogador fora do setor')));

  wrap.appendChild(h('div', { class: 'board' }, h('div', null, buildPitch()), side));
  return wrap;
}

function saveBoard(asNew) {
  const b = board();
  if (!b.name.trim()) { toast('Dê um nome à tática antes de salvar.', 'err'); const i = $('input[aria-label="Nome da tática"]'); if (i) i.focus(); return; }
  const now = new Date().toISOString();
  const rec = { name: b.name.trim(), formation: b.formation, notes: b.notes, slots: clone(b.slots) };
  if (b.id && !asNew) {
    const t = state.ml.tactics.find(x => x.id === b.id);
    if (t) { Object.assign(t, rec, { updatedAt: now }); } else { b.id = null; return saveBoard(false); }
  } else {
    const t = { id: uid(), ...rec, createdAt: now, updatedAt: now };
    state.ml.tactics.push(t);
    b.id = t.id;
  }
  b.dirty = false;
  commit();
  toast('Tática salva.');
}
async function deleteBoard() {
  const b = board();
  const ok = await confirmDialog({ title: 'Excluir tática?', message: `"${b.name}" será excluída.`, okLabel: 'Excluir', danger: true });
  if (!ok) return;
  state.ml.tactics = state.ml.tactics.filter(x => x.id !== b.id);
  ui.board = { id: null, name: '', formation: b.formation, notes: '', slots: slotsFor(b.formation), dirty: false };
  commit();
  toast('Tática excluída.');
}

const CLUB_COLORS = ['#3ddc84', '#4aa3ff', '#f5c542', '#ff7a7a', '#c58bff', '#ff9f43', '#2dd4bf', '#f472b6', '#a3e635', '#94a3b8'];

const clubColor = id => { const i = state.ml.clubs.findIndex(c => c.id === id); return CLUB_COLORS[(i < 0 ? 0 : i) % CLUB_COLORS.length]; };

function dashRecords() {
  const clubs = state.ml.clubs;
  if (ui.dashClub !== 'all' && !getClub(ui.dashClub)) ui.dashClub = 'all';
  let recs = allSeasonRecords().map(r => ({ club: r.club, s: r.s, st: sStats(r.s) }));
  if (ui.dashClub !== 'all') recs = recs.filter(r => r.club.id === ui.dashClub);
  recs.sort((a, b) => a.s.season - b.s.season || clubs.indexOf(a.club) - clubs.indexOf(b.club));

}
function niceStep(max, ticks) {
  const raw = (max || 1) / ticks, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
}

/** Base comum dos gráficos: eixo Y com grade, faixas por clube e rótulos de temporada. */
function chartBase(recs, o) {
  const n = Math.max(recs.length, 1), L = 44, R = 14, T = 24, B = 30, H = o.h || 250;
  const cw = Math.max(300, ((document.getElementById('view') || {}).clientWidth || 900) - 34);
  const band = Math.max(o.minBand || 36, (cw - L - R) / n);
  const W = Math.round(L + R + band * n);
  const yMin = o.yMin || 0, span = (o.yMax - yMin) || 1;
  const y = v => o.invert ? T + (v - yMin) / span * (H - T - B) : H - B - (v - yMin) / span * (H - T - B);
  const cx = i => L + band * (i + 0.5);
  const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': o.label, style: `width:${W}px;max-width:none` });
  // faixas por clube (só quando há mais de um clube)
  if (!o.noBands && recs.length && recs[0].club && new Set(recs.map(r => r.club.id)).size > 1) {
    let i = 0;
    while (i < recs.length) {
      let j = i; while (j + 1 < recs.length && recs[j + 1].club.id === recs[i].club.id) j++;
      const x = L + band * i, w = band * (j - i + 1);
      svg.appendChild(sv('rect', { x, y: T, width: w, height: H - T - B, fill: clubColor(recs[i].club.id), opacity: 0.08 }));
      if (w > 56) svg.appendChild(sv('text', { class: 'ax', x: x + w / 2, y: T - 8, 'text-anchor': 'middle', style: 'font-size:10px' }, recs[i].club.name.slice(0, Math.floor(w / 6.5))));
      i = j + 1;
    }
  }
  o.ticks.forEach(t => {
    svg.appendChild(sv('line', { class: 'gl', x1: L, x2: W - R, y1: y(t), y2: y(t) }));
    svg.appendChild(sv('text', { class: 'ax', x: L - 6, y: y(t) + 4, 'text-anchor': 'end' }, o.fmt ? o.fmt(t) : t));
  });
  const skip = band < 26 ? 3 : band < 34 ? 2 : 1;
  recs.forEach((r, i) => { if (i % skip === 0) svg.appendChild(sv('text', { class: 'ax', x: cx(i), y: H - B + 16, 'text-anchor': 'middle' }, o.labels ? o.labels[i] : 'T' + r.s.season)); });
  return { svg, y, cx, band, L, R, T, B, H, W, wrap: () => h('div', { class: 'chart-scroll' }, svg) };
}
const noData = txt => h('p', { class: 'empty' }, txt || 'Sem dados para este gráfico ainda.');

function chartAprov(recs) {
  const data = recs.filter(r => r.st.J > 0);
  if (!data.length) return noData('Registre vitórias, empates e derrotas nas temporadas para ver o aproveitamento.');
  const c = chartBase(data, { yMax: 100, ticks: [0, 25, 50, 75, 100], fmt: v => v + '%', label: 'Aproveitamento por temporada' });
  const bw = Math.min(30, c.band * 0.62);
  data.forEach((r, i) => {
    const yy = c.y(r.st.pct);
    c.svg.appendChild(sv('g', null,
      sv('title', null, `T${r.s.season} · ${r.club.name}: ${fmtPct(r.st.pct)} (${r.st.w}V ${r.st.d}E ${r.st.l}D)`),
      sv('rect', { x: c.cx(i) - bw / 2, y: yy, width: bw, height: c.y(0) - yy, rx: 3, fill: clubColor(r.club.id) }),
      c.band >= 30 ? sv('text', { class: 'blab', x: c.cx(i), y: yy - 4 }, fmtNum(r.st.pct, 0)) : null));
  });
  const avg = sumStats(data.map(r => r.s)).pct;
  c.svg.appendChild(sv('line', { class: 'avg-line', x1: c.L, x2: c.W - c.R, y1: c.y(avg), y2: c.y(avg) }));
  c.svg.appendChild(sv('text', { class: 'ax', x: c.W - c.R, y: c.y(avg) - 4, 'text-anchor': 'end', style: 'fill:var(--warn)' }, `média ${fmtNum(avg, 1)}%`));
  return c.wrap();
}
function chartGoals(recs) {
  const data = recs.filter(r => r.st.gf + r.st.ga > 0);
  if (!data.length) return noData('Registre gols pró e contra nas temporadas para ver este gráfico.');
  const mx = Math.max(...data.map(r => Math.max(r.st.gf, r.st.ga))), step = niceStep(mx, 5), top = Math.ceil(mx / step) * step;
  const ticks = []; for (let t = 0; t <= top + 0.001; t += step) ticks.push(t);
  const c = chartBase(data, { yMax: top, ticks, label: 'Gols pró e contra por temporada', minBand: 40 });
  const bw = Math.min(16, c.band * 0.34);
  data.forEach((r, i) => {
    [['gf', 'c-gf', -bw / 2 - 1], ['ga', 'c-ga', bw / 2 + 1]].forEach(([k, cls, dx]) => {
      const v = r.st[k], yy = c.y(v);
      c.svg.appendChild(sv('g', null, sv('title', null, `T${r.s.season} · ${r.club.name}: ${r.st.gf} gols pró, ${r.st.ga} contra`),
        sv('rect', { class: cls, x: c.cx(i) + dx - bw / 2, y: yy, width: bw, height: c.y(0) - yy, rx: 2 }),
        c.band >= 40 ? sv('text', { class: 'blab', x: c.cx(i) + dx, y: yy - 3, style: 'font-size:9px' }, v) : null));
    });
  });
  return c.wrap();
}
function chartPositions(recs) {
  const data = recs.filter(r => r.s.position);
  if (!data.length) return noData('Registre a posição final nas temporadas para ver a evolução.');
  const mxPos = Math.max(2, ...data.map(r => r.s.position));
  const step = Math.max(1, Math.ceil(mxPos / 8));
  const ticks = []; for (let t = 1; t <= mxPos; t += step) ticks.push(t);
  if (ticks[ticks.length - 1] !== mxPos) ticks.push(mxPos);
  const c = chartBase(recs, { yMin: 1, yMax: mxPos, invert: true, ticks, fmt: v => v + 'º', label: 'Posição final na liga ao longo do tempo', minBand: 38 });
  let seg = [];
  const flush = () => { if (seg.length > 1) c.svg.appendChild(sv('polyline', { class: 'pt-line', points: seg.join(' ') })); seg = []; };
  recs.forEach((r, i) => { if (r.s.position) seg.push(`${c.cx(i)},${c.y(r.s.position)}`); else flush(); });
  flush();
  recs.forEach((r, i) => {
    if (!r.s.position) return;
    const champ = r.s.position === 1;
    c.svg.appendChild(sv('g', null, sv('title', null, `T${r.s.season} · ${r.club.name}: ${r.s.position}º lugar`),
      sv('circle', { cx: c.cx(i), cy: c.y(r.s.position), r: champ ? 7 : 5.5, fill: clubColor(r.club.id), stroke: champ ? '#f5c542' : 'var(--surface)', 'stroke-width': champ ? 3 : 2 }),
      sv('text', { class: 'blab', x: c.cx(i), y: c.y(r.s.position) - 11, style: 'font-size:10px' }, r.s.position + 'º')));
  });
  return c.wrap();
}
function hbars(rows, color) {
  const mx = Math.max(1, ...rows.map(r => r.v));
  return h('div', null, rows.map(r => h('div', { class: 'hbar' },
    h('span', null, h('span', { class: 'dot', style: { background: r.color || color } }), r.label),
    h('div', { class: 'bar' }, h('i', { style: { width: r.v / mx * 100 + '%', background: r.color || color } })), h('b', null, r.txt != null ? r.txt : r.v))));
}
function chartTitles(recs) {

  if (ui.frameIdx >= frames.length) ui.frameIdx = Math.max(0, frames.length - 1);
  card.appendChild(h('div', { class: 'row' }, h('h3', { style: { margin: 0 } }, '🖼 Quadro tático'), h('div', { class: 'spacer' }),
    h('button', { class: 'btn sm', type: 'button', onclick: () => openInsertPattern(a) }, '📚 Inserir padrão'),
    h('button', { class: 'btn sm primary', type: 'button', onclick: () => { frames.push(newFrame(a, 'Quadro ' + (frames.length + 1))); ui.frameIdx = frames.length - 1; touch(a); commit(); } }, '＋ Novo quadro')));
  if (!frames.length) {
    card.appendChild(h('p', { class: 'muted' }, 'Crie quadros para mostrar momentos do jogo (ex.: "Saída de bola", "Pressão alta", "Transição"). Em cada quadro você arrasta os 22 jogadores e a bola, e desenha setas.'));
    return card;
  }
  const fr = frames[ui.frameIdx];
  card.appendChild(h('div', { class: 'frame-chips' }, frames.map((f, i) => h('button', { class: 'btn sm' + (i === ui.frameIdx ? ' on' : ''), type: 'button', onclick: () => { ui.frameIdx = i; render(); } }, f.name))));
  const fSel = side => {
    const s = h('select', { class: 'input', 'aria-label': 'Formação ' + (side === 'home' ? 'da casa' : 'do visitante') }, REAL_FORMATION_NAMES.map(f => h('option', { value: f }, f)));
    s.value = fr[side].f;
    s.addEventListener('change', () => { fr[side] = { f: s.value, slots: teamSlots(s.value, side === 'away') }; touch(a); commit(); });
    return s;
  };
  const arrowBtns = Object.entries(ARROW_TYPES).map(([k, t]) => h('button', { class: 'btn sm' + (ui.arrowType === k ? ' on' : ''), type: 'button', onclick: () => { ui.arrowType = k; ui.arrowMode = true; render(); } },
    h('span', { class: 'dot', style: { background: t.c, border: '1px solid #888', margin: 0 } }), t.label));
  const side = h('div', { class: 'stack' },
    h('div', { class: 'fld' }, h('label', null, `🔵 ${a.home} — formação`), fSel('home')),
    h('div', { class: 'fld' }, h('label', null, `🔴 ${a.away} — formação`), fSel('away')),
    h('div', { class: 'row' },
      h('button', { class: 'btn sm' + (ui.arrowMode ? ' on' : ''), type: 'button', onclick: () => { ui.arrowMode = !ui.arrowMode; render(); } }, ui.arrowMode ? '✏ Modo seta: ligado' : '✏ Desenhar setas'),
      h('button', { class: 'btn sm', type: 'button', disabled: fr.arrows.length ? null : '', onclick: () => { fr.arrows.pop(); touch(a); commit(); } }, '↶ Desfazer seta'),
      h('button', { class: 'btn sm', type: 'button', disabled: fr.arrows.length ? null : '', onclick: () => { fr.arrows = []; touch(a); commit(); } }, 'Limpar setas')),
    ui.arrowMode ? h('div', { class: 'stack', style: { gap: '6px' } }, h('div', { class: 'row' }, arrowBtns), h('p', { class: 'muted small' }, 'Arraste no campo para desenhar. Toque numa seta para apagá-la. Desligue o modo para mover jogadores.')) :
      h('p', { class: 'muted small' }, 'Arraste jogadores e a bola. Toque num jogador para mudar o rótulo (número ou nome).'),
    fr.note ? h('div', { class: 'note text-block' }, fr.note) : null,
    h('div', { class: 'row' },
      h('button', { class: 'btn sm', type: 'button', onclick: () => formModal({ title: 'Nome e nota do quadro', submitLabel: 'Salvar', fields: [{ key: 'name', label: 'Nome do quadro', type: 'text', required: true, value: fr.name, maxlength: 40 }, { key: 'note', label: 'Nota (o que mostrar neste momento)', type: 'textarea', rows: 4, value: fr.note, maxlength: 1500 }], onSubmit: v => { fr.name = v.name; fr.note = v.note; touch(a); commit(); } }) }, '✎ Nome e nota'),
      h('button', { class: 'btn sm', type: 'button', onclick: () => { const c = clone(fr); c.id = uid(); c.name = fr.name + ' (cópia)'; frames.splice(ui.frameIdx + 1, 0, c); ui.frameIdx++; touch(a); commit(); } }, 'Duplicar'),
      h('button', { class: 'btn sm', type: 'button', title: 'Guardar este quadro na biblioteca de padrões', onclick: () => openSavePattern(fr) }, '⭐ Salvar como padrão'),
      h('button', { class: 'btn sm', type: 'button', title: 'Imagem PNG deste quadro', onclick: () => shareFramePng(a, fr) }, '🖼 Imagem'),
      h('button', { class: 'btn sm', type: 'button', onclick: () => { fr.home.slots = teamSlots(fr.home.f, false); fr.away.slots = teamSlots(fr.away.f, true); fr.ball = { x: 50, y: 50 }; touch(a); commit(); } }, '↺ Resetar posições'),
      h('button', { class: 'btn sm danger', type: 'button', onclick: async () => { const ok = await confirmDialog({ title: 'Excluir quadro?', message: `"${fr.name}" será excluído.`, okLabel: 'Excluir', danger: true }); if (!ok) return; frames.splice(ui.frameIdx, 1); touch(a); commit(); } }, '🗑 Excluir quadro')));
  card.appendChild(h('div', { class: 'board' }, h('div', null, buildFramePitch(a, fr)), side));
  return card;
}

function rtgMetrics() {
  const clubs = state.ml.clubs, recs = allSeasonRecords();
  const real = clubs.filter(c => !c.national), nats = clubs.filter(c => c.national);
  const G = state.ml;
  const m = {
    clubs: new Set(real.map(c => normText(c.name))).size, nations: new Set(nats.map(c => normText(c.name))).size,
    seasons: recs.length, wins: 0, goals: 0, titles: 0, natTitles: 0, leagueTitles: 0, unbeaten: 0, aprov80: 0, invictoChamp: 0, streak: 0,
    diary: G.diary.length, analyses: G.analyses.length, tactics: G.tactics.length, experiments: G.experiments.length, patterns: G.patterns.length,
    chalDone: G.challenges.rolls.filter(r => r.status === 'concluido').length, chalHard: G.challenges.rolls.filter(r => r.status === 'concluido' && r.diff >= 8).length,
    maxOvr: G.squad.reduce((mx, p) => Math.max(mx, p.ovr || 0), 0), count80: G.squad.filter(p => p.ovr >= 80).length,
    talents: G.squad.filter(p => p.age <= 21 && p.pot != null && p.pot >= 85).length
  };
  const countries = new Set(), champClubs = new Set(), conts = new Set();
  RTG_LEAGUE_TROPHIES.forEach(t => { m['ln_' + t.id] = 0; });
  recs.forEach(({ club, s }) => {
    const x = sStats(s);
    m.wins += x.w; m.goals += x.gf; m.titles += x.titles;
    if (club.national) m.natTitles += x.titles;
    if (x.J >= 10 && x.l === 0) m.unbeaten++;
    if (x.J >= 10 && x.pct >= 80) m.aprov80++;
    if (s.position === 1 && !club.national) {
      m.leagueTitles++; countries.add(normText(club.country)); champClubs.add(normText(club.name));
      const ct = continentOf(club.country); if (ct) conts.add(ct);
      if (x.J >= 10 && x.l === 0) m.invictoChamp++;
      RTG_LEAGUE_TROPHIES.forEach(t => { if (t.test(club)) m['ln_' + t.id]++; });
    }
  });
  m.champCountries = countries.size; m.champClubs = champClubs.size; m.champContinents = conts.size;
  m.bigFive = BIG5.filter(id => m['ln_' + id] > 0).length;
  const natConts = new Set(); nats.forEach(c => { const ct = continentOf(c.country); if (ct) natConts.add(ct); });
  m.natContinents = natConts.size;
  clubs.filter(c => !c.national).forEach(c => {
    let run = 0, prev = null;
    c.seasons.filter(s => s.position === 1).map(s => s.season).sort((a, b) => a - b).forEach(n => { run = prev != null && n === prev + 1 ? run + 1 : 1; prev = n; if (run > m.streak) m.streak = run; });
  });
  // copas detectadas pelos títulos digitados
  const titles = recs.flatMap(r => (r.s.titles || []).map(t => normText(t)));
  m.cupCount = {};
  Object.keys(CUPS).forEach(k => { m.cupCount[k] = titles.filter(CUPS[k].test).length; });
