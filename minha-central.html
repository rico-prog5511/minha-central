const goalSaved = g => (g.deposits || []).reduce((s, d) => s + d.amount, 0);
/** Estimativa: ritmo dos seus depósitos; sem depósitos, usa o saldo médio mensal recente. */
function goalEstimate(g) {
  const saved = goalSaved(g), left = cents(g.target - saved);
  if (left <= 0) return { done: true };
  const deps = g.deposits || [];
  let monthly = null, src = '';
  if (deps.length >= 2) {
    const first = deps.reduce((m, d) => d.date < m ? d.date : m, deps[0].date);
    const months = Math.max(1, (-daysUntil(first)) / 30.44);
    monthly = saved / months; src = 'o ritmo dos seus depósitos';
  } else {
    const ms = lastMonths(3), T = state.dd.transactions;
    const active = ms.filter(k => T.some(t => monthKey(t.date) === k));
    if (active.length) {
      const bal = active.reduce((s, k) => { const L = T.filter(t => monthKey(t.date) === k); return s + sumTx(L, 'in') - sumTx(L, 'out'); }, 0);
      monthly = bal / active.length; src = 'o seu saldo médio mensal recente';
    }
  }
  const est = { left, saved };
  if (g.deadline) { const dd = daysUntil(g.deadline); est.needed = dd > 0 ? left / Math.max(dd / 30.44, 0.03) : null; est.late = dd < 0; }

/** Converte um SVG em imagem PNG com título, legenda e nota (para mandar a amigos) */
function svgToPng(svgEl, o) {

      probe.font = '24px system-ui,sans-serif';
      const noteLines = o.note ? wrap(probe, o.note, W - 60).slice(0, 7) : [];
      const H = HH + 70 + FH + (noteLines.length ? noteLines.length * 32 + 40 : 0) + 56;
      const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
      const c = cv.getContext('2d');

      c.fillStyle = o.accent || '#3ddc84'; c.fillRect(0, 0, W, 10);
      c.fillStyle = '#ffffff'; c.font = '800 34px system-ui,sans-serif';
      wrap(c, o.title || '', W - 60).slice(0, 2).forEach((l, i) => c.fillText(l, 30, 58 + i * 40));
      c.fillStyle = '#9fb6a8'; c.font = '24px system-ui,sans-serif'; c.fillText((o.subtitle || '').slice(0, 60), 30, HH - 6);
      let lx = 30; (o.legend || []).forEach(l => { c.fillStyle = l.c; c.beginPath(); c.arc(lx + 9, HH + 30, 9, 0, 7); c.fill(); c.fillStyle = '#e6f4ea'; c.font = '22px system-ui,sans-serif'; c.fillText(l.t.slice(0, 26), lx + 26, HH + 38); lx += 40 + c.measureText(l.t.slice(0, 26)).width + 20; });
      c.drawImage(img, 0, HH + 70, W, FH);
      let y = HH + 70 + FH + 40;
      if (noteLines.length) { c.fillStyle = '#e6f4ea'; c.font = '24px system-ui,sans-serif'; noteLines.forEach(l => { c.fillText(l, 30, y); y += 32; }); y += 8; }
      c.fillStyle = '#6f8a7a'; c.font = '20px system-ui,sans-serif'; c.fillText('Minha Central · ' + fmtDate(todayISO()), 30, H - 22);

    };

}

    deferredInstall && !isStandalone() ? h('button', { class: 'btn primary', type: 'button', onclick: async () => { try { deferredInstall.prompt(); await deferredInstall.userChoice; } catch (e) {} deferredInstall = null; m.close(); } }, '📲 Instalar agora') : null,
    h('div', { class: 'card stack' }, h('h3', { style: { margin: 0 } }, 'Opção A — mais simples (sem hospedar)'),
      h('ol', { class: 'steps' }, step(1, 'Mande o arquivo minha-central.html para o celular (e-mail, nuvem, cabo ou pen drive).'), step(2, 'Abra o arquivo no Chrome (Android) ou no Safari (iPhone). Costuma funcionar offline.'),
        step(3, 'No menu do navegador use "Adicionar à tela inicial" para criar um atalho.')),
      h('p', { class: 'muted small' }, 'Limite: em alguns celulares o arquivo aberto pelo gerenciador de arquivos não guarda os dados entre uma abertura e outra. Se isso acontecer, use a opção B.')),
    h('div', { class: 'card stack' }, h('h3', { style: { margin: 0 } }, 'Opção B — instalar como app de verdade (recomendado)'),
      h('ol', { class: 'steps' },
        step(1, 'Junte estes 5 arquivos numa mesma pasta: minha-central.html, manifest.webmanifest, sw.js, icon-192.png e icon-512.png (os 4 últimos já estão na pasta do projeto).'),
        step(2, 'Hospede a pasta em um serviço gratuito de sites estáticos (GitHub Pages, Netlify, Cloudflare Pages…) e abra o endereço no celular.'),
        step(3, 'Android (Chrome): menu ⋮ → "Instalar app" (ou "Adicionar à tela inicial"). iPhone (Safari): botão Compartilhar → "Adicionar à Tela de Início".'),
        step(4, 'Abra uma vez com internet: depois disso o app funciona offline e atualiza sozinho quando você publicar uma versão nova.')),
      h('p', { class: 'muted small' }, 'Seus dados NÃO vão para a hospedagem: ficam só no aparelho que usa o app. Por isso, para levar os dados de um aparelho para outro, use 💾 Backup → exportar no computador e importar no celular (e vice-versa).')),
    h('div', { class: 'modal-foot' }, h('button', { class: 'btn', type: 'button', onclick: () => m.close() }, 'Fechar'))].filter(Boolean));
}

/* =====================================================================
   21. ABAS DE FASES FUTURAS (marcador "em breve")
   ===================================================================== */
function renderComingSoon(t) {
  return h('div', { class: 'card soon-card' },
    h('div', { class: 'big' }, t.icon),
    h('h2', { style: { marginTop: '8px' } }, t.label),
    h('p', { class: 'muted', style: { marginTop: '6px' } }, `Esta aba será construída na Fase ${t.phase}.`),
    t.desc ? h('ul', null, t.desc.map(d => h('li', null, d))) : null);
}

/* =====================================================================
   22. INICIALIZAÇÃO
   ===================================================================== */
window.addEventListener('storage', e => {          // outra aba do navegador alterou os dados
  if (e.key === STORAGE_KEY) { state = loadState(); applyTheme(); render(); }
});
if (lightMQ && lightMQ.addEventListener) lightMQ.addEventListener('change', () => { if (state.meta.theme === 'auto') { applyTheme(); render(); } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') runAutoBackup(); });
window.addEventListener('pagehide', () => runAutoBackup());
setInterval(() => runAutoBackup(), 30 * 60 * 1000);
applyTheme();
render();
setupPwa();
setTimeout(() => runAutoBackup(), 1500);
</script>
</body>
