{ id: 'm38', level: 3, icon: '🧭', title: 'Metodologia de testes web na prática (WSTG)', mins: 30,
  intro: 'Testar uma aplicação web é um processo organizado, não uma sequência aleatória de truques. Siga um fluxo de trabalho, use as ferramentas certas e produza evidências úteis.',
  sections: [
    { h: 'Preparação e ambiente', p: `• Escopo e autorização: sem eles, nada de teste. Em laboratórios (Juice Shop, DVWA, PortSwigger), você mesmo é o dono.
• Ambiente: navegador dedicado com proxy (Burp Suite ou OWASP ZAP), certificado do proxy instalado e extensões úteis.
• Contas de teste de diferentes papéis (usuário comum, administrador) para comparar permissões.
• Anotações e organização: registre requisições, resultados e hipóteses.
• Guia de referência: OWASP Web Security Testing Guide (WSTG), que organiza testes por categoria.` },
    { h: 'Mapeamento e reconhecimento', p: `Antes de testar falhas, conheça a aplicação:
• Navegue por todas as funções com o proxy ligado para registrar as requisições.
• Liste parâmetros, formulários, uploads, APIs, cookies e cabeçalhos.
• Identifique tecnologias (cabeçalhos, mensagens de erro, arquivos estáticos).
• Descoberta de conteúdo: pastas e arquivos ocultos (ferramentas como ffuf ou gobuster, com listas de palavras, só em alvos autorizados).
• Arquivos informativos: robots.txt, sitemap.xml, documentação de API (Swagger/OpenAPI).
• Compreenda o fluxo de negócio e os papéis. Falhas de lógica só aparecem para quem entende o que o sistema deveria fazer.` },
    { h: 'Autenticação, sessão e controle de acesso', p: `Teste:
• Enumeração de usuários (mensagens diferentes para "usuário inexistente" e "senha errada").
• Política de senhas, bloqueio por tentativas e proteção contra automação.
• Recuperação de senha: tokens previsíveis, reutilizáveis ou sem expiração, links que vazam por Referer.
• Sessão: cookies com atributos de segurança, rotação após login, invalidação no logout, expiração.
• Controle de acesso: troque identificadores (IDOR), tente funções administrativas com usuário comum, acesse URLs diretamente, altere métodos HTTP e parâmetros ocultos.
Compare sempre as respostas entre papéis diferentes: é assim que se descobre autorização quebrada.` },
    { h: 'Entradas e falhas de injeção', p: `Fluxo seguro e eficiente para cada ponto de entrada:
1. Teste com valores inofensivos e observe como a aplicação reflete e processa (aspas simples, caracteres especiais, marcadores únicos).
2. Identifique o contexto (HTML, atributo, JavaScript, SQL, comando, caminho de arquivo, XML).
3. Confirme a falha com a prova de conceito mais simples possível, sem causar dano.
4. Pare e documente: não extraia dados além do necessário para provar o risco.
Categorias: XSS (refletido, armazenado, DOM), SQL injection, injeção de comandos, path traversal, XXE, SSRF, upload inseguro e desserialização. Em laboratórios, pratique cada uma e depois reescreva a correção.` },
    { h: 'Lógica de negócio, evidências e relatório', p: `Falhas de lógica não são achadas por scanners: preços manipulados no cliente, cupons reutilizáveis, saltos de etapas em fluxos de compra, condições de corrida (race conditions) em saldos e saques, limites de quantidade ignorados.

Evidências: requisições e respostas completas, capturas de tela, passos numerados para reproduzir e o impacto real. Classifique a gravidade (CVSS ou critério claro), recomende a correção e sugira o reteste.

Comunicação: relate de forma objetiva, sem expor dados reais de usuários, e respeite prazos de divulgação responsável em programas de bug bounty.` }
  ],
  terms: [['WSTG', 'Guia de testes de segurança web da OWASP.'], ['Proxy de interceptação', 'Ferramenta que fica entre o navegador e o site e permite ver e alterar requisições.'], ['Content discovery', 'Busca de pastas e arquivos não linkados em um site.'], ['Enumeração de usuários', 'Descobrir contas existentes por diferenças nas respostas.'], ['Race condition', 'Falha que ocorre quando operações simultâneas geram um estado inconsistente.'], ['Prova de conceito', 'Demonstração mínima de que a falha existe.'], ['Divulgação responsável', 'Relatar falhas ao responsável com prazo antes de publicar.']],
  practice: ['No OWASP Juice Shop, mapeie todas as rotas e parâmetros com o proxy ligado e crie uma tabela com 10 itens.', 'Compare as respostas de um usuário comum e de um administrador para o mesmo endpoint e anote as diferenças.', 'Escreva um relatório de 1 página para uma falha fictícia (título, gravidade, passos, impacto e correção).'],
  quiz: [
    { q: 'Qual o primeiro passo de qualquer teste?', o: ['Atacar o site', 'Ter escopo e autorização', 'Baixar ferramentas', 'Escolher o payload'], a: 1, e: 'Sem autorização, o teste é invasão.' },
    { q: 'O que torna a enumeração de usuários possível?', o: ['Senhas fortes', 'Mensagens de erro diferentes para usuário inexistente e senha errada', 'Uso de HTTPS', 'Cookies seguros'], a: 1, e: 'Respostas distintas revelam quais contas existem.' },
    { q: 'Por que falhas de lógica de negócio não costumam ser achadas por scanners?', o: ['Porque são raras', 'Porque exigem entender o fluxo esperado do sistema', 'Porque não existem em sites reais', 'Porque são cobertas por HTTPS'], a: 1, e: 'Scanners não sabem o que a aplicação deveria fazer.' },
    { q: 'Após confirmar uma falha de injeção, o procedimento ético é...', o: ['Extrair o máximo de dados possível', 'Parar, documentar e relatar com a prova mínima', 'Vender a falha', 'Apagar logs'], a: 1, e: 'Evidência mínima basta; evite impacto desnecessário.' },
    { q: 'Qual é um uso típico do proxy de interceptação?', o: ['Criptografar o disco', 'Ver e alterar requisições entre navegador e site', 'Atualizar o navegador', 'Limpar cookies'], a: 1, e: 'Burp Suite e ZAP permitem inspecionar e modificar o tráfego.' }
  ],
  cards: [['O que é o WSTG?', 'Guia de testes de segurança web da OWASP, organizado por categoria.'], ['Como testar controle de acesso?', 'Comparar respostas entre papéis e trocar identificadores e métodos.'], ['O que é race condition?', 'Estado inconsistente causado por operações simultâneas (ex.: duplo saque).'],
    ['O que registrar como evidência?', 'Requisições/respostas, capturas, passos e impacto.'], ['O que é content discovery?', 'Procurar arquivos e pastas escondidos com listas de palavras.'], ['Qual a regra ao confirmar uma falha?', 'Prova mínima, sem dano, e relato responsável.']]
},
{ id: 'm39', level: 3, icon: '🕶️', title: 'Privacidade avançada: rastreamento, VPN e Tor', mins: 26,
  intro: 'Quem rastreia você, como e o que realmente protege? Aprenda a diferenciar ferramentas, entender seus limites e montar um modelo de ameaças pessoal.',
  sections: [
    { h: 'Como somos rastreados', p: `• Cookies de terceiros e pixels de rastreamento seguem você entre sites.
• Fingerprinting: o conjunto de características do navegador (fontes, tela, extensões, fuso) forma uma "impressão digital" mesmo sem cookies.
• Endereço IP e dados de rede revelam localização aproximada e provedor.
• Aplicativos com SDKs de terceiros coletam localização, contatos e identificadores de publicidade.
• Corretores de dados (data brokers) agregam informações de várias fontes.
• Metadados de e-mails, fotos e documentos entregam local, data e autor.
• Redes Wi-Fi e Bluetooth próximos rastreiam presença.
Pergunte sempre: quem se interessa por esse dado e o que faria com ele?` },
    { h: 'Ferramentas e seus limites', p: `• VPN: cria um túnel criptografado até um servidor do provedor. Esconde seu tráfego da rede local e o seu IP dos sites, mas você passa a confiar no provedor da VPN. Não torna você anônimo nem protege de golpes ou malware.
• Tor: encaminha o tráfego por três nós voluntários, de forma que nenhum nó saiba ao mesmo tempo quem você é e para onde vai. Oferece anonimato muito maior, é mais lento e não protege você de erros (logar em uma conta pessoal, baixar e abrir arquivos fora do navegador).
• DNS privado (DoH/DoT): evita que o provedor veja quais nomes você consulta (o IP de destino ainda é visível).
• Navegadores com proteção contra rastreamento e bloqueadores de conteúdo reduzem cookies e fingerprinting.
• HTTPS protege o conteúdo, mas não esconde o domínio acessado de quem vê a rede.
Nenhuma ferramenta resolve tudo: combine com bons hábitos.` },
    { h: 'Compartimentalização e modelo de ameaças', p: `Modelo de ameaças pessoal: o que você quer proteger, de quem e com que custo?
• Perfil comum: golpistas e vazamentos de dados. Foco: senhas, 2FA, backups, menos exposição.
• Jornalistas, ativistas, advogados e pessoas em situações de risco: atacantes mais persistentes e spyware comercial. Foco: aparelhos atualizados, chaves de segurança, modos de proteção reforçada (como o Modo de Bloqueio do iOS e a Proteção Avançada do Android e de contas Google), mensageiros com criptografia ponta a ponta e separação de identidades.

Compartimentalizar: use e-mails e perfis diferentes para contextos diferentes (trabalho, compras, redes), cartões virtuais, navegadores ou perfis separados e evite ligar identidades por acidente (mesmo nome de usuário, mesma foto).` },
    { h: 'Mensageiros e metadados', p: `Criptografia ponta a ponta protege o conteúdo, mas os metadados (quem fala com quem, quando, quanto) podem continuar visíveis para o serviço.
• Signal usa criptografia ponta a ponta com o protocolo Signal, coleta pouquíssimos metadados e tem recursos como mensagens temporárias.
• WhatsApp usa o mesmo protocolo para o conteúdo, mas coleta mais metadados.
• Backups na nuvem podem quebrar a proteção se não forem criptografados com chave só sua.
• Atenção a capturas de tela, notificações na tela bloqueada e dispositivos vinculados.
• Verifique o código de segurança de contatos importantes para detectar troca de chaves.` },
    { h: 'Direitos, ética e uso responsável', p: `Privacidade é um direito, e não um sinal de que alguém tem algo a esconder. No Brasil, a LGPD dá ao titular direitos de acesso, correção, eliminação e informação sobre compartilhamento.

Ao mesmo tempo, ferramentas de anonimato são usadas para o bem (jornalismo, denúncia, proteção de pessoas em risco) e para o mal. Use-as dentro da lei e de forma responsável. Ao estudar, evite acessar conteúdo ilegal e não aja contra terceiros.` }
  ],
  terms: [['Fingerprinting', 'Identificar um navegador por suas características únicas, sem cookies.'], ['Data broker', 'Empresa que agrega e vende dados pessoais de várias fontes.'], ['VPN', 'Túnel criptografado até um provedor; muda o IP visto pelos sites.'], ['Tor', 'Rede que encaminha tráfego por vários nós para dar anonimato.'], ['Modelo de ameaças pessoal', 'Análise do que proteger, de quem e com quais recursos.'], ['Compartimentalização', 'Separar identidades e contextos para limitar vazamentos.'], ['Metadados', 'Dados sobre dados: quem, quando, onde e quanto, sem o conteúdo.']],
  practice: ['Teste seu navegador em um site de fingerprinting (como o Cover Your Tracks, da EFF) e veja quão único ele é.', 'Escreva seu modelo de ameaças pessoal em 5 linhas: o que proteger, de quem e que medidas valem o custo.', 'Revise as permissões de localização e o identificador de publicidade do seu celular e reduza o que for desnecessário.'],
  quiz: [
    { q: 'O que uma VPN comercial NÃO faz?', o: ['Criptografar o tráfego até o servidor da VPN', 'Tornar você totalmente anônimo e protegido de golpes', 'Esconder seu IP dos sites', 'Proteger o tráfego na rede local'], a: 1, e: 'Você passa a confiar no provedor; ela não impede golpes nem malware.' },
    { q: 'Como o Tor protege a identidade?', o: ['Com uma senha', 'Passando o tráfego por vários nós para que nenhum conheça origem e destino ao mesmo tempo', 'Apagando o histórico', 'Bloqueando anúncios'], a: 1, e: 'A divisão de conhecimento entre os nós dificulta o rastreamento.' },
    { q: 'O que é fingerprinting?', o: ['Leitura de digitais no celular', 'Identificação do navegador por suas características, sem cookies', 'Um tipo de criptografia', 'Um golpe de e-mail'], a: 1, e: 'A combinação de configurações cria uma impressão digital.' },
    { q: 'A criptografia ponta a ponta de um mensageiro protege...', o: ['Todos os metadados', 'O conteúdo das mensagens', 'O aparelho contra roubo', 'O número de telefone'], a: 1, e: 'Metadados podem continuar visíveis para o serviço.' },
    { q: 'Compartimentalizar identidades significa...', o: ['Usar a mesma conta em tudo', 'Separar e-mails, perfis e cartões por contexto', 'Apagar todas as contas', 'Compartilhar senhas'], a: 1, e: 'Limita o dano e a correlação quando algo vaza.' }
  ],
  cards: [['VPN protege de quê?', 'De quem vê a rede local e esconde seu IP dos sites, mas exige confiança no provedor.'], ['O que é fingerprinting?', 'Identificação por características únicas do navegador.'], ['O que são metadados?', 'Informações sobre a comunicação (quem, quando, onde) sem o conteúdo.'],
    ['Quando usar Tor?', 'Quando anonimato é necessário, aceitando lentidão e seguindo boas práticas.'], ['O que é modelo de ameaças?', 'Definir o que proteger, de quem e com que custo.'], ['O que a LGPD garante ao titular?', 'Acesso, correção, eliminação e informação sobre o uso de seus dados.']]
},
{ id: 'm40', level: 3, icon: '📶', title: 'Forense de rede e análise de tráfego com Wireshark', mins: 30,
  intro: 'A rede registra o que o atacante faz. Aprenda a capturar, filtrar e interpretar tráfego para reconstruir um incidente e identificar padrões de ataque.',
  sections: [
    { h: 'Capturas e ferramentas', p: `• Capturas completas (PCAP) guardam os pacotes; ocupam muito espaço e podem conter dados sensíveis.
• Wireshark: análise visual, ótima para estudo. tshark/tcpdump: linha de comando, bons para servidores e automação.
• Filtros de captura (BPF) limitam o que é gravado (por exemplo, port 53); filtros de exibição (display filters) escolhem o que mostrar no Wireshark (por exemplo, dns).
• NetFlow/IPFIX registram só metadados de fluxos (origem, destino, portas, volume): úteis para ver padrões em escala com pouco armazenamento.
• Zeek (antigo Bro) transforma tráfego em logs estruturados (conn, dns, http, ssl, files) e facilita a análise.
Capture apenas em redes e dispositivos sob sua responsabilidade ou autorização.` },
    { h: 'Filtros essenciais do Wireshark', p: `Alguns filtros de exibição úteis:`, code: `ip.addr == 10.0.0.57             # tráfego de ou para um host
tcp.port == 443                  # uma porta TCP
dns                               # consultas e respostas DNS
http.request.method == "POST"    # requisições POST
tcp.flags.syn == 1 && tcp.flags.ack == 0   # início de conexões (varreduras)
tls.handshake.type == 1          # ClientHello (ver SNI e versões)
frame contains "FLAG{"           # procurar um texto em qualquer pacote
!(arp || dns)                    # excluir ruído` },
    { h: 'Reconstruindo conversas e arquivos', p: `• Follow TCP Stream: junta os pacotes de uma conexão e mostra a conversa legível (em protocolos sem criptografia).
• File > Export Objects (HTTP, SMB): extrai arquivos transferidos; calcule o hash e consulte reputações.
• Estatísticas: Protocol Hierarchy, Conversations e Endpoints mostram quem mais conversou.
• Com TLS, o conteúdo está cifrado, mas ainda há metadados valiosos: IPs, SNI (nome do servidor, em geral visível), certificados e impressões do cliente como JA3/JA4.
• Linha do tempo: ordene eventos por horário e relacione com logs de outros sistemas (DNS, proxy, EDR).` },
    { h: 'Padrões de ataque no tráfego', p: `• Varredura de portas: muitos SYN para portas diferentes em pouco tempo, com RST ou sem resposta.
• ARP spoofing: respostas ARP repetidas associando um IP a dois MACs diferentes.
• Beaconing: conexões em intervalos regulares para o mesmo destino (comando e controle).
• DNS tunneling: consultas longas ou muito frequentes a subdomínios aleatórios, muitas vezes do tipo TXT.
• Exfiltração: grande volume de saída para destinos incomuns, fora do horário.
• Força bruta: muitas tentativas de autenticação (SSH, RDP, SMB, HTTP) do mesmo origem.
• Movimentação lateral: conexões SMB/RDP/WinRM entre estações que normalmente não conversam.
Pratique com os logs simulados do Treino e com PCAPs públicos de estudo (como os de malware-traffic-analysis.net).` },
    { h: 'Boas práticas, legalidade e relatório', p: `• Autorização e escopo: capturar tráfego de terceiros pode violar a lei de interceptação e a LGPD.
• Minimização: capture o mínimo necessário, proteja os arquivos PCAP com acesso restrito e criptografia, defina prazo de retenção.
• Integridade: calcule o hash dos arquivos de captura e mantenha cadeia de custódia se forem evidência.
• Documentação: registre filtros usados, horários e conclusões; inclua capturas de tela e linhas do tempo.
• Relatório: descreva o que aconteceu, evidências, indicadores (IOCs) e recomendações de contenção e prevenção.
• Compartilhe indicadores com o time de detecção para virar regras.` }
  ],
  terms: [['PCAP', 'Arquivo com pacotes de rede capturados.'], ['Filtro BPF', 'Filtro aplicado na captura para gravar só certos pacotes.'], ['Display filter', 'Filtro usado na tela do Wireshark para escolher o que exibir.'], ['NetFlow / IPFIX', 'Registros de metadados de fluxos de rede.'], ['Zeek', 'Ferramenta que converte tráfego em logs estruturados.'], ['SNI', 'Campo do TLS que informa o nome do servidor desejado.'], ['JA3 / JA4', 'Impressões digitais do cliente TLS usadas para identificar softwares.']],
  practice: ['Capture 1 minuto do seu próprio tráfego no Wireshark e use o filtro dns para listar os nomes consultados.', 'Baixe um PCAP de estudo (de uma fonte de treinamento) e use Statistics > Conversations para achar o host que mais conversou.', 'Aplique o filtro de varredura (SYN sem ACK) em um PCAP de nmap feito por você em laboratório e observe o padrão.'],
  quiz: [
    { q: 'Qual a diferença entre filtro de captura e filtro de exibição?', o: ['Não há diferença', 'O de captura limita o que é gravado; o de exibição escolhe o que mostrar', 'O de exibição apaga pacotes', 'O de captura só funciona no Windows'], a: 1, e: 'BPF é aplicado antes de gravar; display filters, depois.' },
    { q: 'Com tráfego TLS, o que ainda costuma ser visível?', o: ['Todo o conteúdo', 'Metadados como IPs, SNI e certificados', 'Nada', 'Apenas a senha'], a: 1, e: 'O conteúdo é cifrado, mas há metadados úteis.' },
    { q: 'O que caracteriza beaconing?', o: ['Um único acesso grande', 'Conexões em intervalos regulares para o mesmo destino', 'Tráfego só de download', 'Falhas de DNS'], a: 1, e: 'É um padrão típico de comunicação com comando e controle.' },
    { q: 'Qual filtro mostra início de conexões TCP (típico de varredura)?', o: ['tcp.flags.syn == 1 && tcp.flags.ack == 0', 'dns', 'arp', 'http'], a: 0, e: 'SYN sem ACK indica pedidos de nova conexão.' },
    { q: 'Qual precaução legal é essencial ao capturar tráfego?', o: ['Nenhuma', 'Ter autorização e coletar o mínimo necessário', 'Capturar tudo da vizinhança', 'Publicar o PCAP'], a: 1, e: 'Capturas podem conter dados pessoais e interceptação sem permissão é ilegal.' }
  ],
  cards: [['O que é um PCAP?', 'Arquivo de captura de pacotes de rede.'], ['O que faz Follow TCP Stream?', 'Reconstrói a conversa de uma conexão TCP.'], ['O que é DNS tunneling?', 'Esconder dados em consultas DNS, geralmente a subdomínios aleatórios.'],
    ['O que é JA3?', 'Impressão digital do cliente TLS baseada no ClientHello.'], ['Para que serve o Zeek?', 'Gerar logs estruturados a partir do tráfego de rede.'], ['Como é o padrão de uma varredura SYN?', 'Muitos SYN sem ACK para várias portas em pouco tempo.']]

VULNS.push(
  { id: 'jwt', t: 'JWT mal validado', sev: 'Alta', cwe: 'CWE-345 / 347', what: 'A API aceita tokens sem checar corretamente a assinatura, o algoritmo ou a validade, permitindo forjar identidades.',
    bad: `// Node.js (vulnerável): só decodifica, não verifica\nconst dados = jwt.decode(token);\nif (dados.admin) liberar();`,
    good: `// Verifica assinatura, algoritmo, expiração e audiência\nconst dados = jwt.verify(token, CHAVE_PUBLICA, { algorithms: ['RS256'], audience: 'minha-api', issuer: 'https://idp.exemplo.test' });`,
    fix: ['Sempre verificar assinatura (nunca apenas decodificar)', 'Fixar os algoritmos aceitos (rejeitar "none" e confusão HS256/RS256)', 'Usar segredos fortes e rotacionar chaves', 'Validar exp, aud e iss; tokens curtos e revogáveis'] },
  { id: 'clickjack', t: 'Clickjacking', sev: 'Média', cwe: 'CWE-1021', what: 'Um site malicioso carrega a sua página invisível dentro de um frame e induz o usuário a clicar em botões reais sem perceber.',
    bad: `<!-- site do atacante -->\n<iframe src="https://banco.exemplo/transferir" style="opacity:0;position:absolute"></iframe>\n<button>Ganhe um prêmio!</button>`,
    good: `# Cabeçalhos de resposta do seu site\nContent-Security-Policy: frame-ancestors 'none'\nX-Frame-Options: DENY`,
    fix: ['frame-ancestors no CSP (ou X-Frame-Options)', 'Reautenticar ações sensíveis', 'Interface que não depende de um único clique crítico'] },
  { id: 'redirect', t: 'Redirecionamento aberto (open redirect)', sev: 'Média', cwe: 'CWE-601', what: 'O site redireciona para qualquer endereço informado em um parâmetro, e golpistas usam o domínio confiável como trampolim em phishing.',
    bad: `// vulnerável\napp.get('/sair', (req, res) => res.redirect(req.query.url));\n// /sair?url=http://site-falso.example`,
    good: `const PERMITIDOS = new Set(['/inicio', '/conta']);\napp.get('/sair', (req, res) => res.redirect(PERMITIDOS.has(req.query.url) ? req.query.url : '/inicio'));`,
    fix: ['Lista de destinos permitidos ou identificadores internos', 'Aceitar apenas caminhos relativos', 'Avisar o usuário ao sair para sites externos'] },
  { id: 'xxe', t: 'XXE (entidades externas XML)', sev: 'Alta', cwe: 'CWE-611', what: 'O analisador XML processa entidades externas, permitindo ler arquivos do servidor ou fazer requisições internas.',
    bad: `# Python com parser inseguro\nfrom lxml import etree\ndoc = etree.fromstring(dados_xml, etree.XMLParser(resolve_entities=True))`,
    good: `from lxml import etree\nparser = etree.XMLParser(resolve_entities=False, no_network=True, dtd_validation=False, load_dtd=False)\ndoc = etree.fromstring(dados_xml, parser)`,
    fix: ['Desativar DTD e entidades externas', 'Preferir JSON quando possível', 'Atualizar bibliotecas XML', 'Executar o parser com privilégios mínimos'] },
  { id: 'race', t: 'Condição de corrida (race condition)', sev: 'Alta', cwe: 'CWE-362', what: 'Duas requisições simultâneas passam pela mesma verificação antes de qualquer uma atualizar o estado (ex.: usar um cupom ou sacar saldo duas vezes).',
    bad: `# vulnerável: checa e depois atualiza, em passos separados\nif saldo >= valor:\n    saldo = saldo - valor      # outra requisição pode passar pelo if ao mesmo tempo\n    salvar(saldo)`,
    good: `-- atômico no banco: a condição e a atualização são uma única operação\nUPDATE contas SET saldo = saldo - :valor WHERE id = :id AND saldo >= :valor;\n-- se nenhuma linha foi alterada, o saque é recusado`,
    fix: ['Operações atômicas e transações com bloqueio', 'Restrições únicas no banco (cupom por usuário)', 'Idempotência em operações críticas', 'Testes de concorrência'] },
  { id: 'cors', t: 'CORS permissivo demais', sev: 'Média', cwe: 'CWE-942', what: 'A API aceita requisições de qualquer origem com credenciais, permitindo que outro site leia dados do usuário logado.',
    bad: `// Express (vulnerável)\nres.setHeader('Access-Control-Allow-Origin', req.headers.origin);\nres.setHeader('Access-Control-Allow-Credentials', 'true');`,
    good: `const ORIGENS = new Set(['https://app.exemplo.test']);\nif (ORIGENS.has(req.headers.origin)) {\n  res.setHeader('Access-Control-Allow-Origin', req.headers.origin);\n  res.setHeader('Vary', 'Origin');\n}`,
    fix: ['Lista fixa de origens permitidas', 'Nunca combinar "*" com credenciais', 'Não refletir o Origin recebido sem validar', 'Autenticar e autorizar no servidor mesmo com CORS correto'] },
  { id: 'random', t: 'Aleatoriedade fraca', sev: 'Alta', cwe: 'CWE-330', what: 'Tokens de recuperação de senha ou de sessão gerados com um gerador previsível podem ser adivinhados.',

  { id: 'massassign', t: 'Mass assignment', sev: 'Alta', cwe: 'CWE-915', what: 'A API grava no objeto todos os campos recebidos do cliente, inclusive os que ele não deveria definir (como papel de administrador).',

  { id: 'logs', t: 'Injeção em logs e vazamento por logs', sev: 'Média', cwe: 'CWE-117 / 532', what: 'Entradas com quebras de linha forjam registros, e logs com senhas ou tokens viram uma segunda fonte de vazamento.',
    bad: `# Python (vulnerável)\nlogging.info("login de " + usuario + " com senha " + senha)\n# usuario = "ana\\nINFO login de admin ok"`,
    good: `import logging\nlogging.info("login de %s", usuario.replace("\\n", " ").replace("\\r", " "))\n# nunca registrar senha, token, cartão ou CPF completos`,

PLAYBOOKS.push(
  { id: 'pb_dataleak', t: 'Vazamento de dados pessoais na empresa (LGPD)', who: 'Empresa', steps: ['Acione o time de resposta e o encarregado de dados (DPO); registre horários e decisões.', 'Contenha: bloqueie acessos, revogue credenciais e feche a falha.', 'Preserve evidências (logs, imagens) antes de limpar sistemas.', 'Avalie o alcance: quais dados, quantos titulares, quais riscos.', 'Decida com o jurídico se o incidente pode causar risco ou dano relevante e, se sim, comunique a ANPD e os titulares em prazo razoável.', 'Prepare a comunicação com linguagem clara e orientações práticas aos afetados.', 'Corrija a causa raiz e atualize controles e treinamento.', 'Registre o incidente e as lições aprendidas.'] },
  { id: 'pb_insider', t: 'Suspeita de vazamento por pessoa de dentro (insider)', who: 'Empresa', steps: ['Envolva o jurídico e o RH antes de qualquer ação direta; mantenha sigilo.', 'Preserve logs de acesso, e-mails e registros do período relevante (sem acessar além do necessário e autorizado).', 'Revise e restrinja acessos de forma discreta, se necessário.', 'Identifique quais dados foram acessados, copiados ou enviados.', 'Documente fatos e evite acusações sem provas.', 'Defina medidas: advertência, desligamento ou ações legais, conforme a política.', 'Melhore controles: privilégio mínimo, DLP e monitoramento de acessos incomuns.'] },
  { id: 'pb_bec', t: 'Pagamento desviado por fraude de e-mail (BEC)', who: 'Empresa', steps: ['Acione imediatamente o banco de origem e peça a tentativa de bloqueio/recall da transferência.', 'Preserve o e-mail fraudulento, cabeçalhos e comprovantes.', 'Registre boletim de ocorrência e informe o jurídico.', 'Verifique se contas de e-mail foram comprometidas e troque senhas, ativando MFA.', 'Alerte fornecedores e clientes sobre a fraude.', 'Implante verificação por segundo canal e dupla aprovação para mudanças bancárias.'] },
  { id: 'pb_gitkey', t: 'Chave ou senha vazou em um repositório', who: 'Empresa', steps: ['Revogue e troque a credencial imediatamente (não basta apagar o commit).', 'Verifique logs de uso da chave no período em que esteve exposta.', 'Procure por criação de recursos, usuários ou custos anormais (nuvem).', 'Remova o segredo do histórico (git filter-repo) e force a atualização dos clones, se aplicável.', 'Ative varredura de segredos no repositório e no pré-commit.', 'Use um cofre de segredos e variáveis de ambiente daqui em diante.'] },
  { id: 'pb_cloudkey', t: 'Credenciais de nuvem comprometidas', who: 'Empresa', steps: ['Desative a chave/usuário e as sessões ativas; troque senhas e ative MFA.', 'Revise o log de auditoria (CloudTrail, Activity Log) para ver o que foi feito.', 'Procure recursos novos (instâncias, funções, usuários) e remova os indevidos.', 'Verifique dados acessados ou copiados (buckets, bancos, snapshots).', 'Aplique privilégio mínimo e restrições de rede e de região.', 'Configure alertas de faturamento e de ações sensíveis.'] },
  { id: 'pb_defaced', t: 'Site alterado (defacement) ou comprometido', who: 'Empresa', steps: ['Tire o site do ar ou coloque uma página de manutenção; preserve uma cópia do estado atual.', 'Colete logs do servidor e da aplicação para entender a entrada.', 'Troque todas as credenciais (painel, banco, FTP/SSH, chaves) e revise usuários.', 'Restaure a partir de um backup limpo e atualize CMS, plugins e dependências.', 'Corrija a falha de entrada e procure backdoors e arquivos suspeitos.', 'Monitore e informe clientes se houver risco aos seus dados.'] },
  { id: 'pb_social', t: 'Minha conta de rede social foi invadida', who: 'Pessoal', steps: ['Use o fluxo oficial de recuperação do aplicativo (ou o e-mail de recuperação) para retomar o acesso.', 'Troque a senha por uma nova e única e ative 2FA por app ou chave.', 'Revise e-mail e telefone de recuperação cadastrados e remova os que não são seus.', 'Encerre sessões e remova aplicativos conectados desconhecidos.', 'Avise seus contatos para ignorarem mensagens suspeitas enviadas por sua conta.', 'Denuncie à plataforma e registre um boletim de ocorrência se houve golpes ou extorsão.'] },
  { id: 'pb_sim', t: 'Suspeito de troca fraudulenta de chip (SIM swap)', who: 'Pessoal', steps: ['Se o celular ficou sem sinal sem motivo, ligue para a operadora de outro telefone e confirme se houve troca de chip.', 'Peça o bloqueio do número e o restabelecimento do chip correto.', 'Avise os bancos e bloqueie cartões e acessos do app.', 'Troque as senhas de e-mail e de contas importantes e passe o 2FA de SMS para app ou chave.', 'Registre um boletim de ocorrência e guarde protocolos.', 'Peça à operadora a proteção contra troca de chip (PIN ou bloqueio) quando disponível.'] },
  { id: 'pb_phonemalware', t: 'Suspeita de malware ou espionagem no celular', who: 'Pessoal', steps: ['Desconecte de redes e revise aplicativos instalados, permissões e administradores do dispositivo.', 'Remova apps desconhecidos e verifique acessibilidade e instalação de fontes externas.', 'Atualize o sistema e use a verificação de segurança da loja oficial.', 'Troque as senhas importantes a partir de outro aparelho limpo e ative 2FA.', 'Faça backup do essencial (fotos e documentos) e, se persistir, restaure o aparelho de fábrica.', 'Se for caso de perseguição ou stalkerware, procure ajuda especializada e canais de apoio.'] },
  { id: 'pb_kids', t: 'Criança sofreu golpe, sextorsão ou aliciamento', who: 'Pessoal', steps: ['Acolha, escute sem julgar e deixe claro que a culpa não é da criança.', 'Não apague nada: capture conversas, perfis, links e números.', 'Bloqueie o contato e denuncie o perfil na plataforma.', 'Não pague nem negocie com o criminoso.', 'Registre boletim de ocorrência e procure a delegacia (inclusive as especializadas em crimes cibernéticos); use também canais como SaferNet e Disque 100.', 'Revise as configurações de privacidade e o controle parental e ofereça apoio emocional contínuo.'] }
);

  { id: 'c01', title: 'Mensagem em Base64', level: 1, pts: 10, cat: 'Codificação', story: 'Você interceptou uma mensagem estranha de um colega. Parece só letras e números, terminando em "=". Qual é a flag escondida?', data: 'RkxBR3tiYXNlNjRfbmFvX2VfY3JpcHRvZ3JhZmlhfQ==', hash: '978025b83969c1a28f9b83f736729f2b0c117b22e2f332843d94db257e22f1a6', hints: ['Textos que terminam com = ou == costumam ser Base64.', 'Use Laboratório > Codificação > Base64 para decodificar.', 'Base64 só muda a representação: qualquer pessoa consegue desfazer.'] },
  { id: 'c02', title: 'O espelho do alfabeto', level: 1, pts: 10, cat: 'Cifras clássicas', story: 'Esta mensagem foi "escondida" trocando cada letra por outra 13 posições à frente. Recupere a flag.', data: 'SYNT{ebg13_fr_ercrgr}', hash: '68a899d478651160e10b077a105c368b5f8361a7290b738dbd6d4e791cd58e6c', hints: ['O alfabeto tem 26 letras: aplicar o mesmo deslocamento duas vezes volta ao texto original.', 'Procure a ferramenta ROT13 (ou César com deslocamento 13).', 'A flag sempre começa com FLAG{ — "SYNT{" é um bom sinal de que você está no caminho.'] },
  { id: 'c03', title: 'César sem chave', level: 1, pts: 15, cat: 'Cifras clássicas', story: 'Júlio César usava uma cifra de deslocamento. Aqui o deslocamento é desconhecido, mas só existem 25 possibilidades.', data: 'H ihuklpyh zljylah l MSHN{jlzhy_alt_zv_25_johclz}', hash: 'afc066884053f37cd8071829cff577dffaaa387174932ff0ba2a097d57569138', hints: ['Teste todos os deslocamentos de 1 a 25.', 'No Laboratório > Cifras > César existe uma tabela que mostra os 25 resultados de uma vez (força bruta).', 'Procure a linha que forma palavras em português.'] },

  { id: 'c05', title: 'Só uns e zeros', level: 1, pts: 10, cat: 'Codificação', story: 'Computadores guardam texto como bits. Cada grupo de 8 bits abaixo é uma letra.', data: '01000110 01001100 01000001 01000111 01111011 01100010 01101001 01110100 01110011 01011111 01100101 01011111 01100010 01111001 01110100 01100101 01110011 01111101', hash: '30540419fa50e2a86f622fa9e5e0fe7221eaad88b842d1670550c54a387f9679', hints: ['01000110 é o código da letra F.', 'Converta cada grupo de 8 bits para número e depois para caractere.', 'Use Laboratório > Codificação > Binário.'] },
  { id: 'c06', title: 'Link estranho', level: 1, pts: 10, cat: 'Codificação', story: 'Um link continha este trecho depois do "?texto=". O navegador usa % para escrever caracteres especiais.', data: 'Ola%21%20A%20flag%20e%20FLAG%7Burl_encoding_e_comum%7D', hash: 'd06f35c06a0abd3dbe6903c2265e355d831b705a3987aa0810521d6e0c366af8', hints: ['%20 é espaço, %7B é { e %7D é }.', 'O nome dessa codificação é "URL encoding" ou "percent-encoding".', 'Use Laboratório > Codificação > URL.'] },
  { id: 'c07', title: 'O poema', level: 2, pts: 15, cat: 'Esteganografia', story: 'Um amigo mandou este poema. Parece só um poema comum... mas a mensagem importante está escondida na forma do texto.', data: 'Estudar segurança é um hábito\nSenhas fortes protegem tudo\nCada clique merece atenção\nUpdates fecham muitas portas\nDuplo fator ajuda de verdade\nOlhos atentos evitam golpes', hash: 'fff2caf351349f652612e73705d66fb18c7a4f48fbfd26bc5f0debb5f82d801d', hints: ['A informação está escondida na forma do texto, não nas palavras.', 'Olhe a primeira letra de cada linha.', 'Formato da flag: FLAG{palavra_em_minusculas}.'] },
  { id: 'c08', title: 'XOR de um byte', level: 2, pts: 25, cat: 'Criptografia', story: 'Cada byte do texto original foi combinado (XOR) com UM mesmo byte secreto (de 0 a 255). O resultado em hexadecimal está abaixo.', data: '6c666b6d5152455875494547755f474b7549424b5c4f57', hash: 'a43e2051fd24f3f3c478d7abc4eb4b4b231adbb364767c1261292068e936a53b', hints: ['Como a chave é um único byte, há só 256 possibilidades.', 'A flag em claro começa com FLAG{ — uma chave certa produz texto legível.', 'Use Laboratório > Cifras > XOR e a opção de força bruta de 1 byte.'] },
  { id: 'c09', title: 'Vigenère', level: 2, pts: 25, cat: 'Cifras clássicas', story: 'Uma cifra que repete uma palavra-chave para deslocar as letras. A palavra-chave tem 5 letras e é o que você precisa para abrir qualquer cadeado digital.', data: 'C ZEILC ZEXVGAA Z JNHG{QMILNZVG_AEH_GJHVZ}', hash: 'cbac55fb20f5e08fc06d276a7ae3d0f48f6d1c0d710468d59a5e0ae34b0db77f', hints: ['A palavra-chave é CHAVE.', 'Em Vigenère cada letra da chave define um deslocamento diferente: C=2, H=7, A=0, V=21, E=4.', 'Use Laboratório > Cifras > Vigenère e escolha "Decifrar".'] },
  { id: 'c10', title: 'Sinais antigos', level: 2, pts: 20, cat: 'Codificação', story: 'Uma mensagem em código Morse (/ separa as palavras). Escreva a flag usando minúsculas e _ no lugar dos espaços: FLAG{...}.', data: '-- --- .-. ... . / ... .- .-.. ...- --- ..- / ...- .. -.. .- ...', hash: '0aae8c95b5f9d114f93d469a1b838b1dda43ffeb6258054b95afa8399e86c827', hints: ['Letras são separadas por espaço; palavras por /.', 'Use a tabela de Morse no Laboratório > Codificação > Morse.', 'Depois monte FLAG{palavra_palavra_palavra}.'] },
  { id: 'c11', title: 'Senha fraca, hash fraco', level: 2, pts: 25, cat: 'Senhas', story: 'Vazou do banco de dados de um site o hash MD5 abaixo. O usuário gosta de um esporte e acrescentou 123 no fim da senha. Qual era a senha?', data: '7c0e0a74ff5b16da9bab3777fbc63b8f', hash: '33fb27747110199dd93e2791e859e9c91a696f7013cdf8a37a6833bc601e1c5a', hints: ['Pense em esportes populares no Brasil, tudo minúsculo, seguido de 123.', 'Calcule o MD5 das suas tentativas em Laboratório > Hashes e compare.', 'É por isso que senhas fracas + hashes rápidos (MD5) são perigosos. A flag é FLAG{senha}.'] },
  { id: 'c12', title: 'Caçando no log', level: 2, pts: 30, cat: 'Análise de logs', story: 'O site de uma loja foi alvo de uma tentativa de ataque. Abaixo está um trecho do log de acessos. Qual IP tentou o ataque? A flag é FLAG{IP}.', data: '203.0.113.5 - - [12/Mar/2025:10:01:12 +0000] "GET /index.html HTTP/1.1" 200 5120\n198.51.100.20 - - [12/Mar/2025:10:01:40 +0000] "GET /produtos HTTP/1.1" 200 8230\n203.0.113.77 - - [12/Mar/2025:10:02:03 +0000] "GET /login?user=admin\'%20OR%20\'1\'=\'1 HTTP/1.1" 500 312\n203.0.113.5 - - [12/Mar/2025:10:02:15 +0000] "GET /contato HTTP/1.1" 200 2210\n198.51.100.20 - - [12/Mar/2025:10:03:01 +0000] "POST /carrinho HTTP/1.1" 200 410\n192.0.2.44 - - [12/Mar/2025:10:03:44 +0000] "GET /sobre HTTP/1.1" 200 3100\n203.0.113.5 - - [12/Mar/2025:10:04:10 +0000] "GET /ajuda HTTP/1.1" 200 1999', hash: '330e4103fd4a6d92db9151f932210061d3d1545c9ec7f688f9e8fcda2dbd0685', hints: ['Procure um pedido que não parece um acesso normal a uma página.', 'Algo como \' OR \'1\'=\'1 é uma tentativa clássica de SQL injection.', 'A flag é FLAG{IP de quem tentou o ataque}.'] },
  { id: 'c13', title: 'O token', level: 3, pts: 30, cat: 'Web', story: 'Você encontrou este token JWT em um cookie de um site de testes. Será que ele guarda algum segredo?', data: 'eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0.eyJ1c2VyIjoidmlzaXRhbnRlIiwicm9sZSI6InVzZXIiLCJmbGFnIjoiRkxBR3tqd3RfcGF5bG9hZF9uYW9fZV9zZWNyZXRvfSJ9.assinatura_falsa', hash: '18120399c89ea3170d76795d5d81846d34d66cab3441806cd79029968e166f8f', hints: ['Um JWT tem 3 partes separadas por ponto: cabeçalho.corpo.assinatura.', 'O corpo (parte do meio) é só Base64URL — use o decodificador de JWT no Laboratório.', 'Lição: nunca ponha segredos no corpo de um JWT.'] },
  { id: 'c14', title: 'Substituição', level: 3, pts: 40, cat: 'Cifras clássicas', story: 'Cada letra foi trocada por outra, sempre da mesma forma (substituição simples). Use a frequência das letras: em português, A, E e O são as mais comuns.', data: 'Q LTUXKQFEQ RQ OFYGKDQEQG HKGZTUT HTLLGQL T RQRGL YSQU{YKTJXTFEOQ_QPXRQ}', hash: '5d36d961a61d274c9acc4f8a1fda159cacd401a0870ef6c8e9eb7950b358c3d9', hints: ['Conte quais letras aparecem mais no texto cifrado.', 'As palavras de uma letra (A, E) e "DA" ajudam muito.', 'Use Laboratório > Cifras > Substituição: monte o mapa de letras e veja o texto se revelar.'] },
  { id: 'c15', title: 'Metadados', level: 3, pts: 30, cat: 'Forense', story: 'Você recebeu os metadados de uma foto. Algo ali não é normal para uma foto de férias...', data: 'Arquivo: foto_ferias.jpg\nCâmera: Modelo X100\nData: 2024:07:15 14:32:10\nTamanho: 2.4 MB\nGPS: não disponível\nSoftware: EditorFoto 3.2\nComentario: RkxBR3ttZXRhZGFkb3NfZW50cmVnYW1fc2VncmVkb3N9\nResolucao: 4032x3024', hash: 'c9b12c0fd123a9a827c8bb0b259a0a25671c792af833b9a73e3c119bb48b4e07', hints: ['Metadados são dados sobre o arquivo: câmera, data, local, programa...', 'Existe um campo que não é comum em fotos: leia com atenção.', 'O conteúdo do campo está codificado em Base64.'] },
  { id: 'c16', title: 'Três camadas', level: 3, pts: 40, cat: 'Codificação', story: 'A flag foi cortada em três pedaços, e cada pedaço usa uma codificação diferente.', data: 'Parte 1 (Base64): RkxBR3t0cmVz\nParte 2 (Hex): 5f63616d61646173\nParte 3 (ROT13): _whagnf}\n\nJunte as três partes, na ordem, para formar a flag.', hash: '990ae999b86a96c645abaece54665116034a2ca74cf69ed88c4c81ae3dec2272', hints: ['Cada parte usa uma codificação diferente.', 'Decodifique uma por vez e depois junte os pedaços.', 'A flag completa começa em FLAG{ e termina em }.'] },
  { id: 'c17', title: 'Códigos ASCII', level: 1, pts: 10, cat: 'Codificação', story: 'Cada número é o código ASCII (decimal) de um caractere. Converta tudo em texto.', data: '70 76 65 71 123 97 115 99 105 105 95 101 95 115 111 95 110 117 109 101 114 111 125', hash: 'c2131e66e3c29ab0b3b4e9e9d70fa22cae7752ab571d5feffb7f7b7101ce3ed6', hints: ['65 é a letra A, 66 é B...', 'Use Laboratório > Codificação > Decimal (ASCII).', 'Letras maiúsculas ficam entre 65 e 90, minúsculas entre 97 e 122.'] }
];

/* Desafios extras: de novo, só o hash SHA-256 da flag fica no código. */
CTF_CHALLENGES.push(
  { id: 'c18', title: 'Base32', level: 1, pts: 15, cat: 'Codificação', story: 'Outra codificação de texto, parecida com Base64, mas só usa letras maiúsculas e os números de 2 a 7. Termina com sinais de = para completar o tamanho.', data: 'IZGECR33MJQXGZJTGJPXIZLNL5ZW6X3NMFUXK43DOVWGC435', hash: 'a7af0030905dc6d909241f764ebaae310b71309c2a8023c43c7973cb260b7625', hints: ['Se só aparecem A–Z e 2–7 (e = no fim), pense em Base32.', 'No Laboratório > Codificações escolha Base32 e decodifique.', 'Base32 é uma codificação, não criptografia: qualquer pessoa desfaz.'] },
  { id: 'c19', title: 'Alfabeto invertido', level: 1, pts: 15, cat: 'Cifras clássicas', story: 'Na cifra Atbash, a vira z, b vira y, c vira x… O alfabeto é espelhado. Descubra a flag.', data: 'UOZT{zgyzhs_rmevigv_l_zouzyvgl}', hash: '784eb3ff86afd3649a48c80502a1e88ba556625017f259da450fb2f997b8dc95', hints: ['A primeira letra vira a última: A↔Z, B↔Y, C↔X.', 'Atbash não tem chave: aplicar duas vezes volta ao original.', 'Use Laboratório > Codificações > Atbash.'] },
  { id: 'c20', title: 'Cookie de sessão', level: 2, pts: 20, cat: 'Web', story: 'Um site guarda dados do usuário diretamente em um cookie. O valor parece embaralhado, mas será que protege alguma coisa? Qual é a flag escondida nele?', data: 'Cookie: sessao=eyJ1c3VhcmlvIjoidmlzaXRhbnRlIiwiYWRtaW4iOmZhbHNlLCJ0ZW1hIjoiZXNjdXJvIiwicmVjYWRvIjoiRkxBR3tjb29raWVfbmFvX2VfY29mcmV9In0=', hash: '47f4febd85586fc4ee6ddaacff3b23724e0efcf766e0537f15b60fcf77286a29', hints: ['O valor depois de "sessao=" termina com = (sinal clássico de Base64).', 'Decodifique em Laboratório > Codificações > Base64 e leia o JSON.', 'Lição: nunca confie em dados guardados no cliente nem coloque segredos neles.'] },
  { id: 'c21', title: 'Hash SHA-1 fraco', level: 2, pts: 25, cat: 'Senhas', story: 'Vazou o hash SHA-1 abaixo, de um usuário do site de teste. A senha era uma das mais comuns do Brasil. Descubra-a (a flag é FLAG{senha}).', data: '3decd49a6c6dce88c16a85b9a8e42b51aa36f1e2', hash: '2db0a21fd7d7567e0822a215d280ba6c51cbf292fa671234a724feadd6f05767', hints: ['Hashes de senhas comuns aparecem em listas: teste palpites.', 'Use Laboratório > Hashes > "Tentar quebrar um hash" com uma lista de palavras.', 'Sem salt e com hash rápido, senhas fracas caem em segundos.'] },
  { id: 'c22', title: 'O arquivo esquecido', level: 2, pts: 20, cat: 'Web', story: 'Você está estudando um site de testes. Primeiro lê o arquivo robots.txt, depois acessa o caminho que ele \'esconde\'. Onde está a flag?', data: 'GET /robots.txt\\nUser-agent: *\\nDisallow: /painel/\\nDisallow: /admin-antigo/\\n\\nGET /admin-antigo/\\nIndex of /admin-antigo/\\n  leia-me.txt   1 KB\\n  logo.png      9 KB\\n\\nGET /admin-antigo/leia-me.txt\\nBackup antigo. Nao divulgar. Codigo: RkxBR3tyb2JvdHNfbmFvX2Vfc2VndXJhbmNhfQ==', hash: '2be4d1dc12a5785d152a44c20cbbf211ab8b9216ad38b1eb90a65e49ce6e5d5a', hints: ['O robots.txt lista o que os administradores NÃO querem que apareça nos buscadores: isso não é proteção.', 'O conteúdo de leia-me.txt termina com algo que parece Base64.', 'Decodifique o código final em Laboratório > Codificações > Base64.'] },
  { id: 'c23', title: 'Camadas de camadas', level: 3, pts: 35, cat: 'Codificação', story: 'Alguém codificou a flag em Base64 e depois escreveu o resultado em hexadecimal. Desfaça na ordem inversa.', data: '526b78425233746a595731685a47467a58334e68623139795a585a6c636e4e70646d56706333303d', hash: '02456bf31c6833d06ce717d07c736e44c7c4d0c54371185d8ddf9c7c81f73ed8', hints: ['A ordem das camadas: flag → Base64 → hexadecimal. Para voltar, desfaça o hexadecimal primeiro.', 'Depois do hexadecimal você terá algo que termina com = ou parece Base64.', 'Use Laboratório > Codificações duas vezes (e o botão "Usar saída como entrada").'] }
);

/* Mais desafios; apenas o hash SHA-256 da flag fica no código. */
CTF_CHALLENGES.push(
  { id: 'c24', title: 'Trilhos de ferro', level: 2, pts: 25, cat: 'Cifras clássicas', story: 'Esta cifra de transposição escreve o texto em zigue-zague em 3 trilhos e depois lê trilho por trilho. As letras não mudam, só mudam de lugar.', data: 'F{lde}LGtih_efroAro_r', hash: 'e05746edce72e97f8db99dfd486312b9c438848af66e8896734bec6497f19a39', hints: ['Em transposição, as letras são as mesmas, só trocam de posição.', 'O número de trilhos é 3: o Laboratório > Cifras tem a ferramenta Rail Fence.', 'Escolha "Decifrar" com 3 trilhos.'] },
  { id: 'c25', title: 'RSA de brinquedo', level: 3, pts: 40, cat: 'Criptografia', story: 'Uma mensagem foi cifrada byte a byte com RSA, mas escolheram números minúsculos. Dados públicos: n = 3233 e e = 17. Cada número abaixo é um byte cifrado. Se você consegue fatorar n, você encontra a chave privada.', data: 'n = 3233\ne = 17\nc = 325 2726 2790 669 855 2412 1230 1632 119 1369 2412 1632 281 2185 1516', hash: 'c22f01d13607d8b6de60978c4f03b5810490bb9934aa4329d4c0b6905ebe12e9', hints: ['n é pequeno: tente achar dois primos cuja multiplicação seja 3233.', 'p = 61 e q = 53. A chave privada d é o inverso de e módulo (p-1)(q-1).', 'Use Laboratório > Cifras > RSA didático: informe p, q e e, e decifre a lista de números.'] },
  { id: 'c26', title: 'Segredo fraco no JWT', level: 3, pts: 40, cat: 'Web', story: 'Este token JWT usa HS256, ou seja, é assinado com um segredo compartilhado. Quem descobre o segredo pode forjar tokens. O segredo é uma palavra do português seguida de números. A flag é FLAG{segredo}.', data: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c3VhcmlvIjoidmlzaXRhbnRlIiwicGFwZWwiOiJjb211bSIsImV4cCI6MTg5MzQ1NjAwMH0.8tCl97-M8WzFGVelRQYNbw-XsicwHVT9vCPLrNeKn_Y', hash: '7530842296274fa328f3b2be643c390380be4dff3abfe70607dcd533adc133b2', hints: ['Tokens HS256 podem ser testados offline com listas de palavras.', 'No Laboratório > JWT há a função de testar segredos contra uma lista de palavras.', 'O segredo é uma palavra comum seguida de 123.'] },
  { id: 'c27', title: 'XOR com chave repetida', level: 3, pts: 40, cat: 'Criptografia', story: 'Desta vez a chave XOR tem vários bytes e se repete ao longo do texto. Você sabe que a mensagem começa com FLAG{.', data: '272f2426181d0e113a020c083e000d0015003e11001106110807041c', hash: '50f1fd6c8bfacc12227aea7ebe8cf0c1bb1b75ed6781a020e91347334874fe71', hints: ['Se você conhece o início do texto, pode recuperar o início da chave: cifrado XOR conhecido = chave.', 'Aplique XOR dos 5 primeiros bytes cifrados com "FLAG{": os bytes resultantes se repetem (a chave tem 3 letras).', 'Laboratório > Cifras > XOR com chave repetida: use "descobrir a chave por texto conhecido" e depois decifre.'] },
  { id: 'c28', title: 'Letras e números', level: 1, pts: 10, cat: 'Codificação', story: 'Na cifra A1Z26, A vale 1, B vale 2... Z vale 26. Letras de uma palavra são separadas por hífen e palavras por espaço. A flag usa _ entre as palavras: FLAG{palavra_palavra_palavra}.', data: '14-21-13-5-18-15-19 22-9-18-1-13 12-5-20-18-1-19', hash: '8407617faca94bcf17b793a0f6f3d35bb1c2430cdbb3f911409d4c0218836836', hints: ['1 = A, 2 = B, 3 = C...', '14 é a letra N (a 14ª do alfabeto).', 'Use Laboratório > Codificações > A1Z26.'] },
  { id: 'c29', title: 'ROT47', level: 2, pts: 15, cat: 'Cifras clássicas', story: 'O ROT13 só gira letras. O ROT47 gira todos os caracteres imprimíveis do ASCII (33 a 126), inclusive números e símbolos.', data: 'u{pvLC@Ecf0:?4=F:0D:>3@=@DN', hash: '2450d2bff46881b12321f86bff205680a2292fb8c84bf29631a5b0c60238abbd', hints: ['Aplicar o ROT47 duas vezes volta ao original.', 'A flag original começa com FLAG{ — em ROT47 vira algo parecido com "u}pv...".', 'Use Laboratório > Codificações > ROT47.'] },
  { id: 'c30', title: 'Base oito', level: 1, pts: 10, cat: 'Codificação', story: 'Cada grupo de três dígitos abaixo é um byte escrito em octal (base 8).', data: '106 114 101 107 173 157 143 164 141 154 137 164 141 155 142 145 155 137 163 145 162 166 145 175', hash: '85503e5afdfe9aea2ef20098fddf6085ea098ac6ff4d09d2d67aaf7a2c702394', hints: ['Octal usa dígitos de 0 a 7.', '106 em octal é 70 em decimal, ou a letra F.', 'Use Laboratório > Codificações > Octal.'] },
  { id: 'c31', title: 'Entidades HTML', level: 1, pts: 10, cat: 'Codificação', story: 'Páginas web usam entidades para representar caracteres. Cada trecho &#NN; é um caractere em decimal.', data: '&#70;&#76;&#65;&#71;&#123;&#101;&#110;&#116;&#105;&#100;&#97;&#100;&#101;&#115;&#95;&#104;&#116;&#109;&#108;&#125;', hash: 'd8d0d15d2cde2091a9b53ba6d0c9ccecbcc3c1697c7a9a4b1c5df10c26ddd75d', hints: ['&#70; representa o caractere de código 70 (a letra F).', 'Ao ver &# seguido de número e ponto e vírgula, pense em HTML.', 'Use Laboratório > Codificações > Entidades HTML.'] },
  { id: 'c32', title: 'De onde veio este e-mail?', level: 2, pts: 25, cat: 'Forense', story: 'O e-mail diz ser do banco, mas há algo estranho nos cabeçalhos. Descubra o domínio de onde a mensagem realmente partiu. A flag é FLAG{dominio}.', data: 'Return-Path: <bounce@promo-fraude.test>\nReceived: from smtp.promo-fraude.test (smtp.promo-fraude.test [198.51.100.250]) by mx.provedor.example with ESMTPS; Tue, 14 Mar 2025 10:02:11 -0300\nReceived: from localhost (127.0.0.1) by smtp.promo-fraude.test with SMTP; Tue, 14 Mar 2025 13:02:05 +0000\nAuthentication-Results: mx.provedor.example; spf=fail smtp.mailfrom=promo-fraude.test; dkim=none; dmarc=fail header.from=banco-horizonte.example\nFrom: "Banco Horizonte" <seguranca@banco-horizonte.example>\nReply-To: atendimento@promo-fraude.test\nSubject: Atualização urgente da sua conta', hash: 'ddc3be1ee6e11d8291364631b75c571603e46f732113f8e0304bef7994d238b0', hints: ['Leia os cabeçalhos Received de baixo para cima: o de baixo é o mais antigo.', 'Compare o domínio do From com os de Return-Path, Reply-To e dos Received.', 'Use Laboratório > Cabeçalho de e-mail; o domínio que aparece em Return-Path e nos Received é o real.'] },
  { id: 'c33', title: 'Varredura no firewall', level: 2, pts: 25, cat: 'Análise de logs', story: 'Este é um trecho do log de um firewall de uma rede de testes. Um dos endereços tentou muitas portas diferentes em pouco tempo. A flag é FLAG{IP}.', data: 'Mar 14 02:10:01 fw DROP IN=eth0 SRC=198.51.100.66 DST=10.0.0.5 PROTO=TCP SPT=40007 DPT=21\nMar 14 02:10:02 fw DROP IN=eth0 SRC=198.51.100.66 DST=10.0.0.5 PROTO=TCP SPT=40014 DPT=22\nMar 14 02:10:03 fw DROP IN=eth0 SRC=192.0.2.88 DST=10.0.0.5 PROTO=TCP SPT=40021 DPT=443\nMar 14 02:10:04 fw DROP IN=eth0 SRC=198.51.100.66 DST=10.0.0.5 PROTO=TCP SPT=40028 DPT=23\nMar 14 02:10:05 fw DROP IN=eth0 SRC=198.51.100.66 DST=10.0.0.5 PROTO=TCP SPT=40035 DPT=25\nMar 14 02:10:06 fw DROP IN=eth0 SRC=198.51.100.66 DST=10.0.0.5 PROTO=TCP SPT=40042 DPT=80\nMar 14 02:10:07 fw DROP IN=eth0 SRC=192.0.2.88 DST=10.0.0.5 PROTO=TCP SPT=40049 DPT=443\nMar 14 02:10:08 fw DROP IN=eth0 SRC=198.51.100.66 DST=10.0.0.5 PROTO=TCP SPT=40056 DPT=110\nMar 14 02:10:09 fw DROP IN=eth0 SRC=198.51.100.66 DST=10.0.0.5 PROTO=TCP SPT=40063 DPT=139\nMar 14 02:10:10 fw DROP IN=eth0 SRC=198.51.100.66 DST=10.0.0.5 PROTO=TCP SPT=40070 DPT=443\nMar 14 02:10:11 fw DROP IN=eth0 SRC=192.0.2.88 DST=10.0.0.5 PROTO=TCP SPT=40077 DPT=443\nMar 14 02:10:12 fw DROP IN=eth0 SRC=198.51.100.66 DST=10.0.0.5 PROTO=TCP SPT=40084 DPT=445\nMar 14 02:10:13 fw DROP IN=eth0 SRC=198.51.100.66 DST=10.0.0.5 PROTO=TCP SPT=40091 DPT=3306\nMar 14 02:10:14 fw DROP IN=eth0 SRC=198.51.100.66 DST=10.0.0.5 PROTO=TCP SPT=40098 DPT=3389\nMar 14 02:10:15 fw DROP IN=eth0 SRC=198.51.100.66 DST=10.0.0.5 PROTO=TCP SPT=40105 DPT=8080\nMar 14 02:10:16 fw DROP IN=eth0 SRC=203.0.113.45 DST=10.0.0.5 PROTO=TCP SPT=40112 DPT=443\nMar 14 02:10:17 fw DROP IN=eth0 SRC=203.0.113.45 DST=10.0.0.5 PROTO=TCP SPT=40119 DPT=443\nMar 14 02:10:18 fw DROP IN=eth0 SRC=203.0.113.45 DST=10.0.0.5 PROTO=TCP SPT=40126 DPT=443\nMar 14 02:10:19 fw DROP IN=eth0 SRC=203.0.113.45 DST=10.0.0.5 PROTO=TCP SPT=40133 DPT=443\nMar 14 02:11:20 fw DROP IN=eth0 SRC=203.0.113.45 DST=10.0.0.5 PROTO=TCP SPT=40140 DPT=443\nMar 14 02:11:21 fw DROP IN=eth0 SRC=203.0.113.45 DST=10.0.0.5 PROTO=TCP SPT=40147 DPT=443\nMar 14 02:11:22 fw DROP IN=eth0 SRC=203.0.113.45 DST=10.0.0.5 PROTO=TCP SPT=40154 DPT=443\nMar 14 02:11:23 fw DROP IN=eth0 SRC=203.0.113.45 DST=10.0.0.5 PROTO=TCP SPT=40161 DPT=443\nMar 14 02:11:24 fw DROP IN=eth0 SRC=192.0.2.88 DST=10.0.0.5 PROTO=TCP SPT=40168 DPT=80\nMar 14 02:11:25 fw DROP IN=eth0 SRC=203.0.113.45 DST=10.0.0.5 PROTO=TCP SPT=40175 DPT=22', hash: 'c40cc782b2c9765165e49fad11a131eb50bfd5c0f9dd83b336b4962f13cc433e', hints: ['Procure o IP que aparece com muitos valores diferentes de DPT (porta de destino).', 'Um IP que bate sempre na mesma porta (443) não é varredura, é só insistência.', 'Conte as portas distintas por IP.'] },
  { id: 'c34', title: 'SHA-256 de senha comum', level: 2, pts: 25, cat: 'Senhas', story: 'O hash SHA-256 abaixo é de uma senha com inicial maiúscula e um ano no final. A flag é FLAG{senha}.', data: '7d84304c4862f9d93e42ad9e03fe1755610cc7e440ba35b00350ad9db86c3215', hash: '0dfd09e73c1e3f1cd7dab80d2f7cdebe09bddf46fb3db95b949fb1898d9a50ce', hints: ['Pense em uma palavra comum do Brasil, com inicial maiúscula, e um ano recente.', 'No Laboratório > Hashes > "Tentar quebrar um hash" o app testa variações assim.', 'Sem salt, mesmo SHA-256 não protege senhas fracas.'] },
  { id: 'c35', title: 'Vigenère com texto conhecido', level: 3, pts: 45, cat: 'Cifras clássicas', story: 'A chave é uma fruta com 5 letras (sem acento). Você sabe que o texto começa com FLAG. Letras maiúsculas e minúsculas seguem a mesma regra.', data: 'QTMG{jtoqnscm_borp_aqr_efmnrooi}', hash: 'f3edd7360a4a68344e2a90230f7527ff6ff875c5d50d660690963b4b2c1b8007', hints: ['Subtraia FLAG do texto cifrado para obter as 4 primeiras letras da chave.', 'A chave é uma fruta com 5 letras, bem conhecida no Brasil e usada em caipirinhas.', 'Use Laboratório > Cifras > Vigenère > descobrir chave por texto conhecido, e depois decifre.'] },
  { id: 'c36', title: 'Cabeçalhos que falam demais', level: 2, pts: 20, cat: 'Web', story: 'Um servidor de testes devolveu os cabeçalhos abaixo. Algum deles carrega informação que não deveria estar lá.', data: 'HTTP/1.1 200 OK\nServer: nginx/1.18.0\nContent-Type: text/html; charset=utf-8\nX-Powered-By: PHP/7.4.3\nX-Debug-Token: RkxBR3tjYWJlY2FsaG9zX3ZhemFtX2luZm9ybWFjYW99\nSet-Cookie: sessao=a1b2c3; HttpOnly; Secure\nCache-Control: no-store', hash: 'b666ee2223454d96f94cb40990a759ae5f18052dcdada0f768a9098b4cbd112b', hints: ['Cabeçalhos X-* são personalizados e muitas vezes esquecidos em produção.', 'Um valor termina em = e parece Base64.', 'Decodifique o token em Laboratório > Codificações > Base64.'] },
  { id: 'c37', title: 'Camadas finais', level: 3, pts: 50, cat: 'Codificação', story: 'A flag passou por três transformações, nesta ordem: ROT13, Base32 e hexadecimal. Para recuperá-la, desfaça na ordem inversa.', data: '4b4e4d55345644334d525547345a33464d4a5058413354324e5a5957345a53374d46524636343357504a36513d3d3d3d', hash: 'a4ac6043d0609bcbb5eeea3d6d4343a4304a7e70512d3a8ee5c3f4762d7dd390', hints: ['Última camada aplicada = primeira a desfazer: comece pelo hexadecimal.', 'Depois do hexadecimal você terá letras maiúsculas e números de 2 a 7: Base32.', 'O último passo é ROT13. Use o botão "Usar saída como entrada" para encadear.'] },
  { id: 'c38', title: 'Broadcast da sub-rede', level: 2, pts: 20, cat: 'Redes', story: 'Qual o endereço de BROADCAST da rede onde está o host 10.20.30.77/26? A flag é FLAG{endereço}.', data: 'Host: 10.20.30.77/26', hash: '15375d59d5c14d73b0046f7fed1fbfa9976f2b364330280863b297e92e03cf8a', hints: ['/26 significa 26 bits de rede e 6 bits de host: blocos de 64 endereços.', 'Os blocos começam em .0, .64, .128, .192. Em qual deles está o .77?', 'Confirme no Laboratório > Redes (calculadora CIDR).'] },
  { id: 'c39', title: 'Bytes mágicos', level: 2, pts: 20, cat: 'Forense', story: 'Um arquivo perdeu a extensão. Os primeiros bytes (em hexadecimal) dizem qual é o formato. Qual é? A flag é FLAG{formato} em minúsculas.', data: '89 50 4E 47 0D 0A 1A 0A 00 00 00 0D 49 48 44 52', hash: '52cf98d01dff7c3ae1cb53e44fdd4a739fcf9da608b9691bdc497804dd5e3a98', hints: ['Converta 50 4E 47 de hexadecimal para texto (ASCII).', 'O formato é uma sigla de 3 letras muito usada para imagens com transparência.', '50 4E 47 = P N G.'] }
);

/** kind: email | sms | wa. phish: true se for golpe. links: [{t texto exibido, u endereço real}] */
const PHISH = [
  { id: 'ph01', kind: 'email', from: 'Banco Horizonte <seguranca@horizonte-banco.example>', subj: 'URGENTE: sua conta será bloqueada em 2 horas', body: 'Prezado cliente,\n\nDetectamos acesso suspeito na sua conta. Para evitar o bloqueio definitivo, confirme seus dados agora:\n\n[Confirmar meus dados]\n\nApós 2 horas sua conta será encerrada.\n\nAtenciosamente,\nEquipe de Segurança', links: [{ t: 'Confirmar meus dados', u: 'http://horizonte-banco.verifica-conta.example/login' }], phish: true,

  { id: 'ph02', kind: 'sms', from: '+55 11 9xxxx-0142', body: 'Correios: seu pacote foi retido por falta de pagamento de taxa de R$ 7,32. Regularize em 24h para evitar devolução: correios-entrega.regulariza.example/taxa', links: [{ t: 'correios-entrega.regulariza.example/taxa', u: 'http://correios-entrega.regulariza.example/taxa' }], phish: true,

  { id: 'ph03', kind: 'wa', from: 'Mãe (novo número)', body: 'Oi filho, troquei de número, o outro quebrou. Salva esse aqui. Preciso de um favor urgente, estou sem acesso ao app do banco. Você consegue fazer um Pix de R$ 850 pra uma conta? Te devolvo amanhã 🙏', phish: true,

  { id: 'ph04', kind: 'email', from: 'Receita Federal <atendimento@receita-regulariza.example>', subj: 'Seu CPF está IRREGULAR — regularize hoje', body: 'Foi identificada pendência no CPF 000.***.***-00. Emita o comprovante de regularização para evitar bloqueio de benefícios e cadastro no SPC.\n\n[Emitir comprovante]', links: [{ t: 'Emitir comprovante', u: 'http://gov-cpf.regulariza.example/emitir' }], phish: true,

  { id: 'ph05', kind: 'email', from: 'Banco Horizonte <noreply@horizonte.example>', subj: 'Seu extrato de março está disponível', body: 'Olá, Ana.\n\nSeu extrato de março já está disponível no aplicativo e no internet banking.\n\nPor segurança, não enviamos arquivos nem pedimos senhas ou códigos por e-mail. Acesse o app do Banco Horizonte para consultar.\n\nCentral: 0800 000 0000 (número no verso do seu cartão).', phish: false,
    flags: ['Chama pelo nome', 'Não tem link nem anexo', 'Orienta a usar o app e lembra que o banco não pede senha por e-mail'], why: 'Parece legítimo: sem pressa, sem anexos, sem links e com orientação de acessar pelo canal oficial.' },
  { id: 'ph06', kind: 'sms', from: 'Horizonte', body: 'Horizonte: seu código de verificação é 482913. Nunca compartilhe este código. Se não foi você, ligue para o número do verso do cartão.', phish: false,

  { id: 'ph07', kind: 'email', from: 'Suporte Microsoft <alerta@ms-segurancapc.example>', subj: 'Seu computador está infectado! Ligue agora', body: 'ATENÇÃO!!! Detectamos 5 vírus no seu computador. Seus dados bancários estão em risco.\n\nLigue imediatamente para 0800 000 1111 para falar com um técnico certificado e receber a remoção gratuita.', phish: true,
    flags: ['Alerta alarmista em letras maiúsculas', 'Empresas de tecnologia não enviam e-mail avisando que seu PC está infectado', 'Quer que você ligue para um número desconhecido', 'Remetente com domínio estranho'], why: 'É a base do golpe do "falso suporte técnico": o criminoso pede acesso remoto ao PC e depois cobra ou rouba dados.' },
  { id: 'ph08', kind: 'email', from: 'Carlos (Diretoria) <carlos.diretoria@empresa-grupo.example>', subj: 'Pagamento urgente — confidencial', body: 'Oi Marina, estou em reunião e não posso atender. Preciso que você faça uma transferência de R$ 48.900 para um fornecedor novo hoje ainda. Não comente com ninguém por enquanto. Te mando os dados da conta agora. Responda só aqui, ok?', phish: true,

  { id: 'ph09', kind: 'email', from: 'Equipe Slack <notificacoes@slack.example>', subj: 'Camila convidou você para o workspace "Projeto Aurora"', body: 'Camila Rocha (camila@suaempresa.example) convidou você para entrar no workspace Projeto Aurora.\n\n[Entrar no Slack]\n\nSe você não reconhece este convite, ignore esta mensagem. Você também pode acessar slack.example e entrar manualmente.', links: [{ t: 'Entrar no Slack', u: 'https://suaempresa.slack.example/join' }], phish: false,
    flags: ['Convite esperado e de uma colega que você conhece', 'O endereço do link é do domínio do serviço', 'A mensagem oferece alternativa de entrar manualmente'], why: 'Parece legítimo, mas mesmo assim vale confirmar com a colega se você não esperava o convite.' },
  { id: 'ph10', kind: 'sms', from: 'DETRAN-SP', body: 'DETRAN: foi registrada multa grave em seu veículo. Pague com 40% de desconto até hoje: detran-multas.consulta.example/pagar', links: [{ t: 'detran-multas.consulta.example/pagar', u: 'http://detran-multas.consulta.example/pagar' }], phish: true,
    flags: ['Desconto e prazo curto', 'Domínio que não é do órgão', 'Mensagem sem identificar o veículo ou a infração'], why: 'Órgãos de trânsito não cobram multas por link de SMS com desconto relâmpago. Consulte pelo site/app oficial.' },
  { id: 'ph11', kind: 'wa', from: '+55 21 9xxxx-3377', body: 'Olá! Vi seu currículo e temos uma vaga home office, R$ 450 por dia, sem experiência. Basta curtir vídeos e enviar prints. Para começar, depositamos R$ 20 na sua conta como teste. Quer participar?', phish: true,

  { id: 'ph12', kind: 'email', from: 'Loja do Bairro <pedidos@lojadobairro.example>', subj: 'Pedido #84213 confirmado', body: 'Olá, João!\n\nRecebemos seu pedido #84213 (Fone Bluetooth, R$ 189,90) feito hoje às 14:32. A previsão de entrega é de 4 a 6 dias úteis.\n\nVocê pode acompanhar o pedido na sua conta, em lojadobairro.example, na área "Meus pedidos". Se você não fez essa compra, responda este e-mail ou ligue 0800 000 2222.', phish: false,

  { id: 'ph13', kind: 'sms', from: 'BancoHorizonte', body: 'Pix de R$ 1.980,00 agendado para HOJE. Se NÃO reconhece, cancele agora: horizonte-pix.cancela.example', links: [{ t: 'horizonte-pix.cancela.example', u: 'http://horizonte-pix.cancela.example/' }], phish: true,

  { id: 'ph14', kind: 'email', from: 'Netflix <suporte@netflix-pagamento.example>', subj: 'Falha no pagamento — conta será suspensa', body: 'Não conseguimos processar seu pagamento. Atualize os dados do cartão para continuar assistindo.\n\n[Atualizar pagamento]', links: [{ t: 'Atualizar pagamento', u: 'http://netflix-pagamento.atualiza.example/cartao' }], phish: true,

    flags: ['Aviso informativo sem pressão', 'Instruções para acessar a área de configurações pelo site', 'Sem anexos'], why: 'É um alerta de segurança comum. Se você não reconhece o login, acesse o site digitando o endereço e troque a senha.' },
  { id: 'ph16', kind: 'email', from: 'RH <rh@suaempresa-beneficios.example>', subj: 'Atualização salarial 2025 — veja seu reajuste', body: 'Prezado colaborador,\n\nSegue a planilha com os novos valores salariais. Abra o anexo e clique em "Habilitar conteúdo" para visualizar corretamente.\n\nAnexo: reajuste_2025.xlsm', phish: true,

  { id: 'ph17', kind: 'sms', from: '+55 31 9xxxx-5500', body: 'Mãe, caiu meu celular na água e estou usando o do meu amigo. Preciso que você pague um boleto pra mim, tá? Te mando o código de barras. Pode ser agora? Responde aqui.', phish: true,

  { id: 'ph18', kind: 'wa', from: 'Grupo da Família', body: 'Pessoal, o pessoal do prédio pediu para todo mundo confirmar a reunião do condomínio de quinta, às 19h, no salão. Vou levar a ata impressa. Quem for, avisa aqui.', phish: false,

  { id: 'ph19', kind: 'email', from: 'Prêmios Brasil <ganhador@premios-sorteio.example>', subj: 'Parabéns! Você ganhou um iPhone 16', body: 'Você foi selecionado entre 10.000 participantes! Para receber seu prêmio, pague apenas o frete de R$ 29,90 e informe seus dados e cartão.\n\n[Resgatar prêmio]', links: [{ t: 'Resgatar prêmio', u: 'http://resgate-premio.sorteio.example/frete' }], phish: true,
    flags: ['Prêmio inesperado', 'Pede pagamento de frete para liberar', 'Solicita dados do cartão'], why: 'Prêmio de sorteio em que você não se inscreveu é isca. O objetivo é roubar dados e cobrar.' },
  { id: 'ph20', kind: 'email', from: 'Biblioteca da Universidade <biblioteca@universidade.example>', subj: 'Lembrete: devolução do livro "Redes de Computadores"', body: 'Olá, Pedro,\n\nO livro "Redes de Computadores" (Tombo 12984) vence em 3 dias (12/04). Você pode renovar no sistema da biblioteca, em biblioteca.universidade.example, ou presencialmente.\n\nBoa leitura!', phish: false,

  { id: 'ph21', kind: 'sms', from: 'INSS', body: 'INSS: há valores retroativos disponíveis em seu nome (R$ 3.420,00). Consulte o CPF e libere o saque: inss-beneficios.libera.example', links: [{ t: 'inss-beneficios.libera.example', u: 'http://inss-beneficios.libera.example/' }], phish: true,

  { id: 'ph22', kind: 'email', from: 'TI Interna <ti@suaempresa.example>', subj: 'Sua senha de e-mail expira hoje', body: 'Sua senha expira hoje às 18h. Para mantê-la, clique no botão abaixo e informe sua senha atual.\n\n[Manter minha senha]', links: [{ t: 'Manter minha senha', u: 'http://portal-ti.suaempresa-acesso.example/senha' }], phish: true,

  { id: 'ph23', kind: 'wa', from: 'Banco Horizonte (Atendimento)', body: 'Olá! Aqui é do suporte do Banco Horizonte. Identificamos tentativa de compra de R$ 3.200 no seu cartão. Para cancelar, confirme o código de 6 dígitos que enviamos por SMS.', phish: true,
    flags: ['Contato inesperado por WhatsApp com a marca do banco', 'Pede o código recebido por SMS', 'Cria urgência e medo'], why: 'O código é a chave da sua conta. Banco nenhum pede código por mensagem ou ligação.' },

  { id: 'ph26', kind: 'sms', from: '+55 85 9xxxx-0001', body: 'Oi, tudo bem? Sou da central do seu banco. Estou te ligando agora pelo número oficial para confirmar uma compra suspeita. Atenda e siga as orientações, vou pedir que instale um app de segurança.', phish: true,

  sec += 3; const okTime = `${hh(Math.floor(sec / 3600))}:${hh(Math.floor(sec % 3600 / 60))}:${hh(sec % 60)}`;

    qs: [{ q: 'Qual IP fez o maior número de tentativas FALHAS?', ans: top[0], kind: 'ip' }, { q: `Quantas tentativas falhas esse IP fez?`, ans: String(top[1]), kind: 'num' }, { q: 'Qual usuário teve login ACEITO a partir desse IP?', ans: 'admin', kind: 'txt' }, { q: 'Que tipo de ataque é esse? (força bruta / sqli / phishing)', ans: 'forca bruta', alt: ['força bruta', 'brute force', 'forca-bruta'], kind: 'txt' }],
    lesson: 'Muitas falhas seguidas de um sucesso do mesmo IP indicam força bruta bem-sucedida. Ações: bloquear o IP, trocar a senha de "admin", revisar o crontab (persistência, veja a última linha), ativar chaves SSH, fail2ban e 2FA.' };
  /* 2) Web */
  const web = []; const sc = '198.51.100.23', paths = ['/admin', '/wp-login.php', '/.env', '/phpmyadmin', '/backup.zip', '/config.php', '/login', '/.git/config'];
  let t = 0; const ts = () => { t += 1 + rnd(3); return `14/Mar/2025:10:${hh(20 + Math.floor(t / 60))}:${hh(t % 60)} -0300`; };
  const normal = ['/', '/produtos', '/contato', '/sobre'], ips = ['192.0.2.15', '192.0.2.40', '198.51.100.99'];

    lesson: 'Sequência clássica: força bruta (4625 repetidos), logon por RDP (4624 tipo 10), reconhecimento (whoami), criação de conta (4720) e elevação (4732). Ações: isolar o servidor, redefinir credenciais, remover a conta criada, fechar o RDP para a internet, ativar MFA/VPN e investigar o "ferramenta.exe".' };

/* =====================================================================
   Mensagens adicionais para "Isto é golpe?" (kind: email | sms | wa | call). Tudo fictício.
