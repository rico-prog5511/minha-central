{ id: 'm07', level: 2, icon: '🔐', title: 'Criptografia na prática', mins: 22,
  intro: 'Criptografia é a base de quase toda proteção digital. Aqui você aprende a diferença entre codificar, cifrar e fazer hash — e pratica no Laboratório.',
  sections: [
    { h: 'Codificar, cifrar e fazer hash não são a mesma coisa', p: `• Codificação (Base64, hexadecimal, URL encoding): muda a representação dos dados para transporte. Não tem segredo: qualquer pessoa reverte.
• Criptografia (cifragem): embaralha os dados usando uma chave; só quem tem a chave (correta) consegue reverter.
• Hash: gera uma "impressão digital" de tamanho fixo a partir dos dados; é de mão única (não se reverte) e pequenas mudanças na entrada mudam completamente a saída.

Erro comum: achar que Base64 "esconde" algo. Não esconde. Teste no Laboratório > Codificações.` },
    { h: 'Criptografia simétrica', p: `Usa a mesma chave para cifrar e decifrar. É rápida e usada para proteger grandes volumes de dados.

• AES (128/192/256 bits): o padrão atual. Importa o modo de operação: ECB é inseguro (padrões aparecem); prefira GCM (que também garante integridade) ou CBC/CTR com cuidado.
• ChaCha20-Poly1305: alternativa moderna, rápida em celulares.
• DES e 3DES: obsoletos.
O desafio da simétrica é combinar a chave com segurança: como entregá-la a quem precisa sem que ninguém a intercepte?` },
    { h: 'Criptografia assimétrica', p: `Usa um par de chaves: a pública (pode ser distribuída) e a privada (fica só com o dono).

• Cifrar: o que é cifrado com a chave pública só é aberto com a privada. Qualquer um pode te mandar algo secreto.
• Assinar: o que é assinado com a chave privada pode ser verificado por todos com a pública. Prova autoria e integridade.

Algoritmos: RSA (2048+ bits), curvas elípticas (ECDSA, Ed25519, X25519). É mais lenta, por isso na prática se usa a assimétrica para combinar uma chave simétrica de sessão (como faz o TLS) e a simétrica para o resto.` },
    { h: 'Hashes, HMAC e derivação de chaves', p: `• Funções de hash: MD5 e SHA-1 estão quebradas para segurança (é possível criar colisões). Use SHA-256/SHA-3 para integridade.
• HMAC: hash com chave secreta; garante integridade e autenticidade de uma mensagem.
• KDF (derivação de chaves): PBKDF2, scrypt e Argon2 transformam senhas em chaves ou hashes de senha de forma lenta e com salt.
• Aleatoriedade: números aleatórios seguros vêm de geradores criptográficos (no navegador, crypto.getRandomValues), nunca de Math.random().

Para arquivos baixados, comparar o SHA-256 publicado com o calculado confirma que o arquivo não foi alterado.` },
    { h: 'Assinaturas, certificados e regras de ouro', p: `Um certificado digital liga uma chave pública a uma identidade (por exemplo, um domínio), e é assinado por uma autoridade certificadora (AC) em que seu sistema confia. No Brasil, o ICP-Brasil regula certificados oficiais.

Regras de ouro:
• Nunca invente seu próprio algoritmo: use bibliotecas e algoritmos revisados pela comunidade.
• O segredo deve estar na chave, não no algoritmo (princípio de Kerckhoffs).
• Chaves nunca ficam no código nem em repositórios públicos.
• Troque algoritmos obsoletos e mantenha as bibliotecas atualizadas.
• Cifrar não substitui controle de acesso, nem backup, nem boas práticas.` }
  ],
  terms: [['Chave', 'Segredo usado para cifrar e decifrar (ou assinar e verificar).'], ['Simétrica', 'Mesma chave para cifrar e decifrar (ex.: AES).'], ['Assimétrica', 'Par de chaves pública/privada (ex.: RSA, Ed25519).'], ['Hash', 'Impressão digital de tamanho fixo, de mão única.'], ['HMAC', 'Hash com chave secreta para autenticar mensagens.'], ['KDF', 'Função que deriva chaves ou hashes de senha de forma lenta (PBKDF2, Argon2).'], ['Certificado digital', 'Documento que liga uma chave pública a uma identidade, assinado por uma AC.'], ['Salt', 'Valor aleatório adicionado antes do hash.']],
  practice: ['No Laboratório > Codificações, converta uma frase para Base64, hexadecimal e binário e volte ao texto.', 'No Laboratório > Hashes, calcule o SHA-256 de "abc" e de "abd" e observe o efeito avalanche.', 'Resolva os desafios de codificação (c01 a c06) na área CTF.'],
  quiz: [
    { q: 'Base64 é...', o: ['Uma criptografia forte', 'Um hash', 'Uma codificação reversível sem chave', 'Um certificado'], a: 2, e: 'Base64 só muda a representação. Qualquer pessoa reverte, sem chave nenhuma.' },
    { q: 'Qual a principal vantagem da criptografia assimétrica?', o: ['É mais rápida que a simétrica', 'Não exige combinar um segredo prévio para trocar mensagens secretas', 'Não precisa de chaves', 'É imune a todos os ataques'], a: 1, e: 'Com chaves pública/privada, qualquer pessoa pode te enviar algo cifrado sem um segredo compartilhado antes.' },
    { q: 'O que se faz com a chave PRIVADA para provar autoria?', o: ['Cifrar o arquivo', 'Assinar o conteúdo', 'Publicar a chave', 'Calcular o MD5'], a: 1, e: 'Quem assina usa a chave privada; todos verificam com a pública.' },
    { q: 'Qual destes modos do AES deve ser evitado?', o: ['GCM', 'CTR', 'ECB', 'CBC com IV aleatório'], a: 2, e: 'No ECB blocos iguais geram saídas iguais e padrões vazam. Prefira GCM.' },
    { q: 'Qual a forma adequada de gerar números aleatórios para segurança no navegador?', o: ['Math.random()', 'crypto.getRandomValues()', 'Date.now()', 'Um contador'], a: 1, e: 'Math.random() é previsível. crypto.getRandomValues() usa fonte criptograficamente segura.' }
  ],
  cards: [['Diferença entre codificar, cifrar e hash?', 'Codificar: reversível sem chave. Cifrar: reversível só com a chave. Hash: mão única.'], ['Quando usar HMAC?', 'Para verificar integridade E autenticidade de uma mensagem com chave secreta compartilhada.'], ['Por que MD5 e SHA-1 são desaconselhados?', 'Existem colisões práticas; use SHA-256/SHA-3 para integridade e KDF lento para senhas.'],
    ['Como o TLS combina simétrica e assimétrica?', 'Usa assimétrica para combinar uma chave de sessão e a simétrica (AES/ChaCha20) para o tráfego.'], ['O que é o princípio de Kerckhoffs?', 'A segurança deve depender só do segredo da chave, não do sigilo do algoritmo.'], ['Para que serve uma AC (autoridade certificadora)?', 'Assina certificados atestando que uma chave pública pertence a determinada identidade.']]
},
{ id: 'm08', level: 2, icon: '🐧', title: 'Linux e linha de comando', mins: 24,
  intro: 'Servidores, ferramentas de segurança e laboratórios rodam em Linux. Dominar o terminal é uma habilidade que serve para atacar (em laboratório) e para defender.',
  sections: [
    { h: 'Por que aprender', p: `A maioria dos servidores, equipamentos de rede, containers e ferramentas de segurança usa Linux. Distribuições voltadas a segurança (Kali Linux, Parrot) trazem ferramentas prontas, mas você aprende mais usando uma distribuição comum (Ubuntu, Debian) em uma máquina virtual (VirtualBox ou VMware). Assim, nada do que você testa afeta seu computador.` },
    { h: 'Comandos essenciais', p: `Navegação e arquivos:
• pwd (onde estou), ls -la (listar com detalhes), cd (entrar), cat/less (ler), cp, mv, rm (copiar, mover, apagar — sem lixeira!), mkdir, touch.
Busca e texto:
• grep "padrão" arquivo (procura texto), find / -name "x" (acha arquivos), head/tail (início/fim; tail -f acompanha em tempo real), wc -l, sort, uniq -c, cut, awk.
Encadeamento:
• O pipe | liga a saída de um comando à entrada de outro. Exemplo: cat acessos.log | grep "404" | sort | uniq -c | sort -nr | head.
Sistema:
• whoami, id, uname -a, ps aux, top, df -h, free -h.
Ajuda: man comando, comando --help. Consulte a seção "Cheat sheets" da Biblioteca.` },
    { h: 'Permissões e usuários', p: `Cada arquivo tem dono, grupo e três conjuntos de permissões (dono, grupo, outros), cada um com r (ler=4), w (escrever=2) e x (executar=1).

• ls -l mostra algo como -rwxr-x--- : dono pode tudo; grupo lê e executa; outros nada.
• chmod 640 arquivo (dono lê/escreve; grupo lê; outros nada). chmod +x script.sh.
• chown usuario:grupo arquivo.
• O usuário root pode tudo: use sudo só quando necessário (princípio do privilégio mínimo).
• Arquivos importantes: /etc/passwd (usuários), /etc/shadow (hashes de senha, só root lê), /etc/sudoers, /var/log/ (logs), ~/.ssh/ (chaves SSH).
• Bits especiais: SUID (executa com os privilégios do dono) é fonte comum de escalada de privilégio quando mal configurado.` },
    { h: 'Processos, serviços, rede e logs', p: `• ps aux, top: processos. kill PID: encerra.
• systemctl status|start|stop|enable serviço: gerencia serviços.
• ss -tulpn (ou netstat): portas abertas e quem as escuta. Serviço escutando sem necessidade é superfície de ataque.
• ip a, ip route, ping, traceroute, dig/nslookup: diagnóstico de rede.
• curl -I https://site: cabeçalhos HTTP. wget baixa arquivos.
• ssh usuario@host: acesso remoto seguro. Prefira chaves a senhas e desative o login do root.
• Logs: /var/log/auth.log (logins), journalctl (systemd), /var/log/syslog. Ver tentativas falhas de login ajuda a detectar ataques de força bruta.
• cron: tarefas agendadas (também usado por invasores para persistência).` },
    { h: 'Endurecimento (hardening) básico', p: `• Mantenha o sistema atualizado (apt update && apt upgrade).
• Remova serviços e pacotes que você não usa.
• SSH: chaves em vez de senha, login do root desativado, porta com tentativas limitadas (fail2ban).
• Firewall: ufw ou nftables, negando tudo por padrão.
• Usuários com privilégio mínimo; revise o sudoers.
• Registre e monitore logs; faça backup.
• Scripts: valide entradas, evite deixar senhas em texto no script e no histórico de comandos.` }
  ],
  terms: [['Shell', 'Programa que interpreta seus comandos (bash, zsh).'], ['Pipe (|)', 'Liga a saída de um comando à entrada de outro.'], ['chmod', 'Altera permissões de arquivos.'], ['root', 'Superusuário com poder total no sistema.'], ['sudo', 'Executa um comando com privilégios elevados.'], ['SUID', 'Bit que faz o programa rodar com os privilégios do dono.'], ['Hardening', 'Endurecimento: reduzir a superfície de ataque de um sistema.']],
  practice: ['Instale uma VM com Ubuntu (VirtualBox) e treine: criar uma pasta, um arquivo, mudar permissões com chmod 600.', 'Use ss -tulpn e descreva cada porta aberta. Alguma é desnecessária?', 'Use grep, sort e uniq -c para contar quantas vezes cada IP aparece num arquivo de log (invente um arquivo de teste).'],
  quiz: [
    { q: 'Qual comando mostra as portas em escuta e os processos associados?', o: ['pwd', 'ss -tulpn', 'cat /etc/passwd', 'chmod'], a: 1, e: 'ss -tulpn (ou netstat -tulpn) lista sockets TCP/UDP em escuta com o processo.' },
    { q: 'O que significa chmod 640 arquivo?', o: ['Todos leem e escrevem', 'Dono lê e escreve; grupo lê; outros nada', 'Dono executa; grupo escreve; outros leem', 'Somente root pode ler'], a: 1, e: '6 = rw- (dono), 4 = r-- (grupo), 0 = --- (outros).' },
    { q: 'Onde ficam os hashes de senha dos usuários no Linux?', o: ['/etc/passwd', '/etc/shadow', '/var/log/auth.log', '/home'], a: 1, e: '/etc/shadow guarda os hashes e só o root consegue ler. /etc/passwd é legível por todos.' },
    { q: 'Qual a melhor forma de proteger o acesso SSH?', o: ['Permitir login do root com senha', 'Usar chaves SSH, desativar login do root e limitar tentativas', 'Trocar a porta apenas', 'Desligar o firewall'], a: 1, e: 'Chaves + root desativado + limitação de tentativas reduz muito o risco de força bruta.' },
    { q: 'O que o pipe (|) faz?', o: ['Apaga o arquivo', 'Redireciona a saída de um comando como entrada do próximo', 'Executa dois comandos em paralelo sem relação', 'Cria um usuário'], a: 1, e: 'É a base da linha de comando: encadear ferramentas pequenas.' }
  ],
  cards: [['O que faz grep "erro" arquivo.log?', 'Mostra as linhas do arquivo que contêm "erro".'], ['Como ver o final de um log em tempo real?', 'tail -f arquivo.log'], ['Valores do chmod: r, w, x?', 'r=4, w=2, x=1 (somados por dono/grupo/outros).'],
    ['Onde ver tentativas de login no Debian/Ubuntu?', '/var/log/auth.log (ou journalctl).'], ['Por que SUID mal configurado é perigoso?', 'Um programa SUID roda com os privilégios do dono (muitas vezes root), podendo permitir escalada de privilégio.'], ['O que é o princípio do privilégio mínimo?', 'Dar a usuários e programas apenas as permissões estritamente necessárias.']]
},
{ id: 'm09', level: 2, icon: '📡', title: 'Redes na prática: análise e varreduras', mins: 24,
  intro: 'Agora que você conhece as camadas, veja como observar o tráfego e descobrir o que está exposto — sempre em redes suas ou autorizadas.',
  sections: [
    { h: 'Ver o tráfego: captura de pacotes', p: `Wireshark (interface gráfica) e tcpdump (linha de comando) capturam pacotes que passam pela placa de rede. Você vê cabeçalhos, protocolos e, quando não há criptografia, o conteúdo.

Filtros úteis no Wireshark: ip.addr == 192.168.0.10, tcp.port == 80, http, dns, tcp.flags.syn == 1.
O que investigar: o handshake TCP, consultas DNS, requisições HTTP em texto claro (senhas visíveis revelam por que HTTPS importa), tráfego estranho para destinos desconhecidos.
Capture apenas em redes suas ou com autorização — capturar tráfego alheio pode violar a lei.` },
    { h: 'Descobrir o que está exposto: varredura de portas', p: `Uma varredura (scan) verifica quais portas de um host respondem. A ferramenta clássica é o Nmap:

• nmap 192.168.0.1: portas mais comuns.
• nmap -sV host: tenta descobrir a versão dos serviços.
• nmap -p 1-1000 host: intervalo de portas.
• nmap -sn 192.168.0.0/24: quais hosts estão ativos (sem varrer portas).
Estados: aberta (um serviço responde), fechada (o host responde, mas sem serviço) e filtrada (um firewall esconde a resposta).

Conceito: cada porta aberta é uma possível superfície de ataque. O objetivo do defensor é ter só as portas necessárias. Varrer redes que não são suas é ilegal ou, no mínimo, abusivo; pratique no seu laboratório ou em alvos feitos para isso (como scanme.nmap.org, que permite testes leves).` },
    { h: 'Ataques comuns em redes', p: `• Sniffing: ler tráfego sem criptografia.
• ARP spoofing: o atacante engana a rede local para ficar no meio da comunicação (man-in-the-middle). Defesa: HTTPS/TLS, VPN, switches com proteções, segmentação.
• DNS spoofing/poisoning: respostas DNS falsas levam a sites maliciosos. Defesa: DNSSEC, DoH/DoT, resolvedores confiáveis.
• DoS/DDoS: sobrecarga do serviço (SYN flood, amplificação). Defesa: CDN, limitação de taxa, provedores anti-DDoS.
• Evil twin: ponto de acesso Wi-Fi falso com o mesmo nome.
• Varreduras e força bruta automatizadas contra serviços expostos (SSH, RDP).` },
    { h: 'Defesa de rede', p: `• Segmentação: separar a rede em zonas (visitantes, IoT, servidores, estações) com firewall entre elas, para um invasor não "andar" livremente.
• Firewall com regras mínimas; DMZ para serviços expostos à internet.
• IDS/IPS (Snort, Suricata, Zeek): detectam (e bloqueiam) tráfego suspeito.
• Monitoramento de logs e de tráfego (NetFlow, SIEM).
• Desativar serviços legados e inseguros (Telnet, FTP simples, SMBv1).
• Acesso remoto só por VPN ou por túnel seguro, com MFA.
• Zero Trust: não confiar automaticamente em nada só por estar dentro da rede; verificar sempre identidade, dispositivo e contexto.` },
    { h: 'Montando seu laboratório', p: `Um laboratório seguro e isolado permite praticar sem riscos:
• Use VirtualBox/VMware/Hyper-V com redes "somente interna" ou "host-only".
• Máquinas: uma atacante (Kali) e alvos propositalmente vulneráveis (Metasploitable, DVWA, OWASP Juice Shop, VulnHub).
• Plataformas online legais: TryHackMe, Hack The Box, OverTheWire, PicoCTF, PortSwigger Web Security Academy.
• Registre o que aprende no caderno de CTFs do app.` }
  ],
  terms: [['Pacote', 'Unidade de dados que viaja pela rede, com cabeçalho e conteúdo.'], ['Nmap', 'Ferramenta de mapeamento de rede e varredura de portas.'], ['Superfície de ataque', 'Conjunto de pontos por onde um sistema pode ser atacado.'], ['MITM', 'Man-in-the-middle: atacante entre duas partes que se comunicam.'], ['IDS / IPS', 'Sistemas que detectam / bloqueiam intrusões.'], ['DMZ', 'Zona de rede isolada para serviços expostos à internet.'], ['Zero Trust', 'Modelo em que nenhum acesso é confiável por padrão; tudo é verificado.']],
  practice: ['Instale o Wireshark, capture 1 minuto do seu próprio tráfego e identifique uma consulta DNS e um handshake TCP.', 'Num laboratório seu, rode nmap -sV na própria máquina virtual e liste as portas abertas e os serviços.', 'Desenhe a segmentação ideal da sua casa: onde colocar celulares, TV, câmeras e computador de trabalho?'],
  quiz: [
    { q: 'Uma porta marcada como "filtrada" pelo Nmap significa...', o: ['Que há um serviço vulnerável', 'Que algo (como um firewall) impede saber se está aberta', 'Que o host está desligado', 'Que a porta é segura'], a: 1, e: 'Filtrada: os pacotes são bloqueados ou ignorados, então o estado não pôde ser determinado.' },
    { q: 'Qual a defesa mais eficaz contra sniffing em redes não confiáveis?', o: ['Esconder o nome do Wi-Fi', 'Criptografia (HTTPS/VPN)', 'Trocar de navegador', 'Usar modo anônimo'], a: 1, e: 'Se o conteúdo está criptografado, quem captura o tráfego não consegue lê-lo.' },
    { q: 'ARP spoofing permite principalmente...', o: ['Quebrar WPA3', 'Posicionar-se no meio da comunicação na rede local (MITM)', 'Instalar atualizações', 'Quebrar hashes'], a: 1, e: 'O atacante associa seu MAC ao IP de outro dispositivo e intercepta o tráfego.' },
    { q: 'Qual a vantagem de segmentar a rede?', o: ['Deixa a internet mais rápida sempre', 'Limita o movimento lateral de um invasor', 'Elimina a necessidade de senhas', 'Substitui o antivírus'], a: 1, e: 'Se um dispositivo é comprometido, o dano fica contido na sua zona.' },
    { q: 'Varrer a rede de uma empresa sem autorização, "só para ver", é...', o: ['Sempre legal', 'Potencialmente ilegal e antiético', 'Um direito do consumidor', 'Obrigatório na LGPD'], a: 1, e: 'Sempre tenha autorização escrita e escopo definido.' }
  ],
  cards: [['O que faz o Nmap?', 'Descobre hosts e portas abertas e tenta identificar serviços e versões.'], ['Estados de porta no Nmap?', 'Aberta, fechada, filtrada (e variações).'], ['O que é DMZ?', 'Zona isolada que abriga serviços expostos à internet, separada da rede interna.'],

},
{ id: 'm10', level: 2, icon: '🕸️', title: 'Segurança web e OWASP Top 10', mins: 28,
  intro: 'Aplicações web são o alvo mais comum. Você vai entender como as principais falhas funcionam e, principalmente, como corrigi-las.',
  sections: [
    { h: 'Como a web funciona (rápido)', p: `O navegador envia uma requisição HTTP (método GET/POST, URL, cabeçalhos, corpo) e o servidor devolve uma resposta (código de status, cabeçalhos, corpo). Cookies guardam o estado da sessão. O servidor não pode confiar em nada que vem do cliente: tudo (campos de formulário, cabeçalhos, cookies, parâmetros) pode ser alterado por quem usa. Esse é o princípio base da segurança web: nunca confie na entrada.` },
    { h: 'OWASP Top 10: o mapa das falhas', p: `A OWASP publica uma lista das categorias de risco mais críticas. Em linhas gerais (a ordem muda entre edições):

• Controle de acesso quebrado: usuários acessando o que não deveriam (IDOR, escalada de privilégio).
• Falhas criptográficas: dados sensíveis sem proteção adequada.
• Injeção: dados do usuário interpretados como comando (SQL, comandos do sistema, XSS).
• Design inseguro: falta de modelagem de ameaças e regras de negócio frágeis.
• Configuração incorreta de segurança: padrões inseguros, mensagens de erro detalhadas, serviços abertos.
• Componentes vulneráveis e desatualizados.
• Falhas de identificação e autenticação.
• Falhas de integridade de software e dados (cadeia de suprimentos).
• Falhas de registro e monitoramento.
• SSRF: fazer o servidor requisitar endereços internos.` },
    { h: 'Injeção de SQL (SQLi)', p: `Ocorre quando a aplicação monta consultas concatenando texto vindo do usuário. Exemplo vulnerável (pseudocódigo):

consulta = "SELECT * FROM usuarios WHERE nome = '" + entrada + "'"

Se a entrada contiver aspas e lógica SQL, o usuário muda o sentido da consulta e pode ler ou alterar o banco.

Correção: consultas parametrizadas (prepared statements), onde os dados nunca são interpretados como código; ORM usado corretamente; validação; usuário de banco com privilégio mínimo. Veja a ficha "SQL Injection" na Biblioteca com o código vulnerável e o corrigido.` },
    { h: 'XSS, CSRF e outras', p: `• XSS (Cross-Site Scripting): a aplicação exibe dados do usuário sem escapar, e um script malicioso roda no navegador da vítima (roubo de sessão, ações em nome dela). Correção: escapar a saída conforme o contexto (HTML, atributo, JS), usar textContent em vez de innerHTML, política de segurança de conteúdo (CSP) e cookies HttpOnly.
• CSRF: o site da vítima aceita um pedido forjado por outro site, porque o navegador envia os cookies junto. Correção: tokens anti-CSRF, cookies SameSite, exigir reautenticação em ações sensíveis.
• IDOR: trocar o id na URL (/pedido/123 → /pedido/124) e ver dados de outra pessoa. Correção: verificar sempre no servidor se o usuário pode acessar aquele recurso.
• Upload inseguro, path traversal (../), SSRF, desserialização insegura: todos nascem de confiar demais na entrada.` },
    { h: 'Cabeçalhos, sessões e boas práticas', p: `• Cookies: Secure, HttpOnly e SameSite.
• Cabeçalhos: Content-Security-Policy, Strict-Transport-Security (HSTS), X-Content-Type-Options, Referrer-Policy.
• Senhas com bcrypt/Argon2; MFA; limites de tentativas; mensagens de erro genéricas.
• Valide entradas no servidor (lista de permitidos), codifique saídas.
• Atualize frameworks e dependências; use SCA para achar componentes vulneráveis.
• Registre eventos relevantes; faça revisões de código e testes de segurança (SAST/DAST).
Para praticar legalmente: OWASP Juice Shop, DVWA, WebGoat, PortSwigger Web Security Academy.` }
  ],
  terms: [['OWASP', 'Comunidade que publica guias e a lista Top 10 de riscos em aplicações web.'], ['SQLi', 'Injeção de SQL: dados do usuário alteram a consulta ao banco.'], ['XSS', 'Script injetado que roda no navegador da vítima.'], ['CSRF', 'Pedido forjado que usa a sessão autenticada da vítima.'], ['IDOR', 'Acesso a objetos de outros usuários trocando um identificador.'], ['CSP', 'Política que limita de onde o navegador carrega scripts e recursos.'], ['Consulta parametrizada', 'Consulta em que os dados são enviados separados do código SQL.']],
  practice: ['Suba o OWASP Juice Shop localmente (Docker ou Node) e tente achar um XSS refletido em um campo de busca.', 'Leia as fichas "SQL Injection" e "XSS" na Biblioteca e reescreva mentalmente o código vulnerável com a correção.', 'Abra as ferramentas do navegador (F12 > Rede) e observe cabeçalhos e cookies de um site que você usa.'],
  quiz: [
    { q: 'Qual é a defesa principal contra SQL Injection?', o: ['Esconder o formulário', 'Consultas parametrizadas', 'Usar HTTPS', 'Trocar a senha do banco'], a: 1, e: 'Com consultas parametrizadas, os dados do usuário nunca são tratados como código SQL.' },
    { q: 'XSS acontece quando...', o: ['O servidor cai', 'Dados do usuário são exibidos sem tratamento e executam como script no navegador', 'A senha é fraca', 'O certificado expira'], a: 1, e: 'O navegador executa script injetado como se fosse do site.' },
    { q: 'Trocar /pedido/123 por /pedido/124 e ver o pedido de outra pessoa é um exemplo de...', o: ['XSS', 'CSRF', 'IDOR (controle de acesso quebrado)', 'DDoS'], a: 2, e: 'O servidor deveria verificar se o usuário tem direito àquele pedido.' },
    { q: 'O atributo HttpOnly em um cookie...', o: ['Obriga o uso de HTTP', 'Impede que scripts leiam o cookie', 'Faz o cookie expirar', 'Criptografa o cookie'], a: 1, e: 'Isso reduz o impacto de um XSS no roubo de sessão.' },
    { q: 'Qual é o princípio base da segurança web?', o: ['Confiar nos dados do cliente', 'Nunca confiar na entrada vinda do cliente', 'Validar apenas no navegador', 'Esconder o código-fonte'], a: 1, e: 'Tudo que vem do cliente pode ser alterado: valide e trate no servidor.' }
  ],
  cards: [['O que é injeção?', 'Quando dados não confiáveis são interpretados como parte de um comando ou consulta.'], ['Como evitar SQLi?', 'Consultas parametrizadas, privilégio mínimo no banco e validação de entrada.'], ['Como evitar XSS?', 'Escapar a saída conforme o contexto, usar textContent, CSP e cookies HttpOnly.'],
    ['O que o cookie SameSite ajuda a evitar?', 'CSRF (limita o envio do cookie em requisições entre sites).'], ['O que é IDOR?', 'Referência direta insegura a objeto: acessar dados de outros trocando um identificador.'], ['O que é SSRF?', 'Fazer o servidor realizar requisições a endereços internos ou arbitrários.']]
},
{ id: 'm11', level: 2, icon: '🪟', title: 'Windows, Active Directory e identidade', mins: 22,
  intro: 'Em empresas, a maior parte dos computadores é Windows, ligada a um diretório central. Entender identidade e privilégios explica a maioria dos incidentes corporativos.',
  sections: [
    { h: 'Segurança no Windows', p: `• Contas: usuário padrão no dia a dia, administrador só quando preciso. O UAC pede confirmação ao elevar privilégios.
• Microsoft Defender (antivírus), Firewall do Windows e SmartScreen: mantenha ativos.
• BitLocker: criptografia de disco para proteger dados em caso de perda ou roubo.
• Atualizações do Windows Update e dos aplicativos.
• Logs: Visualizador de Eventos (IDs úteis: 4624 login com sucesso, 4625 falha de login, 4688 criação de processo, 4720 usuário criado).
• Registro, tarefas agendadas, serviços e pastas de inicialização são locais clássicos de persistência de malware.
• PowerShell é poderoso para administração e muito usado em ataques: habilite o log de scripts (Script Block Logging).` },
    { h: 'Autenticação e privilégios', p: `• Os hashes de senha locais ficam no SAM; em domínio, no controlador de domínio (NTDS.dit).
• NTLM é um protocolo de autenticação antigo, vulnerável a ataques como relay e pass-the-hash (usar o hash em vez da senha). Kerberos é o protocolo principal de domínio, baseado em tickets.
• Princípios: privilégio mínimo, separação entre contas comuns e administrativas, uso de estações de acesso privilegiado.
• Senhas locais de administrador únicas por máquina (LAPS) impedem que uma senha comprometida abra todas as máquinas.` },
    { h: 'Active Directory em linhas gerais', p: `Active Directory (AD) é o serviço de diretório da Microsoft: guarda usuários, grupos, computadores e políticas de uma organização. Os controladores de domínio (DC) respondem a pedidos de autenticação.

Conceitos: domínio, floresta, unidades organizacionais (OU), grupos, GPO (políticas de grupo, que aplicam configurações em massa), Domain Admins (poder total).

Como um atacante costuma agir dentro de um AD (visão defensiva):
1. Acesso inicial (phishing, senha fraca, serviço exposto).
2. Reconhecimento: listar usuários, grupos e máquinas.
3. Roubo de credenciais (Kerberoasting, dumping de memória, pass-the-hash).
4. Movimentação lateral até uma máquina de privilégio alto.
5. Persistência e objetivo final (dados, ransomware).
Quem controla um DC controla o domínio, por isso ele é o ativo mais crítico.` },
    { h: 'Defesas para ambientes Windows/AD', p: `• MFA para acessos remotos e contas privilegiadas.
• Política de senhas longas; proibir senhas comuns; contas de serviço com senhas fortes (ou gMSA).
• Limitar quem é Domain Admin; contas administrativas separadas; sem logins administrativos em estações comuns.
• Desativar NTLM e SMBv1 sempre que possível.
• Segmentar a rede e restringir RDP à VPN com MFA.
• Aplicar patches rápido (vulnerabilidades críticas em Windows são exploradas em dias).
• Monitorar eventos (SIEM), alertar sobre criação de contas, adição a grupos privilegiados e falhas de login repetidas.
• Backups offline e testes de recuperação do AD.
Para estudar em laboratório: monte um domínio de teste com VMs (Windows Server Evaluation) e use ferramentas como BloodHound para entender caminhos de ataque.` }
  ],
  terms: [['Active Directory', 'Serviço de diretório da Microsoft que centraliza usuários, grupos e políticas.'], ['Controlador de domínio', 'Servidor que autentica usuários e guarda o diretório.'], ['GPO', 'Política de grupo: configurações aplicadas em massa.'], ['Kerberos', 'Protocolo de autenticação por tickets usado em domínios.'], ['Pass-the-hash', 'Usar o hash da senha para autenticar sem conhecer a senha.'], ['Movimento lateral', 'Deslocamento do invasor entre máquinas da rede.'], ['BitLocker', 'Criptografia de disco do Windows.']],
  practice: ['No seu Windows, abra o Visualizador de Eventos e localize um evento 4624 (login com sucesso).', 'Verifique se o BitLocker/Criptografia de dispositivo está ativo e se você usa conta padrão no dia a dia.', 'Monte (opcional) um laboratório com Windows Server Evaluation e crie 3 usuários e 2 grupos.'],
  quiz: [
    { q: 'Qual evento do Windows indica falha de login?', o: ['4624', '4625', '4688', '4720'], a: 1, e: '4625 = falha de logon. 4624 = sucesso, 4688 = novo processo, 4720 = conta criada.' },
    { q: 'O que é movimento lateral?', o: ['Atualizar o sistema', 'O invasor se deslocar de máquina em máquina na rede', 'Um backup entre servidores', 'Uma regra de firewall'], a: 1, e: 'Depois de entrar em uma máquina, o invasor busca outras até chegar a ativos de maior valor.' },
    { q: 'Qual o risco do NTLM?', o: ['É muito lento', 'Permite ataques como relay e pass-the-hash', 'Não funciona em redes locais', 'Não usa hashes'], a: 1, e: 'Por isso é recomendado reduzir ou desativar o NTLM.' },
    { q: 'Para que serve o LAPS?', o: ['Para criar GPOs', 'Para dar senhas de administrador local únicas e rotativas por máquina', 'Para criptografar o disco', 'Para filtrar e-mails'], a: 1, e: 'Se uma senha de administrador local vaza, ela não abre todas as outras máquinas.' },
    { q: 'Qual é o ativo mais crítico de um domínio Active Directory?', o: ['As impressoras', 'O controlador de domínio', 'O Wi-Fi de visitantes', 'O notebook de testes'], a: 1, e: 'Quem controla o DC controla todo o domínio.' }
  ],
  cards: [['Evento 4625?', 'Falha de logon no Windows (4624 é sucesso).'], ['O que é Kerberoasting?', 'Ataque que pede tickets de contas de serviço e tenta quebrar a senha offline.'], ['O que é GPO?', 'Política de grupo do AD, que aplica configurações a muitas máquinas.'],
    ['Defesa contra pass-the-hash?', 'Privilégio mínimo, LAPS, desativar NTLM, não logar como admin em máquinas comuns.'], ['O que o UAC faz?', 'Pede confirmação antes de elevar privilégios de administrador.'], ['Por que separar contas comuns e administrativas?', 'Para que o comprometimento de uma conta de uso diário não entregue poder administrativo.']]
},
{ id: 'm12', level: 2, icon: '📊', title: 'Gestão de vulnerabilidades e de riscos', mins: 20,
  intro: 'Segurança não é eliminar todo risco; é priorizar e tratar o que mais importa com os recursos disponíveis.',
  sections: [
    { h: 'O ciclo da gestão de vulnerabilidades', p: `Um processo contínuo:
1. Inventariar ativos (você só protege o que conhece).
2. Descobrir vulnerabilidades (varreduras com ferramentas como Nessus, OpenVAS, Trivy).
3. Priorizar (gravidade × exposição × importância do ativo × existência de exploração pública).
4. Corrigir (patch, configuração, mitigação) ou aceitar o risco formalmente.
5. Verificar se foi realmente corrigido.
6. Medir e repetir.
Um scanner gera falsos positivos e falsos negativos: o resultado precisa de análise humana.` },
    { h: 'CVE, CVSS, CWE e KEV', p: `• CVE: identificador público de uma vulnerabilidade específica (CVE-2021-44228 é o Log4Shell).
• CVSS: nota de 0 a 10 que indica a gravidade técnica (baixa, média, alta, crítica). Não é o risco para o seu ambiente.
• CWE: catálogo de tipos de fraqueza (CWE-79 é XSS; CWE-89 é SQL injection).
• EPSS: estimativa da probabilidade de exploração.
• Catálogo KEV (CISA): lista de vulnerabilidades já exploradas em ataques reais — prioridade máxima.
• Zero-day: falha desconhecida do fabricante (ou sem correção) já explorada.` },
    { h: 'Análise e tratamento de riscos', p: `Risco = probabilidade × impacto. Uma matriz simples (baixa/média/alta × baixo/médio/alto) ajuda a comparar riscos.

Opções de tratamento:
• Mitigar: aplicar controles para reduzir.
• Transferir: seguro, terceirizar.
• Evitar: deixar de fazer a atividade.
• Aceitar: conviver com o risco de forma consciente e documentada.
Risco residual é o que sobra depois dos controles. O processo é registrado em um registro de riscos, com responsável e prazo.` },
    { h: 'Modelagem de ameaças (STRIDE)', p: `Threat modeling é pensar no sistema como um atacante, antes de construir. STRIDE ajuda a achar ameaças por categoria:

• Spoofing (falsificação de identidade) → autenticação forte.
• Tampering (adulteração) → integridade, assinaturas.
• Repudiation (repúdio) → logs e trilhas de auditoria.
• Information disclosure (vazamento) → criptografia, controle de acesso.
• Denial of service (negação de serviço) → limites, redundância.
• Elevation of privilege (elevação de privilégio) → privilégio mínimo, validação.

Passos: desenhar o sistema (fluxo de dados e fronteiras de confiança), listar ameaças com STRIDE, avaliar, definir controles. Use a ferramenta "Mapa de ameaças" em Treino para praticar.` },
    { h: 'Defesa em profundidade e frameworks', p: `Nenhum controle é perfeito; por isso usamos camadas (defesa em profundidade): física, rede, host, aplicação, dados e pessoas.

Frameworks de referência:
• ISO/IEC 27001 e 27002: gestão e controles de segurança.
• NIST Cybersecurity Framework: Identificar, Proteger, Detectar, Responder, Recuperar.
• CIS Controls e CIS Benchmarks: lista priorizada de controles e guias de configuração.
• LGPD e normas do setor (PCI DSS para cartões).
Políticas, treinamento e cultura de segurança completam a técnica.` }
  ],
  terms: [['CVE', 'Identificador público de uma vulnerabilidade.'], ['CVSS', 'Pontuação de 0 a 10 da gravidade técnica de uma vulnerabilidade.'], ['CWE', 'Catálogo de tipos de fraqueza de software.'], ['KEV', 'Catálogo de vulnerabilidades com exploração ativa conhecida.'], ['Risco residual', 'Risco que permanece após aplicar os controles.'], ['STRIDE', 'Modelo de categorias de ameaça: Spoofing, Tampering, Repudiation, Information disclosure, DoS, Elevation.'], ['Defesa em profundidade', 'Camadas de controles que se complementam.']],
  practice: ['Faça um inventário dos seus dispositivos e softwares (planilha ou nas Fichas do app) e pesquise se algum tem CVE crítica sem correção.', 'Escolha um aplicativo simples (um site de cadastro) e faça o STRIDE completo no Treino > Mapa de ameaças.', 'Procure no catálogo KEV da CISA uma vulnerabilidade de um produto que você usa.'],
  quiz: [
    { q: 'O CVSS mede...', o: ['O risco exato para a sua empresa', 'A gravidade técnica da vulnerabilidade, em nota de 0 a 10', 'O custo da correção', 'O número de usuários afetados'], a: 1, e: 'A nota CVSS é um ponto de partida; o risco real depende do seu ambiente.' },
    { q: 'Qual destes é um tratamento de risco válido?', o: ['Ignorar sem registrar', 'Mitigar, transferir, evitar ou aceitar de forma documentada', 'Esconder o risco', 'Esperar acontecer'], a: 1, e: 'Aceitar é válido, desde que consciente, documentado e com responsável.' },
    { q: 'A letra "T" do STRIDE representa...', o: ['Teste', 'Tampering (adulteração)', 'Trojan', 'Token'], a: 1, e: 'Tampering é a alteração indevida de dados ou código.' },
    { q: 'Uma vulnerabilidade presente no catálogo KEV deve ser...', o: ['Priorizada, pois há exploração real conhecida', 'Ignorada se a nota for baixa', 'Tratada apenas no próximo ano', 'Removida do inventário'], a: 0, e: 'KEV = já explorada em ataques reais. A prioridade é alta.' },
    { q: 'O que é defesa em profundidade?', o: ['Um único firewall muito forte', 'Várias camadas de controle que se complementam', 'Criptografar tudo e mais nada', 'Ter servidores no subsolo'], a: 1, e: 'Se uma camada falha, outras ainda protegem.' }
  ],
  cards: [['Risco = ?', 'Probabilidade × impacto.'], ['Quais as 4 formas de tratar um risco?', 'Mitigar, transferir, evitar, aceitar.'], ['O que é CVE?', 'Identificador público único de uma vulnerabilidade (ex.: CVE-2021-44228).'],
    ['O que significa STRIDE?', 'Spoofing, Tampering, Repudiation, Information disclosure, DoS, Elevation of privilege.'], ['O que é risco residual?', 'O risco que sobra depois de aplicar os controles.'], ['As 5 funções do NIST CSF?', 'Identificar, Proteger, Detectar, Responder, Recuperar (versão 2.0 inclui também Governar).']]
}
);

LESSONS.push(
{ id: 'm13', level: 3, icon: '🧪', title: 'Teste de invasão ético (pentest)', mins: 26,
  intro: 'Pentest é a simulação autorizada de um ataque para achar falhas antes dos criminosos. O que separa o profissional é o método, o escopo e o relatório.',
  sections: [
    { h: 'Contrato, escopo e regras', p: `Um pentest sempre começa por documentos, não por ferramentas:
• Autorização escrita do dono dos sistemas (e de terceiros envolvidos, como provedores de nuvem).
• Escopo: o que pode ser testado (IPs, domínios, aplicações) e o que não pode.
• Regras de engajamento: horários, técnicas permitidas (engenharia social? negação de serviço?), contatos de emergência.
• Tratamento de dados: o que fazer ao encontrar informações sensíveis, e como destruí-las depois.
Sair do escopo transforma o teste em crime. Em programas de bug bounty (HackerOne, Bugcrowd, programas próprios), a política do programa funciona como o escopo.` },
    { h: 'Fases de um pentest', p: `1. Planejamento e reconhecimento: coleta de informação. Passivo (OSINT: domínios, vazamentos, redes sociais, certificados) e ativo (varreduras, enumeração).
2. Varredura e enumeração: portas, serviços, versões, diretórios, usuários.
3. Análise de vulnerabilidades: relacionar o que foi encontrado a falhas conhecidas ou lógicas.
4. Exploração: confirmar que a falha é real, com o mínimo impacto necessário (prova de conceito).
5. Pós-exploração: avaliar o alcance (privilégios, dados, movimento lateral) — sempre dentro das regras.
6. Relatório e apresentação.
7. Reteste após as correções.
Metodologias de referência: PTES, OSSTMM, OWASP Web Security Testing Guide, NIST SP 800-115.` },
    { h: 'Tipos de teste', p: `• Caixa-preta: sem informação prévia (visão do atacante externo).
• Caixa-cinza: informação parcial (ex.: uma conta de usuário comum).
• Caixa-branca: acesso total, inclusive código e diagramas.
• Externo x interno; aplicação web; mobile; Wi-Fi; engenharia social; físico.
• Red team: simulação mais ampla e furtiva dos objetivos de um adversário real, testando também a detecção. Blue team defende. Purple team une os dois para melhorar a detecção.` },
    { h: 'Ferramentas comuns (para estudo em laboratório)', p: `• Reconhecimento: whois, dig, Shodan, Amass, theHarvester.
• Varredura: Nmap, Masscan.
• Web: Burp Suite (proxy de interceptação), OWASP ZAP, ffuf/gobuster (descoberta de diretórios), sqlmap, nikto.
• Exploração: Metasploit Framework, scripts próprios.
• Senhas: Hashcat, John the Ripper, Hydra (testar apenas em laboratório e com hashes seus).
• Rede/AD: BloodHound, Impacket, Responder, CrackMapExec/NetExec.
• Ferramenta nenhuma substitui entender o que acontece por baixo: aprenda o protocolo antes de apertar o botão.` },
    { h: 'O relatório é o produto', p: `O cliente paga pelo relatório. Ele deve ter:
• Resumo executivo (linguagem não técnica; riscos de negócio).
• Metodologia e escopo.
• Achados com título, gravidade (CVSS ou critério claro), descrição, evidências (capturas), impacto, passos para reproduzir e recomendação objetiva de correção.
• Priorização e um plano de remediação.
• Pontos positivos (o que estava bem).
Escreva para duas plateias: a diretoria entende o risco; a equipe técnica consegue corrigir. Treine escrevendo write-ups no Caderno de CTFs deste app.` }
  ],
  terms: [['Pentest', 'Teste de invasão autorizado para achar vulnerabilidades.'], ['Escopo', 'Limites do que pode ser testado.'], ['Red / Blue / Purple team', 'Atacante simulado / defensor / colaboração entre os dois.'], ['Prova de conceito (PoC)', 'Demonstração mínima de que a falha é explorável.'], ['Caixa-preta/cinza/branca', 'Níveis de informação prévia dada ao testador.'], ['Bug bounty', 'Programa que recompensa a descoberta e o relato responsável de falhas.'], ['Enumeração', 'Levantamento detalhado de serviços, usuários e recursos.']],
  practice: ['Faça uma sala de iniciantes no TryHackMe ou uma máquina fácil no Hack The Box e registre o write-up no Caderno de CTFs.', 'Escreva um achado fictício (ex.: "Cadastro sem limite de tentativas") com descrição, impacto, passos para reproduzir e recomendação.', 'Leia a política de um programa de bug bounty e liste o que está dentro e fora do escopo.'],
  quiz: [
    { q: 'O que torna um pentest legal e ético?', o: ['Usar ferramentas gratuitas', 'Autorização escrita e escopo definido', 'Ser feito à noite', 'Não deixar rastros'], a: 1, e: 'Sem autorização e escopo, é invasão. Isso vale também para bug bounty: siga a política.' },
    { q: 'Em qual teste o analista recebe acesso total, inclusive código-fonte?', o: ['Caixa-preta', 'Caixa-cinza', 'Caixa-branca', 'Red team'], a: 2, e: 'Caixa-branca dá visão completa e permite achar mais falhas com menos tempo.' },
    { q: 'Qual a ordem lógica mais comum das fases?', o: ['Exploração → reconhecimento → relatório', 'Reconhecimento → varredura/enumeração → análise → exploração → pós-exploração → relatório', 'Relatório → exploração', 'Pós-exploração → reconhecimento'], a: 1, e: 'Primeiro se coleta informação; só depois se explora, sempre dentro das regras.' },
    { q: 'O que um bom relatório de pentest deve incluir?', o: ['Só a lista de ferramentas usadas', 'Resumo executivo, achados com evidência e recomendação, e plano de remediação', 'Somente capturas de tela', 'Apenas os nomes das vítimas'], a: 1, e: 'Precisa servir tanto à gestão quanto à equipe técnica que vai corrigir.' },
    { q: 'O que faz um purple team?', o: ['Só ataca', 'Só defende', 'Une atacantes e defensores para melhorar a detecção', 'Cuida do marketing'], a: 2, e: 'Atacantes mostram técnicas, defensores ajustam detecções em conjunto.' }
  ],
  cards: [['Quais são as fases de um pentest?', 'Planejamento/reconhecimento, varredura/enumeração, análise, exploração, pós-exploração, relatório, reteste.'], ['Diferença entre red team e pentest?', 'Red team é mais amplo e furtivo, mira objetivos e testa a detecção; o pentest busca o máximo de falhas num escopo.'], ['O que contém o escopo?', 'Alvos permitidos, exclusões, janelas de tempo, técnicas autorizadas e contatos.'],
    ['O que é uma PoC?', 'Prova de conceito: demonstração mínima de que a falha é explorável.'], ['Por que o relatório é crucial?', 'É o que o cliente usa para corrigir e priorizar; sem ele o teste não gera valor.'], ['Caixa-preta x cinza x branca?', 'Nenhuma / parcial / total informação prévia sobre o alvo.']]
},
{ id: 'm14', level: 3, icon: '🔬', title: 'Análise de malware e forense digital', mins: 28,
  intro: 'Quando algo dá errado, é preciso entender o que aconteceu. Esta aula apresenta a análise segura de amostras e a investigação de evidências digitais.',
  sections: [
    { h: 'Princípios da forense', p: `Forense digital busca responder: o que aconteceu, quando, como, quem e qual o impacto — preservando evidências para que sejam confiáveis (e aceitas, se houver processo legal).

• Preservar: não alterar o original. Trabalhe em cópias (imagens forenses) e confirme com hash (SHA-256) que a cópia é idêntica.
• Cadeia de custódia: registro de quem teve acesso à evidência, quando e por quê.
• Ordem de volatilidade: colete primeiro o que desaparece mais rápido — memória RAM, conexões de rede, processos — depois o disco e os logs.
• Documentar tudo: horários, comandos usados, achados.
• Linha do tempo (timeline): ordenar eventos de várias fontes revela a história do incidente.` },
    { h: 'Fontes de evidência', p: `• Memória (RAM): processos, conexões, injeções, chaves. Ferramentas: Volatility.
• Disco: sistema de arquivos, arquivos apagados, tarefas agendadas, itens de inicialização, histórico de navegação. Ferramentas: Autopsy, Sleuth Kit, FTK Imager.
• Logs: sistema operacional, aplicações, firewalls, proxy, DNS, nuvem.
• Rede: capturas de pacotes (PCAP), NetFlow.
• Windows: registro, Prefetch, Amcache, eventos, LNK, arquivos recentes.
• E-mail e metadados de arquivos (EXIF, autor, datas).
• Dispositivos móveis e nuvem (cada um com suas particularidades legais).` },
    { h: 'Análise de malware: estática e dinâmica', p: `Analisar malware é arriscado: faça-o apenas em ambiente isolado (VM sem rede ou rede simulada, snapshots, sem pastas compartilhadas).

Análise estática (sem executar):
• Hash do arquivo e consulta em serviços como o VirusTotal (sem enviar arquivos privados).
• Tipo e cabeçalhos do arquivo (file, PE headers), strings legíveis, funções importadas, entropia (alta pode indicar empacotamento ou criptografia).
• Disassembly/decompilação (Ghidra, IDA).

Análise dinâmica (executando em laboratório):
• Monitorar arquivos, registro, processos e rede (Process Monitor, Process Explorer, Wireshark, Fakenet).
• Observar persistência, comunicações com servidores de comando e controle (C2), arquivos criados.

Resultado: IOCs (indicadores de comprometimento: hashes, domínios, IPs, chaves de registro) e regras de detecção (YARA, Sigma) para proteger outros ambientes.` },
    { h: 'Indicadores e técnicas de ofuscação', p: `Malware tenta se esconder:
• Empacotamento e criptografia do código (packers).
• Ofuscação de strings e de scripts (PowerShell/JavaScript codificados em Base64).
• Detecção de VMs e debuggers para não revelar o comportamento.
• Uso de ferramentas legítimas do sistema ("living off the land": PowerShell, certutil, mshta).
• Domínios gerados dinamicamente (DGA) e comunicações disfarçadas em tráfego comum (HTTPS, DNS).
Por isso o exercício de decodificar camadas (Base64, hex, XOR) que você pratica nos desafios CTF é uma habilidade real de analista.` },
    { h: 'Boas práticas e carreira', p: `• Nunca execute amostras no seu computador pessoal.
• Mantenha laboratórios isolados e atualizados; desative cópia/colagem e pastas compartilhadas com o host.
• Mantenha IOCs e regras organizados (veja a Biblioteca).
• Pratique com amostras de fontes legítimas para estudo (MalwareBazaar, Malware-Traffic-Analysis.net, laboratórios do CyberDefenders e Blue Team Labs Online) seguindo as regras de cada site.
• Certificações relacionadas: GCFA, GCFE, GREM, CHFI.` }
  ],
  terms: [['Cadeia de custódia', 'Registro de quem manuseou a evidência e quando.'], ['Imagem forense', 'Cópia bit a bit de um disco ou memória para análise.'], ['IOC', 'Indicador de comprometimento: hash, domínio, IP, chave de registro etc.'], ['C2', 'Servidor de comando e controle usado pelo malware.'], ['YARA', 'Linguagem de regras para identificar malware por padrões.'], ['Análise estática / dinâmica', 'Examinar sem executar / observar a execução em ambiente isolado.'], ['Volatility', 'Framework de análise de memória.']],
  practice: ['Calcule o SHA-256 de um arquivo seu e anote como confirmaria depois que uma cópia é idêntica.', 'No Laboratório > Codificações, decodifique um texto em duas camadas (Base64 + hexadecimal) e relacione ao desafio c16.', 'Resolva a análise de logs "Relatório de acessos" no Treino e monte a linha do tempo do ataque em 3 frases.'],
  quiz: [
    { q: 'Em uma coleta de evidências, o que se coleta primeiro?', o: ['O disco rígido', 'Os dados mais voláteis, como memória e conexões de rede', 'Os arquivos antigos', 'As configurações de fábrica'], a: 1, e: 'A ordem de volatilidade manda começar pelo que desaparece primeiro (RAM, conexões).' },
    { q: 'Para que serve o hash de uma imagem forense?', o: ['Para compactá-la', 'Para provar que a cópia é idêntica e não foi alterada', 'Para criptografá-la', 'Para pesquisar senhas'], a: 1, e: 'Se o hash confere, a integridade da evidência fica comprovada.' },
    { q: 'Onde deve ser executada uma amostra de malware para estudo?', o: ['No notebook pessoal', 'Em uma VM isolada, com snapshots e sem acesso à rede real', 'No servidor de produção', 'No celular'], a: 1, e: 'O isolamento evita que a análise vire um incidente real.' },
    { q: 'O que são IOCs?', o: ['Instruções de operação', 'Indicadores de comprometimento que ajudam a detectar a ameaça', 'Impostos', 'Instaladores oficiais'], a: 1, e: 'Hashes, IPs, domínios e artefatos que revelam a presença de uma ameaça.' },
    { q: 'Entropia muito alta em um executável pode indicar...', o: ['Código bem organizado', 'Empacotamento ou criptografia', 'Arquivo vazio', 'Arquivo de texto'], a: 1, e: 'Dados criptografados ou comprimidos parecem aleatórios (alta entropia).' }
  ],
  cards: [['O que é cadeia de custódia?', 'Documentação de quem teve acesso à evidência, quando e por quê.'], ['O que é ordem de volatilidade?', 'Coletar primeiro os dados que somem mais rápido: RAM, rede, processos; depois disco e logs.'], ['Estática x dinâmica?', 'Estática analisa sem executar; dinâmica observa a execução em ambiente isolado.'],
    ['O que é YARA?', 'Linguagem de regras para identificar arquivos/malware por padrões.'], ['O que significa "living off the land"?', 'Usar ferramentas legítimas do sistema (PowerShell, certutil) para atacar e evitar detecção.'], ['O que é C2?', 'Infraestrutura de comando e controle com que o malware recebe ordens.']]
},
{ id: 'm15', level: 3, icon: '🚨', title: 'Resposta a incidentes, SOC e MITRE ATT&CK', mins: 26,
  intro: 'Incidentes vão acontecer. O que diferencia uma organização madura é detectar rápido, conter e aprender com cada um.',
  sections: [
    { h: 'O ciclo de resposta a incidentes', p: `Modelo NIST SP 800-61:
1. Preparação: plano, equipe, contatos, ferramentas, treinamento, backups.
2. Detecção e análise: identificar alertas reais, classificar a gravidade, definir o escopo.
3. Contenção, erradicação e recuperação: isolar sistemas, remover a causa (malware, contas, acesso), restaurar de forma segura e monitorar.
4. Atividade pós-incidente: lições aprendidas, ajustes de controles, relatório.

Um incidente com dados pessoais pode exigir comunicação à ANPD e aos titulares (LGPD, art. 48). Envolva o jurídico e a comunicação desde cedo.` },
    { h: 'O SOC e a detecção', p: `O SOC (Security Operations Center) monitora e responde 24x7. Ferramentas:
• SIEM: coleta e correlaciona logs de várias fontes (Splunk, Elastic, Wazuh, Sentinel).
• EDR/XDR: monitora endpoints e permite isolar máquinas remotamente.
• SOAR: automatiza respostas.
• Threat intelligence: IOCs e informações sobre adversários.
Níveis: analista N1 (triagem), N2 (investigação), N3 (casos complexos, caça a ameaças).
Métricas: MTTD (tempo médio para detectar) e MTTR (tempo médio para responder). Alertas demais geram fadiga; boas regras e ajustes constantes reduzem falsos positivos.` },
    { h: 'MITRE ATT&CK', p: `É uma base de conhecimento de táticas e técnicas reais usadas por adversários. As táticas (o "porquê") formam uma sequência típica:

Reconhecimento · Desenvolvimento de recursos · Acesso inicial · Execução · Persistência · Escalada de privilégios · Evasão de defesa · Acesso a credenciais · Descoberta · Movimento lateral · Coleta · Comando e controle · Exfiltração · Impacto.

Cada tática tem técnicas (T1566 Phishing, T1059 Interpretadores de comando, T1078 Contas válidas, T1486 Dados criptografados para impacto) e sub-técnicas. Uso: mapear detecções, descobrir lacunas, planejar exercícios de red team e comunicar ataques com uma linguagem comum. Relacionado: a Cyber Kill Chain (Lockheed Martin) e o Modelo Diamante.` },
    { h: 'Caça a ameaças e análise de logs', p: `Threat hunting é buscar proativamente sinais de atacantes que passaram pelos alertas, partindo de hipóteses ("se houvesse movimento lateral, apareceriam logins de rede incomuns à noite").

Habilidades essenciais:
• Ler logs de autenticação, web, DNS, firewall e endpoint.
• Identificar anomalias: picos de erros 401/403, muitas tentativas de login de um mesmo IP, horários incomuns, user-agents estranhos, consultas DNS a domínios recém-registrados, grandes transferências de saída.
• Usar filtros e agregações (grep, awk, consultas no SIEM, Sigma).
Treine nos exercícios "Análise de logs" em Treino: eles usam IPs de documentação (203.0.113.x, 198.51.100.x), que não pertencem a ninguém.` },
    { h: 'Comunicação, evidências e lições aprendidas', p: `• Tenha um plano de comunicação: quem fala com a direção, clientes, imprensa, autoridades.
• Registre decisões e horários (linha do tempo do incidente).
• Preserve evidências antes de limpar sistemas.
• Atribuição a um grupo específico é difícil e raramente necessária para responder bem.
• Reunião de lições aprendidas sem culpados: o foco é melhorar o processo.
• Exercícios de mesa (tabletop) e simulações periódicas testam o plano antes da crise real. Veja "Cenários de decisão" no Treino.` }
  ],
  terms: [['Incidente', 'Evento que compromete (ou ameaça) a segurança da informação.'], ['SOC', 'Centro de operações de segurança.'], ['SIEM', 'Plataforma que correlaciona logs e gera alertas.'], ['EDR', 'Detecção e resposta em endpoints.'], ['MITRE ATT&CK', 'Base de conhecimento de táticas e técnicas de adversários.'], ['Threat hunting', 'Busca proativa de ameaças não detectadas.'], ['MTTD / MTTR', 'Tempo médio para detectar / para responder.']],
  practice: ['Resolva os cenários de decisão do Treino e compare suas escolhas com as explicações.', 'Pegue o ataque do desafio c12 (log de SQLi) e mapeie-o em táticas do MITRE ATT&CK.', 'Escreva um mini plano de resposta para "perdi meu notebook de trabalho": quem avisar, o que revogar e o que verificar.'],
  quiz: [
    { q: 'Qual etapa do NIST vem imediatamente antes da erradicação e recuperação?', o: ['Preparação', 'Detecção e análise → contenção', 'Lições aprendidas', 'Relatório final'], a: 1, e: 'Após detectar e analisar, contém-se o incidente; depois se erradica a causa e recupera.' },
    { q: 'Para que serve um SIEM?', o: ['Substituir o firewall', 'Coletar e correlacionar logs para gerar alertas', 'Criptografar discos', 'Fazer backup'], a: 1, e: 'Ele centraliza logs de várias fontes para detecção e investigação.' },
    { q: 'MITRE ATT&CK é...', o: ['Uma ferramenta de hacking', 'Uma base de conhecimento de táticas e técnicas de adversários', 'Um antivírus', 'Um sistema operacional'], a: 1, e: 'Serve para mapear detecções, lacunas e planejar testes.' },
    { q: 'O que é threat hunting?', o: ['Esperar os alertas do SIEM', 'Busca proativa por sinais de atacantes com base em hipóteses', 'Contratar um hacker', 'Rastrear fornecedores'], a: 1, e: 'Caça-se o que as detecções automáticas não pegaram.' },
    { q: 'Em um incidente, por que preservar evidências antes de limpar?', o: ['Não é necessário', 'Porque a limpeza pode apagar provas essenciais para investigação e para a análise da causa', 'Para acelerar a limpeza', 'Para economizar espaço'], a: 1, e: 'Sem evidências, não se entende a causa e podem voltar a explorar a mesma falha.' }
  ],
  cards: [['Fases do NIST SP 800-61?', 'Preparação; detecção e análise; contenção, erradicação e recuperação; pós-incidente.'], ['O que é MTTD?', 'Mean Time to Detect: tempo médio para detectar um incidente.'], ['Cite 4 táticas do ATT&CK.', 'Acesso inicial, persistência, movimento lateral, exfiltração (entre outras).'],
    ['O que é um exercício de mesa (tabletop)?', 'Simulação discutida em reunião para testar o plano de resposta.'], ['T1566 no ATT&CK?', 'Phishing (técnica de acesso inicial).'], ['Em quais casos comunicar à ANPD?', 'Quando o incidente puder causar risco ou dano relevante aos titulares de dados (LGPD, art. 48).']]
},
{ id: 'm16', level: 3, icon: '🧮', title: 'Criptografia avançada, TLS e PKI', mins: 26,
  intro: 'Entenda o que acontece quando você abre um site HTTPS, por que algumas implementações falham e para onde a criptografia está indo.',
  sections: [
    { h: 'Como o TLS funciona (visão geral)', p: `O TLS (sucessor do SSL) protege a conexão em três objetivos: confidencialidade, integridade e autenticação do servidor.

Em linhas gerais (TLS 1.3):
1. O cliente diz quais algoritmos suporta e envia sua parte da troca de chaves (ECDHE).
2. O servidor responde com sua parte e seu certificado, assinado por uma AC confiável, e prova que tem a chave privada.
3. Ambos calculam a mesma chave de sessão (sem que ela viaje pela rede).
4. O tráfego passa a ser cifrado com um algoritmo simétrico autenticado (AES-GCM ou ChaCha20-Poly1305).
Sigilo perfeito adiante (PFS/forward secrecy): como as chaves de sessão são efêmeras, o vazamento posterior da chave do servidor não decifra conversas passadas.` },
    { h: 'PKI e certificados', p: `Infraestrutura de chaves públicas (PKI): autoridades certificadoras (AC) raiz e intermediárias emitem certificados X.509. O navegador valida a cadeia até uma raiz confiável, o nome do domínio, a validade e se o certificado foi revogado (CRL, OCSP).

• Let's Encrypt automatiza certificados gratuitos.
• Certificate Transparency: registros públicos de certificados emitidos, que permitem detectar emissões indevidas.
• Fixação (pinning) e HSTS reduzem ataques de downgrade.
• Falhas históricas: ACs comprometidas, chaves privadas vazadas, certificados autoassinados aceitos sem verificação em apps, validações desativadas "para teste" que vão para produção.` },
    { h: 'Ataques e falhas de criptografia', p: `Conceitos (para entender defesas):
• Downgrade: forçar o uso de versões ou cifras fracas (POODLE, FREAK, Logjam). Defesa: desativar SSLv3, TLS 1.0/1.1 e cifras de exportação.
• Falhas de implementação: Heartbleed (leitura de memória no OpenSSL) mostrou que um bug de código derruba a criptografia.
• Ataques de oráculo de preenchimento (padding oracle) e canais laterais (tempo de resposta, consumo de energia) revelam informações pelo comportamento.
• Reuso de nonce/IV em modos como GCM ou CTR destrói a segurança.
• Aleatoriedade fraca (chaves previsíveis) invalida qualquer algoritmo.
• Colisões em hashes antigos (MD5, SHA-1) permitem falsificar certificados e arquivos.
Moral: usar bibliotecas maduras (libsodium, bibliotecas padrão), com configurações recomendadas, e nunca "inventar" criptografia.` },
    { h: 'Tópicos avançados', p: `• Curvas elípticas: chaves menores com a mesma segurança (Ed25519, X25519).
• Troca de chaves Diffie-Hellman: duas partes chegam a um segredo comum por um canal público.
• Assinaturas digitais e cadeias de confiança: base de atualizações de software e de blockchains.
• Criptografia pós-quântica: computadores quânticos poderosos quebrariam RSA e curvas elípticas; já existem padrões novos (ML-KEM e ML-DSA, do NIST) e implantações híbridas. A ameaça "colete agora, decifre depois" justifica migrar dados de longa duração.
• Criptografia homomórfica e provas de conhecimento zero (ZKP): computar ou provar algo sem revelar os dados.
• Gerenciamento de chaves (KMS, HSM): gerar, armazenar, rotacionar e revogar chaves; é onde muitos projetos falham.
• Cifragem ponta a ponta (E2EE) de aplicativos de mensagens e o protocolo Signal (ratcheting).` },
    { h: 'Práticas para desenvolvedores e administradores', p: `• Use TLS 1.2+ (de preferência 1.3), certificados válidos, HSTS e renovação automática.
• Teste a configuração com ferramentas como SSL Labs e testssl.sh.
• Armazene senhas com Argon2/bcrypt; use AES-GCM com nonces únicos; derive chaves com HKDF/PBKDF2.
• Guarde chaves em um cofre (KMS, HSM, variáveis seguras), nunca no código.
• Planeje a rotação de chaves e a agilidade criptográfica: poder trocar algoritmos sem reescrever o sistema.
• Registre e monitore expirações de certificados: muitos incidentes são apenas um certificado vencido.` }
  ],
  terms: [['TLS', 'Protocolo que protege conexões (sucessor do SSL).'], ['PKI', 'Infraestrutura de chaves públicas: ACs, certificados, validação.'], ['PFS', 'Sigilo perfeito adiante: chaves efêmeras que protegem conversas passadas.'], ['Diffie-Hellman', 'Método para dois lados chegarem a um segredo comum por um canal público.'], ['Nonce / IV', 'Valor único usado uma vez por operação de cifragem.'], ['HSM / KMS', 'Hardware / serviço para guardar e usar chaves com segurança.'], ['Pós-quântica', 'Algoritmos projetados para resistir a computadores quânticos.']],
  practice: ['Abra o certificado de um site HTTPS no navegador e liste emissor, validade e algoritmo.', 'Teste o domínio de um site seu (ou de um público) no SSL Labs e leia o que foi apontado.', 'Pesquise o que foi o Heartbleed e explique por que um bug de código quebrou a criptografia.'],
  quiz: [
    { q: 'O que o sigilo perfeito adiante (PFS) garante?', o: ['Que o certificado nunca expira', 'Que o vazamento futuro da chave do servidor não decifra conversas passadas', 'Que o site é honesto', 'Que não há logs'], a: 1, e: 'Chaves de sessão efêmeras impedem a decifragem retroativa.' },
