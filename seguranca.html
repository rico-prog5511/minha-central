{ id: 'm17', level: 3, icon: '⚙️', title: 'Engenharia reversa e exploração (conceitos)', mins: 26,
  intro: 'Como um software vira uma falha explorável? Um panorama conceitual — para quem quer defender, analisar e, mais tarde, aprofundar em CTFs.',
  sections: [
    { h: 'Como um programa roda', p: `Um programa compilado vira instruções de máquina. Em execução, cada processo tem regiões de memória:
• Código (instruções).
• Pilha (stack): variáveis locais e endereços de retorno das funções.
• Heap: memória dinâmica alocada em tempo de execução.
• Dados globais.
Processadores têm registradores (como o ponteiro de instrução, que diz qual instrução executar). Entender isso é a base para a engenharia reversa e para compreender falhas de memória.` },
    { h: 'Engenharia reversa', p: `É analisar um programa sem o código-fonte para entender o que faz. Ferramentas: Ghidra (gratuita), IDA, radare2/Cutter, x64dbg/gdb (depuradores), strings, objdump.

Fluxo comum:
1. Identificar o tipo de arquivo (PE, ELF), arquitetura e proteções.
2. Listar strings e funções importadas (pistas do que ele faz).
3. Decompilar e ler a lógica (função principal, validações).
4. Depurar: executar passo a passo, definir pontos de parada e observar valores.
Usos legítimos: analisar malware, auditar software de terceiros com permissão, pesquisar vulnerabilidades, CTFs (categoria "reversing"), interoperabilidade. Verifique licenças e leis locais antes de analisar software comercial.` },
    { h: 'Falhas de memória (conceito)', p: `Em linguagens como C e C++ o programador gerencia a memória. Erros típicos:
• Buffer overflow: escrever além do tamanho de uma área reservada, sobrescrevendo dados vizinhos (na pilha, pode alterar o endereço de retorno e desviar a execução).
• Use-after-free: usar memória já liberada.
• Format string: entrada do usuário usada como formato de impressão.
• Integer overflow: números que "dão a volta" e geram tamanhos errados.
Consequências: travamentos, vazamento de memória, execução de código arbitrário.
Estes conceitos explicam a maior parte das vulnerabilidades críticas históricas em software de baixo nível.` },
    { h: 'Mitigações modernas', p: `Sistemas e compiladores trazem proteções em camadas:
• Stack canaries: valores de checagem antes do endereço de retorno.
• DEP/NX: regiões de dados não são executáveis.
• ASLR: endereços de memória são randomizados em cada execução.
• PIE e RELRO: executáveis relocáveis e proteção de tabelas.
• CFI e isolamento (sandbox): restringem o fluxo e o alcance do processo.
Técnicas de bypass (como ROP) existem, por isso mitigações reduzem a chance de exploração, mas não substituem corrigir a falha. A solução de longo prazo é usar linguagens com segurança de memória (Rust, Go, Java, C#) e boas práticas.` },
    { h: 'Defender: desenvolvimento seguro', p: `• Linguagens seguras para código novo; em C/C++: verificar tamanhos, usar funções seguras, ferramentas como AddressSanitizer.
• Fuzzing: gerar muitas entradas aleatórias/mutadas para achar travamentos (AFL++, libFuzzer).
• Análise estática (SAST) e revisão de código.
• Divulgação responsável de vulnerabilidades: contatar o fabricante, dar prazo razoável e publicar depois da correção; CVE para registro.
• Pratique com desafios legais: crackmes, pwn.college, OverTheWire (Narnia, Behemoth), picoCTF, exercícios de reversing do HTB.
Se for estudar em profundidade, aprenda C, assembly básico (x86-64) e depuração antes das técnicas avançadas.` }
  ],
  terms: [['Pilha (stack)', 'Região de memória de variáveis locais e endereços de retorno.'], ['Heap', 'Memória alocada dinamicamente.'], ['Buffer overflow', 'Escrita além do limite de uma área de memória.'], ['ASLR', 'Randomização do layout de memória a cada execução.'], ['DEP / NX', 'Marcação de memória de dados como não executável.'], ['Fuzzing', 'Teste que gera entradas inesperadas para achar falhas.'], ['Decompilador', 'Ferramenta que reconstrói código de alto nível a partir do binário.']],
  practice: ['Instale o Ghidra, abra um programa seu simples (compilado de um "olá mundo") e localize a função principal e a string.', 'Resolva um nível de reversing fácil no picoCTF e registre o write-up.', 'Explique com suas palavras por que ASLR e DEP não corrigem a falha, só tornam a exploração mais difícil.'],
  quiz: [
    { q: 'Buffer overflow é...', o: ['Falta de memória RAM', 'Escrever além do limite de uma área reservada, afetando memória vizinha', 'Um erro de rede', 'Um tipo de vírus'], a: 1, e: 'Pode corromper dados, travar o programa ou desviar a execução.' },
    { q: 'O que o ASLR faz?', o: ['Criptografa o código', 'Randomiza os endereços de memória a cada execução', 'Bloqueia a rede', 'Remove senhas'], a: 1, e: 'Dificulta que o atacante saiba onde estão os dados e funções.' },
    { q: 'Qual abordagem de longo prazo reduz falhas de memória?', o: ['Usar mais antivírus', 'Usar linguagens com segurança de memória (Rust, Go, Java...)', 'Esconder o código-fonte', 'Reiniciar o servidor'], a: 1, e: 'Elimina classes inteiras de vulnerabilidades por design.' },
    { q: 'Fuzzing consiste em...', o: ['Ler o código linha a linha', 'Enviar muitas entradas inesperadas para achar travamentos e falhas', 'Compactar arquivos', 'Auditar licenças'], a: 1, e: 'É uma técnica automatizada muito eficaz para achar bugs.' },
    { q: 'Ao encontrar uma vulnerabilidade em software de terceiros, o procedimento ético é...', o: ['Vender para o primeiro interessado', 'Divulgação responsável ao fabricante, com prazo razoável', 'Publicar imediatamente com detalhes', 'Explorar no sistema de clientes'], a: 1, e: 'Dê ao fabricante tempo para corrigir antes de publicar os detalhes.' }
  ],
  cards: [['Onde ficam as variáveis locais e o endereço de retorno?', 'Na pilha (stack).'], ['O que é DEP/NX?', 'Regiões de dados marcadas como não executáveis.'], ['O que são stack canaries?', 'Valores de checagem que detectam sobrescrita da pilha antes do retorno da função.'],
    ['Ferramentas de engenharia reversa?', 'Ghidra, IDA, radare2/Cutter, x64dbg, gdb.'], ['O que é divulgação responsável?', 'Avisar o fabricante, dar prazo para correção e só então publicar os detalhes.'], ['O que é use-after-free?', 'Usar memória depois de liberada, o que pode levar a corrupção e execução indevida.']]
},
{ id: 'm18', level: 3, icon: '☁️', title: 'Nuvem, containers e DevSecOps', mins: 24,
  intro: 'Hoje a infraestrutura é código e roda na nuvem. A segurança precisa entrar na esteira de desenvolvimento, e não só no fim.',
  sections: [
    { h: 'Responsabilidade compartilhada', p: `Em nuvem (AWS, Azure, Google Cloud) a segurança é dividida:
• O provedor cuida "DA nuvem": datacenters, hardware, virtualização.
• Você cuida do que coloca "NA nuvem": identidades, dados, configurações, sistemas e aplicações. Quanto mais próximo de IaaS, mais é responsabilidade sua; em SaaS, menos.
A maioria dos incidentes em nuvem vem de má configuração (buckets públicos, chaves vazadas, permissões amplas demais), não de falhas do provedor.` },
    { h: 'Identidade e dados na nuvem', p: `• IAM: quem pode fazer o quê. Princípio do privilégio mínimo; evite curingas (*); use papéis (roles) temporários em vez de chaves fixas.
• MFA obrigatório para contas privilegiadas; a conta raiz não deve ser usada no dia a dia.
• Segredos (chaves de API, senhas) em cofres (Secrets Manager, Key Vault), nunca no código ou em repositórios — chaves vazadas no GitHub são encontradas por robôs em minutos.
• Armazenamento: bloqueie acesso público por padrão, criptografe dados em repouso e em trânsito.
• Registro: ative CloudTrail/Activity Logs/Audit Logs e alertas para ações sensíveis.
• Ferramentas de postura (CSPM) apontam configurações arriscadas.` },
    { h: 'Containers e Kubernetes', p: `• Imagens: use bases mínimas e oficiais, escaneie vulnerabilidades (Trivy, Grype), fixe versões e assine imagens.
• Não rode containers como root; remova privilégios (capabilities); sistema de arquivos somente leitura quando possível.
• Nunca coloque segredos dentro da imagem.
• Docker socket exposto = controle do host.
• Kubernetes: RBAC mínimo, Network Policies para limitar a comunicação, Pod Security Standards, secrets criptografados, API server não exposto publicamente, atualização frequente.
• Isolamento: containers compartilham o kernel do host; falhas de kernel ou configurações perigosas podem permitir fuga do container.` },
    { h: 'DevSecOps e a cadeia de suprimentos', p: `Integrar a segurança ao ciclo de desenvolvimento ("shift left"):
• SAST (análise estática do código), DAST (teste da aplicação rodando), SCA (dependências vulneráveis), varredura de segredos (gitleaks), IaC scanning (Terraform, CloudFormation) no pipeline CI/CD.
• SBOM: lista de componentes do software, essencial quando surge uma falha como o Log4Shell.
• Proteja o pipeline: permissões mínimas para runners, segredos protegidos, revisão obrigatória de código, assinatura de artefatos (Sigstore), travamento de dependências.
• Ataques à cadeia de suprimentos: pacotes maliciosos com nomes parecidos (typosquatting), dependências comprometidas, atualizações sequestradas (SolarWinds).` },
    { h: 'Defesa em nuvem na prática', p: `• Habilite MFA e alertas de faturamento (um custo anormal pode indicar mineração de criptomoedas por chave vazada).
• Faça revisões periódicas de permissões e de recursos expostos.
• Use infraestrutura como código com revisão e versionamento.
• Segmente redes (VPC/sub-redes), use grupos de segurança restritivos e WAF para aplicações web.
• Prepare resposta a incidentes específica para nuvem: como revogar chaves, isolar instâncias e preservar snapshots.
• Para praticar: laboratórios gratuitos (flaws.cloud, CloudGoat, Kubernetes Goat) e contas gratuitas com limites de gasto.` }
  ],
  terms: [['Responsabilidade compartilhada', 'Divisão de deveres de segurança entre provedor e cliente.'], ['IAM', 'Gestão de identidades e acessos.'], ['SBOM', 'Lista de materiais de software: componentes e versões.'], ['SAST / DAST / SCA', 'Análise estática / dinâmica / de dependências.'], ['Typosquatting', 'Pacote malicioso com nome parecido com um legítimo.'], ['CSPM', 'Gerenciamento de postura de segurança em nuvem.'], ['Shift left', 'Levar a segurança para o início do ciclo de desenvolvimento.']],
  practice: ['Crie uma conta gratuita de nuvem (com alerta de custo), ative MFA e revise as permissões do usuário padrão.', 'Rode um escaneamento com Trivy numa imagem Docker de teste e leia o relatório.', 'Procure no seu repositório (ou em um de teste) segredos esquecidos usando gitleaks.'],
  quiz: [
    { q: 'No modelo de responsabilidade compartilhada, quem cuida da configuração das permissões e dos dados do cliente?', o: ['Sempre o provedor', 'O cliente', 'O governo', 'Ninguém'], a: 1, e: 'O provedor protege a infraestrutura; o cliente protege identidades, dados e configurações.' },
    { q: 'Qual é a causa mais comum de incidentes em nuvem?', o: ['Falhas de hardware do provedor', 'Má configuração (buckets públicos, permissões excessivas, chaves vazadas)', 'Raios', 'Ataques de satélite'], a: 1, e: 'Revisões de configuração e privilégio mínimo reduzem muito o risco.' },
    { q: 'O que é SBOM?', o: ['Um tipo de firewall', 'A lista de componentes e versões de um software', 'Um backup', 'Uma ferramenta de DDoS'], a: 1, e: 'Permite saber rapidamente se você é afetado por uma nova vulnerabilidade.' },
    { q: 'Onde guardar segredos como chaves de API?', o: ['No código-fonte', 'Em um cofre de segredos (Secrets Manager, Key Vault)', 'Em um arquivo README', 'No chat da equipe'], a: 1, e: 'Segredos no código acabam vazando; robôs varrem repositórios públicos continuamente.' },
    { q: 'Rodar containers como root é...', o: ['Recomendado', 'Uma prática arriscada: use usuário sem privilégios', 'Obrigatório', 'Indiferente'], a: 1, e: 'Se o container for comprometido, o impacto é maior com root.' }
  ],
  cards: [['O que é responsabilidade compartilhada?', 'O provedor protege a nuvem; o cliente protege o que coloca nela (dados, identidades, configurações).'], ['O que é shift left?', 'Antecipar atividades de segurança para as fases iniciais do desenvolvimento.'], ['SAST x DAST?', 'SAST analisa o código; DAST testa a aplicação em execução.'],
    ['Risco de um bucket público?', 'Qualquer pessoa na internet pode ler (ou até escrever) os dados.'], ['O que é typosquatting?', 'Publicar pacotes com nome parecido com um popular para enganar desenvolvedores.'], ['Por que usar roles temporárias?', 'Evitam chaves de longa duração que podem vazar e ser usadas por tempo indefinido.']]
},
{ id: 'm19', level: 3, icon: '📱', title: 'Segurança mobile, IoT e sem fio', mins: 22,
  intro: 'Celulares, câmeras, relógios e carros conectados: cada dispositivo é um computador com seus próprios riscos.',
  sections: [
    { h: 'Segurança de aplicativos móveis', p: `Android e iOS têm sandbox por aplicativo, permissões e lojas oficiais, mas apps podem ter falhas ou ser maliciosos.
Riscos comuns (OWASP Mobile Top 10):
• Armazenamento inseguro de dados no aparelho.
• Comunicação sem TLS ou com validação de certificado desativada.
• Autenticação e autorização fracas.
• Chaves e segredos embutidos no app (qualquer um pode extrair do pacote).
• Código sem ofuscação e sem proteção contra adulteração.
• Permissões excessivas e SDKs de terceiros que coletam dados.
Defesa: armazenar o mínimo, usar o keychain/keystore do sistema, TLS correto, validar tudo no servidor, não confiar no app.` },
    { h: 'Ameaças ao seu celular', p: `• Apps falsos ou piratas e APKs de fora da loja ("sideload").
• Smishing e golpes por WhatsApp (clonagem de conta, "novo número").
• SIM swap: o criminoso transfere seu número para outro chip e recebe seus SMS e códigos. Defesa: 2FA por app em vez de SMS, PIN na operadora.
• Spyware/stalkerware comercial; spyware sofisticado e sem clique usado contra alvos específicos (jornalistas, ativistas).
• Wi-Fi público, carregadores públicos e Bluetooth aberto.
• Roubo físico: bloqueio forte, criptografia ativa, "encontrar dispositivo", conta do banco com proteção extra.
Hábitos: atualizações imediatas, apenas lojas oficiais, revisar permissões, ativar modo de bloqueio (Lockdown Mode no iOS) se for alvo de risco alto.` },
    { h: 'IoT: a internet das coisas', p: `Câmeras, roteadores, lâmpadas, TVs, fechaduras, babás eletrônicas: baratos, com pouca atualização e senhas padrão.
Problemas típicos: credenciais padrão, firmware sem atualização, serviços expostos na internet, comunicação sem criptografia, falta de suporte do fabricante.
Exemplo histórico: a botnet Mirai usou câmeras com senhas padrão para derrubar grandes serviços.
Defesa:
• Troque as senhas padrão; desative UPnP e serviços que você não usa.
• Isole os dispositivos IoT em uma rede de visitantes/VLAN separada.
• Mantenha firmware atualizado e descarte equipamentos sem suporte.
• Desconfie de acesso remoto "fácil" via nuvem do fabricante sem MFA.` },
    { h: 'Wi-Fi, Bluetooth, RFID e rádio', p: `• Wi-Fi: WPA3 > WPA2; ataques ao WPA2 pessoal dependem da força da senha (captura do handshake e quebra offline) — por isso senhas longas. Evil twin e deauth afetam redes abertas ou sem proteção de gerenciamento.
• Bluetooth: pareamento seguro, desligar quando não usa; falhas históricas (BlueBorne).
• NFC e RFID: cartões de acesso antigos podem ser clonados; cartões modernos (criptografados) são mais seguros. Pagamentos por aproximação usam tokens, o que limita o risco.
• Chaves de carro e portões por rádio podem sofrer replay ou relay; guarde chaves sem contato em bolsas bloqueadoras de sinal quando o risco justificar.
• Pesquisa em laboratório com rádio definido por software (SDR) exige respeito à legislação de telecomunicações (Anatel).` },
    { h: 'Boas práticas resumidas', p: `• Mantenha tudo atualizado e descarte o que não recebe mais atualizações.
• Uma rede separada para IoT e visitantes.
• Gerenciador de senhas e 2FA por app.
• Revisão trimestral de permissões e dispositivos conectados às contas.
• Backups e criptografia do aparelho ativados.
• Para estudar com segurança: use dispositivos seus, emuladores e apps propositalmente vulneráveis (DIVA, InsecureBankv2, OWASP MASTG, Damn Vulnerable IoT).` }
  ],
  terms: [['Sandbox', 'Isolamento que limita o que um app pode acessar.'], ['Keychain / Keystore', 'Armazenamento seguro de segredos do sistema operacional.'], ['SIM swap', 'Transferência fraudulenta do seu número de telefone para outro chip.'], ['IoT', 'Internet das coisas: dispositivos conectados do dia a dia.'], ['Firmware', 'Software embarcado que controla o hardware.'], ['Sideload', 'Instalar apps de fora da loja oficial.'], ['Mirai', 'Botnet de dispositivos IoT com senhas padrão.']],
  practice: ['Revise permissões de todos os apps do celular e remova as desnecessárias; ative a verificação em duas etapas do WhatsApp.', 'Liste seus dispositivos IoT, troque as senhas padrão e coloque-os na rede de visitantes.', 'Peça à operadora para colocar uma proteção/PIN contra troca de chip no seu número.'],
  quiz: [
    { q: 'O que é SIM swap?', o: ['Trocar de celular', 'Transferir fraudulentamente seu número para outro chip para receber seus SMS', 'Atualizar o chip', 'Um tipo de antivírus'], a: 1, e: 'Por isso 2FA por app é melhor que SMS.' },
    { q: 'Por que não embutir chaves secretas no aplicativo?', o: ['Deixa o app pesado', 'Qualquer pessoa pode extrair do pacote do app', 'Não funciona no iOS', 'É proibido pela loja'], a: 1, e: 'Aplicativos podem ser descompilados; o segredo deve ficar no servidor.' },
    { q: 'O que a botnet Mirai explorou?', o: ['Falhas de criptografia do TLS', 'Dispositivos IoT com senhas padrão', 'Servidores de e-mail', 'Aplicativos bancários'], a: 1, e: 'Milhares de câmeras e roteadores com credenciais padrão viraram uma botnet.' },
    { q: 'Qual a melhor prática para dispositivos IoT em casa?', o: ['Deixar na rede principal', 'Colocar em rede separada e trocar senhas padrão', 'Ligar o UPnP sempre', 'Nunca atualizar'], a: 1, e: 'Se um IoT é comprometido, ele não alcança seus computadores e celulares.' },
    { q: 'Instalar APK de fora da loja oficial (sideload) é...', o: ['Mais seguro', 'Aumenta o risco de malware', 'Obrigatório', 'Irrelevante'], a: 1, e: 'Sem as verificações da loja, é mais fácil instalar um app malicioso.' }
  ],
  cards: [['O que é sandbox de app?', 'Isolamento que limita acesso do app a dados e recursos do sistema.'], ['Melhor alternativa ao SMS para 2FA?', 'App autenticador ou chave FIDO2.'], ['Por que isolar IoT em outra rede?', 'Para que o comprometimento de um dispositivo fraco não alcance seus dispositivos importantes.'],
    ['O que é OWASP MASTG?', 'Guia de testes de segurança móvel da OWASP.'], ['Risco de armazenar dados em texto no aparelho?', 'Outro app, malware ou quem tenha o aparelho pode ler; use keychain/keystore e criptografia.'], ['O que é uma babá eletrônica insegura?', 'Câmera IoT com senha padrão que pode ser vista por qualquer pessoa na internet.']]
},
{ id: 'm20', level: 3, icon: '🏛️', title: 'Governança, conformidade e carreira', mins: 22,
  intro: 'Tecnologia sozinha não basta: pessoas, políticas e processos sustentam a segurança. Esta aula fecha a trilha com o lado organizacional e os caminhos de carreira.',
  sections: [
    { h: 'Governança, políticas e cultura', p: `Governança de segurança define quem decide e quem responde. Elementos:
• Política de segurança da informação (documento aprovado pela direção).
• Normas, procedimentos e padrões que detalham como cumprir a política.
• Papéis: CISO (diretor de segurança), encarregado de dados (DPO, na LGPD), responsáveis por ativos.
• Conscientização e treinamento contínuos (simulações de phishing, campanhas).
• Gestão de acessos (joiner-mover-leaver): conceder, ajustar e revogar acessos na entrada, mudança e saída de pessoas.
• Gestão de fornecedores: terceiros são parte da superfície de ataque.
• Métricas e indicadores para a diretoria.` },
    { h: 'Normas e frameworks', p: `• ISO/IEC 27001: requisitos de um sistema de gestão de segurança (SGSI), certificável. 27002: catálogo de controles. 27701: privacidade.
• NIST CSF e NIST SP 800-53: estrutura e catálogo de controles.
• CIS Controls: controles priorizados e práticos.
• PCI DSS: obrigatória para quem processa cartões.
• SOC 2: relatório de auditoria sobre controles de serviços.
• LGPD: base legal, direitos dos titulares, DPO, relatório de impacto (RIPD), comunicação de incidentes, sanções da ANPD.
• Outros: GDPR (União Europeia), Resoluções do Banco Central e da CVM para o setor financeiro, Marco Civil da Internet e Lei 12.737/2012.` },
    { h: 'Auditoria, continuidade e privacidade', p: `• Auditorias avaliam se os controles existem e funcionam; achados geram planos de ação.
• Continuidade de negócios (BCP) e recuperação de desastres (DRP): definem RTO (tempo máximo para voltar) e RPO (quantidade máxima de dados que se aceita perder).
• Análise de impacto no negócio (BIA).
• Privacidade desde a concepção (privacy by design): proteger dados desde o projeto do sistema.
• Mapeamento de dados (inventário), registro das operações de tratamento, bases legais, retenção e descarte.` },
    { h: 'Carreiras em segurança', p: `Há muitos caminhos, não só "hacker":
• Defensivos: analista de SOC, resposta a incidentes, forense, engenharia de detecção, caça a ameaças.
• Ofensivos: pentester, red team, pesquisador de vulnerabilidades, analista de bug bounty.
• Engenharia: segurança de aplicações (AppSec), DevSecOps, segurança em nuvem, criptografia.
• Governança: GRC (governança, risco e conformidade), auditoria, privacidade/DPO, CISO.
Base comum: redes, sistemas operacionais, programação e escrita clara. Um perfil em forma de "T" (largo em geral, profundo em uma área) funciona bem.` },
    { h: 'Plano de estudos e certificações', p: `Certificações não substituem prática, mas abrem portas:
• Entrada: CompTIA Security+, ISC2 CC, Google Cybersecurity Certificate.
• Redes/sistemas: CompTIA Network+/Linux+, CCNA, LPIC-1.
• Ofensiva: eJPT, PNPT, CEH, OSCP (muito respeitada, prática).
• Defesa: CompTIA CySA+, BTL1, GCIH, GCIA.
• Gestão: CISSP, CISM, ISO 27001 Lead Implementer/Auditor, CRISC.
• Nuvem: AWS/Azure/GCP Security Specialty, CCSP.
Estratégia: monte um laboratório, resolva CTFs, escreva write-ups e publique estudos (blog, GitHub), contribua com projetos abertos e participe de comunidades (Roadsec, BSides, grupos locais, OWASP chapters). Acompanhe notícias e relatórios (CERT.br, CISA, relatórios Verizon DBIR).
Use a seção "Carreira e certificações" da Biblioteca para comparar caminhos.` }
  ],
  terms: [['Governança', 'Estrutura de decisão e responsabilidade sobre segurança.'], ['SGSI', 'Sistema de gestão de segurança da informação (ISO 27001).'], ['DPO', 'Encarregado pelo tratamento de dados pessoais (LGPD).'], ['RTO / RPO', 'Tempo máximo para recuperar / quantidade máxima de dados que se aceita perder.'], ['BCP / DRP', 'Plano de continuidade de negócios / de recuperação de desastres.'], ['GRC', 'Governança, risco e conformidade.'], ['Privacy by design', 'Privacidade incorporada desde o projeto.']],
  practice: ['Escreva uma política de uso aceitável de uma página para uma empresa fictícia de 10 pessoas.', 'Defina RTO e RPO para três sistemas fictícios (e-mail, site de vendas, folha de pagamento) e justifique.', 'Monte seu plano de 6 meses: laboratório, trilhas, 1 certificação e 10 CTFs, no Caderno do app.'],

{ id: 'm21', level: 1, icon: '💬', title: 'WhatsApp e redes sociais: golpes e proteção', mins: 18,
  intro: 'É onde a maior parte dos golpes brasileiros acontece hoje. Aprenda como as contas são clonadas, quais mensagens são armadilhas e como deixar o aplicativo bem configurado.',
  sections: [
    { h: 'Por que mensageiros e redes sociais são alvo', p: `Eles reúnem três coisas que os golpistas adoram: milhões de pessoas, confiança entre conhecidos e pressa. Uma mensagem "da sua mãe" ou "do seu chefe" pede muito menos desconfiança do que um e-mail de uma empresa.

Além disso, uma conta sequestrada vira uma máquina de golpes: o criminoso usa o seu nome e a sua lista de contatos para enganar quem confia em você. Proteger a própria conta é também proteger quem está na sua agenda.` },
    { h: 'Golpes clássicos', p: `• Clonagem por código: o golpista tenta cadastrar o seu número em outro aparelho; o WhatsApp envia um código de 6 dígitos por SMS e ele pede esse código a você com uma desculpa ("mandei por engano", "sou do suporte", "é para confirmar sua entrega").
• "Troquei de número": alguém se passa por parente e pede dinheiro urgente por Pix.
• Falso suporte e falsas vendas: anúncio ou perfil que leva a um chat fora da plataforma, com pedido de pagamento adiantado.
• Links de "quem viu seu perfil", "fotos vazadas" e brindes: levam a páginas falsas ou instalam aplicativos maliciosos.
• Sequestro de contas de Instagram/Facebook por phishing ou por senha vazada, usado para divulgar investimentos falsos.
• Sextorsão: chantagem com fotos íntimas, reais ou geradas por IA. A regra é não pagar, guardar provas e denunciar.
• Grupos de "investimento": o grupo parece cheio de pessoas lucrando, mas quase todos são perfis do golpista.` },
    { h: 'Configurações que protegem de verdade', p: `No WhatsApp (e em apps parecidos):
• Ative a verificação em duas etapas (um PIN de 6 dígitos só seu) e cadastre um e-mail de recuperação. Assim, mesmo que alguém consiga o código SMS, ele não toma a conta.
• Em Privacidade, limite quem vê foto, recado e "visto por último" e quem pode adicionar você a grupos (use "Meus contatos").
• Em Aparelhos conectados, revise de vez em quando e desconecte o que não reconhece (o WhatsApp Web aberto em computador público é um clássico).
• Ative bloqueio por biometria e o backup com criptografia de ponta a ponta.
• Desconfie de "pedidos de código" de qualquer natureza: o código do WhatsApp é a chave da sua conta.
• Use mensagens temporárias para assuntos delicados e evite compartilhar documentos e fotos de cartões.

Nas redes sociais: senha única, 2FA por app ou chave, e-mail de recuperação seguro e perfil com revisão de aplicativos conectados.` },
    { h: 'Perfis falsos, correntes e conteúdo', p: `• Perfis falsos copiam fotos reais para pedir dinheiro, vender produtos ou aplicar golpes de relacionamento. Sinais: conta nova, poucos seguidores reais, urgência, pressão para sair da plataforma.
• Correntes e "alertas" costumam ser desinformação ou isca de cliques. Antes de repassar, procure a notícia em fontes confiáveis ou em agências de checagem.
• Pense no que você publica: rotina, localização em tempo real, fotos da casa, documentos e crianças. Isso alimenta golpes sob medida (OSINT).
• Fotos e vídeos podem ser usados para criar deepfakes. Perfis fechados e menos exposição reduzem o risco.` },
    { h: 'Se sua conta foi invadida ou clonada', p: `1. Avise amigos e familiares por outro canal para não responderem pedidos de dinheiro.
2. Tente recuperar a conta pelo aplicativo oficial (reinstalar e pedir novo código). Não compartilhe o código com ninguém.
3. Ative a verificação em duas etapas assim que recuperar.
4. Troque a senha do e-mail e das redes ligadas àquele número.
5. Revise aparelhos conectados e sessões abertas.
6. Registre um boletim de ocorrência e denuncie o perfil/golpe na plataforma.
7. Se o número foi roubado (SIM swap), fale com a operadora.
Veja também o playbook "Meu WhatsApp foi clonado/sequestrado" na Biblioteca.` }
  ],
  terms: [['Clonagem de WhatsApp', 'Golpe em que o criminoso toma a conta ao obter o código de verificação da vítima.'], ['Verificação em duas etapas (WhatsApp)', 'PIN extra, só seu, pedido ao registrar o número em um aparelho.'], ['Aparelhos conectados', 'Lista de sessões (WhatsApp Web, desktop) ligadas à sua conta.'], ['Perfil falso (fake)', 'Conta que imita uma pessoa ou empresa para enganar.'], ['Sextorsão', 'Chantagem com fotos ou vídeos íntimos, verdadeiros ou falsos.'], ['Mensagem temporária', 'Mensagem que se apaga sozinha após um tempo definido.'], ['Engenharia social por mensageiro', 'Manipulação de confiança usando conversa e conhecidos.']],
  practice: ['Abra o WhatsApp > Configurações > Conta e ative a verificação em duas etapas com e-mail de recuperação.', 'Revise "Aparelhos conectados" e desconecte qualquer sessão que você não reconheça.', 'Combine com a família uma palavra de segurança para pedidos de dinheiro e teste: peça que alguém "se passe" por você e veja se a regra funciona.'],
  quiz: [
    { q: 'Alguém diz que enviou o código do WhatsApp para o seu número "por engano" e pede que você o repasse. O que fazer?', o: ['Passar o código, é só um favor', 'Não passar: é a tentativa de clonar sua conta', 'Passar só metade', 'Responder com seu CPF'], a: 1, e: 'O código é a chave da sua conta. Quem pede está tentando cadastrá-la em outro aparelho.' },
    { q: 'Qual configuração impede que o golpista assuma a conta mesmo tendo o código SMS?', o: ['Foto de perfil oculta', 'Verificação em duas etapas com PIN', 'Mensagens temporárias', 'Modo escuro'], a: 1, e: 'O PIN da verificação em duas etapas é pedido além do SMS.' },
    { q: 'Recebeu "mãe, troquei de número, faz um Pix?" O melhor passo é...', o: ['Fazer o Pix e perguntar depois', 'Ligar para o número antigo ou usar a palavra de segurança combinada', 'Mandar o dinheiro em dois Pix menores', 'Encaminhar a mensagem a todos'], a: 1, e: 'Confirmar por outro canal desmonta o golpe do falso parente.' },
    { q: 'Sobre extorsão com fotos íntimas (sextorsão), o mais correto é...', o: ['Pagar uma vez para acabar', 'Não pagar, guardar as provas e denunciar', 'Apagar tudo e fingir que não aconteceu', 'Negociar o valor'], a: 1, e: 'Pagar costuma levar a novas cobranças. Provas e denúncia protegem você.' },
    { q: 'Por que revisar "Aparelhos conectados"?', o: ['Para economizar bateria', 'Para encontrar sessões que você esqueceu ou que não reconhece', 'Para aumentar o limite de grupos', 'Para liberar espaço'], a: 1, e: 'Um WhatsApp Web esquecido em outro computador dá acesso às suas conversas.' }
  ],
  cards: [['Como funciona a clonagem de WhatsApp?', 'O golpista pede o código de 6 dígitos enviado por SMS e o usa para registrar o seu número em outro aparelho.'], ['Qual a melhor proteção contra clonagem?', 'Ativar a verificação em duas etapas (PIN) e nunca informar códigos a ninguém.'], ['O que fazer ao receber pedido de dinheiro de "parente"?', 'Confirmar por ligação ou palavra de segurança antes de qualquer Pix.'],
    ['Como reduzir golpes por grupos?', 'Configurar "quem pode me adicionar a grupos" para Meus contatos.'], ['O que fazer se a conta foi clonada?', 'Avisar contatos, recuperar a conta, ativar 2FA, trocar senhas, registrar BO e denunciar.'], ['O que é sextorsão?', 'Chantagem com imagens íntimas; não pague, guarde provas e denuncie.']]
},
{ id: 'm22', level: 1, icon: '💸', title: 'Golpes financeiros: Pix, boleto, cartão e investimentos', mins: 20,
  intro: 'Dinheiro é o objetivo da maioria dos criminosos. Conheça os golpes mais comuns no Brasil e as defesas que realmente funcionam.',
  sections: [
    { h: 'Pix: velocidade que ajuda o golpista', p: `O Pix é instantâneo e irreversível por vontade própria, e é justamente isso que os golpistas exploram.

Golpes comuns:
• Falso parente ou falso vendedor pedindo Pix urgente.
• QR Code ou chave trocada em cobranças e panfletos.
• "Pix errado, devolva": alguém deposita um valor na sua conta e pede devolução, mas o depósito veio de fraude ou de uma conta invadida.
• Falsa central do banco que manda "testar" ou "estornar" um Pix para proteger a conta.
• Sequestro relâmpago e coação: o criminoso obriga a vítima a transferir.

Defesas: limite de valor por transação e por período (e menor à noite), alerta de transações, conferir nome do recebedor antes de confirmar, e usar o recurso de bloqueio do app. Em caso de fraude, acione o banco na hora: existe o Mecanismo Especial de Devolução (MED), que tenta bloquear e devolver valores em fraudes e falhas operacionais, mas depende de rapidez e de haver saldo na conta do golpista.` },
    { h: 'Boletos, cartão e compras online', p: `• Boleto adulterado: o código de barras leva o dinheiro a outra conta. Antes de pagar, confira o beneficiário (nome e CNPJ) mostrado no app do banco.
• Boleto "atualizado" enviado por WhatsApp ou e-mail inesperado deve ser confirmado com a empresa por canal oficial.
• Maquininha trocada ou adulterada e "cobrança na entrega com máquina própria" são variações de golpe.
• Cartão: use cartão virtual de uso único ou número temporário para compras online, ative notificações e o bloqueio temporário no app.
• Golpe do motoboy: ligação dizendo que o cartão foi clonado e que um motoboy vai buscá-lo. Nenhum banco recolhe cartões em casa.
• Sites de compras com preço muito abaixo do mercado, sem CNPJ claro e que só aceitam Pix: desconfie. Pesquise o nome em sites de reclamação e confira o domínio.` },
    { h: 'Investimentos e promessas milagrosas', p: `Sinais de golpe de investimento:
• Retorno garantido e alto ("ganhe 5% ao dia", "dobre seu dinheiro em um mês").
• Pressão para decidir rápido e para trazer outras pessoas (pirâmide financeira).
• Influenciadores, celebridades e depoimentos (muitas vezes deepfakes) e grupos com "alunos" lucrando.
• Plataformas de "trade" e criptoativos sem registro, que mostram lucros falsos na tela e dificultam o saque ("pague uma taxa para sacar").
• Cursos que prometem renda fácil.

Antes de investir: verifique se a empresa e o produto são autorizados na CVM ou no Banco Central, desconfie de rendimento muito acima do mercado e nunca envie dinheiro para pessoas físicas. Quem garante lucro sem risco está mentindo.` },
    { h: 'Empréstimos, consignado e golpes contra idosos', p: `• Falso empréstimo com pagamento adiantado: o "banco" pede um depósito (taxa, seguro, IOF) para liberar um crédito que nunca vem.
• Consignado e portabilidade: ligações oferecendo "liberar" um valor, ou pedindo dados do benefício. Aposentados e pensionistas são alvos frequentes.
• Falsa renegociação de dívidas (limpa nome) com taxa antecipada.
• Mensagens do "INSS" ou de "órgãos" com links para atualizar cadastro ou liberar valores.

Dicas: consulte seus próprios dados e relações bancárias pelos canais oficiais (como o Registrato, do Banco Central, e os aplicativos Meu INSS e Gov.br), acompanhe extratos e combine com a família uma regra: nenhum empréstimo ou Pix grande sem conversar antes.` },
    { h: 'O que fazer se caiu em um golpe', p: `1. Ligue imediatamente para o banco pelo número oficial (verso do cartão ou app) e peça bloqueio e acionamento do MED, se for Pix.
2. Reúna provas: prints de conversas, comprovantes, perfis, anúncio, número do telefone e dados do recebedor.
3. Troque senhas e revise os dispositivos conectados ao app do banco.
4. Registre um boletim de ocorrência (muitas delegacias aceitam online).
5. Conteste a transação por escrito e guarde os protocolos.
6. Denuncie na plataforma onde o golpe aconteceu e, se for o caso, procure o Procon ou o Banco Central.
Quanto antes agir, maiores as chances de recuperar parte do valor. Veja os playbooks na Biblioteca.` }
  ],
  terms: [['MED', 'Mecanismo Especial de Devolução do Pix: procedimento para tentar bloquear e devolver valores em fraudes.'], ['Boleto adulterado', 'Boleto com código de barras alterado para desviar o pagamento.'], ['Cartão virtual', 'Número de cartão temporário ou de uso único para compras online.'], ['Pirâmide financeira', 'Esquema que paga os primeiros investidores com o dinheiro dos novos, até quebrar.'], ['Golpe do motoboy', 'Falsa ligação do banco dizendo que o cartão foi clonado e será "recolhido" por um motoboy.'], ['CVM', 'Comissão de Valores Mobiliários, que regula e fiscaliza o mercado de capitais.'], ['Registrato', 'Serviço do Banco Central para consultar suas relações com instituições financeiras.']],
  practice: ['Abra o app do seu banco e configure limites de Pix (diurno e noturno) compatíveis com a sua rotina.', 'Faça uma busca por "reclame aqui" + nome de uma loja online desconhecida e analise como o site se comporta (sem comprar).', 'Peça a alguém da família que leia em voz alta um anúncio de "investimento" e marque todos os sinais de alerta.'],
  quiz: [
    { q: 'Qual atitude é mais segura antes de pagar um boleto recebido por WhatsApp?', o: ['Pagar logo para evitar multa', 'Conferir o beneficiário no app do banco e confirmar com a empresa por canal oficial', 'Pagar só metade', 'Pedir ao remetente que mande de novo'], a: 1, e: 'Boletos adulterados desviam o dinheiro: o beneficiário mostrado no app deve ser o da empresa.' },
    { q: 'O "golpe do motoboy" consiste em...', o: ['Entregar compras erradas', 'Convencer a vítima de que o cartão foi clonado e será recolhido em casa', 'Roubar a moto da vítima', 'Cobrar uma taxa de entrega'], a: 1, e: 'Nenhum banco recolhe cartões ou pede senha para "cancelar" o cartão por telefone.' },
    { q: 'O que o MED do Pix faz?', o: ['Impede qualquer Pix à noite', 'Tenta bloquear e devolver valores em fraudes, mas depende de rapidez e saldo', 'Criptografa o Pix', 'Cobra tarifa de golpistas'], a: 1, e: 'Agir rápido com o banco é decisivo.' },
    { q: 'Qual é um sinal claro de golpe de investimento?', o: ['Informações sobre risco e registro na CVM', 'Retorno alto garantido com urgência e pressão para indicar amigos', 'Contrato escrito', 'Explicação de como o produto funciona'], a: 1, e: 'Lucro garantido e pirâmide de indicações são marcas de fraude.' },
    { q: 'Um "banco" pede um depósito antecipado para liberar um empréstimo. Isso é...', o: ['Normal em qualquer empréstimo', 'Um sinal clássico de golpe', 'Uma exigência do Banco Central', 'Uma forma de proteção do cliente'], a: 1, e: 'Instituições sérias descontam taxas do valor liberado ou do contrato, não pedem Pix antes.' }
  ],
  cards: [['Como se proteger de Pix indevido?', 'Definir limites (menores à noite), ativar alertas e conferir o nome do recebedor.'], ['O que fazer ao notar uma fraude de Pix?', 'Ligar ao banco pelo canal oficial na hora, pedir o MED, registrar BO e guardar provas.'], ['Como confirmar um boleto?', 'Ver o beneficiário (nome e CNPJ) no app do banco e checar com a empresa.'],
    ['Quais sinais indicam pirâmide ou golpe de investimento?', 'Retorno garantido e alto, urgência, pedido de indicação, plataforma sem registro.'], ['Para que serve o cartão virtual?', 'Reduzir o risco em compras online: o número é temporário ou de uso único.'], ['Onde consultar suas relações com bancos?', 'No Registrato, do Banco Central.']]
},
{ id: 'm23', level: 1, icon: '🌍', title: 'Navegador, e-mail e downloads seguros', mins: 17,
  intro: 'O navegador e o e-mail são as portas de entrada do dia a dia. Ajustes simples e alguns hábitos bloqueiam a maior parte dos problemas.',
  sections: [
    { h: 'Navegador: o que ajustar', p: `• Mantenha o navegador e o sistema atualizados: muitas invasões usam falhas já corrigidas.
• Instale poucas extensões, só de desenvolvedores conhecidos, e revise as permissões: uma extensão pode ler tudo o que você acessa.
• Use o bloqueio de anúncios e rastreadores e a Navegação Segura (alertas de sites perigosos).
• Cuidado com notificações de sites: sites maliciosos pedem para "enviar notificações" e depois mandam propaganda enganosa.
• Permissões de câmera, microfone e localização devem ser concedidas só quando fizer sentido.
• O modo anônimo não torna você invisível: ele apenas não guarda histórico neste aparelho. Provedor, trabalho e sites ainda veem o acesso.
• Salvar senhas no próprio navegador é melhor do que repeti-las, mas um gerenciador dedicado com senha-mestra é o ideal.` },
    { h: 'E-mail: spam, anexos e remetente falso', p: `• O nome de exibição pode ser qualquer coisa: veja o endereço completo e o domínio. O campo "Responder para" também pode ser diferente do remetente.
• Anexos perigosos: .exe, .scr, .js, .iso, .zip protegidos por senha enviada no próprio e-mail, documentos pedindo "habilitar macros".
• Links: passe o mouse para ver o endereço verdadeiro. Encurtadores escondem o destino.
• Não responda a spam nem clique em "cancelar inscrição" de remetentes desconhecidos.
• Use um e-mail de recuperação separado e protegido por 2FA. Considere aliases diferentes para cadastros (um para compras, outro para redes).
• Se o provedor sinalizar "mensagem suspeita", respeite o aviso.` },
    { h: 'Downloads e instalação de programas', p: `• Baixe só do site oficial do fabricante ou das lojas oficiais. Anúncios patrocinados em buscadores às vezes levam a sites falsos de programas conhecidos.
• Evite cracks, geradores de chave e programas "milagrosos": são das principais fontes de malware.
• Ao instalar, escolha a opção personalizada e desmarque programas extras que vêm junto.
• Confira o hash (SHA-256) publicado pelo site com o do arquivo baixado: o Laboratório > Hashes calcula o hash de um arquivo.
• Ao abrir o instalador, veja o editor/assinatura digital: "Fabricante desconhecido" merece atenção.
• Mantenha o antivírus ativo e use a análise em serviços como o VirusTotal (sem enviar arquivos privados).
• Aplicativos portáteis e "versões modificadas" de jogos são um caminho comum de ladrões de senhas.` },
    { h: 'Sites, certificados e endereços parecidos', p: `• O cadeado indica conexão criptografada, não honestidade. Golpistas também têm cadeado.
• Leia o domínio da direita para a esquerda até o primeiro "/": bancohorizonte.com.br é diferente de bancohorizonte.com.br.verifica.example.
• Domínios parecidos (typosquatting): letras trocadas, hífens, extensões diferentes (.co, .net). Domínios internacionais com caracteres parecidos (IDN/punycode) podem imitar letras.
• Desconfie de páginas para as quais você chegou por link recebido; digite o endereço ou use o app.
• QR Codes: confira o endereço antes de abrir e desconfie de QR colado sobre outro.
• Treine em Treino > Links e na seção "Isto é golpe?".` },
    { h: 'Pagamentos e dados em sites', p: `• Use cartão virtual e, se possível, carteiras digitais que não expõem o número do cartão.
• Prefira o fluxo de autenticação do banco (3D Secure) e ative notificações.
• Evite salvar o cartão em sites que você mal conhece.
• Preencha só os dados necessários: CPF, data de nascimento e telefone em excesso aumentam o risco de golpes personalizados.
• Leia políticas de privacidade de apps e cadastros que pedem dados sensíveis (LGPD).
• Ao terminar em computador público, saia das contas, feche o navegador e não deixe a senha salva.` }
  ],

{ id: 'm24', level: 1, icon: '💾', title: 'Backup, atualizações e recuperação pessoal', mins: 16,
  intro: 'O backup é o seguro contra quase tudo: ransomware, roubo, falha de disco e erro humano. Aprenda a montar um que realmente funcione na hora que você precisar.',
  sections: [
    { h: 'Sincronizar não é fazer backup', p: `Serviços como Google Drive, OneDrive ou iCloud Fotos sincronizam: se você apaga ou se um vírus criptografa o arquivo, a alteração se propaga para a nuvem. Um backup verdadeiro guarda versões antigas e fica separado do dispositivo.

Causas de perda: falha de disco, roubo ou perda do aparelho, ransomware, exclusão acidental, conta bloqueada ou invadida, desastres (água, fogo). Um bom plano cobre todas.` },
    { h: 'A regra 3-2-1 (e variações)', p: `• 3 cópias dos dados (a original e duas de backup).
• 2 tipos de mídia diferentes (por exemplo, HD externo e nuvem).
• 1 cópia fora do local (nuvem ou casa de um parente).
Versões modernas acrescentam: 1 cópia offline ou imutável (que um ransomware não alcance) e 0 erros (testar a restauração para ter certeza). Resumo: 3-2-1-1-0.

Prefira backups criptografados: se o HD externo for roubado, os dados não ficam expostos. Guarde a senha do backup em lugar seguro.` },
    { h: 'Estratégias práticas', p: `• Backup completo (tudo), incremental (só o que mudou desde o último backup) e diferencial (o que mudou desde o último completo): o incremental poupa espaço, o completo facilita a restauração.
• Versionamento: guardar várias versões por dias ou semanas protege de arquivos corrompidos e de ransomware que só foi notado depois.
• Automação: backup manual é esquecido. Agende (semanal, diário) e confira notificações de erro.
• Celular: ative o backup do sistema (iCloud/Google) e exporte conversas e fotos importantes. Lembre do código de recuperação do 2FA.
• Dados de trabalho: siga a política da empresa; não misture pessoal e corporativo.
• Teste: restaure um arquivo de verdade pelo menos duas vezes por ano.` },
    { h: 'Atualizações e fim de suporte', p: `• Atualizações corrigem falhas que criminosos já conhecem. Ative as automáticas no sistema, no navegador e nos aplicativos.
• Programas e sistemas sem suporte do fabricante (fim de vida) deixam de receber correções. O suporte ao Windows 10, por exemplo, terminou em outubro de 2025 (com atualizações estendidas pagas para quem contratar). Planeje a troca ou atualização.
• Atualize também o firmware do roteador, de câmeras, TVs e outros aparelhos conectados.
• Antes de atualizações grandes, confirme que o backup está em dia.
• Desconfie de "atualizações" que aparecem em janelas de sites ou em mensagens: atualize pelo sistema.` },
    { h: 'Plano de recuperação pessoal', p: `Prepare, em um lugar seguro (offline ou gerenciador de senhas):
• Lista das contas importantes e como recuperá-las (e-mail e telefone de recuperação).
• Códigos de recuperação do 2FA impressos ou em cofre.
• Contatos de emergência (banco, operadora) e números de bloqueio de cartões e chip.
• Onde estão os backups e como restaurar.
• Herança digital: quem terá acesso se algo acontecer com você (gerenciadores de senhas e redes sociais oferecem contato herdeiro).
Revise o plano uma vez por ano. Use o Meu dia a dia para acompanhar.` }
  ],
  terms: [['Backup 3-2-1-1-0', 'Três cópias, duas mídias, uma fora do local, uma offline/imutável e zero erros verificados.'], ['Sincronização', 'Espelhar arquivos entre dispositivos; não protege contra exclusão ou ransomware.'], ['Backup incremental', 'Guarda apenas o que mudou desde o último backup.'], ['Versionamento', 'Manter versões antigas dos arquivos para recuperação.'], ['Fim de suporte (EOL)', 'Data a partir da qual o fabricante deixa de fornecer correções.'], ['Imutável', 'Cópia que não pode ser alterada ou apagada por um período.'], ['Herança digital', 'Plano para que pessoas de confiança acessem suas contas em caso de necessidade.']],
  practice: ['Monte seu 3-2-1: liste onde estão suas fotos e documentos e o que falta (mídia, local ou offline).', 'Restaure um arquivo aleatório do seu backup para provar que funciona.', 'Anote em um papel guardado em local seguro os códigos de recuperação de e-mail e banco.'],
  quiz: [
    { q: 'Por que a sincronização com a nuvem não substitui o backup?', o: ['Porque é lenta', 'Porque apagar ou criptografar um arquivo propaga a mudança para a nuvem', 'Porque é paga', 'Porque não funciona offline'], a: 1, e: 'Backup guarda versões antigas e fica separado do dispositivo.' },
    { q: 'O que o "1" final do 3-2-1-1-0 acrescenta?', o: ['Uma cópia offline ou imutável', 'Um segundo computador', 'Um antivírus', 'Uma senha extra'], a: 0, e: 'Uma cópia que o ransomware não alcance.' },
    { q: 'Qual a melhor forma de saber se o backup funciona?', o: ['Olhar o tamanho do arquivo', 'Restaurar arquivos de teste periodicamente', 'Confiar no ícone verde', 'Fazer mais backups sem testar'], a: 1, e: 'Backup que nunca foi restaurado é só esperança.' },
    { q: 'Sistemas sem suporte do fabricante...', o: ['Ficam mais seguros', 'Deixam de receber correções de segurança', 'Não precisam de antivírus', 'Ficam mais rápidos'], a: 1, e: 'Falhas novas não são corrigidas, o que aumenta o risco.' },
    { q: 'Backup incremental é aquele que...', o: ['Copia tudo sempre', 'Copia só o que mudou desde o último backup', 'Apaga os dados antigos', 'Só funciona na nuvem'], a: 1, e: 'Economiza espaço e tempo; a restauração usa o completo mais os incrementais.' }
  ],
  cards: [['O que significa 3-2-1?', '3 cópias, em 2 tipos de mídia, 1 fora do local.'], ['Por que criptografar backups?', 'Para que o roubo da mídia não exponha os dados.'], ['Backup completo x incremental?', 'Completo copia tudo; incremental copia só o que mudou desde o último.'],
    ['O que é versionamento?', 'Guardar várias versões de um arquivo para voltar no tempo.'], ['O que incluir no plano de recuperação pessoal?', 'Contas, códigos de recuperação, contatos de emergência, localização dos backups e herança digital.'], ['O que é fim de suporte?', 'Quando o fabricante para de fornecer atualizações de segurança.']]
},
{ id: 'm25', level: 1, icon: '👨‍👩‍👧', title: 'Segurança digital para família, crianças e idosos', mins: 18,
  intro: 'Proteger quem convive com você exige conversa, regras claras e as ferramentas certas. Este módulo reúne orientações para crianças, adolescentes e pessoas idosas.',
  sections: [
    { h: 'Conversar antes de proibir', p: `O que mais protege crianças e idosos é a confiança para contar quando algo estranho acontece, sem medo de bronca. Algumas bases:

• Combine regras simples e explique o motivo: "não aceite desconhecidos", "nunca compartilhe códigos", "me avise se algo incomodar".
• Mostre exemplos de golpes (use o Treino "Isto é golpe?" juntos).
• Defina uma palavra de segurança da família para pedidos de dinheiro ou de ajuda.
• Quem foi enganado não é "burro": golpistas são profissionais. Acolher primeiro, agir rápido depois.` },
    { h: 'Crianças e adolescentes', p: `Riscos principais: contato com estranhos (inclusive adultos que se passam por jovens), cyberbullying, golpes em jogos (venda de contas, gift cards, "skins" grátis), conteúdo impróprio, vício em telas e exposição de imagem.

Ações:
• Use controle parental e contas infantis (Google Family Link, Apple Tempo de Uso, controles do console).
• Revise com a criança as configurações de privacidade; perfis fechados e lista de amigos que ela conhece.
• Nunca compartilhar nome completo, escola, endereço, rotina, documentos ou fotos íntimas.
• Compras em jogos: bloqueie cartão salvo e exija senha.
• Sextorsão e aliciamento: ensine que, se alguém pedir fotos ou segredos, ela deve contar a um adulto; a culpa nunca é da criança.
• Mantenha dispositivos em áreas comuns e combine horários, com razoabilidade.` },
    { h: 'Pessoas idosas', p: `Golpes mais comuns: falso parente ("vó, sou eu"), falsa central do banco, consignado e "liberação" de valores, falso INSS, "motoboy" que recolhe o cartão e aplicativos de acesso remoto instalados por orientação do golpista.

Ações:
• Configure o celular: fonte maior, limites de Pix baixos, notificações de transação, bloqueio de instalação de apps desconhecidos.
• Cadastre contatos de confiança no banco, quando houver essa opção.
• Combine a regra "desligar e ligar": qualquer ligação sobre dinheiro é interrompida e retomada pelo número oficial.
• Nunca informar senhas, códigos ou instalar apps a pedido de quem liga.
• Deixe números de emergência e do banco à vista e revise os extratos juntos de vez em quando.` },
    { h: 'Dispositivos compartilhados e casa conectada', p: `• Perfis separados no computador e no celular (adulto, criança), cada um com sua senha.
• Atualizações e antivírus em dia em todos os aparelhos da família.
• TVs, assistentes de voz e câmeras: troque senhas padrão, revise microfone e câmera e use rede de visitantes.
• Localização da família: só com consentimento claro e conversa sobre o motivo.
• Cuidado com fotos de crianças em redes abertas: pense no que ficará público por anos.
• Descarte seguro: restaure o aparelho de fábrica antes de passar adiante.` },
    { h: 'Quando algo dá errado', p: `• Acolher a pessoa e não culpar.
• Guardar provas (prints, links, números) antes de apagar.
• Bloquear o contato, denunciar o perfil na plataforma e trocar senhas.
• Procurar ajuda: canais como a SaferNet Brasil (denúncias de crimes na internet), o Disque 100 (violações de direitos de crianças e idosos) e a delegacia (inclusive as especializadas em crimes cibernéticos).
• Em casos de golpes financeiros, siga o playbook "Caí em golpe do Pix" na Biblioteca.
• Se houver sofrimento emocional, procure apoio de profissionais ou de serviços como o CVV (188).` }
  ],
  terms: [['Controle parental', 'Ferramentas que limitam conteúdo, tempo de uso e compras de crianças.'], ['Aliciamento (grooming)', 'Aproximação de adultos com intenção abusiva, geralmente se passando por jovens.'], ['Cyberbullying', 'Perseguição ou humilhação de alguém pela internet.'], ['Palavra de segurança', 'Termo combinado para confirmar identidade em pedidos urgentes.'], ['SaferNet Brasil', 'Organização que recebe denúncias de crimes e violações na internet.'], ['Acesso remoto', 'Controle do aparelho à distância; golpistas pedem a instalação para roubar dados.'], ['Perfil infantil', 'Conta com restrições de idade, conteúdo e compras.']],
  practice: ['Configure em um celular de criança ou idoso da família: limites de Pix, loja de apps protegida e notificações de transação.', 'Faça com a família uma conversa de 10 minutos sobre golpes, usando duas mensagens do Treino "Isto é golpe?".', 'Crie a palavra de segurança da família e combine em quais situações ela será usada.'],
  quiz: [
    { q: 'O que mais protege crianças online?', o: ['Proibir tudo e castigar erros', 'Confiança para contar o que aconteceu e regras combinadas', 'Esconder a internet', 'Nenhum contato com ninguém, para sempre'], a: 1, e: 'Se a criança tem medo de contar, o risco aumenta.' },
    { q: 'Um golpista pede a uma pessoa idosa que instale um app "do banco" durante a ligação. O que é isso?', o: ['Um procedimento normal', 'Uma tentativa de acesso remoto para roubar dinheiro', 'Uma atualização obrigatória', 'Um sorteio'], a: 1, e: 'Nenhum banco pede instalação de aplicativos por telefone.' },
    { q: 'Qual regra ajuda muito contra ligações golpistas?', o: ['Atender e confirmar os dados', 'Desligar e ligar de volta pelo número oficial', 'Dar só os 4 primeiros dígitos do cartão', 'Pedir o nome do atendente e confiar'], a: 1, e: 'Você escolhe o canal de contato, não o golpista.' },
    { q: 'Em jogos online, golpes comuns envolvem...', o: ['Atualizações gratuitas', 'Venda de contas, gift cards e "skins" grátis', 'Backup de partidas', 'Acordos de amizade'], a: 1, e: 'Crianças são alvos de golpes de venda de itens e pedidos de cartões.' },
    { q: 'Se uma criança sofre sextorsão, o mais adequado é...', o: ['Culpá-la e proibir a internet', 'Acolher, guardar provas, bloquear e denunciar', 'Pagar para o golpista apagar', 'Ignorar'], a: 1, e: 'A culpa nunca é da vítima; denunciar e proteger vem primeiro.' }
  ],
  cards: [['O que é a palavra de segurança da família?', 'Termo combinado para confirmar pedidos de dinheiro ou ajuda urgentes.'], ['Quais ferramentas existem para controle parental?', 'Google Family Link, Apple Tempo de Uso e controles dos consoles.'], ['Como proteger idosos de golpes financeiros?', 'Limites de Pix, alertas, contatos de confiança e a regra "desligar e ligar".'],
    ['O que é aliciamento (grooming)?', 'Adulto que se aproxima de criança com intenção abusiva, muitas vezes fingindo ser jovem.'], ['Onde denunciar crimes na internet?', 'SaferNet Brasil, delegacia (inclusive cibercrimes) e as plataformas; Disque 100 para violações de direitos.'], ['O que fazer ao saber de um golpe contra familiar?', 'Acolher, guardar provas, bloquear contato, avisar banco e registrar BO.']]
},
{ id: 'm26', level: 1, icon: '🤖', title: 'IA, deepfakes e desinformação', mins: 18,
  intro: 'A inteligência artificial deixou golpes mais convincentes e baratos. Entenda o que mudou e como se proteger sem abrir mão das vantagens da tecnologia.',
  sections: [
    { h: 'O que mudou com a IA generativa', p: `Hoje é possível clonar uma voz com poucos segundos de áudio, gerar fotos e vídeos de pessoas que nunca existiram ou de pessoas reais dizendo coisas que nunca disseram (deepfakes), e escrever mensagens de phishing impecáveis, sem os erros de português que antes denunciavam o golpe.

Isso não cria golpes novos, mas aumenta a escala, a qualidade e a personalização. Por isso as defesas que funcionam são as de processo (confirmar por outro canal) e não apenas "olhar com atenção".` },
    { h: 'Golpes que usam IA', p: `• Voz clonada de um parente pedindo dinheiro ou dizendo que sofreu um acidente.
• Videochamada falsa de "executivo" mandando fazer transferências. Em um caso conhecido de 2024, uma empresa multinacional em Hong Kong perdeu cerca de 25 milhões de dólares depois de uma reunião em vídeo em que quase todos os participantes eram deepfakes.
• Anúncios com celebridades "recomendando" investimentos ou produtos (deepfake).
• Imagens íntimas falsas usadas para chantagem ou humilhação.
• Perfis falsos com fotos geradas por IA para golpes de relacionamento e vagas de emprego.
• Avaliações e comentários falsos em massa.` },
    { h: 'Como verificar', p: `• Confirme por outro canal: ligue de volta para o número que você já tinha, use a palavra de segurança, faça uma pergunta que só a pessoa saberia.
• Desconfie de urgência, segredo e pedidos de dinheiro, mesmo com voz ou rosto conhecidos.
• Sinais em vídeos e fotos (nem sempre presentes): bordas estranhas, mãos e dentes anormais, piscar e sincronia labial ruins, sombras e reflexos inconsistentes, textos distorcidos.
• Busca reversa de imagem para achar a origem de uma foto.
• Procure a notícia em mais de uma fonte e em agências de checagem.
• Padrões de procedência de conteúdo (credenciais de conteúdo, como o C2PA) começam a indicar origem e edição de mídia, mas ainda não estão em toda parte.` },
    { h: 'Usando ferramentas de IA com segurança', p: `• Não cole dados pessoais, senhas, documentos de clientes ou código confidencial em ferramentas de IA sem saber como o provedor trata os dados. Em empresas, siga a política interna.
• Modelos erram e "alucinam": confira fatos, números e referências antes de usar.
• Prompt injection: textos escondidos em páginas, arquivos ou e-mails podem tentar manipular assistentes de IA que leem esse conteúdo e executam ações. Cuidado ao dar permissões amplas (e-mail, arquivos, pagamentos) a agentes.
• Revise extensões e plugins de IA como qualquer outra extensão: eles leem o que você faz.
• Fotos e vozes que você publica podem ser usadas para treinar clones: pense na exposição.` },
    { h: 'Desinformação e pensamento crítico', p: `Desinformação funciona porque explora emoções (raiva, medo, esperança) e o viés de confirmação (acreditamos mais no que confirma o que já pensamos).

Hábitos úteis:
• Pare antes de compartilhar: quem publicou? Há fonte e data?
• Desconfie de manchetes muito emocionais e de correntes.
• Compare com veículos diferentes e com agências de checagem.
• Prints e vídeos sem contexto podem ser antigos ou de outro país.
• Se não tem como verificar, não repasse. Isso protege você e quem está na sua lista de contatos.` }
  ],
  terms: [['Deepfake', 'Mídia sintética (vídeo, voz, imagem) que imita uma pessoa real.'], ['Clonagem de voz', 'Uso de IA para imitar a voz de alguém a partir de amostras de áudio.'], ['Prompt injection', 'Instruções escondidas em conteúdo que tentam manipular um modelo de IA.'], ['Alucinação', 'Resposta de um modelo que parece correta, mas é inventada.'], ['Viés de confirmação', 'Tendência de aceitar o que confirma o que já acreditamos.'], ['Busca reversa de imagem', 'Procurar a origem de uma foto a partir da própria imagem.'], ['C2PA', 'Padrão de credenciais de conteúdo que registra origem e edições de uma mídia.']],
  practice: ['Combine com a família uma pergunta-segredo ou palavra de segurança para confirmar pedidos urgentes, e teste.', 'Pegue uma foto que circulou em redes sociais e faça uma busca reversa de imagem para achar a origem.', 'Revise quais dados você já colou em ferramentas de IA e se eram sensíveis; ajuste seus hábitos.'],
  quiz: [
    { q: 'Você recebe uma ligação com a voz do seu filho pedindo dinheiro urgente. A melhor atitude é...', o: ['Transferir imediatamente, a voz é igual', 'Desligar e ligar de volta ao número conhecido, ou usar a palavra de segurança', 'Perguntar o CPF dele pelo telefone e confiar', 'Pedir o valor em duas parcelas'], a: 1, e: 'Voz pode ser clonada; confirmar por outro canal é a defesa.' },
    { q: 'O que é prompt injection?', o: ['Um tipo de vírus de pen drive', 'Instruções escondidas em conteúdo que tentam manipular um modelo de IA', 'Um aplicativo de gravação', 'Uma extensão do navegador'], a: 1, e: 'Agentes que leem e-mails ou páginas podem ser enganados por instruções ocultas.' },
    { q: 'Por que não colar dados sensíveis em qualquer ferramenta de IA?', o: ['Porque deixa o texto mais lento', 'Porque você pode perder o controle sobre como os dados são guardados e usados', 'Porque é proibido por lei sempre', 'Porque a IA cobra por palavra'], a: 1, e: 'Verifique a política do serviço e as regras da sua empresa.' },
    { q: 'Qual hábito mais protege contra golpes com deepfake?', o: ['Confiar apenas na aparência do vídeo', 'Confirmar o pedido por outro canal, mesmo com voz e rosto conhecidos', 'Aumentar o volume', 'Responder rápido'], a: 1, e: 'Processos de verificação não dependem de achar defeitos no vídeo.' },
    { q: 'O viés de confirmação faz com que...', o: ['Todos chequem tudo', 'Acreditemos mais no que confirma o que já pensamos', 'Notícias falsas desapareçam', 'A IA fique mais precisa'], a: 1, e: 'Por isso é útil buscar fontes diferentes antes de compartilhar.' }
  ],
  cards: [['O que é deepfake?', 'Mídia sintética (vídeo, voz, imagem) que imita uma pessoa real.'], ['Como se proteger de voz clonada?', 'Desligar e ligar de volta, usar palavra de segurança e nunca decidir sob pressão.'], ['O que é prompt injection?', 'Texto escondido que tenta manipular um modelo de IA a fazer algo indevido.'],
    ['Por que conferir respostas de IA?', 'Modelos podem alucinar, ou seja, inventar fatos com aparência convincente.'], ['O que é C2PA?', 'Padrão que registra origem e edições de uma mídia (credenciais de conteúdo).'], ['Antes de compartilhar uma notícia, o que checar?', 'Quem publicou, a fonte, a data e se agências de checagem confirmam.']]
}
);
