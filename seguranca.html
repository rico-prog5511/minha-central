{ id: 'm27', level: 2, icon: '📧', title: 'Segurança de e-mail e DNS: SPF, DKIM e DMARC', mins: 26,
  intro: 'O e-mail foi criado sem verificar quem envia. SPF, DKIM e DMARC corrigiram isso em parte. Entenda como funcionam, como ler um cabeçalho e como o DNS sustenta tudo.',
  sections: [
    { h: 'Como o e-mail realmente funciona', p: `Uma mensagem passa por vários servidores (MTAs) usando o protocolo SMTP. Existem dois "remetentes":
• O remetente do envelope (MAIL FROM / Return-Path): usado entre servidores.
• O remetente visível (From): o que você vê no cliente de e-mail.
Os dois podem ser diferentes, e o campo Reply-To define para quem a resposta vai. Sem proteção, qualquer pessoa pode escrever "From: seu.banco@banco.com.br" (spoofing). SPF, DKIM e DMARC ajudam o servidor receptor a decidir se a mensagem é autêntica.` },
    { h: 'SPF: quem pode enviar por este domínio', p: `O SPF é um registro DNS do tipo TXT que lista os servidores autorizados a enviar e-mails do domínio. O servidor receptor confere o IP de origem contra essa lista.

Exemplo de registro SPF (de um domínio fictício):`, code: `exemplo.test.  TXT  "v=spf1 ip4:203.0.113.10 include:_spf.provedor.test -all"

# v=spf1      versão
# ip4:...     IP autorizado
# include:... autoriza também os servidores do provedor
# -all        qualquer outro deve FALHAR (~all = falha suave)` },
    { h: 'DKIM: assinatura digital da mensagem', p: `No DKIM, o servidor emissor assina partes da mensagem (cabeçalhos e corpo) com uma chave privada. A chave pública fica no DNS, em um registro TXT no nome seletor._domainkey.dominio. O receptor valida a assinatura: se passar, a mensagem veio de quem controla a chave e não foi alterada no caminho.

O cabeçalho DKIM-Signature indica o domínio (d=) e o seletor (s=).` , code: `DKIM-Signature: v=1; a=rsa-sha256; d=exemplo.test; s=2025a;
  h=from:to:subject:date; bh=...; b=...

# Chave pública no DNS:
2025a._domainkey.exemplo.test.  TXT  "v=DKIM1; k=rsa; p=MIIBIjANBgkq..."` },
    { h: 'DMARC: a política e o alinhamento', p: `O DMARC amarra os dois: exige que o domínio do "From" visível esteja alinhado com o domínio aprovado no SPF ou no DKIM e diz o que fazer quando falha:
• p=none: só monitorar e receber relatórios.
• p=quarantine: mandar para spam.
• p=reject: rejeitar.
O registro também pede relatórios agregados (rua=) que ajudam a descobrir quem envia e-mail em nome do seu domínio. A boa prática é começar com p=none, ajustar e subir para reject.`, code: `_dmarc.exemplo.test.  TXT  "v=DMARC1; p=reject; rua=mailto:dmarc@exemplo.test; adkim=s; aspf=s"` },
    { h: 'Lendo cabeçalhos e DNS na prática', p: `Para investigar um e-mail suspeito, abra os cabeçalhos completos ("Mostrar original"):
• Received: cada servidor acrescenta uma linha no topo; leia de baixo para cima para seguir o caminho.
• Authentication-Results: mostra spf=pass/fail, dkim=pass/fail, dmarc=pass/fail.
• Return-Path, Reply-To e From: diferenças merecem atenção.
• Message-ID e datas incoerentes também indicam falsificação.
Use o Laboratório > "Cabeçalho de e-mail" para praticar.

DNS: registros A/AAAA (endereço), MX (servidores de e-mail), TXT (SPF, DKIM, DMARC, verificações), CNAME (apelido), CAA (quem pode emitir certificados). Riscos: sequestro de DNS, "subdomain takeover" (subdomínio apontando para um serviço que não existe mais e que alguém registra) e domínios parecidos. Defesas: DNSSEC, DoH/DoT, MTA-STS, monitoramento de domínios semelhantes e MFA na conta do registrador.` }
  ],
  terms: [['SPF', 'Registro DNS que lista os IPs autorizados a enviar e-mails de um domínio.'], ['DKIM', 'Assinatura digital de mensagens; a chave pública fica no DNS.'], ['DMARC', 'Política que exige alinhamento com SPF/DKIM e define o que fazer em caso de falha.'], ['Return-Path', 'Remetente do envelope usado entre servidores (para devoluções).'], ['Reply-To', 'Endereço para onde a resposta é enviada, podendo diferir do remetente.'], ['MX', 'Registro DNS que indica os servidores de e-mail do domínio.'], ['Subdomain takeover', 'Tomada de um subdomínio que aponta para um recurso abandonado.']],
  practice: ['Consulte os registros TXT e MX do seu domínio (ou de um site conhecido) com nslookup -type=TXT dominio e veja se há SPF e DMARC.', 'Abra os cabeçalhos completos de um e-mail de spam e anote o resultado de SPF, DKIM e DMARC.', 'Use o Laboratório > Cabeçalho de e-mail com os exemplos e explique por que um deles é falso.'],
  quiz: [
    { q: 'O que o SPF define?', o: ['A senha do e-mail', 'Quais servidores podem enviar e-mails em nome do domínio', 'A criptografia do corpo da mensagem', 'O idioma da mensagem'], a: 1, e: 'É uma lista de remetentes autorizados em um registro TXT.' },
    { q: 'Para que serve o DKIM?', o: ['Criptografar o anexo', 'Assinar a mensagem para provar origem e integridade', 'Bloquear spam por palavras', 'Aumentar o limite de envio'], a: 1, e: 'A chave pública no DNS valida a assinatura da mensagem.' },
    { q: 'Qual política do DMARC rejeita mensagens que falham?', o: ['p=none', 'p=quarantine', 'p=reject', 'p=allow'], a: 2, e: 'none monitora, quarantine manda para spam e reject recusa a mensagem.' },
    { q: 'Em um cabeçalho de e-mail, como seguir o caminho da mensagem?', o: ['Ler as linhas Received de baixo para cima', 'Ler só a primeira linha', 'Ler o assunto', 'Olhar o tamanho'], a: 0, e: 'Cada servidor acrescenta um Received no topo; o primeiro está embaixo.' },
    { q: 'O que é um subdomain takeover?', o: ['Roubo de senha de e-mail', 'Tomar um subdomínio que aponta para um serviço abandonado', 'Derrubar o DNS com tráfego', 'Trocar o MX'], a: 1, e: 'O atacante registra o recurso órfão e passa a controlar o subdomínio.' }
  ],
  cards: [['O que o SPF protege?', 'Autoriza quais servidores enviam e-mail pelo domínio (contra falsificação do envelope).'], ['Onde fica a chave pública do DKIM?', 'Em um registro TXT em seletor._domainkey.dominio.'], ['O que é alinhamento no DMARC?', 'O domínio do From precisa coincidir com o aprovado no SPF ou no DKIM.'],
    ['Quais as 3 políticas do DMARC?', 'none (monitorar), quarantine (spam) e reject (rejeitar).'], ['Qual a diferença entre From e Return-Path?', 'From é o remetente visível; Return-Path é o remetente do envelope.'], ['Para que serve o registro CAA?', 'Define quais autoridades certificadoras podem emitir certificados para o domínio.']]
},
{ id: 'm28', level: 2, icon: '🪪', title: 'Autenticação e sessões: MFA, OAuth, SSO e JWT', mins: 26,
  intro: 'Entrar em sistemas parece simples, mas há muita coisa por trás: fatores, sessões, tokens e protocolos de login único. Veja como funcionam e onde costumam falhar.',
  sections: [
    { h: 'MFA e como os atacantes o contornam', p: `Autenticação multifator combina fatores diferentes: algo que você sabe (senha), tem (celular, chave) e é (biometria). Mesmo assim existem ataques:
• Fadiga de MFA (MFA bombing): o atacante dispara muitas notificações até a pessoa aprovar por cansaço. Defesa: correspondência de número, limite de tentativas e treinamento.
• SIM swap: roubo do número para receber SMS.
• Proxies de phishing "adversary in the middle" (como o Evilginx): a vítima digita senha e código em uma página falsa que repassa tudo ao site real e rouba a sessão. Defesa: FIDO2/passkeys, que só funcionam no domínio verdadeiro.
• Roubo de tokens e cookies de sessão por malware.
• Recuperação fraca: perguntas de segurança e e-mails de recuperação desprotegidos anulam o MFA.` },
    { h: 'Sessões e cookies', p: `Depois do login, o servidor cria uma sessão e entrega um identificador (cookie ou token). Quem tiver esse identificador age como você.

Boas práticas:
• Gerar identificadores longos e aleatórios; trocá-los após o login (evita session fixation).
• Cookies com Secure, HttpOnly e SameSite.
• Expiração por inatividade e logout que invalide a sessão no servidor.
• Reautenticar em ações sensíveis (trocar senha, e-mail, pagamento).
• Mostrar ao usuário os dispositivos conectados e permitir encerrá-los.` },
    { h: 'OAuth 2.0 e OpenID Connect em poucas linhas', p: `OAuth 2.0 é um protocolo de autorização delegada: permite que um aplicativo acesse dados seus em outro serviço sem receber a sua senha ("entrar com Google" usa OpenID Connect, que acrescenta identidade).

Papéis: dono do recurso (você), cliente (o app), servidor de autorização (quem emite tokens) e servidor de recursos (a API).

O fluxo recomendado é o Authorization Code com PKCE: o app recebe um código temporário e o troca por tokens, provando que é ele mesmo com um segredo de uso único (PKCE).

Erros comuns: não validar redirect_uri (permite roubo do código), omitir o parâmetro state (CSRF), usar fluxos antigos (implicit), tokens longos demais, escopos amplos demais e guardar tokens em locais inseguros.` },
    { h: 'SSO, SAML e JWT', p: `Single Sign-On permite entrar uma vez e acessar vários sistemas. SAML (XML, muito usado em empresas) e OpenID Connect (JSON/JWT, muito usado na web e em apps) são os protocolos mais comuns. O provedor de identidade (IdP) autentica e entrega uma asserção ou um token ao provedor de serviço.

JWT (JSON Web Token): três partes (cabeçalho, payload, assinatura). Cuidados:
• Verificar sempre a assinatura e o algoritmo esperado (rejeitar "none").
• Segredos HS256 fracos podem ser descobertos por tentativa (veja o Laboratório > JWT).
• Usar exp, aud e iss e validá-los.
• Não colocar dados sensíveis no payload (é só Base64URL).
• Evitar guardar tokens em localStorage se houver risco de XSS.`, code: `// Verificação segura (pseudocódigo)
token = receber()
chave = buscar_chave_publica(token.kid)
dados = verificar(token, chave, algoritmos=["RS256"])   // rejeita "none" e HS256 trocado
exigir(dados.exp > agora e dados.aud == "minha-api" e dados.iss == "https://idp.exemplo.test")` },
    { h: 'Passkeys e o futuro sem senha', p: `Passkeys (baseadas em WebAuthn/FIDO2) usam um par de chaves: a chave privada fica no seu dispositivo (ou em um gerenciador) e o site guarda só a pública. Na entrada, o site envia um desafio aleatório e o dispositivo o assina após você confirmar com biometria ou PIN.

Vantagens: não há segredo para vazar do servidor, a credencial é vinculada ao domínio (resiste a phishing) e não é reutilizável. Desafios: recuperação de contas, migração entre dispositivos e adoção. Para quem administra sistemas, vale oferecer passkeys como opção e manter métodos de recuperação seguros.` }
  ],
  terms: [['MFA bombing', 'Disparar várias notificações de aprovação até a vítima aceitar.'], ['Adversary-in-the-middle', 'Proxy de phishing que repassa a sessão e rouba o login e o token.'], ['OAuth 2.0', 'Protocolo de autorização delegada para acesso a recursos sem expor a senha.'], ['PKCE', 'Extensão do OAuth que protege o código de autorização com segredo de uso único.'], ['SSO', 'Login único para acessar vários sistemas.'], ['SAML', 'Padrão em XML para troca de asserções de identidade entre IdP e serviço.'], ['WebAuthn / passkey', 'Padrão de login por chaves criptográficas ligado ao domínio do site.']],
  practice: ['Revise em quais de suas contas o 2FA é por SMS e troque pelo menos a de e-mail para app ou chave.', 'Use o Laboratório > JWT para decodificar o token de exemplo e liste o que NÃO deveria estar ali.', 'Ative uma passkey em um serviço que ofereça (Google, GitHub, bancos) e teste o login.'],
  quiz: [
    { q: 'Por que passkeys resistem a phishing?', o: ['Porque são mais longas', 'Porque a credencial só funciona no domínio verdadeiro', 'Porque usam SMS', 'Porque trocam sozinhas'], a: 1, e: 'O navegador só assina o desafio para o domínio ao qual a chave está vinculada.' },
    { q: 'O que é MFA bombing?', o: ['Excesso de e-mails', 'Disparar muitas aprovações até a vítima aceitar', 'Um malware de e-mail', 'Um ataque ao DNS'], a: 1, e: 'Cansaço leva à aprovação; correspondência de número e limites ajudam.' },
    { q: 'Qual fluxo OAuth é o recomendado para apps modernos?', o: ['Implicit', 'Authorization Code com PKCE', 'Password', 'Nenhum, usar senha'], a: 1, e: 'PKCE protege o código mesmo em apps públicos.' },
    { q: 'O que não se deve fazer com JWT?', o: ['Validar exp e aud', 'Verificar a assinatura', 'Colocar segredos no payload', 'Rejeitar alg=none'], a: 2, e: 'O payload é apenas codificado; qualquer um lê.' },
    { q: 'O que o atributo state do OAuth ajuda a evitar?', o: ['XSS', 'CSRF no fluxo de login', 'SQL injection', 'DoS'], a: 1, e: 'Ele liga a resposta ao pedido original do usuário.' }
  ],
  cards: [['O que é SSO?', 'Autenticar uma vez e acessar vários sistemas.'], ['Qual a diferença entre OAuth e OpenID Connect?', 'OAuth autoriza acesso a recursos; OpenID Connect acrescenta a identidade do usuário.'], ['O que é PKCE?', 'Segredo de uso único que protege o código de autorização no OAuth.'],
    ['Cite 3 erros comuns de JWT.', 'Aceitar alg=none, segredo fraco e não validar exp/aud.'], ['Como defender-se de AiTM?', 'Passkeys/FIDO2 e monitoramento de sessões suspeitas.'], ['Por que fazer logout invalidar a sessão no servidor?', 'Para que um token roubado deixe de funcionar.']]
},
{ id: 'm29', level: 2, icon: '🧑‍💻', title: 'Programação segura e revisão de código', mins: 26,
  intro: 'Quem escreve software decide muito da segurança. Aprenda princípios, hábitos e uma lista prática para escrever e revisar código mais seguro, em qualquer linguagem.',
  sections: [
    { h: 'Mentalidade de desenvolvimento seguro', p: `• Threat modeling antes de codar: quais dados são sensíveis, quem pode atacar, onde estão as fronteiras de confiança.
• Fail secure: em caso de erro, negar acesso (e não liberar).
• Privilégio mínimo para usuários, serviços e contas de banco de dados.
• Defesa em profundidade: validação, autorização, criptografia e monitoramento juntas.
• Segurança por padrão: configurações iniciais seguras (MFA ligado, permissões fechadas).
• Simplicidade: menos código e menos recursos significam menos falhas.
• Nunca confiar na entrada (formulários, cabeçalhos, arquivos, APIs de terceiros, banco de dados).` },
    { h: 'Entradas, saídas e injeções', p: `• Valide com lista de permitidos (allow list): tipo, tamanho, formato e intervalo.
• Normalize antes de validar (codificações duplas, maiúsculas, Unicode).
• Use consultas parametrizadas e ORMs corretamente; nunca concatene dados em SQL, comandos de shell, XML, LDAP ou HTML.
• Codifique a saída conforme o contexto (HTML, atributo, JavaScript, URL, CSV).
• Para arquivos: valide tipo real, tamanho, renomeie, armazene fora da pasta executável.
• Evite executar comandos do sistema com dados do usuário; se for inevitável, passe argumentos em lista e sem shell.`, code: `# Python — vulnerável
query = "SELECT * FROM usuarios WHERE email = '" + email + "'"
cursor.execute(query)

# Python — corrigido (parametrizado)
cursor.execute("SELECT * FROM usuarios WHERE email = %s", (email,))` },
    { h: 'Segredos, logs e tratamento de erros', p: `• Segredos (senhas, chaves de API, certificados) não ficam no código nem no repositório: use variáveis de ambiente e cofres (Vault, Secrets Manager).
• Revise o histórico do Git: um segredo apagado no último commit continua no histórico. Se vazou, troque a chave.
• Não registre senhas, tokens, números de cartão ou dados pessoais em logs. Registre eventos de segurança (login, falha, mudança de permissão) com data, usuário e origem.
• Log injection: caracteres de nova linha em entradas podem forjar linhas de log; sanitize.
• Mensagens de erro genéricas para o usuário, detalhadas apenas no log interno.
• Aleatoriedade segura (secrets, crypto.getRandomValues) para tokens; nunca Math.random() ou random() padrão.` },
    { h: 'Dependências e cadeia de suprimentos', p: `A maior parte do código de um sistema vem de bibliotecas. Cuidados:
• Mantenha dependências atualizadas e use ferramentas de SCA (Dependabot, Renovate, npm audit, pip-audit, Trivy).
• Trave versões (lockfiles) e revise atualizações importantes.
• Confira o nome do pacote: typosquatting publica pacotes maliciosos com nomes parecidos.
• Reduza dependências desnecessárias e prefira projetos mantidos.
• Gere um SBOM (lista de componentes) para saber rapidamente se uma nova falha afeta você.
• No pipeline de CI/CD, use contas e tokens com permissão mínima.` },
    { h: 'Revisão de código e testes de segurança', p: `Checklist de revisão:
• Autenticação e autorização checadas em todo endpoint?
• Toda entrada é validada e toda saída codificada?
• Há segredos, URLs internas ou chaves no código?
• Erros expõem informações demais?
• Criptografia: algoritmos modernos, nonces únicos, chaves fora do código?
• Dependências novas são confiáveis?
• Há testes para casos de abuso (negação de acesso, entradas maliciosas)?

Ferramentas: SAST (análise estática), DAST (testes na aplicação rodando), fuzzing, testes de unidade com casos de abuso e revisão por pares. Automatize no CI e trate achados como bugs.` }
  ],
  terms: [['Fail secure', 'Em caso de falha, o sistema nega o acesso em vez de liberar.'], ['Allow list', 'Lista de valores permitidos; tudo fora dela é rejeitado.'], ['Log injection', 'Inserir caracteres especiais para forjar ou corromper registros de log.'], ['SCA', 'Análise de composição de software: acha dependências vulneráveis.'], ['Lockfile', 'Arquivo que fixa as versões exatas das dependências.'], ['SBOM', 'Lista de componentes de um software com versões.'], ['SAST', 'Análise estática do código-fonte em busca de falhas.']],
  practice: ['Procure no seu projeto (ou em um de exemplo) por palavras como password, secret e api_key e verifique se há segredos no código.', 'Reescreva em papel uma consulta que concatena entrada do usuário usando uma versão parametrizada.', 'Rode uma ferramenta de SCA (npm audit, pip-audit ou Trivy) em um projeto de teste e leia o relatório.'],
  quiz: [
    { q: 'Qual abordagem de validação é mais segura?', o: ['Lista de bloqueio (block list)', 'Lista de permitidos (allow list)', 'Nenhuma validação', 'Validar só no navegador'], a: 1, e: 'Permitir só o que é esperado evita as variações que a lista de bloqueio esquece.' },
    { q: 'Se uma chave de API foi commitada por engano e depois removida, o que fazer?', o: ['Nada, foi removida', 'Trocar (revogar) a chave, pois ela continua no histórico', 'Apagar o repositório', 'Esconder o commit'], a: 1, e: 'O histórico do Git preserva o segredo; é preciso rotacionar.' },
    { q: 'O que significa fail secure?', o: ['Quando falha, nega acesso', 'Quando falha, libera tudo', 'Quando falha, reinicia', 'Quando falha, ignora'], a: 0, e: 'Erros não devem abrir portas.' },
    { q: 'Qual prática ajuda contra typosquatting em pacotes?', o: ['Instalar o primeiro pacote de nome parecido', 'Conferir o nome e a reputação do pacote antes de instalar', 'Desativar atualizações', 'Usar versões antigas'], a: 1, e: 'Pacotes maliciosos usam nomes parecidos com os populares.' },
    { q: 'Qual deve ser o conteúdo dos logs?', o: ['Senhas e tokens para facilitar depuração', 'Eventos relevantes sem dados sensíveis', 'Nada', 'Cartões completos'], a: 1, e: 'Logs ajudam na investigação, mas não devem expor segredos.' }
  ],
  cards: [['O que é validação por allow list?', 'Aceitar apenas valores previstos e rejeitar o resto.'], ['Por que não registrar senhas em logs?', 'Logs costumam ter acesso mais amplo e retenção longa.'], ['O que é SCA?', 'Análise que identifica dependências com vulnerabilidades conhecidas.'],
    ['Qual a vantagem do lockfile?', 'Garante versões reprodutíveis e evita atualizações maliciosas inesperadas.'], ['Cite 3 itens da revisão de código.', 'Autorização, validação/saída, segredos, erros, dependências.'], ['O que é SAST x DAST?', 'SAST analisa o código; DAST testa a aplicação em execução.']]
},
{ id: 'm30', level: 2, icon: '🐍', title: 'Automação para segurança com Python e Bash', mins: 28,
  intro: 'Automatizar tarefas repetitivas é uma habilidade essencial em segurança. Este módulo traz scripts curtos e defensivos que você pode rodar na sua própria máquina.',
  sections: [
    { h: 'Por que automatizar e como fazer com segurança', p: `Analistas passam muito tempo lendo logs, conferindo hashes, checando certificados e inventariando recursos. Scripts fazem isso em segundos, de forma repetível.

Regras de ouro ao escrever scripts de segurança:
• Rode só em ambientes seus ou autorizados.
• Nunca coloque senhas e chaves no script: use variáveis de ambiente.
• Valide entradas e trate erros.
• Prefira bibliotecas padrão e revise o que baixa da internet.
• Registre o que o script fez (log) e evite ações destrutivas sem confirmação.` },
    { h: 'Hash de arquivo e verificação de integridade (Python)', p: `Conferir se um arquivo baixado é igual ao original usando SHA-256. O código lê o arquivo em blocos para suportar arquivos grandes.`, code: `import hashlib, sys

def sha256_arquivo(caminho):
    h = hashlib.sha256()
    with open(caminho, "rb") as f:
        for bloco in iter(lambda: f.read(1024 * 1024), b""):
            h.update(bloco)
    return h.hexdigest()

if __name__ == "__main__":
    caminho, esperado = sys.argv[1], sys.argv[2].lower()
    real = sha256_arquivo(caminho)
    print("OK" if real == esperado else f"DIFERENTE: {real}")` },
    { h: 'Analisando logs: os IPs com mais falhas (Python)', p: `Contar tentativas de login falhas por IP em um arquivo auth.log. É o mesmo raciocínio do treino de logs deste app.`, code: `import re, collections, sys

padrao = re.compile(r"Failed password .* from (\\d+\\.\\d+\\.\\d+\\.\\d+)")
contagem = collections.Counter()

with open(sys.argv[1], encoding="utf-8", errors="replace") as f:
    for linha in f:
        m = padrao.search(linha)
        if m:
            contagem[m.group(1)] += 1

for ip, n in contagem.most_common(10):
    print(f"{n:5d}  {ip}")` },
    { h: 'Bash: tarefas rápidas no terminal', p: `Linhas úteis para o dia a dia (em Linux ou WSL), todas defensivas: contar acessos, ver quem está escutando e achar arquivos modificados recentemente.`, code: `# Top 10 IPs em um log de acesso web
awk '{print $1}' access.log | sort | uniq -c | sort -nr | head -10

# Quais processos escutam em quais portas
ss -tulpn

# Arquivos alterados nos últimos 2 dias dentro de /etc
find /etc -type f -mtime -2 -ls 2>/dev/null

# Hash de todos os arquivos de uma pasta (para comparar depois)
find ./pasta -type f -exec sha256sum {} + > hashes.txt` },
    { h: 'Checando certificados e portas na sua infraestrutura (Python)', p: `Dois checks úteis: quantos dias faltam para um certificado vencer (use só em domínios seus) e se uma porta de um servidor seu está aberta.`, code: `import socket, ssl, datetime

def dias_para_vencer(host, porta=443):
    ctx = ssl.create_default_context()
    with socket.create_connection((host, porta), timeout=5) as s:
        with ctx.wrap_socket(s, server_hostname=host) as tls:
            cert = tls.getpeercert()
    fim = datetime.datetime.strptime(cert["notAfter"], "%b %d %H:%M:%S %Y %Z")
    return (fim - datetime.datetime.utcnow()).days

def porta_aberta(host, porta):
    with socket.socket() as s:
        s.settimeout(1.0)
        return s.connect_ex((host, porta)) == 0

print(dias_para_vencer("exemplo.com"))
print(porta_aberta("127.0.0.1", 22))` }
  ],

{ id: 'm31', level: 2, icon: '🚪', title: 'Segurança física e engenharia social presencial', mins: 20,
  intro: 'De nada adianta uma senha forte se alguém entra no escritório e conecta um dispositivo na rede. A segurança física e os ataques presenciais são parte do jogo.',
  sections: [
    { h: 'Camadas físicas de proteção', p: `Segurança física também é feita em camadas: perímetro (cercas, portaria), edifício (controle de acesso, crachás, catracas), áreas internas (salas de servidores, armários de rede), equipamentos (cabos de segurança, bloqueio de portas USB) e pessoas (treinamento, registro de visitantes).

Princípios: controle quem entra, registre quem esteve lá, separe áreas por criticidade, vigie (câmeras, alarmes) e proteja o ambiente (energia, temperatura, incêndio).` },
    { h: 'Ataques presenciais comuns', p: `• Tailgating/piggybacking: entrar logo atrás de alguém autorizado ("pode segurar a porta?").
• Shoulder surfing: ler senhas e telas por cima do ombro.
• Dumpster diving: vasculhar lixo atrás de documentos, etiquetas e anotações.
• Pretexto presencial: fingir ser técnico, entregador, auditor ou fornecedor.
• Clonagem de crachás de proximidade antigos.
• Dispositivos maliciosos: pen drives deixados de propósito, cabos e teclados com hardware adulterado (BadUSB), dispositivos plugados em tomadas de rede.
• "Evil maid": alguém com acesso físico ao seu notebook sem supervisão adultera o equipamento.` },
    { h: 'Defesas práticas', p: `• Política de visitantes: registro, crachá visível, acompanhamento.
• Mesa limpa e tela bloqueada (Win+L / Ctrl+Cmd+Q) sempre que sair.
• Descarte seguro: triturador de papel e destruição de mídias.
• Criptografia de disco e BIOS/UEFI com senha para dificultar roubo e adulteração.
• Bloqueio de portas USB e de conexão automática em ambientes críticos.
• Educação: incentive perguntar "quem é você e com quem vai falar?" sem constrangimento.
• Desative portas de rede não usadas e segmente a rede (visitantes separados).
• Registre e teste alarmes e câmeras.` },
    { h: 'Home office, viagens e espaços públicos', p: `• Use filtro de privacidade em notebooks e evite trabalhar com dados sensíveis em locais cheios.
• Não deixe equipamentos sozinhos em cafés, carros e quartos de hotel.
• Em viagens de risco, leve aparelhos limpos e com criptografia, e evite plugar em carregadores públicos (use bloqueadores de dados ou sua própria fonte).
• Cuidado com Wi-Fi de hotéis e aeroportos: VPN e HTTPS.
• Em casa, mantenha equipamentos de trabalho separados e guarde documentos em local trancado.
• Cuidado com chamadas de vídeo: o que aparece ao fundo (quadros, anotações, telas).` },
    { h: 'Testes físicos autorizados', p: `Testes de intrusão física (tentar entrar, plantar dispositivo, clonar crachá) só são legais com autorização formal. Boas práticas:
• Contrato com escopo, datas, locais e regras claras.
• "Carta de autorização" assinada por alguém com poder de decisão, levada pelo testador (para provar a autorização se for abordado).
• Contato de emergência e canal para interromper o teste.
• Evitar riscos reais a pessoas e a operações.
• Relatório com evidências e recomendações sem expor indivíduos de forma humilhante.
Sem autorização, entrar em um prédio ou instalar um dispositivo é invasão, mesmo que a intenção seja "testar".` }
  ],
  terms: [['Tailgating', 'Entrar em área restrita logo atrás de uma pessoa autorizada.'], ['Shoulder surfing', 'Observar telas e digitação por cima do ombro.'], ['Dumpster diving', 'Procurar informações úteis no lixo.'], ['BadUSB', 'Dispositivo USB adulterado que age como teclado ou outro periférico malicioso.'], ['Evil maid', 'Ataque com acesso físico não supervisionado a um equipamento.'], ['Mesa limpa', 'Política de não deixar documentos e senhas à vista.'], ['Carta de autorização', 'Documento que comprova o teste físico autorizado.']],

{ id: 'm32', level: 2, icon: '🗄️', title: 'Segurança de bancos de dados', mins: 22,
  intro: 'O banco de dados guarda o que mais interessa ao atacante. Veja como proteger acessos, dados e backups, e por que tantos bancos aparecem expostos na internet.',
  sections: [
    { h: 'Superfície de ataque dos bancos de dados', p: `Bancos de dados podem ser atacados por: injeção (SQL/NoSQL), credenciais fracas ou vazadas, serviços expostos à internet sem autenticação, permissões excessivas, backups desprotegidos, vulnerabilidades sem correção e abuso por pessoas de dentro.

Casos comuns: instâncias de MongoDB, Elasticsearch e Redis abertas na internet sem senha, com milhões de registros vazados ou apagados por criminosos que deixam um pedido de resgate.` },
    { h: 'Controle de acesso e privilégio mínimo', p: `• Contas separadas para cada aplicação e para cada pessoa; nunca use a conta administrativa (root, sa, postgres) na aplicação.
• Conceda apenas as permissões necessárias (SELECT/INSERT/UPDATE) e só nas tabelas necessárias; evite GRANT ALL.
• Exija senhas fortes e, quando possível, autenticação integrada (IAM, Kerberos) e MFA para administradores.
• Revise periodicamente quem tem acesso (joiner-mover-leaver).
• Desative contas padrão e exemplos.
• Em bancos expostos à rede, restrinja por firewall e use redes privadas; nunca publique a porta do banco (3306, 5432, 1433, 27017, 6379) na internet.` },
    { h: 'Criptografia, mascaramento e dados sensíveis', p: `• Em trânsito: TLS entre aplicação e banco.
• Em repouso: criptografia de disco/tablespace, e para campos muito sensíveis, criptografia no nível da aplicação.
• Senhas: nunca em texto; use hash com salt (Argon2/bcrypt).
• Mascaramento e pseudonimização em ambientes de desenvolvimento e testes: não use dados reais de clientes.
• Minimização: guarde só o necessário e por tempo limitado (LGPD).
• Chaves em KMS/HSM e com rotação.
• Classifique os dados (públicos, internos, sensíveis) para decidir controles.` },
    { h: 'Auditoria, backups e hardening', p: `• Ative logs de auditoria: logins, falhas, mudanças de esquema e de permissões, consultas em tabelas sensíveis.
• Monitore comportamentos anormais (consultas massivas, exportações fora do horário).
• Backups criptografados, testados e com acesso controlado; guarde cópia offline/imutável.
• Aplique patches e remova recursos não usados (procedures, extensões).
• Revise configuração segundo guias como os CIS Benchmarks.
• Separe ambientes (produção, homologação, desenvolvimento) e não compartilhe credenciais entre eles.` },
    { h: 'Injeções em bancos relacionais e NoSQL', p: `A injeção de SQL continua entre as falhas mais graves. Além das consultas parametrizadas, use contas com privilégio mínimo para limitar o estrago, e trate erros sem expor detalhes do banco.

NoSQL também sofre injeção: em MongoDB, operadores como $ne ou $gt vindos de JSON do usuário podem alterar consultas. Valide tipos (string, número) e não passe objetos de entrada diretamente para a consulta.`, code: `// Node.js + MongoDB (vulnerável)
db.usuarios.findOne({ email: req.body.email, senha: req.body.senha })
// entrada JSON: {"email":"a@b.c","senha":{"$ne":null}}  -> entra sem saber a senha

// Corrigido: forçar tipos e comparar hash
const email = String(req.body.email), senha = String(req.body.senha)
const u = await db.usuarios.findOne({ email })
if (!u || !(await argon2.verify(u.hash, senha))) negar()` }
  ],
  terms: [['Privilégio mínimo (BD)', 'Dar à conta só as permissões estritamente necessárias.'], ['Criptografia em repouso', 'Proteção dos dados armazenados em disco ou backup.'], ['Mascaramento', 'Substituir dados reais por valores fictícios em ambientes não produtivos.'], ['Auditoria de banco', 'Registro de acessos e alterações no banco de dados.'], ['NoSQL injection', 'Injeção de operadores em consultas de bancos não relacionais.'], ['TDE', 'Transparent Data Encryption: criptografia transparente de arquivos do banco.'], ['Tablespace', 'Área de armazenamento lógica do banco, que pode ser criptografada.']],
  practice: ['Liste as contas de banco de dados de um sistema que você usa e verifique se alguma aplicação usa conta administrativa.', 'Suba um banco local em Docker, crie um usuário só com SELECT e teste o que ele não consegue fazer.', 'Pesquise sobre incidentes de bancos expostos (MongoDB/Elasticsearch) e liste 3 lições.'],

    { q: 'O que significa mascarar dados em ambiente de teste?', o: ['Esconder a tela', 'Trocar dados reais por fictícios', 'Apagar o banco', 'Compactar'], a: 1, e: 'Evita que dados de clientes vazem em ambientes menos protegidos.' },
    { q: 'Por que não expor a porta do banco na internet?', o: ['Porque deixa o banco lento', 'Porque amplia muito a superfície de ataque', 'Porque é proibido pelo SQL', 'Porque aumenta o custo'], a: 1, e: 'Acesso deve passar por rede privada, VPN ou serviços intermediários.' },
    { q: 'Como o operador {"$ne": null} pode ser abusado?', o: ['Para formatar datas', 'Em NoSQL injection, para contornar a checagem de senha', 'Para compactar dados', 'Para criptografar'], a: 1, e: 'Valide tipos e nunca passe objetos de entrada direto para a consulta.' },

{ id: 'm33', level: 3, icon: '🔎', title: 'Engenharia de detecção: logs, Sigma, YARA e SIEM', mins: 30,
  intro: 'Detectar é transformar logs em sinais úteis. Veja como se constrói uma detecção, como escrever regras em formatos abertos e como evitar o ruído que enterra os alertas reais.',
  sections: [
    { h: 'Do log ao alerta', p: `Uma detecção nasce de uma pergunta: "que comportamento do atacante deixaria rastro?". O caminho:
1. Fontes de dados: autenticação, endpoints (EDR, Sysmon), rede (DNS, proxy, firewall), nuvem (CloudTrail, Azure AD), aplicações.
2. Coleta e normalização: campos comuns (usuário, IP, processo) para poder correlacionar fontes diferentes (modelos como ECS ou OCSF).
3. Lógica de detecção: regra, estatística ou comportamento.
4. Triagem e resposta: o alerta precisa trazer contexto suficiente para decidir.
5. Melhoria contínua: ajustar ruído e cobrir lacunas.
Sem logs adequados não há detecção: o primeiro passo é saber o que se coleta e por quanto tempo.` },
    { h: 'Sigma: regras de detecção portáveis', p: `Sigma é um formato aberto (YAML) para descrever detecções de logs sem depender de um SIEM específico. Ferramentas convertem a regra para Splunk, Elastic, Sentinel e outros. Uma regra tem metadados (título, nível, referências ao MITRE ATT&CK), a fonte de log e as condições.`, code: `title: Muitas falhas de login seguidas de sucesso (exemplo didático)
id: 4d9a0000-0000-4000-8000-000000000001
status: experimental
description: Sequência de falhas de autenticação do mesmo IP e depois um sucesso
logsource:
  product: windows
  service: security
detection:
  falha:
    EventID: 4625
  sucesso:
    EventID: 4624
  condition: falha | count() by IpAddress > 10 and sucesso
tags:
  - attack.credential_access
  - attack.t1110
level: high` },
    { h: 'YARA: identificando arquivos e memória por padrões', p: `YARA descreve padrões (textos, bytes, expressões) que identificam famílias de malware ou arquivos suspeitos, em disco ou em memória. É muito usada por analistas de malware e equipes de resposta.`, code: `rule Exemplo_Documento_com_Macro_Suspeita
{
    meta:
        description = "Procura strings típicas de macro que baixa e executa algo (didático)"
        author = "Escola de Segurança"
    strings:
        $a = "AutoOpen" nocase
        $b = "Shell(" nocase
        $c = "powershell" nocase
        $d = { D0 CF 11 E0 A1 B1 1A E1 }   // assinatura de arquivo Office antigo
    condition:
        $d at 0 and ($a or $b) and $c
}` },
    { h: 'Consultas e caça (SPL, KQL e equivalentes)', p: `Cada SIEM tem uma linguagem de consulta, mas a lógica é parecida: filtrar, agrupar, contar e comparar com o normal.`, code: `# Splunk (SPL): IPs com muitas falhas de login
index=auth action=failure
| stats count by src_ip
| where count > 20
| sort - count

// Microsoft Sentinel (KQL): falhas de login por usuário nas últimas 24h
SigninLogs
| where TimeGenerated > ago(24h) and ResultType != 0
| summarize falhas = count() by UserPrincipalName, IPAddress
| where falhas > 10
| order by falhas desc` },
    { h: 'Qualidade, ruído e maturidade', p: `• Falsos positivos: ajuste com listas de exceção (por exemplo, scanners de vulnerabilidade autorizados), limiares e contexto. Registre por que cada exceção existe.
• Pirâmide da Dor (Pyramid of Pain): bloquear hashes e IPs é fácil para o atacante contornar; detectar comportamentos e técnicas (TTPs) custa muito mais caro a ele.
• Cobertura: mapeie as detecções no MITRE ATT&CK e descubra lacunas.
• Detecção como código: guardar regras em Git, revisar por pares, testar automaticamente.
• Teste: use emulação de adversário em laboratório (Atomic Red Team, Caldera) para verificar se a detecção dispara.
• Métricas: precisão (quantos alertas eram reais), tempo para detectar (MTTD) e para responder (MTTR).` }
  ],
  terms: [['Normalização', 'Padronizar nomes e formatos de campos de logs de fontes diferentes.'], ['Sigma', 'Formato aberto em YAML para regras de detecção independentes de produto.'], ['YARA', 'Linguagem de regras para identificar arquivos ou memória por padrões.'], ['Sysmon', 'Ferramenta Microsoft que gera logs detalhados de processos e rede no Windows.'], ['Pirâmide da Dor', 'Modelo que ordena indicadores pela dificuldade que causam ao atacante quando detectados.'], ['Detecção como código', 'Tratar regras de detecção como software: versionar, revisar e testar.'], ['Atomic Red Team', 'Conjunto de testes pequenos que emulam técnicas do ATT&CK.']],
  practice: ['Escolha uma técnica do ATT&CK (por exemplo T1110, força bruta) e escreva em português a lógica de uma detecção: fonte de log, condição e limite.', 'Reescreva a regra Sigma de exemplo trocando o limiar de 10 para um valor que faria sentido na sua empresa (explique por quê).', 'Instale o Sysmon em uma VM de teste e observe os eventos gerados ao abrir um programa.'],
  quiz: [

    { q: 'Como reduzir falsos positivos de uma regra?', o: ['Desativar o alerta', 'Ajustar limiares e criar exceções documentadas com contexto', 'Ignorar os alertas', 'Aumentar o volume de logs sem critério'], a: 1, e: 'Ajuste fino com contexto mantém a sensibilidade sem inundar a equipe.' }
  ],

{ id: 'm34', level: 3, icon: '🕵️‍♂️', title: 'Threat intelligence e OSINT defensivo', mins: 26,
  intro: 'Conhecer o adversário ajuda a priorizar defesas. Veja como a inteligência de ameaças funciona, que modelos usar e como coletar informações públicas de forma ética.',
  sections: [
    { h: 'O que é threat intelligence', p: `Threat intelligence (CTI) é informação analisada sobre ameaças, útil para decisões. Não é só uma lista de IPs: é contexto (quem, por quê, como e o que fazer).

Níveis:
• Estratégica: tendências, motivações, riscos para o negócio (direção, conselho).
• Tática: técnicas e procedimentos dos atacantes (TTPs) para detecção e defesa.
• Operacional: campanhas em andamento, infraestrutura e prazos.
• Técnica: indicadores concretos (hashes, IPs, domínios, URLs) para bloqueio e busca.` },
    { h: 'O ciclo de inteligência', p: `1. Direção: o que precisamos saber? (requisitos de inteligência)
2. Coleta: fontes abertas, feeds, relatórios, comunidades, telemetria interna.
3. Processamento: normalizar, deduplicar, enriquecer (quem é o dono do IP? o domínio é novo?).
4. Análise: transformar dados em conclusões com nível de confiança.
5. Disseminação: entregar à pessoa certa no formato certo (relatório executivo, regra de detecção).
6. Feedback: ajustar os requisitos.
Cuidado com fontes ruins: indicadores antigos geram falsos positivos; avalie confiabilidade da fonte e da informação.` },
    { h: 'Modelos e padrões', p: `• Cyber Kill Chain: fases de um ataque (reconhecimento até ação sobre objetivos).
• Diamond Model: relaciona adversário, capacidade, infraestrutura e vítima.
• MITRE ATT&CK: táticas e técnicas reais; permite comparar grupos e planejar defesa.
• Pirâmide da Dor: indicadores x dificuldade para o atacante.
• TLP (Traffic Light Protocol): define o quanto uma informação pode ser compartilhada (CLEAR, GREEN, AMBER, RED).
• STIX/TAXII: formato e transporte padronizados de CTI.
• MISP: plataforma aberta para compartilhar indicadores e eventos.
Como se usa: ao ler um relatório de um grupo que ataca o seu setor, mapeie as técnicas no ATT&CK, verifique se há detecção para cada uma e priorize as lacunas.` },
    { h: 'OSINT: informação de fontes abertas', p: `OSINT usa informações públicas para investigação e defesa:
• Domínios e infraestrutura: WHOIS, registros DNS, certificados (Certificate Transparency), buscadores de dispositivos (Shodan, Censys).
• Código e vazamentos: repositórios públicos com segredos, pastas expostas.
• Redes sociais e empresas: estrutura, cargos, tecnologias usadas (úteis para um atacante, por isso a sua "pegada digital" importa).
• Imagens e geolocalização (verificação de fotos e vídeos).
Para a defesa, faça OSINT sobre a sua própria organização para descobrir o que um atacante veria.

Ética e lei: coletar o que é público não é o mesmo que ser livre para qualquer uso. Respeite a LGPD, os termos das plataformas e não persiga pessoas. Foque em infraestrutura e ameaças, não em indivíduos sem motivo legítimo.` },
    { h: 'Monitoramento de marca, vazamentos e domínios', p: `• Monitore domínios semelhantes ao da empresa (typosquatting) e registre os principais.
• Acompanhe vazamentos de credenciais corporativas para forçar a troca de senhas.
• Observe menções a sua marca em fóruns e canais de golpistas.
• Solicite remoção (takedown) de sites e perfis falsos aos provedores e registradores.
• Compartilhe indicadores com comunidades do setor (ISACs) e com o CERT.br, quando fizer sentido.
• Documente as fontes e o nível de confiança de cada informação.` }
  ],
  terms: [['CTI', 'Cyber Threat Intelligence: informação analisada sobre ameaças.'], ['TTP', 'Táticas, técnicas e procedimentos de um adversário.'], ['TLP', 'Protocolo que classifica por cores o quanto uma informação pode ser compartilhada.'], ['STIX / TAXII', 'Padrões para representar e transportar inteligência de ameaças.'], ['MISP', 'Plataforma de código aberto para compartilhar indicadores de ameaça.'], ['Certificate Transparency', 'Registros públicos de certificados emitidos, úteis para descobrir domínios.'], ['ISAC', 'Centro de compartilhamento de informações e análise de um setor.']],
  practice: ['Faça OSINT passivo sobre um domínio seu: registros DNS, certificados em crt.sh e o que um buscador de dispositivos mostra.', 'Escolha um relatório público sobre um grupo de ameaça e mapeie 5 técnicas no ATT&CK.', 'Escreva os requisitos de inteligência (3 perguntas) de uma pequena empresa de e-commerce.'],
  quiz: [
    { q: 'O que diferencia inteligência de ameaças de uma simples lista de IPs?', o: ['Nada', 'O contexto e a análise para apoiar decisões', 'A cor da planilha', 'O tamanho do arquivo'], a: 1, e: 'Dados viram inteligência quando analisados e contextualizados.' },
    { q: 'O que significa TLP AMBER?', o: ['Pode ser publicado livremente', 'Compartilhamento limitado dentro da organização e de quem precisa saber', 'Nunca compartilhar com ninguém', 'Só para a imprensa'], a: 1, e: 'AMBER restringe a distribuição ao necessário.' },
    { q: 'Para que serve o Certificate Transparency em OSINT?', o: ['Para quebrar senhas', 'Para descobrir subdomínios e certificados emitidos', 'Para assinar e-mails', 'Para bloquear spam'], a: 1, e: 'Logs públicos mostram quais certificados foram emitidos para um domínio.' },
    { q: 'Qual a principal precaução ética no OSINT?', o: ['Não há precaução', 'Respeitar a lei e a privacidade, focando em infraestrutura e ameaças', 'Coletar tudo sobre qualquer pessoa', 'Publicar o que achar'], a: 1, e: 'Dados públicos continuam sendo dados pessoais sujeitos à LGPD.' },
    { q: 'Qual nível de CTI traz hashes, IPs e domínios para bloqueio?', o: ['Estratégica', 'Técnica', 'Executiva', 'Jurídica'], a: 1, e: 'Indicadores concretos são inteligência técnica.' }
  ],
  cards: [['Quais os 4 níveis de CTI?', 'Estratégica, tática, operacional e técnica.'], ['O que é TLP?', 'Protocolo que define o quanto uma informação pode ser compartilhada (CLEAR, GREEN, AMBER, RED).'], ['Para que serve o MISP?', 'Compartilhar eventos e indicadores de ameaça entre organizações.'],
    ['Qual o ciclo da inteligência?', 'Direção, coleta, processamento, análise, disseminação e feedback.'], ['Como usar um relatório de grupo de ameaça?', 'Mapear as técnicas no ATT&CK e checar as detecções existentes.'], ['O que é OSINT defensivo?', 'Pesquisar informações públicas sobre a própria organização para reduzir exposição.']]
},
{ id: 'm35', level: 3, icon: '🔌', title: 'Segurança de APIs (OWASP API Top 10)', mins: 28,
  intro: 'Aplicativos móveis, sites e integrações conversam por APIs. Elas concentram dados e lógica de negócio, e têm falhas próprias. Veja as principais e como evitá-las.',
  sections: [
    { h: 'APIs em 5 minutos', p: `API é uma interface para programas conversarem entre si. As mais comuns são REST (JSON sobre HTTP), GraphQL (uma consulta flexível) e gRPC. A autenticação costuma usar tokens (OAuth/JWT) ou chaves de API.

Por que são alvo: expõem diretamente objetos e funções, têm muitos endpoints (alguns esquecidos), e frequentemente confiam no cliente (o aplicativo móvel) para aplicar regras. Mas o cliente pode ser alterado por quem o controla: toda regra precisa ser validada no servidor.` },
    { h: 'Falhas de autorização (as mais graves)', p: `• BOLA (Broken Object Level Authorization), também chamada de IDOR: o usuário troca o identificador de um objeto (/contas/123) e acessa dados de outro. Defesa: checar no servidor se o usuário tem direito àquele objeto em toda requisição.
• BFLA (Broken Function Level Authorization): usuário comum chama funções administrativas (DELETE /usuarios/5). Defesa: controle por papel em cada função.
• BOPLA e mass assignment: a API aceita campos que o usuário não deveria controlar (por exemplo "admin": true). Defesa: listas de campos permitidos.`, code: `// Node.js / Express — mass assignment vulnerável
app.put('/perfil', auth, async (req, res) => {
  await Usuario.update(req.user.id, req.body);   // o corpo pode conter {"admin": true}
  res.sendStatus(204);
});

// Corrigido: aceitar só campos permitidos
const permitidos = ['nome', 'telefone', 'idioma'];
const dados = Object.fromEntries(Object.entries(req.body).filter(([k]) => permitidos.includes(k)));
await Usuario.update(req.user.id, dados);` },
    { h: 'Autenticação, limites e consumo de recursos', p: `• Autenticação fraca: chaves de API em URLs ou aplicativos, tokens sem expiração, falta de bloqueio de tentativas.
• Falta de limite de requisições: permite força bruta, scraping e negação de serviço. Use rate limiting por usuário/IP/chave, paginação com tamanho máximo e limites de tamanho de corpo.
• Consumo irrestrito de recursos: consultas caras, uploads gigantes, operações que disparam custos (SMS, e-mail, IA). Imponha cotas e alertas.
• Fluxos sensíveis de negócio (compras, cadastro, cupons) abusados por automação: use detecção de bots e verificação de limites de uso.` },
    { h: 'Configuração, inventário e consumo seguro', p: `• SSRF: APIs que buscam URLs informadas pelo usuário podem ser forçadas a acessar redes internas. Valide e restrinja os destinos.
• Má configuração: CORS aberto demais, erros detalhados, métodos HTTP desnecessários, cabeçalhos de segurança ausentes e TLS fraco.
• Inventário inadequado: APIs antigas (v1), de teste ou "sombra" continuam expostas sem patch ou monitoramento. Mantenha catálogo de endpoints e desligue versões antigas.
• Consumo inseguro de APIs de terceiros: confiar cegamente nos dados que vêm de outras APIs. Valide como se fossem entrada do usuário.
• Registre e monitore: logs de acesso e alertas para padrões como varredura de IDs sequenciais.` },
    { h: 'GraphQL e como testar APIs', p: `GraphQL traz riscos próprios: introspecção ativa em produção (revela o esquema), consultas muito profundas ou em lote que sobrecarregam o servidor e autorização aplicada só em alguns campos. Defesas: limitar profundidade e custo das consultas, desativar introspecção em produção, aplicar autorização por campo e por objeto.

Ferramentas de teste: Postman, Insomnia, Burp Suite, OWASP ZAP e scanners de APIs a partir de especificações OpenAPI. Pratique em ambientes feitos para isso (crAPI, Juice Shop, DVGA) e use testes automatizados de contrato e de autorização no CI.` }
  ],
  terms: [['BOLA / IDOR', 'Acesso a objetos de outros usuários pela troca de um identificador.'], ['BFLA', 'Acesso a funções administrativas por usuários sem permissão.'], ['Mass assignment', 'Aceitar campos do cliente que deveriam ser controlados pelo servidor.'], ['Rate limiting', 'Limitar o número de requisições por tempo.'], ['Introspecção GraphQL', 'Consulta que revela o esquema completo da API.'], ['OpenAPI', 'Especificação padronizada para descrever APIs REST.'], ['API sombra', 'API esquecida ou não documentada, exposta sem controle.']],
  practice: ['Suba o OWASP Juice Shop ou o crAPI localmente e tente achar um BOLA trocando identificadores (somente nesses laboratórios).', 'Liste os endpoints de uma API sua (ou de exemplo) e marque quais exigem autenticação e quais checam o dono do objeto.', 'Escreva um teste automatizado de autorização: usuário A tenta ler um objeto do usuário B e deve receber 403 ou 404.'],
  quiz: [
    { q: 'O que é BOLA?', o: ['Um tipo de criptografia', 'Acesso indevido a objetos de outros usuários por falha na autorização por objeto', 'Um ataque de DNS', 'Um erro de CSS'], a: 1, e: 'É o equivalente a IDOR em APIs e uma das falhas mais comuns.' },
    { q: 'Qual a melhor defesa contra mass assignment?', o: ['Aceitar todo o JSON recebido', 'Permitir apenas uma lista de campos conhecidos', 'Esconder os campos no app', 'Aumentar o tamanho do corpo'], a: 1, e: 'O servidor decide quais campos o cliente pode alterar.' },
    { q: 'Por que limitar requisições (rate limiting)?', o: ['Para economizar papel', 'Para dificultar força bruta, scraping e abuso', 'Para ocultar erros', 'Para bloquear o TLS'], a: 1, e: 'Sem limites, um atacante automatiza tentativas em larga escala.' },
    { q: 'O que são APIs sombra (shadow APIs)?', o: ['APIs com tema escuro', 'APIs esquecidas ou não documentadas que continuam expostas', 'APIs criptografadas', 'APIs de backup'], a: 1, e: 'Sem inventário, elas ficam sem correção e sem monitoramento.' },
    { q: 'Qual recomendação vale para GraphQL em produção?', o: ['Manter introspecção sempre ligada', 'Limitar profundidade e custo e desativar introspecção', 'Aceitar consultas ilimitadas', 'Não ter autenticação'], a: 1, e: 'Consultas profundas e introspecção aberta facilitam abusos.' }
  ],
  cards: [['BOLA x BFLA?', 'BOLA: acesso a objetos alheios; BFLA: acesso a funções administrativas.'], ['O que é mass assignment?', 'O servidor aceita campos que o cliente não deveria definir (como admin=true).'], ['Como evitar BOLA?', 'Checar no servidor, em toda requisição, se o usuário pode acessar aquele objeto.'],
    ['Para que serve rate limiting?', 'Limitar abuso, força bruta, scraping e consumo de recursos.'], ['Riscos de GraphQL?', 'Introspecção aberta, consultas profundas e autorização incompleta por campo.'], ['Como manter inventário de APIs?', 'Catálogo de endpoints e versões com donos definidos e desligamento de versões antigas.']]
},
{ id: 'm36', level: 3, icon: '🏭', title: 'Segurança industrial (OT/ICS) e infraestrutura crítica', mins: 24,
  intro: 'Fábricas, usinas, estações de tratamento e redes elétricas funcionam com sistemas de controle. Uma falha ali pode ferir pessoas, por isso as prioridades são diferentes das de TI.',
  sections: [
    { h: 'TI x OT: prioridades diferentes', p: `Na TI de escritório, a ordem costuma ser confidencialidade, integridade e disponibilidade. Na tecnologia operacional (OT), que controla processos físicos, a ordem se inverte: segurança das pessoas e disponibilidade vêm primeiro.

Características da OT:
• Equipamentos de vida longa (10 a 30 anos), difíceis de atualizar e muitas vezes sem suporte.
• Protocolos antigos sem autenticação (Modbus, DNP3, versões de PROFINET e outros).
• Paradas custam muito e podem ser perigosas; testes invasivos podem derrubar processos.
• Componentes: CLPs/PLCs, RTUs, IHMs, SCADA, historiadores, redes industriais.
Com a convergência IT/OT e acessos remotos, sistemas antes isolados passaram a ser alcançáveis.` },
    { h: 'Modelo de referência e segmentação', p: `O modelo Purdue organiza a rede industrial em níveis:
• Nível 0: processo físico (sensores, atuadores).
• Nível 1: controle básico (CLPs).
• Nível 2: supervisão local (IHMs, SCADA).
• Nível 3: operações (gerenciamento da produção, historiadores).
• Nível 3.5: zona desmilitarizada industrial (DMZ) entre TI e OT.
• Níveis 4 e 5: TI corporativa e internet.
A defesa central é segmentar: firewalls entre níveis, DMZ para troca de dados, acesso remoto por jump hosts com MFA e proibição de acesso direto da internet à OT. A norma IEC 62443 define zonas, conduítes e requisitos de segurança.` },
    { h: 'Incidentes que marcaram o setor', p: `• Stuxnet (2010): malware sofisticado que sabotou centrífugas, mostrando que ataques podem causar dano físico.
• Ucrânia (2015 e 2016): ataques à rede elétrica deixaram centenas de milhares de pessoas sem energia (BlackEnergy e Industroyer).
• Triton/Trisis (2017): ataque a sistemas de segurança instrumentados de uma planta petroquímica.
• Oldsmar, Flórida (2021): invasão de acesso remoto a uma estação de tratamento de água, com tentativa de alterar produtos químicos; foi percebida e revertida a tempo.
• Colonial Pipeline (2021): ransomware na parte de TI levou a empresa a interromper preventivamente a operação do oleoduto.
Lição: muitos incidentes começam por acessos remotos mal protegidos, senhas fracas e falta de segmentação.` },
    { h: 'Defesas para ambientes industriais', p: `• Inventário de ativos (passivo, sem consultas que derrubem equipamentos) e mapa de comunicações.
• Segmentação e DMZ, com regras mínimas entre IT e OT.
• Acesso remoto com MFA, sessões gravadas e janelas de manutenção.
• Monitoramento passivo de rede industrial (detecção de comandos fora do normal).
• Gestão de patches planejada, com testes em ambiente de homologação, e controles compensatórios quando não é possível atualizar.
• Backup de lógica dos CLPs e de configurações, com procedimentos de restauração.
• Controle de mídias removíveis e de notebooks de terceiros.
• Treinamento e planos de resposta que envolvam engenharia e operação, não só a TI.
• Segurança funcional (safety) e cibersegurança andam juntas.` },
    { h: 'Estudando OT com segurança', p: `Nunca teste sistemas industriais reais sem autorização formal e acompanhamento da engenharia. Para aprender:
• Simuladores e laboratórios virtuais (OpenPLC, ScadaBR, laboratórios de universidades).
• Capturas de tráfego industrial públicas para análise no Wireshark (Modbus, DNP3).
• Guias e normas: IEC 62443, NIST SP 800-82, MITRE ATT&CK for ICS.
• Comunidades e cursos introdutórios de segurança em ICS.
Carreira: engenharia de segurança OT, analista de monitoramento industrial e integração entre TI, automação e segurança.` }
  ],
  terms: [['OT', 'Tecnologia operacional: sistemas que controlam processos físicos.'], ['ICS / SCADA', 'Sistemas de controle industrial e de supervisão e aquisição de dados.'], ['CLP / PLC', 'Controlador lógico programável que comanda equipamentos.'], ['Modelo Purdue', 'Modelo de níveis para organizar redes industriais.'], ['IEC 62443', 'Norma de segurança para sistemas de automação e controle industrial.'], ['DMZ industrial', 'Zona intermediária entre a rede corporativa e a rede de produção.'], ['Segurança funcional (safety)', 'Proteção de pessoas e do ambiente contra falhas do processo.']],
  practice: ['Desenhe em papel um diagrama simples de uma fábrica fictícia com os níveis Purdue e marque onde ficaria o firewall e a DMZ.', 'Baixe uma captura pública de tráfego Modbus e identifique no Wireshark os comandos de leitura e escrita.', 'Pesquise o incidente de Oldsmar e liste 3 controles que teriam evitado o risco.'],
  quiz: [
    { q: 'Na OT, qual prioridade costuma vir primeiro?', o: ['Confidencialidade dos dados', 'Segurança das pessoas e disponibilidade do processo', 'Velocidade do download', 'Aparência das telas'], a: 1, e: 'Falhas podem causar acidentes e paradas caras.' },
    { q: 'O que é uma DMZ industrial?', o: ['Um tipo de CLP', 'Zona intermediária entre a TI e a OT para troca controlada de dados', 'Um backup', 'Um protocolo'], a: 1, e: 'Evita conexões diretas entre a rede corporativa e a de produção.' },
    { q: 'Por que muitos equipamentos industriais ficam sem atualização?', o: ['Porque são gratuitos', 'Porque têm vida longa e paradas são caras ou arriscadas', 'Porque não usam energia', 'Porque não têm firmware'], a: 1, e: 'Patches exigem janelas de manutenção e testes cuidadosos.' },
    { q: 'O que o ataque da Ucrânia em 2015 mostrou?', o: ['Que redes elétricas são imunes', 'Que ataques cibernéticos podem causar apagões', 'Que antivírus bastam', 'Que só TI importa'], a: 1, e: 'Foi um dos primeiros ataques a causar queda de energia em larga escala.' },
    { q: 'Qual é uma boa prática para acesso remoto à OT?', o: ['Acesso direto da internet ao CLP', 'Jump host com MFA e sessões registradas', 'Senha padrão', 'Compartilhar contas'], a: 1, e: 'Acesso controlado e auditado reduz o risco.' }
  ],
  cards: [['O que é OT?', 'Tecnologia operacional que controla processos físicos.'], ['Quais os níveis do modelo Purdue?', '0 processo, 1 controle, 2 supervisão, 3 operações, 3.5 DMZ, 4-5 TI e internet.'], ['Qual norma trata segurança de automação industrial?', 'IEC 62443.'],
    ['Por que Modbus é arriscado?', 'Foi criado sem autenticação nem criptografia.'], ['O que foi o Stuxnet?', 'Malware que sabotou centrífugas, causando dano físico.'], ['Como proteger acesso remoto à OT?', 'MFA, jump host, registro de sessões e janelas de manutenção.']]
}
);

{ id: 'm37', level: 3, icon: '🪙', title: 'Blockchain, criptoativos e golpes cripto', mins: 24,
  intro: 'Criptoativos misturam tecnologia interessante com muita fraude. Entenda o básico de blockchain, como guardar chaves com segurança e como reconhecer os golpes mais comuns.',
  sections: [
    { h: 'Blockchain em poucas linhas', p: `Uma blockchain é um registro compartilhado e encadeado: cada bloco guarda o hash do bloco anterior, então alterar o passado exigiria refazer todos os blocos seguintes. Uma rede de nós aplica regras de consenso (por exemplo, prova de trabalho ou prova de participação) para decidir quais blocos são válidos.

Ideias de segurança envolvidas: hashes, assinaturas digitais (cada transação é assinada com a chave privada), consenso e transparência. Os dados são públicos, mas os endereços são pseudônimos, não anônimos: é possível rastrear fluxos de dinheiro.` },
    { h: 'Carteiras, chaves e frase de recuperação', p: `Quem controla a chave privada controla os fundos. A carteira é o software ou dispositivo que guarda e usa as chaves.

• Custodial: uma exchange guarda as chaves por você (praticidade, mas depende da empresa).
• Não custodial: você guarda as chaves (controle total e responsabilidade total).
• Hardware wallet: dispositivo dedicado que assina transações sem expor a chave.
• Frase de recuperação (seed phrase, 12 ou 24 palavras): reconstrói todas as chaves. Quem a tiver, tem o dinheiro. Guarde offline (papel ou metal), em local seguro, e nunca a digite em sites, nem a fotografe, nem a envie a ninguém, nem a "valide" para suporte algum.
• Nunca existe suporte legítimo que peça a frase de recuperação.` },
    { h: 'Golpes e ataques mais comuns', p: `• Phishing de carteira: sites falsos que pedem a frase de recuperação ou fazem você assinar uma transação que esvazia a carteira (aprovações de token maliciosas).
• Falso suporte em chats e redes sociais.
• Giveaways e "airdrops" falsos, muitas vezes com deepfakes de celebridades: "envie 1 e receba 2 de volta".
• Rug pull: criadores de um token ou projeto retiram a liquidez e somem.
• Pump and dump: grupos inflam o preço e vendem sobre os compradores.
• Pig butchering: golpe de relacionamento que leva a vítima a investir em plataformas falsas por meses.
• Clipboard hijacker: malware que troca o endereço copiado por outro do golpista; confira o endereço antes de enviar.
• Esquemas piramidais disfarçados de "mineração" ou "staking" com retorno garantido.` },
    { h: 'Contratos inteligentes e DeFi', p: `Contratos inteligentes são programas que rodam na blockchain e não podem ser corrigidos facilmente depois de publicados. Falhas comuns:
• Reentrância: o contrato chama outro contrato antes de atualizar seu próprio saldo, permitindo saques repetidos (caso The DAO, 2016).
• Estouro e arredondamento aritmético, controle de acesso mal feito, dependência de oráculos de preço manipuláveis (ataques com empréstimos relâmpago), chaves de administrador comprometidas.
Grandes roubos em pontes (bridges) e protocolos DeFi mostram o risco. Boas práticas: auditorias independentes, testes e verificação formal, limites e pausas de emergência, multiassinatura para chaves administrativas e programas de recompensa por falhas (bug bounty).` },
    { h: 'Regulação e boas práticas', p: `• No Brasil, o Banco Central regula prestadores de serviços de ativos virtuais e a CVM atua quando o ativo é tratado como valor mobiliário. Verifique se a empresa é autorizada.
• Use exchanges com boa reputação, verificação em duas etapas por app ou chave e lista de endereços de saque autorizados.
• Não invista o que não pode perder; retorno garantido é sinal de golpe.
• Teste enviando um valor pequeno antes de uma transferência grande e confira o endereço (primeiros e últimos caracteres).
• Mantenha o sistema do computador e da carteira atualizados e evite instalar software de fontes desconhecidas.
• Guarde registros de operações para fins fiscais.` }
  ],
