PHISH.push(
  { id: 'ph27', kind: 'call', from: '+55 11 4004-xxxx (aparece como "Banco Horizonte")', body: 'Atendente: Bom dia, aqui é da central de segurança do Banco Horizonte. Detectamos uma compra de R$ 4.890 em Dubai no seu cartão.\nVocê: Não fui eu!\nAtendente: Fique tranquilo, vamos bloquear. Para cancelar, preciso que o senhor instale o aplicativo "Segurança Horizonte" que vou enviar agora e informe o código que aparecer na tela. É rápido.\nVocê: Mas isso é seguro?\nAtendente: Claro. Se o senhor desligar agora, a compra será efetivada.', phish: true,
    flags: ['Ligação inesperada que cria medo e pressa', 'Pede a instalação de um aplicativo (acesso remoto)', 'Pede um código exibido na tela', 'Ameaça: "se desligar, a compra será efetivada"', 'Número que "aparece como" o banco pode ser falsificado (spoofing)'], why: 'O banco nunca pede instalação de apps nem códigos por telefone. Desligue e ligue você mesmo para o número do cartão (de preferência de outro telefone).' },
  { id: 'ph28', kind: 'call', from: '+55 21 3xxx-8800', body: 'Atendente: Falo do setor de fraudes. Seu cartão final 4821 foi clonado. Já cancelamos, mas precisamos recolher o cartão para destruição. Um motoboy passa aí em 30 minutos.\nVocê: Mas eu preciso fazer algo?\nAtendente: Apenas digite a senha do cartão no telefone para confirmar o cancelamento e entregue o cartão e o envelope ao motoboy.', phish: true,
    flags: ['Cartão "recolhido por motoboy" é o golpe do motoboy', 'Pede senha do cartão por telefone', 'Cria urgência de 30 minutos'], why: 'Banco nenhum recolhe cartões em casa nem pede a senha. Corte a ligação e avise o banco pelo número oficial.' },
  { id: 'ph29', kind: 'call', from: '+55 61 9xxxx-2201', body: 'Atendente: Bom dia, seu João. Falo do INSS. Identificamos um valor retroativo de R$ 7.300 disponível em seu benefício. Para liberar, preciso confirmar o número do seu benefício, CPF e a senha do aplicativo.\nVocê: Mas por que eu preciso dar a senha?\nAtendente: É a única forma de transferir hoje. Amanhã o valor volta para o governo.', phish: true,
    flags: ['Promessa de valor "retroativo"', 'Pede senha de aplicativo', 'Prazo curto para liberar'], why: 'O INSS não liga pedindo senha. Consulte pelo Meu INSS (digitando o endereço) ou pelo 135.' },
  { id: 'ph30', kind: 'wa', from: '+55 11 9xxxx-0440', body: 'Boa tarde! Fiz um Pix de R$ 600 para você por engano, era para o meu fornecedor. Pode devolver? Já te mando o comprovante. Se puder devolver agora, agradeço muito 🙏', phish: true,
    flags: ['Pix "por engano" com pedido de devolução imediata', 'Comprovante pode ser falso', 'O valor pode ter vindo de fraude e ser estornado depois'], why: 'Antes de devolver, confira no extrato do banco se o dinheiro realmente entrou. Devolva pelo recurso de devolução do app do banco, não por nova chave informada em conversa.' },
  { id: 'ph31', kind: 'email', from: 'Fatura Cartão <fatura@cartao-fatura-online.example>', subj: 'Sua fatura de março vence amanhã — anexo', body: 'Prezado(a),\n\nSua fatura de março está disponível. Evite juros e bloqueio: abra o arquivo anexo e confira os lançamentos.\n\nAnexo: fatura_marco_2025.zip (senha: 1234)', phish: true,
    flags: ['Anexo .zip com senha informada no próprio e-mail (escapa de antivírus)', 'Saudação genérica', 'Urgência de vencimento', 'Domínio que não é do emissor do cartão'], why: 'Faturas legítimas são consultadas no app ou no site oficial. Arquivos protegidos por senha enviada no mesmo e-mail são um truque para driblar o antivírus.' },
  { id: 'ph32', kind: 'sms', from: 'Operadora', body: 'Seu chip será bloqueado em 24h por falta de atualização cadastral. Atualize agora: meu-cadastro-operadora.atualiza.example/chip', links: [{ t: 'meu-cadastro-operadora.atualiza.example/chip', u: 'http://meu-cadastro-operadora.atualiza.example/chip' }], phish: true,
    flags: ['Ameaça de bloqueio', 'Domínio que não é da operadora', 'Prazo curto'], why: 'Dados cadastrais são atualizados pelo aplicativo oficial da operadora. O golpista quer seus dados para clonar o chip (SIM swap).' },
  { id: 'ph33', kind: 'wa', from: 'Comprador (anúncio de venda)', body: 'Olá, tenho interesse no produto. Já fechei a compra e vou pagar pelo "pagamento protegido". Vou te mandar o link para você receber o valor, é só colocar seus dados do cartão ali para liberar.', links: [{ t: 'link de recebimento', u: 'http://pagamento-protegido.recebe-seguro.example/liberar' }], phish: true,
    flags: ['Para receber dinheiro, você nunca precisa informar dados do cartão', 'Link fora da plataforma de vendas', 'Pressão para sair da plataforma original'], why: 'Para receber um pagamento basta a sua chave Pix ou conta. Pedir dados do cartão e links externos é golpe do "falso comprador".' },
  { id: 'ph34', kind: 'email', from: 'Marina Costa - Recrutadora <marina.costa@talentos-vagas.example>', subj: 'Oportunidade sênior + teste técnico', body: 'Olá! Vi seu perfil no LinkedIn e adorei sua experiência. Para avançar, precisamos que você baixe nosso aplicativo de avaliação, rode o arquivo e envie o resultado em até 2 horas.\n\nAnexo: AvaliacaoTecnica_v3.exe', phish: true,
    flags: ['Pede execução de um arquivo .exe', 'Prazo curto para o teste', 'Domínio genérico, sem relação com uma empresa real'], why: 'Recrutadores reais usam plataformas de testes online, não executáveis anexados. É um método usado para instalar malware em profissionais.' },
  { id: 'ph35', kind: 'email', from: 'Administrador do Sistema <admin@sua-empresa-suporte.example>', subj: 'Sua caixa de e-mail está 98% cheia', body: 'Sua caixa de e-mail atingiu o limite. Novas mensagens serão rejeitadas em 24h. Para aumentar o espaço gratuitamente, entre com seu usuário e senha:\n\n[Aumentar espaço]', links: [{ t: 'Aumentar espaço', u: 'http://webmail-espaco.login-empresa.example/auth' }], phish: true,
    flags: ['Ameaça de perda de mensagens', 'Pede usuário e senha em um link', 'Domínio diferente do da empresa'], why: 'Aumentos de cota são feitos pelo TI ou pelo painel oficial do provedor, sem pedir sua senha por link.' },
  { id: 'ph36', kind: 'email', from: 'Assinatura Digital <envio@docs-assinaturas.example>', subj: 'Documento aguardando sua assinatura: Contrato_2025', body: 'Olá,\n\nUm documento foi compartilhado com você e aguarda assinatura. Clique para visualizar e assinar.\n\n[Revisar documento]\n\nEste link expira em 12 horas.', links: [{ t: 'Revisar documento', u: 'https://docs-assinaturas.example/view?id=a8f3k2&u=login-microsoft' }], phish: true,
    flags: ['Documento que você não esperava', 'Link que leva a uma página de login', 'Expiração curta', 'Remetente desconhecido'], why: 'Em dúvida, abra a plataforma de assinatura digitando o endereço e procure o documento. Se você não esperava, confirme com quem teria enviado.' },
  { id: 'ph37', kind: 'sms', from: 'CNH-Brasil', body: 'CNH Social: você foi selecionado para tirar a habilitação gratuita! Cadastre-se hoje: cnh-social-gratis.cadastro.example', links: [{ t: 'cnh-social-gratis.cadastro.example', u: 'http://cnh-social-gratis.cadastro.example/' }], phish: true,
    flags: ['Benefício que você nunca solicitou', 'Domínio que não é gov.br', 'Pede cadastro com dados pessoais'], why: 'Programas oficiais são divulgados em sites gov.br e canais do governo estadual. O objetivo é coletar CPF e dados.' },
  { id: 'ph38', kind: 'sms', from: 'FGTS-CAIXA', body: 'FGTS: saque calamidade liberado para o seu CPF. Consulte o valor e solicite: caixa-fgts.saque-liberado.example/consulta', links: [{ t: 'caixa-fgts.saque-liberado.example/consulta', u: 'http://caixa-fgts.saque-liberado.example/consulta' }], phish: true,
    flags: ['Valor "liberado" em mensagem não solicitada', 'Domínio falso imitando banco público', 'Pede consulta por link'], why: 'Consulte o FGTS pelo aplicativo oficial. Golpistas aproveitam notícias de liberações de saque.' },
  { id: 'ph39', kind: 'wa', from: 'Atendimento Auxílio Brasil', body: 'Você tem direito a um benefício de R$ 1.200 que ainda não foi sacado. Para regularizar, preencha o formulário no link e informe os dados do cartão para depósito.', links: [{ t: 'formulario-beneficio', u: 'http://beneficio-federal.regulariza-cpf.example/form' }], phish: true,
    flags: ['Benefício que aparece do nada', 'Pede dados do cartão para "depósito"', 'Link fora de gov.br'], why: 'Para receber depósitos, ninguém precisa informar dados de cartão. Benefícios são consultados em canais oficiais.' },
  { id: 'ph40', kind: 'email', from: 'Segurança da Conta <seguranca@banco-autenticacao.example>', subj: 'Autenticação obrigatória: escaneie o QR Code', body: 'Para manter sua conta ativa, escaneie o QR Code abaixo com o aplicativo do seu banco e confirme a autenticação.\n\n[QR CODE]\n\nPrazo: hoje, até 23:59.', phish: true,
    flags: ['QR Code em e-mail (quishing)', 'Prazo curto', 'Pedido de "autenticação obrigatória" sem contexto', 'Remetente de domínio estranho'], why: 'QR Codes escondem o endereço real e driblam filtros. Para autenticar, abra o app diretamente e veja se há avisos.' },
  { id: 'ph41', kind: 'sms', from: 'Pedágio', body: 'Você possui um pedágio pendente de R$ 11,40. Evite multa e protesto: regularize em ate 24h em pedagio-pendente.regulariza.example/pagar', links: [{ t: 'pedagio-pendente.regulariza.example/pagar', u: 'http://pedagio-pendente.regulariza.example/pagar' }], phish: true,
    flags: ['Valor baixo para parecer plausível', 'Ameaça de multa e protesto', 'Domínio que não é da concessionária ou do governo'], why: 'Cobranças reais vêm do aplicativo ou site da concessionária que você usa. Valores baixos reduzem a desconfiança.' },
  { id: 'ph42', kind: 'email', from: 'Roberto (Fornecedor Silva LTDA) <financeiro@silva-ltda.example>', subj: 'Atualização de dados bancários — próximo pagamento', body: 'Prezados,\n\nInformamos que nossa conta bancária foi alterada. Peço que os próximos pagamentos sejam feitos para a nova conta abaixo.\n\nBanco: 000 | Ag: 0000 | C/C: 00000-0\n\nAtt., Roberto', phish: true,
    flags: ['Mudança de conta bancária só por e-mail', 'Sem confirmação por outro canal', 'Domínio muito parecido com o do fornecedor (possível imitação)'], why: 'É a fraude de troca de dados bancários (BEC). Sempre confirme mudanças de conta por telefone conhecido ou por um processo formal.' },
  { id: 'ph43', kind: 'email', from: 'Alerta de Segurança <alerta@conta-protegida.example>', subj: 'Novo login suspeito: Moscou, Rússia', body: 'Detectamos um login na sua conta a partir de Moscou, Rússia. Se não foi você, proteja sua conta agora:\n\n[Proteger minha conta]\n\nCaso não haja resposta em 1 hora, a conta será suspensa.', links: [{ t: 'Proteger minha conta', u: 'http://conta-protegida.example/revisar?token=3f2a' }], phish: true,
    flags: ['Gera medo com um local distante', 'Prazo de 1 hora', 'Link em domínio que não é do serviço', 'Mensagem genérica sem identificar a conta'], why: 'Alertas reais podem existir, mas você deve entrar pelo app ou site oficial digitado por você e revisar a atividade lá.' },
  { id: 'ph44', kind: 'wa', from: 'Amigo (conta clonada?)', body: 'Oi! Tudo bem? Cadastrei seu número em uma votação do meu sobrinho (concurso de fotos). Vai chegar um código por SMS, me manda aqui por favor para eu confirmar seu voto 🙏', phish: true,
    flags: ['Pede o código que chega por SMS', 'Justificativa inocente (votação)', 'Pode vir de um amigo cuja conta foi clonada'], why: 'Esse código é o do WhatsApp (ou de outro serviço) e dá acesso à sua conta. Nunca repasse códigos, mesmo para conhecidos.' },
  { id: 'ph45', kind: 'email', from: 'Administradora do Condomínio <cobranca@condominio-segundavia.example>', subj: 'Segunda via do boleto de condomínio — vencimento hoje', body: 'Prezado condômino,\n\nSegue a segunda via do boleto com juros atualizados. Pague hoje para evitar protesto.\n\n[Imprimir boleto]', links: [{ t: 'Imprimir boleto', u: 'http://condominio-segundavia.example/boleto.php?u=1021' }], phish: true,
    flags: ['Boleto "atualizado" por e-mail com link', 'Ameaça de protesto', 'Domínio que não é o da administradora que você conhece'], why: 'Confirme com a administradora por um canal que você já conhecia e confira o beneficiário no app do banco antes de pagar.' },
  { id: 'ph46', kind: 'sms', from: 'Shopee-Info', body: 'Seu pedido foi cancelado por problema de estoque. Reembolso disponível: confirme seus dados bancários em shopee-reembolso.confirma.example', links: [{ t: 'shopee-reembolso.confirma.example', u: 'http://shopee-reembolso.confirma.example/' }], phish: true,
    flags: ['Reembolso que pede dados bancários', 'Domínio que não é da loja', 'Cancelamento sem identificar o pedido'], why: 'Reembolsos são feitos no app da loja, no mesmo meio de pagamento, sem pedir dados em links de SMS.' },
  { id: 'ph47', kind: 'email', from: 'Receita Federal <restituicao@receita-gov-br.example>', subj: 'Restituição disponível: consulte seu lote', body: 'Seu lote de restituição do Imposto de Renda está disponível. Para receber, atualize seus dados e confirme o CPF.\n\n[Consultar restituição]', links: [{ t: 'Consultar restituição', u: 'http://receita-gov-br.example/restituicao' }], phish: true,
    flags: ['Domínio "receita-gov-br" imita gov.br', 'Pede atualização de dados por link', 'Mensagem genérica'], why: 'A consulta oficial é feita no site da Receita ou no app, digitando o endereço. O domínio real termina em .gov.br.' },
  { id: 'ph48', kind: 'wa', from: 'Suporte Instagram', body: 'Sua conta será excluída em 24 horas por violação de direitos autorais. Se acredita ser um engano, preencha o formulário de contestação com seu login e senha.', links: [{ t: 'formulario-contestacao', u: 'http://suporte-contestacao.login-rede.example/form' }], phish: true,
    flags: ['A rede social não contata por WhatsApp', 'Pede login e senha em formulário externo', 'Ameaça de exclusão'], why: 'O suporte oficial usa as notificações dentro do aplicativo. Esse golpe sequestra contas para aplicar fraudes.' },
  { id: 'ph49', kind: 'email', from: 'Cobrança Assinatura <cobranca@software-assinatura.example>', subj: 'Fatura #884210: R$ 2.499,90 — sua assinatura foi renovada', body: 'Sua assinatura anual foi renovada e o valor de R$ 2.499,90 será debitado hoje. Para cancelar ou contestar, ligue imediatamente: 0800 000 3333.', phish: true,
    flags: ['Cobrança alta que você não reconhece', 'Pede para ligar para um número no próprio e-mail', 'Sem detalhes da compra'], why: 'É o golpe do "suporte por telefone": o atendente pede acesso remoto ou dados bancários para "estornar". Verifique no seu banco e no site do fornecedor.' },
  { id: 'ph50', kind: 'wa', from: '+55 11 9xxxx-2299', body: 'Olá! Vaga de estagiário(a) home office, R$ 3.500, 4h por dia. Para começar, baixe o Telegram e fale com nossa gerente. Você receberá um valor para teste antes de contratar.', phish: true,
    flags: ['Salário alto para pouca exigência', 'Muda o contato para outra plataforma', 'Depósito inicial para "teste"'], why: 'É a fraude das "tarefas pagas": começa com pequenos pagamentos para ganhar confiança e depois pede investimento.' },
  { id: 'ph51', kind: 'sms', from: 'Banco Horizonte', body: 'Seu cartão foi bloqueado por segurança. Para desbloquear ligue 3003-0000 e informe o número do cartão e a senha.', phish: true,
    flags: ['Número de telefone do próprio SMS', 'Pede senha do cartão', 'Bloqueio sem contexto'], why: 'Use apenas o número impresso no cartão ou no app do banco. Nunca informe a senha por telefone.' },
  { id: 'ph52', kind: 'call', from: 'Gravação automática', body: 'Gravação: Atenção. Seu CPF será suspenso por pendência com a Receita Federal. Pressione 1 para falar com um atendente e regularizar agora.\n(você pressiona 1)\nAtendente: Para regularizar, precisamos que o senhor faça um pagamento de taxa de R$ 187 via Pix para a conta do Tesouro.', phish: true,
    flags: ['Robocall com ameaça de suspensão do CPF', 'Pede Pix de "taxa" para regularizar', 'O CPF não é "suspenso" por ligação'], why: 'A Receita não cobra regularização por Pix para contas pessoais nem liga com ameaças. Desligue e consulte pelos canais oficiais.' },
  { id: 'ph53', kind: 'email', from: 'Pesquisa de Satisfação <premios@pesquisa-brasil.example>', subj: 'Responda 3 perguntas e ganhe um cartão-presente de R$ 500', body: 'Você foi selecionado(a) para uma pesquisa rápida. Ao final, informe seus dados de entrega para receber o cartão-presente. Restam apenas 12 vagas!', links: [{ t: 'Iniciar pesquisa', u: 'http://pesquisa-brasil.example/premio' }], phish: true,
    flags: ['Prêmio grande por pouco esforço', 'Escassez ("restam 12 vagas")', 'Coleta de dados pessoais'], why: 'Pesquisas premiadas são uma forma de coletar dados e levar a cobranças. Se parece bom demais, desconfie.' },

  ['b_ctfall', '🏴', 'Mestre das flags', 'Resolva todos os desafios de CTF', () => Object.keys(state.ctf.solved).length >= CTF_CHALLENGES.length], ['b_nohint', '🧠', 'Sem muletas', 'Resolva 3 desafios sem dicas', () => Object.values(state.ctf.solved).filter(x => x.hints === 0).length >= 3],
  ['b_streak7', '🔥', 'Uma semana', '7 dias seguidos de estudo', () => studyStreak().best >= 7], ['b_streak30', '🌋', 'Constância', '30 dias seguidos de estudo', () => studyStreak().best >= 30],
  ['b_cards', '🃏', 'Memória de elefante', 'Revise 50 cartões diferentes', () => Object.keys(state.cards).length >= 50], ['b_logs', '📜', 'Analista de logs', 'Resolva todos os logs por completo', () => Object.values(LOGS).every(L => state.logs.done[L.id] && state.logs.done[L.id].best === L.qs.length)],
  ['b_scen', '🎯', 'Estrategista', 'Alcance 80% em todos os cenários', () => SCENARIOS.every(S => state.scen.done[S.id] && state.scen.done[S.id].best >= 80)], ['b_threat', '🧩', 'Modelador', 'Monte um modelo de ameaças com 6+ itens', () => state.threat.some(m => m.items.length >= 6)],
  ['b_check', '🛡️', 'Cuidado pessoal', 'Cumpra 80% do checklist pessoal', () => PERSONAL_CHECK.filter(c => state.personal.check[c.id]).length >= PERSONAL_CHECK.length * 0.8], ['b_nb', '📓', 'Caderno cheio', 'Registre 5 itens no caderno de CTFs', () => state.ctf.notebook.length >= 5],
  ['b_exam', '🎓', 'Aprovado', 'Passe em um simulado (70% ou mais)', () => (state.quiz.exams || []).some(e => e.pct >= 70)],
  ['b_links', '🔗', 'Faro para links', 'Acerte 30 endereços em "Link falso ou verdadeiro?"', () => Object.values(state.linkq.stats).reduce((s, x) => s + x.ok, 0) >= 30],
  ['b_lab', '🧪', 'Cientista', 'Use 6 ferramentas diferentes do laboratório', () => Object.keys(state.study.lab || {}).length >= 6], ['b_lvl', '⭐', 'Defensor', 'Chegue ao nível Defensor', () => levelInfo().i >= 4]
].map(b => ({ id: b[0], icon: b[1], name: b[2], desc: b[3], test: b[4] }));
function checkBadges() {
  BADGES.forEach(b => { if (!state.badges[b.id]) { let ok = false; try { ok = b.test(); } catch (e) {} if (ok) { state.badges[b.id] = todayISO(); setTimeout(() => toast(`🏅 Conquista: ${b.name}!`), 600); } } });
}
