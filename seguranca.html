<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark" data-skin="terminal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b1511">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1511'/%3E%3Ctext x='32' y='46' font-size='38' text-anchor='middle'%3E%F0%9F%9B%A1%EF%B8%8F%3C/text%3E%3C/svg%3E">
<title>Escola de Segurança</title>
<style>
/* =====================================================================
   ESTILOS — as cores vêm das variáveis (--bg, --accent…), trocadas pelo seletor de visuais
   ===================================================================== */
:root{
  --radius:14px; --radius-sm:10px; --danger:#ef4444; --warn:#f59e0b; --good:#34d399;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  --bg:#070d0a; --header:#0b1511; --surface:#0f1b16; --surface2:#15271f; --border:#244236;
  --text:#e3f4ea; --muted:#8fb3a1; --accent:#3dff9a; --accent-ink:#022414; --accent-soft:rgba(61,255,154,.14);
  --shadow:0 8px 28px rgba(0,0,0,.5); --glow:none; --header-img:none; --body-img:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);background-image:var(--body-img);background-attachment:fixed;color:var(--text);font-family:var(--font);line-height:1.5;font-size:15px;transition:background .2s,color .2s}
h1,h2,h3,h4{margin:0;line-height:1.25;font-family:var(--font-head,var(--font))}
h1{letter-spacing:var(--head-ls,0);text-transform:var(--head-tt,none)}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:13px} .hidden{display:none!important}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
body.locked #app-header,body.locked #notices,body.locked #tabs,body.locked #view{display:none}
body.blur #view,body.blur #tabs{filter:blur(16px);pointer-events:none;user-select:none}

/* ---------- Cabeçalho e abas ---------- */
.app-header{position:sticky;top:0;z-index:20;background:var(--header);background-image:var(--header-img);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
.header-inner{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:20px;box-shadow:var(--glow)}
.header-actions{margin-left:auto;display:flex;gap:8px}
.icon-btn{border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:var(--radius-sm);min-width:40px;min-height:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;position:relative}
.icon-btn:hover{border-color:var(--accent)}
.badge-dot{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:var(--warn);border:2px solid var(--header)}
.xpbox{display:flex;flex-direction:column;gap:3px;min-width:96px;font-size:11px;color:var(--muted)}
.xpbox b{color:var(--text);font-size:12px}
.xpbar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--border)}
.xpbar i{display:block;height:100%;background:var(--accent)}
@media (max-width:560px){.xpbox{display:none}.brand span{display:none}}
.tabs{max-width:1120px;margin:0 auto;display:flex;overflow-x:auto;gap:4px;padding:0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:none;color:var(--muted);padding:11px 14px;border-bottom:3px solid transparent;font-weight:600;white-space:nowrap;min-height:44px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
html[data-tabs="pills"] .tabs{padding:8px 10px;gap:6px}
html[data-tabs="pills"] .tab{border-bottom:0;border-radius:999px;padding:8px 16px;min-height:0;background:var(--surface2);border:1px solid var(--border)}
html[data-tabs="pills"] .tab.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:var(--glow)}
main{max-width:1120px;margin:0 auto;padding:18px 16px calc(90px + env(safe-area-inset-bottom))}
.notice{max-width:1120px;margin:10px auto 0;padding:0 16px}
.notice-in{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--warn);border-radius:var(--radius-sm);padding:8px 12px}
.notice-in.err{border-left-color:var(--danger);color:var(--text)}
button.link{background:none;border:0;color:var(--accent);padding:4px 2px;text-decoration:underline;font-size:inherit}

/* ---------- Botões, cartões, grades ---------- */
.btn{border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:var(--radius-sm);padding:9px 14px;min-height:40px;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:var(--glow)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 50%,var(--border))}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;min-height:34px;font-size:13px}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card.elev{box-shadow:var(--shadow)}
.card h3{font-size:16px;margin-bottom:10px}
.page-head{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:2px}
.page-head h1{font-size:25px}
.grid{display:grid;gap:12px}
.grid.stats{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.grid.cards{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.stat .v{font-size:26px;font-weight:800;line-height:1.1}
.stat .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:99px;font-size:12px;background:var(--accent-soft);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.chip.plain{background:var(--surface2);color:var(--muted);border-color:var(--border)}
.chip.warn{background:rgba(245,158,11,.14);color:var(--warn);border-color:rgba(245,158,11,.4)}
.chip.bad{background:rgba(239,68,68,.14);color:var(--danger);border-color:rgba(239,68,68,.4)}
.chip.ok{background:rgba(52,211,153,.14);color:var(--good);border-color:rgba(52,211,153,.4)}
button.chip{cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:26px 12px}
.empty .big{font-size:40px;margin-bottom:6px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.list li{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--surface2);border-radius:var(--radius-sm);border:1px solid var(--border);flex-wrap:wrap}
.list li .t{flex:1;min-width:0}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;color:var(--muted);font-weight:600}
.seg button.active{background:var(--accent);color:var(--accent-ink)}
.seg-scroll{overflow-x:auto;max-width:100%;padding-bottom:2px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.seg-scroll .seg{white-space:nowrap}
.note{background:var(--accent-soft);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px}
.note.warnbox{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.4)}
.text-block{white-space:pre-wrap;word-wrap:break-word}
hr.sep{border:0;border-top:1px solid var(--border);margin:16px 0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--border);font-size:14px}
.kv:last-child{border-bottom:0}
.pbar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--border)}
.pbar i{display:block;height:100%;border-radius:99px;transition:width .3s;background:var(--accent)}
pre.code,.code{font-family:var(--mono);font-size:13px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;overflow:auto;white-space:pre;margin:0;color:var(--text);line-height:1.5}
.code.bad{border-left:4px solid var(--danger)} .code.good{border-left:4px solid var(--good)}
code.i{font-family:var(--mono);font-size:.92em;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:0 5px}

/* ---------- Trilha e aulas ---------- */
.level-head{display:flex;gap:10px;align-items:center;margin-top:6px}
.mod{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;text-align:left;width:100%}
.mod:hover{border-color:var(--accent)}
.mod .ic{font-size:26px;flex:0 0 auto}
.mod .tt{flex:1;min-width:0}
.mod.done{border-color:color-mix(in srgb,var(--good) 55%,var(--border))}
.lesson h2{font-size:22px;margin-bottom:6px}
.lesson h3{font-size:17px;margin:18px 0 6px;color:var(--accent)}
.lesson p{margin:8px 0}
.lesson ul{margin:8px 0;padding-left:22px} .lesson li{margin:3px 0}
.term{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border)}
.term:last-child{border-bottom:0}
.term b{flex:0 0 150px;color:var(--accent)}
@media (max-width:520px){.term{flex-direction:column;gap:2px}.term b{flex:none}}

/* ---------- Treino: flashcards, quiz, phishing ---------- */
.flash{min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;padding:26px 18px;cursor:pointer;user-select:none}
.flash .q{font-size:20px;font-weight:700}
.flash .a{font-size:17px;color:var(--accent);white-space:pre-wrap}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{min-height:52px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);font-weight:700;display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;font-size:14px}
.grades button small{font-weight:500;color:var(--muted);font-size:11px}
.grades button.again{color:var(--danger)} .grades button.good{color:var(--good)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);font-size:15px}
.opt:hover{border-color:var(--accent)}
.opt .k{flex:0 0 26px;height:26px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:rgba(52,211,153,.12)} .opt.wrong{border-color:var(--danger);background:rgba(239,68,68,.12)}
.opt[disabled]{cursor:default}
.explain{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 12px;border-radius:0 var(--radius-sm) var(--radius-sm) 0}
.mail{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.mail-head{padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:13px;display:flex;flex-direction:column;gap:2px}
.mail-head b{color:var(--text)} .mail-body{padding:14px;white-space:pre-wrap;word-wrap:break-word}
.mail.sms{max-width:420px;margin:0 auto;border-radius:22px} .mail.wa{max-width:420px;margin:0 auto;border-radius:16px}
.bubble{background:var(--surface2);border-radius:14px 14px 14px 4px;padding:10px 12px;display:inline-block;max-width:100%}
.flags-list{margin:6px 0 0;padding-left:20px} .flags-list li{margin:3px 0}
.scorebar{display:flex;gap:6px;flex-wrap:wrap}
.scorebar i{width:22px;height:8px;border-radius:99px;background:var(--surface2);border:1px solid var(--border)}
.scorebar i.ok{background:var(--good);border-color:var(--good)} .scorebar i.no{background:var(--danger);border-color:var(--danger)}

/* ---------- Laboratório ---------- */
.lab-out{font-family:var(--mono);font-size:13px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;white-space:pre-wrap;word-break:break-all;min-height:44px}
.meter{height:12px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--border)}
.meter i{display:block;height:100%;transition:width .2s}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:420px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.m{font-family:var(--mono);font-size:13px}
.map26{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.map26 div{display:flex;flex-direction:column;gap:2px;align-items:center;font-family:var(--mono);font-size:12px}
.map26 input{width:100%;text-align:center;text-transform:uppercase;padding:6px 2px;min-height:34px;font-size:15px;border:1px solid var(--border);background:var(--surface2);border-radius:8px;color:var(--text)}

/* ---------- CTF, logs, cenários ---------- */
.ctf{display:flex;flex-direction:column;gap:8px}
.ctf.solved{border-color:var(--good)}
.logbox{font-family:var(--mono);font-size:12px;background:#000;color:#9fe8b6;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;overflow:auto;white-space:pre;max-height:340px;line-height:1.55}
.logbox .hl{background:rgba(245,158,11,.25)}
.choice{display:flex;flex-direction:column;gap:8px}

/* ---------- Biblioteca ---------- */
.cmd{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);flex-wrap:wrap}
.cmd code{font-family:var(--mono);font-size:13px;color:var(--accent);flex:1 1 220px;word-break:break-all}
.cmd span{flex:2 1 220px;font-size:14px}
.vuln{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.vuln-head{display:flex;gap:10px;align-items:center;padding:12px 14px;width:100%;text-align:left;border:0;background:none}
.vuln-body{padding:4px 14px 14px;display:flex;flex-direction:column;gap:10px}
.tl{position:relative;padding-left:22px;border-left:3px solid var(--border);display:flex;flex-direction:column;gap:14px;margin-left:6px}
.tl .ev{position:relative}
.tl .ev::before{content:"";position:absolute;left:-30px;top:6px;width:13px;height:13px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}
.tl .yr{font-weight:800;color:var(--accent)}
.badge{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface)}
.badge .bi{font-size:28px;filter:grayscale(1);opacity:.45}
.badge.on{border-color:var(--accent)} .badge.on .bi{filter:none;opacity:1}
.check-row{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm)}
.check-row input{width:20px;height:20px;accent-color:var(--accent);flex:0 0 auto;margin-top:2px}
.check-row.done{opacity:.7} .check-row.done .ct{text-decoration:line-through}

/* ---------- Formulários ---------- */
.form{display:flex;flex-direction:column;gap:14px}
.form-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;grid-column:span 6}
.fld.w3{grid-column:span 3} .fld.w2{grid-column:span 2}
@media (max-width:520px){.fld.w3{grid-column:span 6}}
.fld label{font-size:13px;font-weight:600;color:var(--muted)}
.fld .hint{font-size:12px;color:var(--muted)}
.fld input[type=text],.fld input[type=number],.fld input[type=date],.fld input[type=password],.fld select,.fld textarea,.input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:16px;min-height:42px;outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus,.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fld textarea,textarea.input{resize:vertical;min-height:80px}
textarea.mono,input.mono,.mono{font-family:var(--mono);font-size:14px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters .input{width:auto;flex:1 1 140px;min-width:120px}
.fld.check{flex-direction:row;align-items:center;gap:10px}
.fld.check input{width:20px;height:20px;accent-color:var(--accent)}
.fld.check label{color:var(--text);font-size:14px}
.fld .info{padding:10px 12px;border-radius:var(--radius-sm);background:var(--accent-soft);font-size:13px}
.multi{display:flex;gap:6px;flex-wrap:wrap}
.multi button{border:1px solid var(--border);background:var(--surface2);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;min-height:36px}
.multi button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.form-error{color:var(--danger);font-size:14px}
.form-error:empty{display:none}
input[type=range]{width:100%;accent-color:var(--accent)}

/* ---------- Janelas, avisos, bloqueio ---------- */
.modal-back{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.modal{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:18px;width:100%;max-width:560px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.modal.wide{max-width:780px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal-head h2{font-size:18px}
.modal-body{padding:16px;overflow:auto}
.modal-foot{position:sticky;bottom:0;background:var(--surface);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px;padding-top:12px}
body.modal-open{overflow:hidden}
@media (max-width:560px){.modal-back{align-items:flex-end;padding:0}.modal{max-width:none;border-radius:18px 18px 0 0;max-height:92vh}}
#toast-root{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));z-index:300;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:var(--shadow);max-width:90vw;animation:pop .2s ease}
.toast.err{background:var(--danger);color:#fff}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
#lock{position:fixed;inset:0;z-index:400;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.lockbox{width:100%;max-width:340px;text-align:center;display:flex;flex-direction:column;gap:14px}
.dots{display:flex;gap:12px;justify-content:center;min-height:20px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad button{min-height:60px;font-size:24px;font-weight:700;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface2)}
.keypad button:active{background:var(--accent);color:var(--accent-ink)}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

<script>

'use strict';
/* =====================================================================
   ESCOLA DE SEGURANÇA — estudo e treino de segurança da informação (offline, um único arquivo)
   Do zero ao avançado, misturando teoria e prática. Use o conhecimento só para se proteger,
   para proteger sistemas que você administra ou em laboratórios/CTFs com autorização.
   Módulos: 0 Utilitários · 1 Dados · 2 Interface base · 3 Visuais · 4 Bloqueio (PIN) · 5 Backup
            6 Navegação · 7 Conteúdo (aulas, biblioteca, treino) · 8 Telas e ferramentas · 9 Inicialização
   ===================================================================== */
const APP_ID = 'escola-de-seguranca';
const STORAGE_KEY = 'seguranca:dados';
const PREV_KEY = STORAGE_KEY + ':anterior';
const AUTO_PREFIX = STORAGE_KEY + ':auto:';
const SCHEMA_VERSION = 1;

/* =====================================================================
   0. UTILITÁRIOS
   ===================================================================== */
const $ = (sel, root = document) => root.querySelector(sel);
function mk(ns) {
  return function (tag, attrs, ...kids) {
    const el = ns ? document.createElementNS(ns, tag) : document.createElement(tag);
    if (attrs) {
      for (const k in attrs) {
        const v = attrs[k];
        if (v == null || v === false) continue;
        if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
        else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
        else if (!ns && (k === 'value' || k === 'checked' || k === 'selected')) el[k] = v;
        else el.setAttribute(k, v === true ? '' : String(v));
      }
    }
    appendKids(el, kids);
    return el;
  };
}
function appendKids(el, kids) {
  for (const k of kids) {
    if (k == null || k === false || k === true) continue;
    if (Array.isArray(k)) appendKids(el, k);
    else el.appendChild(k instanceof Node ? k : document.createTextNode(String(k)));
  }
}
const h = mk(null);
const sv = mk('http://www.w3.org/2000/svg');
/* replaceChildren(null) escreveria o texto "null": ignora valores vazios e aceita listas aninhadas */
(function () { const rc = Element.prototype.replaceChildren; Element.prototype.replaceChildren = function (...kids) { return rc.apply(this, kids.flat(Infinity).filter(k => k != null && k !== false && k !== true)); }; })();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const clone = o => JSON.parse(JSON.stringify(o));
const isObj = o => o && typeof o === 'object' && !Array.isArray(o);
function fmtDate(v) {
  if (!v) return '—';
  const s = String(v), m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if (m) return `${m[3]}/${m[2]}/${m[1]}`;
  const d = new Date(s);
  return isNaN(d) ? '—' : `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
}
function fmtDateTime(v) { const d = new Date(v); return isNaN(d) ? '—' : `${fmtDate(v)} às ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
function addDaysISO(iso, n) { const [y, m, d] = iso.split('-').map(Number); const x = new Date(y, m - 1, d + n); return `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}`; }
const fmtNum = (n, dec = 0) => Number(n).toLocaleString('pt-BR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
const plural = (n, um, varios) => `${fmtNum(n)} ${n === 1 ? um : varios}`;
const normText = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
/** busca tolerante: ignora acentos, pontuação e espaços (`wifi` acha `Wi-Fi`) */
function textMatch(hay, q) {
  const a = normText(hay).replace(/[^a-z0-9]+/g, ' '), b = normText(q).replace(/[^a-z0-9]+/g, ' ').trim();
  return !b || a.includes(b) || a.replace(/ /g, '').includes(b.replace(/ /g, ''));
}
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffled = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
/** número pseudo-aleatório estável a partir de um texto (para o "do dia") */
function seedFrom(str) { let hsh = 2166136261; for (let i = 0; i < str.length; i++) { hsh ^= str.charCodeAt(i); hsh = Math.imul(hsh, 16777619); } return hsh >>> 0; }
const seeded = (seed, arr, salt = 0) => arr[(seed + salt * 7919) % arr.length];
function toast(msg, kind) { const t = h('div', { class: 'toast ' + (kind || '') }, msg); $('#toast-root').appendChild(t); setTimeout(() => t.remove(), 3200); }
function downloadBlob(blob, filename) {
  const a = h('a', { href: URL.createObjectURL(blob), download: filename, class: 'hidden' });
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function copyText(text) {
  const fallback = () => { const t = h('textarea', { style: { position: 'fixed', opacity: '0' } }); t.value = text; document.body.appendChild(t); t.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} t.remove(); toast(ok ? 'Copiado!' : 'Não consegui copiar — selecione o texto à mão.', ok ? '' : 'err'); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast('Copiado!'), fallback); else fallback();
}


/* =====================================================================
   1. DADOS (localStorage com versão do formato e migrações)
   ===================================================================== */
const LEVEL_NAMES = ['', 'Fundamentos', 'Intermediário', 'Avançado'];
const XP_LEVELS = [[0, 'Novato'], [100, 'Curioso'], [300, 'Aprendiz'], [700, 'Analista'], [1300, 'Defensor'], [2200, 'Caçador de ameaças'], [3500, 'Especialista'], [5500, 'Mestre da segurança']];

function defaultState() {
  return {
    version: SCHEMA_VERSION,
    meta: { createdAt: new Date().toISOString(), lastBackup: null, theme: 'dark', skin: 'terminal', accent: '', autoBackup: true, name: '', welcomeDismissed: false,
      pinHash: '', pinSalt: '', pinLen: 4, lockOnHide: false, nav: { tab: 'inicio' }, newPerDay: 10, xp: 0 },
    lessons: {},            // idAula -> {done,date,best (melhor % no quiz da aula),practice:[bool]}
    cards: {},              // idCartão -> {ef,reps,interval,due,lapses,last}  (repetição espaçada)
    userCards: [],          // cartões criados por você {id,q,a,tag}
    quiz: { history: [], stats: {}, exams: [] },       // stats[idPergunta] = {ok,bad,last}; exams = simulados feitos
    phish: { stats: {}, best: 0 },          // stats[idMensagem] = {ok,bad}
    linkq: { stats: {}, best: 0 },          // treino "link falso ou verdadeiro"
    ctf: { solved: {}, hints: {}, notebook: [] },   // desafios internos + caderno de CTFs/laboratórios externos
    logs: { done: {} }, scen: { done: {} }, // análise de logs e cenários de decisão
    threat: [],             // modelos de ameaças (STRIDE)
    personal: { check: {}, accounts: [], incidents: [] },
    links: [], cheats: [], pbooks: {},      // links seus, comandos seus, playbooks marcados
    study: { days: [] },    // dias com atividade (sequência de estudo)
    badges: {}              // conquistas ganhas {id: data}
  };
}
const MIGRATIONS = { 0: d => d };
function migrate(d) { let v = Number(d.version) || 0; while (v < SCHEMA_VERSION) { if (MIGRATIONS[v]) d = MIGRATIONS[v](d) || d; v++; d.version = v; } return d; }
function fillDefaults(target, defs) {
  for (const k in defs) {
    const dv = defs[k];
    if (!(k in target) || target[k] == null) target[k] = clone(dv);
    else if (isObj(dv) && isObj(target[k])) fillDefaults(target[k], dv);
    else if (Array.isArray(dv) && !Array.isArray(target[k])) target[k] = clone(dv);
    else if (isObj(dv) && !isObj(target[k])) target[k] = clone(dv);
  }
  return target;
}
const storageStatus = { unavailable: false, tooNew: false, corrupt: false, saveFailed: false };
function loadState() {
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { storageStatus.unavailable = true; }
  if (!raw) return defaultState();
  try {
    let d = JSON.parse(raw);
    if (!isObj(d)) throw new Error('formato');
    if ((Number(d.version) || 0) > SCHEMA_VERSION) { storageStatus.tooNew = true; return fillDefaults(d, defaultState()); }
    if ((Number(d.version) || 0) < SCHEMA_VERSION) { try { localStorage.setItem(PREV_KEY, raw); } catch (e) {} d = migrate(d); }
    return fillDefaults(d, defaultState());
  } catch (e) {
    storageStatus.corrupt = true;
    try { localStorage.setItem(STORAGE_KEY + ':corrompido', raw); } catch (e2) {}
    return defaultState();
  }
}
function saveState() {
  if (storageStatus.tooNew) return;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); storageStatus.saveFailed = false; } catch (e) { storageStatus.saveFailed = true; }
}
let state = loadState();
function commit() { saveState(); render(); }
const hasAnyData = () => Object.keys(state.lessons).length > 0 || Object.keys(state.cards).length > 0 || state.quiz.history.length > 0 || Object.keys(state.ctf.solved).length > 0 || state.ctf.notebook.length > 0 ||
  state.threat.length > 0 || state.personal.accounts.length > 0 || state.personal.incidents.length > 0 || state.userCards.length > 0 || state.links.length > 0 || Object.keys(state.personal.check).length > 0 || state.meta.xp > 0;

/* ---- XP, nível e sequência de estudo ---- */
const levelInfo = (xp = state.meta.xp) => {
  let i = 0; XP_LEVELS.forEach(([min], k) => { if (xp >= min) i = k; });
  const cur = XP_LEVELS[i], next = XP_LEVELS[i + 1];
  return { i, name: cur[1], min: cur[0], next: next ? next[0] : null, nextName: next ? next[1] : null, pct: next ? (xp - cur[0]) / (next[0] - cur[0]) * 100 : 100 };
};
function markStudyDay() { const t = todayISO(); if (!state.study.days.includes(t)) state.study.days.push(t); }
function studyStreak() {
  const days = new Set(state.study.days), sorted = [...days].sort();
  let cur = 0, d = days.has(todayISO()) ? todayISO() : addDaysISO(todayISO(), -1);
  while (days.has(d)) { cur++; d = addDaysISO(d, -1); }
  let best = 0, run = 0, prev = null;
  sorted.forEach(x => { run = prev && addDaysISO(prev, 1) === x ? run + 1 : 1; prev = x; if (run > best) best = run; });
  return { cur, best, total: days.size, today: days.has(todayISO()) };
}
/** Dá XP, registra o dia de estudo e avisa se subiu de nível ou ganhou conquista. Salva, mas não redesenha. */
function award(n, why) {
  const before = levelInfo().i;
  state.meta.xp += Math.max(0, Math.round(n)); markStudyDay();
  const after = levelInfo();
  if (after.i > before) setTimeout(() => toast(`🎉 Novo nível: ${after.name}!`), 250);
  if (typeof checkBadges === 'function') checkBadges();
  saveState();
}

/* =====================================================================
   2. INTERFACE BASE: janelas, confirmações, formulários
   ===================================================================== */
const modalStack = [];
function openModal({ title, body, size = '', onClose }) {
  const lastFocus = document.activeElement;
  const back = h('div', { class: 'modal-back' });
  let closed = false;
  const close = () => {
    if (closed) return; closed = true;
    const i = modalStack.indexOf(api); if (i >= 0) modalStack.splice(i, 1);
    back.remove();
    if (!modalStack.length) document.body.classList.remove('modal-open');
    if (onClose) onClose();
    if (lastFocus && lastFocus.focus) try { lastFocus.focus(); } catch (e) {}
  };
  const box = h('div', { class: 'modal ' + size, role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
    h('div', { class: 'modal-head' }, h('h2', null, title), h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Fechar', onclick: close }, '✕')),
    h('div', { class: 'modal-body' }, body));
  back.appendChild(box);
  $('#modal-root').appendChild(back);
  document.body.classList.add('modal-open');
  const api = { close, el: box };
  modalStack.push(api);
  const first = box.querySelector('input:not([type=checkbox]),textarea,select');
  if (first) setTimeout(() => { try { first.focus(); } catch (e) {} }, 30);
  return api;
}
function closeAllModals() { while (modalStack.length) modalStack[modalStack.length - 1].close(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalStack.length) modalStack[modalStack.length - 1].close(); });

function confirmDialog({ title = 'Confirmar', message, okLabel = 'Confirmar', cancelLabel = 'Cancelar', danger = false }) {
  return new Promise(resolve => {
    let answered = false;
    const answer = v => { if (!answered) { answered = true; resolve(v); } m.close(); };
    const msgs = Array.isArray(message) ? message : [message];
    const m = openModal({ title, onClose: () => { if (!answered) { answered = true; resolve(false); } },
      body: h('div', { class: 'stack' }, msgs.map(t => h('p', null, t)),
        h('div', { class: 'modal-foot' }, cancelLabel ? h('button', { class: 'btn', type: 'button', onclick: () => answer(false) }, cancelLabel) : null,
          h('button', { class: 'btn ' + (danger ? 'danger solid' : 'primary'), type: 'button', onclick: () => answer(true) }, okLabel))) });
  });
}
const infoDialog = (title, message) => confirmDialog({ title, message, okLabel: 'OK', cancelLabel: null });

/**
 * Formulário em janela. Tipos: text, number, date, time, select, textarea, checkbox, info, multi (vários botões), rating (estrelas), password.
 * onSubmit(values) devolve um texto de erro (mantém aberto) ou nada (fecha).
 */
function formModal({ title, fields, submitLabel = 'Salvar', cancelLabel = 'Cancelar', intro, onSubmit, onCancel, size = '' }) {
  const getters = {}, infos = [];
  const errBox = h('div', { class: 'form-error', role: 'alert' });
  const grid = h('div', { class: 'form-grid' });
  const form = h('form', { class: 'form', novalidate: '' });
  const refreshInfos = () => infos.forEach(fn => fn());
  fields.forEach(f => {
    const id = 'f_' + uid() + f.key, wCls = f.width && f.width !== 'full' ? f.width : '';
    const kids = [];
    if (f.type === 'info') {
      const box = h('div', { class: 'info' });
      infos.push(() => { const r = f.compute(readValues()); if (r instanceof Node) box.replaceChildren(r); else box.textContent = r; });
      kids.push(h('label', null, f.label), box);
    } else if (f.type === 'checkbox') {
      const input = h('input', { id, type: 'checkbox' }); input.checked = !!f.value; getters[f.key] = () => input.checked;
      kids.push(input, h('label', { for: id }, f.label));
    } else if (f.type === 'multi') {
      let cur = new Set(f.value || []);
      const wrap = h('div', { class: 'multi', id });
      f.options.forEach(([v, l]) => { const b = h('button', { type: 'button', class: cur.has(v) ? 'on' : '', 'aria-pressed': cur.has(v) }, l); b.addEventListener('click', () => { if (cur.has(v)) cur.delete(v); else cur.add(v); b.classList.toggle('on', cur.has(v)); b.setAttribute('aria-pressed', cur.has(v)); refreshInfos(); }); wrap.appendChild(b); });
      getters[f.key] = () => [...cur];
      kids.push(h('label', null, f.label), wrap);
    } else if (f.type === 'rating') {
      let cur = f.value || 0;
      const wrap = h('div', { class: 'rating', id });
      const paint = () => [...wrap.children].forEach((b, i) => b.classList.toggle('on', i < cur));
      for (let i = 1; i <= 5; i++) { const b = h('button', { type: 'button', 'aria-label': i + ' estrela' + (i > 1 ? 's' : '') }, '★'); b.addEventListener('click', () => { cur = cur === i ? 0 : i; paint(); }); wrap.appendChild(b); }
      paint(); getters[f.key] = () => cur;
      kids.push(h('label', null, f.label), wrap);
    } else {
      let input;
      if (f.type === 'textarea') input = h('textarea', { id, rows: f.rows || 3, placeholder: f.placeholder, maxlength: f.maxlength });
      else if (f.type === 'select') input = h('select', { id }, f.options.map(o => h('option', { value: o.value }, o.label)));
      else {
        const isNum = f.type === 'number';
        input = h('input', { id, type: f.type || 'text', placeholder: f.placeholder, autocomplete: 'off', min: f.min, max: f.max, step: isNum ? 1 : null, inputmode: isNum ? 'numeric' : f.inputmode, maxlength: isNum ? null : (f.maxlength || 200) });
        if (f.suggestions) { const dl = 'dl_' + id; input.setAttribute('list', dl); kids.push(h('datalist', { id: dl }, f.suggestions.map(s => h('option', { value: s })))); }
      }
      input.value = f.value == null ? '' : f.value;
      getters[f.key] = () => { const v = input.value; return f.type === 'number' ? (v.trim() === '' ? null : Number(v)) : (f.type === 'select' ? v : v.trim()); };
      kids.unshift(h('label', { for: id }, f.label + (f.required ? ' *' : '')));
      kids.splice(1, 0, input);
      if (f.hint) kids.push(h('div', { class: 'hint' }, f.hint));
    }
    grid.appendChild(h('div', { class: 'fld ' + wCls + (f.type === 'checkbox' ? ' check' : '') }, kids));
  });
  function readValues() { const v = {}; fields.forEach(f => { if (getters[f.key]) v[f.key] = getters[f.key](); }); return v; }
  function validate(v) {
    for (const f of fields) {
      if (!getters[f.key] || f.type === 'checkbox') continue;
      const val = v[f.key], empty = val == null || val === '' || (Array.isArray(val) && !val.length);
      if (f.required && empty) return `Preencha o campo "${f.label}".`;
      if (f.type === 'number' && !empty) {
        if (!Number.isFinite(val) || !Number.isInteger(val)) return `"${f.label}" precisa ser um número inteiro.`;
        if (f.min != null && val < f.min) return `"${f.label}" deve ser no mínimo ${f.min}.`;
        if (f.max != null && val > f.max) return `"${f.label}" deve ser no máximo ${f.max}.`;
      }
    }
    return '';
  }
  let submitted = false;
  form.append(...[intro ? h('p', { class: 'muted' }, intro) : null, grid, errBox,
    h('div', { class: 'modal-foot' }, h('button', { class: 'btn', type: 'button', onclick: () => m.close() }, cancelLabel), h('button', { class: 'btn primary', type: 'submit' }, submitLabel))].filter(Boolean));
  form.addEventListener('input', refreshInfos);
  form.addEventListener('submit', e => {
    e.preventDefault();
    const v = readValues(), err = validate(v) || onSubmit(v);
    if (err) { errBox.textContent = err; return; }
    submitted = true; m.close();
  });
  const m = openModal({ title, body: form, size, onClose: () => { if (!submitted && onCancel) onCancel(); } });
  refreshInfos();
  return m;
}

/* =====================================================================
   3. VISUAIS (estilos), tema escuro/claro/automático e cor própria
   Paleta: bg, header, surface, surface2, border, text, muted, accent, ink (texto sobre o destaque)
   ===================================================================== */
const P = (bg, header, surface, surface2, border, text, muted, accent, ink) => ({ bg, header, surface, surface2, border, text, muted, accent, ink });
const SKINS = {
  terminal: { name: 'Terminal', desc: 'Preto com verde-néon, estilo console de hacker — o visual padrão.', radius: 14, radiusSm: 10, tabs: 'underline', glow: true, headerGrad: true, bodyGlow: true, shadow: { dark: '0 8px 28px rgba(0,0,0,.55)', light: '0 6px 20px rgba(20,100,60,.14)' },

{ id: 'm01', level: 1, icon: '🛡️', title: 'O que é segurança da informação', mins: 15,
  intro: 'Antes de qualquer ferramenta, você precisa entender o que está sendo protegido, de quem e por quê. Esta aula dá o vocabulário que todo o resto usa.',
  sections: [
    { h: 'Por que isso importa', p: `Quase tudo na sua vida passa por sistemas digitais: conversas, fotos, dinheiro, documentos, trabalho e estudo. A segurança da informação é o conjunto de práticas e tecnologias que protege esses dados e os sistemas que os guardam contra uso indevido, perda e ataque.

Ela não é só "coisa de hacker". Perder um celular, cair num golpe de Pix, usar a mesma senha em tudo ou esquecer de fazer backup são problemas de segurança da informação — e acontecem todo dia.` },
    { h: 'A tríade CIA (CID, em português)', p: `Três propriedades guiam quase tudo na área:

• Confidencialidade: só quem tem permissão pode ver a informação. Exemplo: suas mensagens privadas. Quebra: vazamento de dados.
• Integridade: a informação não é alterada de forma indevida. Exemplo: o valor de uma transferência não pode ser mudado no caminho. Quebra: adulteração de um arquivo ou de um registro.
• Disponibilidade: a informação e os sistemas estão acessíveis quando você precisa. Exemplo: o site do banco funcionando. Quebra: ataque de negação de serviço, ransomware, queda de energia.

Muitos autores acrescentam a autenticidade (ter certeza de quem é quem) e o não repúdio (quem fez algo não consegue negar depois, por exemplo com assinatura digital).` },
    { h: 'Ameaça, vulnerabilidade, risco e controle', p: `Estes quatro termos aparecem juntos o tempo todo:

• Ativo: qualquer coisa que tem valor (dados, equipamentos, contas, reputação).
• Ameaça: algo que pode causar dano (um criminoso, um vírus, uma enchente, um erro humano).
• Vulnerabilidade: uma fraqueza que a ameaça pode explorar (senha fraca, sistema sem atualização, porta aberta).
• Risco: a chance de uma ameaça explorar uma vulnerabilidade e o tamanho do estrago. De forma simples: risco = probabilidade × impacto.
• Controle (ou contramedida): o que reduz o risco (atualizar, usar 2FA, fazer backup, treinar pessoas).

Exemplo: o ativo é sua conta de e-mail; a ameaça é um golpista; a vulnerabilidade é uma senha repetida em outro site que vazou; o risco é alto; o controle é senha única + verificação em duas etapas.` },

• Criminosos comuns: querem dinheiro (golpes, ransomware, roubo de contas).
• Hacktivistas: querem divulgar uma causa (vazamentos, sites pichados).
• Insiders: pessoas de dentro da organização, por erro ou de propósito.
• Espiões e grupos patrocinados por governos: alvos estratégicos, ataques longos e sofisticados.
• Curiosos e iniciantes: usam ferramentas prontas, às vezes sem entender o estrago.

Você também ouve falar em "chapéus": white hat (profissional autorizado, ético), black hat (criminoso) e grey hat (age sem autorização, mas sem fins criminosos claros — ainda assim pode ser ilegal). O que separa o profissional do criminoso não é a técnica: é a autorização.` },
    { h: 'Ética e lei no Brasil', p: `Aprender segurança é legítimo e valioso, mas testar sistemas de terceiros sem autorização é crime.

• Lei 12.737/2012 ("Lei Carolina Dieckmann"): criou o artigo 154-A do Código Penal, que pune a invasão de dispositivo informático alheio para obter, adulterar ou destruir dados.
• Marco Civil da Internet (Lei 12.965/2014): direitos e deveres na internet.
• LGPD (Lei 13.709/2018): protege os dados pessoais e obriga empresas a cuidar deles.

Regra de ouro: pratique só em equipamentos seus, em laboratórios preparados para isso (TryHackMe, Hack The Box, CTFs) ou com autorização escrita do dono do sistema.` }

{ id: 'm02', level: 1, icon: '🔑', title: 'Senhas e autenticação', mins: 18,
  intro: 'A senha ainda é a porta de entrada da maior parte das suas contas. Entenda por que senhas caem e como montar uma defesa em camadas.',
  sections: [
    { h: 'O que faz uma senha ser forte', p: `A força de uma senha vem principalmente do comprimento e da imprevisibilidade, não de truques como trocar "a" por "@".

• Senhas longas (14+ caracteres) são muito mais resistentes a tentativas automáticas do que senhas curtas e "complicadas".
• Frases-senha (5 ou mais palavras sorteadas, como "cavalo-lanterna-bambu-trovao-pirata-gelo") são longas, fáceis de lembrar e fortes. As palavras precisam ser sorteadas: uma frase famosa ou escolhida por você é bem mais fraca.
• Padrões previsíveis (nome + ano, "123456", "qwerty", data de aniversário) caem em segundos porque estão nas listas dos atacantes.
• Nunca reutilize senhas: se um site vaza, os criminosos testam o mesmo e-mail e senha em outros serviços.

Dica prática: use o Laboratório > Senhas deste app para ver estimativas de quanto tempo uma senha levaria para ser quebrada (a análise roda só no seu navegador).` },
    { h: 'Como as senhas são atacadas', p: `• Força bruta: testar todas as combinações possíveis.
• Ataque de dicionário: testar palavras comuns, nomes e variações ("senha123", "Brasil2024!").
• Credential stuffing (preenchimento de credenciais): usar pares de e-mail e senha vazados em um site para tentar entrar em muitos outros.
• Phishing: enganar a pessoa para ela mesma digitar a senha numa página falsa.
• Keyloggers e malware: programas que registram o que você digita.
• Engenharia social e "olhar por cima do ombro".

Repare: nenhum desses precisa "adivinhar" uma senha forte e única. Por isso, a melhor defesa combina senha única + segundo fator.` },
    { h: 'Como um site deve guardar senhas', p: `Um site nunca deve guardar a senha em texto puro. O correto é guardar um hash: o resultado de uma função matemática de mão única. Na hora do login, o site calcula o hash do que você digitou e compara com o guardado.

Para dificultar ataques, usa-se:
• Salt: um valor aleatório diferente para cada usuário, misturado à senha antes do hash. Assim, dois usuários com a mesma senha têm hashes diferentes e tabelas prontas ("rainbow tables") não servem.
• Algoritmos lentos de propósito (bcrypt, scrypt, Argon2, PBKDF2). Hashes rápidos como MD5 ou SHA-1 simples não são adequados para senhas: a placa de vídeo de um atacante testa bilhões por segundo.

Se um site consegue "te enviar sua senha por e-mail", ele a guarda de forma insegura.` },
    { h: 'Segundo fator e gerenciadores de senha', p: `A verificação em duas etapas (2FA/MFA) exige algo além da senha. Do mais fraco ao mais forte:

• Código por SMS: melhor que nada, mas pode ser interceptado (troca de chip, SIM swap).
• Aplicativo autenticador (TOTP, como Google Authenticator, Authy, 2FAS): código que muda a cada 30 segundos.
• Chave de segurança física (FIDO2/WebAuthn, como YubiKey) e passkeys: resistem a phishing, porque só funcionam no site verdadeiro.

Um gerenciador de senhas (Bitwarden, KeePassXC, 1Password etc.) cria e guarda uma senha única e forte para cada site; você só precisa lembrar de uma senha-mestra longa. Ative o 2FA primeiro nas contas mais importantes: e-mail (que recupera todas as outras), banco e redes sociais.` },
    { h: 'Checklist rápido', p: `• Senha-mestra longa (frase) + gerenciador de senhas.
• Uma senha diferente para cada conta.
• 2FA por app ou chave nas contas principais.
• Guarde os códigos de recuperação em local seguro (offline).
• Desconfie de qualquer pedido de senha ou de código recebido por SMS: ninguém legítimo pede isso.
• Verifique se seu e-mail apareceu em vazamentos (serviços como o Have I Been Pwned) e troque as senhas afetadas.` }
  ],
  terms: [['Hash', 'Resultado de uma função de mão única; usado para guardar senhas sem guardar a senha em si.'], ['Salt', 'Valor aleatório misturado à senha antes do hash, para que senhas iguais gerem hashes diferentes.'], ['Força bruta', 'Ataque que testa todas as combinações possíveis.'], ['Credential stuffing', 'Uso de credenciais vazadas de um site para tentar entrar em outros.'],
    ['2FA / MFA', 'Autenticação em dois (ou mais) fatores: algo que você sabe, tem ou é.'], ['TOTP', 'Código de uso único baseado no tempo, gerado por um app autenticador.'], ['Passkey', 'Credencial moderna baseada em chaves criptográficas (FIDO2) que substitui a senha e resiste a phishing.']],
  practice: ['No Laboratório > Senhas, teste 5 senhas diferentes (nada que você realmente use!) e compare a estimativa de quebra de uma senha curta complicada com uma frase longa.', 'Ative a verificação em duas etapas (de preferência por app) na sua conta de e-mail principal.', 'Escolha três contas e verifique se a senha de cada uma é única. Se não for, troque.'],
  quiz: [
    { q: 'Qual característica mais aumenta a força de uma senha?', o: ['Trocar letras por símbolos ("a" por "@")', 'Ter bastante comprimento e ser imprevisível', 'Começar com maiúscula', 'Usar a data de nascimento'], a: 1, e: 'Comprimento e imprevisibilidade pesam mais do que truques de substituição, que os atacantes já conhecem.' },
    { q: 'O que é credential stuffing?', o: ['Adivinhar senhas curtas', 'Usar e-mails e senhas vazados de um site para tentar entrar em outros', 'Instalar um keylogger', 'Quebrar o hash de uma senha'], a: 1, e: 'Por isso reutilizar senhas é perigoso: um vazamento em um site compromete todas as outras contas com a mesma senha.' },
    { q: 'Para que serve o "salt" ao guardar senhas?', o: ['Deixar o hash menor', 'Fazer senhas iguais terem hashes diferentes e inutilizar tabelas prontas', 'Criptografar a senha para poder recuperá-la', 'Aumentar a velocidade do login'], a: 1, e: 'O salt é único por usuário, o que impede reaproveitar cálculos entre contas e derrota rainbow tables.' },
    { q: 'Qual destes segundos fatores resiste melhor a phishing?', o: ['Código por SMS', 'Pergunta de segurança', 'Chave física FIDO2 / passkey', 'Código enviado por e-mail'], a: 2, e: 'Chaves FIDO2 e passkeys só funcionam no site verdadeiro, então uma página falsa não consegue "pescar" o segundo fator.' },
    { q: 'Qual algoritmo é adequado para guardar senhas?', o: ['MD5', 'SHA-1 simples', 'bcrypt / Argon2', 'Base64'], a: 2, e: 'bcrypt, scrypt e Argon2 são lentos de propósito. MD5 e SHA-1 são rápidos demais e Base64 nem é hash.' }
  ],
  cards: [['Por que o comprimento importa mais que símbolos?', 'Cada caractere extra multiplica o número de combinações; trocas previsíveis ("a"→"@") já estão nas listas dos atacantes.'], ['O que é uma frase-senha?', 'Uma senha formada por várias palavras aleatórias: longa, forte e fácil de lembrar.'], ['Por que não reutilizar senhas?', 'Se um site vaza, os criminosos tentam o mesmo e-mail e senha em outros serviços (credential stuffing).'],
    ['Qual a ordem de força dos segundos fatores?', 'SMS < app autenticador (TOTP) < chave física FIDO2 / passkey.'], ['O que um site deve guardar no lugar da senha?', 'Um hash com salt, gerado por algoritmo lento (bcrypt, scrypt, Argon2).'], ['Qual conta proteger primeiro com 2FA?', 'O e-mail principal, porque ele recupera todas as outras contas.']]
},
{ id: 'm03', level: 1, icon: '🎣', title: 'Engenharia social e phishing', mins: 18,
  intro: 'A maioria dos ataques não "quebra" computadores: convence pessoas. Aprender a reconhecer a manipulação é a defesa mais barata que existe.',
  sections: [
    { h: 'Engenharia social: hackear a pessoa', p: `Engenharia social é o uso de manipulação psicológica para fazer alguém entregar informação ou fazer uma ação (clicar, instalar, transferir dinheiro). Funciona porque explora emoções, não falhas de software:

• Urgência: "sua conta será bloqueada em 1 hora".
• Medo: "detectamos atividade suspeita".
• Autoridade: "aqui é do banco / do chefe / da polícia".
• Curiosidade e ganância: "você ganhou um prêmio", "veja quem visitou seu perfil".
• Confiança e ajuda: "mãe, troquei de número, pode fazer um Pix?".` },
    { h: 'Tipos de ataque', p: `• Phishing: mensagens em massa (e-mail) que imitam empresas conhecidas para roubar dados.
• Spear phishing: phishing direcionado a uma pessoa, usando informações reais sobre ela.
• Smishing: phishing por SMS. Vishing: por ligação telefônica.
• Quishing: QR Code malicioso que leva a um site falso.
• Pretexting: criar uma história convincente (um "pretexto") para obter dados.
• Baiting: deixar uma "isca", como um pen drive infectado ou uma oferta irresistível.
• BEC (Business Email Compromise): fraude em que o golpista se passa por um executivo ou fornecedor para pedir pagamento.
• Falsa central de atendimento, golpe do falso Pix e do "novo número no WhatsApp": muito comuns no Brasil.` },
    { h: 'Como identificar uma mensagem suspeita', p: `Olhe estes sinais — um só já merece cuidado:

• Remetente estranho: o nome parece certo, mas o endereço não (suporte@banco-seguro.net em vez do domínio oficial).
• Link que não bate com o texto: passe o mouse (ou segure o dedo) sobre o link e veja o endereço real antes de tocar.
• Urgência, ameaça ou prêmio irresistível.
• Pedido de senha, código de verificação, cartão ou dados que a empresa real nunca pediria por mensagem.
• Anexos inesperados (principalmente .zip, .exe, .scr, documentos pedindo "habilitar macros").
• Saudação genérica ("Prezado cliente") e erros estranhos de português.
• Ligação ou mensagem que você não esperava, vinda de um número desconhecido.

Treine no menu Treino > "Isto é golpe?" com mensagens simuladas.` },
    { h: 'O que fazer (e não fazer)', p: `• Pare e respire: golpistas contam com a pressa.
• Verifique por outro canal: ligue para o número oficial (do cartão, do site digitado por você), nunca pelo contato da mensagem.
• Digite o endereço do site você mesmo, ou use o aplicativo oficial.
• Nunca informe códigos recebidos por SMS ou app: eles são a chave da sua conta.
• Se clicou ou digitou algo: troque a senha imediatamente, ative o 2FA, avise o banco/serviço e veja o playbook "Cliquei num golpe" na Biblioteca.
• Denuncie: marque como phishing no e-mail, avise a empresa imitada e, se houve prejuízo, registre boletim de ocorrência.

Lembre: 2FA ajuda muito, mas golpistas também tentam roubar o código. Quem pede o código está tentando entrar na sua conta.` }
  ],
  terms: [['Phishing', 'Fraude que imita uma fonte confiável para roubar dados ou induzir uma ação.'], ['Spear phishing', 'Phishing direcionado, com informações reais sobre a vítima.'], ['Smishing / Vishing', 'Phishing por SMS / por ligação telefônica.'], ['Quishing', 'Phishing por QR Code.'], ['Pretexting', 'Invenção de uma história convincente para obter informações.'], ['BEC', 'Fraude de e-mail corporativo em que o golpista se passa por executivo ou fornecedor.']],
  practice: ['Faça 10 mensagens em Treino > "Isto é golpe?" e leia o motivo de cada resposta.', 'Abra sua caixa de spam e escolha uma mensagem de golpe. Liste todos os sinais de alerta que você encontra (sem clicar em nada!).', 'Combine com a família uma "palavra de segurança" para confirmar pedidos de dinheiro feitos por mensagem.'],
  quiz: [
    { q: 'Qual característica é típica de uma mensagem de golpe?', o: ['Chega no horário habitual e usa o nome completo', 'Cria urgência e pede que você clique ou informe dados', 'Vem do endereço oficial e não tem links', 'Não pede nada'], a: 1, e: 'Urgência, ameaça e pedido de dados são as alavancas mais usadas pelos golpistas.' },
    { q: 'O que é spear phishing?', o: ['Phishing por ligação', 'Phishing em massa sem alvo', 'Phishing direcionado a uma pessoa específica', 'Um vírus em pen drive'], a: 2, e: 'No spear phishing o golpista pesquisa a vítima e personaliza a mensagem, por isso é mais convincente.' },
    { q: 'Recebeu um SMS do "banco" com um link. O mais seguro é...', o: ['Clicar rápido para evitar o bloqueio', 'Ligar para o número do verso do cartão ou abrir o app oficial', 'Responder o SMS pedindo mais informações', 'Encaminhar a amigos'], a: 1, e: 'Sempre confirme por um canal oficial que você mesmo escolhe, nunca pelos dados da própria mensagem.' },
    { q: 'Alguém ligando como "suporte" pede o código que você acabou de receber por SMS. Isso é...', o: ['Normal, para confirmar sua identidade', 'Uma tentativa de golpe: o código é a chave da sua conta', 'Exigência da LGPD', 'Um teste do banco'], a: 1, e: 'Nenhuma empresa legítima pede códigos de verificação. Quem pede está tentando entrar na sua conta.' },
    { q: 'QR Code malicioso que leva a um site falso é chamado de...', o: ['Smishing', 'Vishing', 'Quishing', 'Baiting'], a: 2, e: 'Quishing combina QR Code e phishing. Desconfie de QR Codes colados sobre outros, em locais públicos ou em e-mails inesperados.' }
  ],
  cards: [['Cite 3 gatilhos emocionais usados em golpes.', 'Urgência, medo, autoridade (também curiosidade, ganância, confiança).'], ['Qual a diferença entre phishing e spear phishing?', 'Phishing é em massa; spear phishing é direcionado a uma pessoa, com dados reais dela.'], ['O que fazer ao receber um pedido urgente do "banco"?', 'Parar e confirmar por canal oficial (número do cartão ou app), nunca pelo link da mensagem.'],
    ['Por que nunca informar o código do SMS?', 'Ele autoriza o acesso à sua conta; quem pede o código está tentando entrar nela.'], ['O que é BEC?', 'Fraude em que o golpista se passa por executivo/fornecedor para pedir pagamentos.'], ['Se você clicou num link de golpe e digitou a senha, o que fazer?', 'Trocar a senha, ativar 2FA, avisar o serviço/banco, revisar a conta e denunciar.']]
},
{ id: 'm04', level: 1, icon: '🦠', title: 'Malware e como se defender', mins: 16,
  intro: 'Malware é software feito para causar dano. Conheça os tipos, como eles chegam e os hábitos que bloqueiam a maior parte deles.',
  sections: [
    { h: 'Tipos de malware', p: `• Vírus: se anexa a arquivos/programas e se espalha quando eles são executados.
• Worm (verme): se espalha sozinho pela rede, sem precisar de ação do usuário.
• Trojan (cavalo de troia): parece um programa legítimo, mas esconde uma função maliciosa.
• Ransomware: criptografa seus arquivos e exige resgate. Muitos também roubam os dados antes ("dupla extorsão").
• Spyware e stalkerware: espionam atividade, mensagens e localização.
• Keylogger: registra o que é digitado.
• Adware: exibe propagandas indesejadas, às vezes invasivas.
• Rootkit: esconde a presença do invasor no sistema.
• Botnet: rede de dispositivos infectados controlados remotamente, usada para ataques de negação de serviço, spam etc.
• Fileless: roda só na memória, usando ferramentas legítimas do sistema, deixando poucos rastros em disco.` },
    { h: 'Como o malware chega', p: `• Anexos e links de phishing.
• Programas piratas, "cracks", geradores de chave e instaladores de sites não oficiais.
• Aplicativos falsos (inclusive em lojas oficiais, embora sejam mais raros).
• Pen drives e dispositivos USB desconhecidos.
• Falhas de segurança em sistemas e programas desatualizados.
• Senhas fracas em serviços expostos (por exemplo, acesso remoto).
• Anúncios maliciosos e sites comprometidos.` },
    { h: 'Ransomware em detalhes', p: `O ransomware costuma entrar por phishing ou por serviços de acesso remoto mal protegidos. Depois de entrar, o atacante se move pela rede, rouba dados, apaga ou criptografa backups que encontrar e só então cifra os arquivos.

Por isso as defesas são em camadas:
• Backups desconectados (offline ou imutáveis) e testados — a regra 3-2-1: 3 cópias, em 2 tipos de mídia, 1 fora do local.
• Atualizações em dia.
• Contas com o mínimo de privilégio (não usar conta de administrador no dia a dia).
• Autenticação forte em acessos remotos.
• Segmentação de rede e monitoramento.

Pagar o resgate não garante recuperar os dados e financia novos ataques.` },
    { h: 'Defesa na prática', p: `• Mantenha sistema, navegador e aplicativos atualizados (ative as atualizações automáticas).
• Use um antivírus/EDR confiável (o do próprio Windows é adequado para a maioria dos usuários, se estiver ligado e atualizado).
• Baixe programas só de fontes oficiais. Evite software pirata.
• Desconfie de anexos inesperados, principalmente os que pedem para "habilitar macros" ou "habilitar conteúdo".
• Use conta comum no dia a dia, e administrador só quando necessário.
• Faça backups 3-2-1 e teste restaurar.
• Não conecte pen drives desconhecidos.

Sinais de infecção: computador lento sem motivo, programas que você não instalou, janelas e propagandas estranhas, arquivos que não abrem ou com extensão trocada, mensagens de resgate. Se suspeitar: desconecte da rede e peça ajuda antes de continuar usando.` }
  ],
  terms: [['Vírus', 'Malware que se anexa a arquivos e se espalha quando eles são executados.'], ['Worm', 'Malware que se propaga sozinho pela rede.'], ['Trojan', 'Programa que parece legítimo, mas esconde função maliciosa.'], ['Ransomware', 'Malware que criptografa dados e exige resgate.'], ['Botnet', 'Rede de dispositivos infectados controlados remotamente.'], ['Backup 3-2-1', 'Três cópias, em dois tipos de mídia, com uma fora do local.']],
  practice: ['Verifique se o antivírus do seu computador está ligado e atualizado, e se as atualizações automáticas do sistema estão ativas.', 'Monte (ou revise) seu backup 3-2-1: onde estão as cópias dos seus arquivos mais importantes? Já testou restaurar um arquivo?', 'Veja na lista de programas do seu computador se há algo que você não reconhece (apenas observe e pesquise, não apague às cegas).'],
  quiz: [
    { q: 'Qual malware se espalha pela rede sozinho, sem precisar que alguém o execute?', o: ['Trojan', 'Worm', 'Adware', 'Keylogger'], a: 1, e: 'Worms se replicam e se propagam automaticamente. Trojans dependem do usuário instalar algo "legítimo".' },
    { q: 'A regra de backup 3-2-1 significa...', o: ['3 senhas, 2 antivírus, 1 firewall', '3 cópias, em 2 tipos de mídia, 1 fora do local', '3 dias, 2 horas, 1 minuto', '3 servidores, 2 nuvens, 1 pen drive'], a: 1, e: 'Mais de uma cópia, em mídias diferentes, e pelo menos uma longe (ou offline) protege de falhas, roubo e ransomware.' },
    { q: 'Um programa que parece útil, mas esconde função maliciosa, é um...', o: ['Worm', 'Trojan', 'Rootkit', 'Botnet'], a: 1, e: 'É o cavalo de troia: promete uma coisa e entrega outra.' },
    { q: 'Qual atitude reduz mais o risco de infecção por programas piratas?', o: ['Desligar o antivírus para o instalador funcionar', 'Baixar só de fontes oficiais e evitar pirataria', 'Usar o modo anônimo do navegador', 'Instalar mais de um antivírus'], a: 1, e: 'Cracks e instaladores piratas são um dos principais caminhos de malware. Fontes oficiais reduzem muito o risco.' },
    { q: 'Seus arquivos foram criptografados e há um pedido de resgate. O primeiro passo é...', o: ['Pagar rapidamente', 'Desconectar o aparelho da rede e pedir ajuda, preservando as evidências', 'Reiniciar várias vezes', 'Apagar tudo e usar normalmente'], a: 1, e: 'Isolar evita que o ataque se espalhe. Pagar não garante a recuperação e incentiva os criminosos.' }
  ],
  cards: [['O que é ransomware?', 'Malware que criptografa seus arquivos e exige resgate (muitas vezes também rouba os dados).'], ['Diferença entre vírus e worm?', 'Vírus precisa ser executado dentro de um arquivo; worm se espalha sozinho pela rede.'], ['O que é uma botnet?', 'Conjunto de dispositivos infectados controlados remotamente, usado em ataques como DDoS.'],
    ['Defesa nº 1 contra ransomware?', 'Backups desconectados e testados (3-2-1), mais atualizações e privilégio mínimo.'], ['Por que não usar conta de administrador no dia a dia?', 'Porque um malware executado herda os privilégios da conta; com conta comum o dano é menor.'], ['O que é malware "fileless"?', 'Malware que roda na memória usando ferramentas legítimas do sistema, deixando poucos rastros em disco.']]
},
{ id: 'm05', level: 1, icon: '🌐', title: 'Redes: o básico que todo mundo precisa', mins: 20,
  intro: 'Para proteger (ou testar) qualquer coisa conectada, você precisa saber como os dados viajam. Esta aula monta o mapa mental das redes.',
  sections: [
    { h: 'Camadas: o modelo TCP/IP e o OSI', p: `Redes são organizadas em camadas, cada uma com uma função. No modelo OSI são 7:

7 Aplicação (HTTP, DNS, SMTP) · 6 Apresentação (formato, criptografia) · 5 Sessão · 4 Transporte (TCP, UDP) · 3 Rede (IP) · 2 Enlace (Ethernet, Wi-Fi, MAC) · 1 Física (cabos, ondas).

Na prática, o modelo TCP/IP agrupa em 4: Aplicação, Transporte, Internet e Acesso à rede. Pensar em camadas ajuda a localizar problemas e ataques: um cabo cortado é camada 1; um endereço IP falsificado é camada 3; uma página que injeta código é camada 7.` },
    { h: 'Endereços e nomes', p: `• Endereço MAC: identificador de fábrica da placa de rede (camada 2), usado na rede local.
• Endereço IP: identifica um dispositivo na rede (IPv4 como 192.168.0.10; IPv6 é mais longo). Endereços privados (192.168.x.x, 10.x.x.x, 172.16–31.x.x) só valem dentro da sua rede.
• NAT: o roteador "traduz" os endereços privados para um único endereço público.
• DHCP: entrega automaticamente um IP aos dispositivos que entram na rede.
• DNS: a "lista telefônica" da internet, que transforma nomes (exemplo.com) em endereços IP. Sequestrar o DNS é uma forma de levar você a sites falsos.
• Porta: número que indica qual serviço no dispositivo deve receber o dado (80 HTTP, 443 HTTPS, 22 SSH, 53 DNS).` },
    { h: 'TCP, UDP e HTTP/HTTPS', p: `• TCP: confiável. Estabelece conexão (handshake de três vias: SYN, SYN-ACK, ACK), confirma entregas e reordena. Usado em web, e-mail, transferência de arquivos.
• UDP: rápido e sem garantia. Usado em chamadas de voz/vídeo, jogos, DNS.
• HTTP: protocolo da web; os dados viajam em texto claro e podem ser lidos por quem estiver no caminho.
• HTTPS: HTTP dentro de uma conexão criptografada (TLS). Protege contra espionagem e alteração no caminho e confirma a identidade do site por meio de certificado. O cadeado não significa que o site é "confiável", apenas que a conexão é criptografada com o domínio mostrado.` },
    { h: 'Wi-Fi, VPN e firewall', p: `• Wi-Fi: use WPA2 ou, melhor, WPA3 com senha longa. WEP e redes abertas são inseguras. Troque a senha padrão do roteador e o login de administração.
• Redes públicas (aeroporto, café): outras pessoas podem ser donas de redes falsas parecidas ("evil twin") ou observar o tráfego. Prefira o 4G/5G ou use VPN, e confie em HTTPS.
• VPN: cria um túnel criptografado entre você e outra rede (da empresa ou de um provedor). Ela esconde seu tráfego da rede local, mas você passa a confiar no provedor da VPN.
• Firewall: filtra o tráfego conforme regras (quem pode falar com quem, em qual porta). A boa prática é negar tudo por padrão e liberar só o necessário.` },
    { h: 'Seu roteador de casa', p: `O roteador é a porta de entrada da sua casa digital. Faça uma revisão:

• Troque a senha de administração e o nome da rede padrão.
• Use WPA2/WPA3 e uma senha de Wi-Fi longa.
• Mantenha o firmware atualizado e desative o acesso remoto à administração, se não usar.
• Desative WPS (conexão por botão/PIN), que tem falhas conhecidas.
• Crie uma rede de convidados para visitas e aparelhos "inteligentes" (IoT).` }
  ],
  terms: [['IP', 'Endereço que identifica um dispositivo em uma rede.'], ['DNS', 'Sistema que traduz nomes de sites em endereços IP.'], ['Porta', 'Número que indica qual serviço deve receber o tráfego em um dispositivo.'], ['TCP / UDP', 'Protocolos de transporte: TCP confiável com conexão; UDP rápido sem garantia.'], ['HTTPS / TLS', 'Web com conexão criptografada e identidade do site verificada por certificado.'], ['VPN', 'Túnel criptografado entre seu dispositivo e outra rede.'], ['Firewall', 'Filtro que permite ou bloqueia tráfego segundo regras.']],
  practice: ['No seu computador, descubra seu IP privado (Windows: ipconfig; Linux/Mac: ip a ou ifconfig) e seu gateway (o roteador).', 'Entre na página de administração do seu roteador e verifique: tipo de criptografia do Wi-Fi, se a senha padrão foi trocada e a versão do firmware.', 'Abra um site HTTPS, clique no cadeado e veja quem emitiu o certificado e até quando vale.'],
  quiz: [
    { q: 'Em qual camada do modelo OSI atua o protocolo IP?', o: ['Física', 'Enlace', 'Rede', 'Aplicação'], a: 2, e: 'IP é da camada 3 (Rede), responsável pelo endereçamento e roteamento entre redes.' },
    { q: 'Qual a principal função do DNS?', o: ['Criptografar o tráfego', 'Traduzir nomes de sites em endereços IP', 'Entregar IPs automaticamente', 'Bloquear anúncios'], a: 1, e: 'DNS é a "lista telefônica" da internet. DHCP é quem entrega IPs.' },
    { q: 'O cadeado do navegador em um site indica que...', o: ['O site é totalmente seguro e honesto', 'A conexão é criptografada com aquele domínio', 'O site não tem vírus', 'O dono é verificado pelo governo'], a: 1, e: 'HTTPS protege a conexão. Sites de golpe também podem ter cadeado: confira sempre o endereço.' },
    { q: 'Qual destas configurações de Wi-Fi é a mais segura?', o: ['Rede aberta', 'WEP', 'WPA2 com senha longa', 'WPS com PIN'], a: 2, e: 'WPA2 (ou WPA3) com senha longa. WEP é quebrado em minutos; redes abertas não protegem nada; WPS tem falhas.' },
    { q: 'A boa prática para regras de firewall é...', o: ['Permitir tudo e bloquear só o que for ruim', 'Negar tudo por padrão e liberar apenas o necessário', 'Desligar o firewall em redes confiáveis', 'Bloquear só a porta 80'], a: 1, e: 'O princípio de "negar por padrão" reduz a superfície de ataque.' }
  ],
  cards: [['Quantas camadas tem o modelo OSI?', 'Sete: Física, Enlace, Rede, Transporte, Sessão, Apresentação, Aplicação.'], ['O que faz o DHCP?', 'Entrega automaticamente endereço IP e configurações aos dispositivos da rede.'], ['TCP ou UDP: qual é confiável?', 'TCP (com handshake e confirmação). UDP é rápido e sem garantias.'],
    ['Portas comuns: 22, 53, 80, 443?', '22 SSH, 53 DNS, 80 HTTP, 443 HTTPS.'], ['O que é NAT?', 'Tradução de endereços privados em um endereço público pelo roteador.'], ['O que protege o HTTPS?', 'Criptografa a conexão e confirma a identidade do domínio; não garante que o site seja honesto.']]
},
{ id: 'm06', level: 1, icon: '🕵️', title: 'Privacidade e segurança pessoal', mins: 17,
  intro: 'Segurança também é decidir o que você compartilha. Esta aula junta privacidade, LGPD e hábitos digitais do dia a dia.',
  sections: [
    { h: 'Seus dados e a LGPD', p: `A Lei Geral de Proteção de Dados (LGPD, Lei 13.709/2018) diz que dados pessoais (nome, CPF, e-mail, localização, hábitos) pertencem à pessoa. Empresas só podem usá-los com uma base legal (consentimento, cumprimento de lei, contrato etc.) e para finalidades claras.

Você tem direitos como: saber se seus dados são tratados, acessar, corrigir, pedir a eliminação (em certos casos), revogar o consentimento e pedir portabilidade. A ANPD (Autoridade Nacional de Proteção de Dados) fiscaliza.

Dica prática: antes de aceitar um app ou cadastro, pergunte: "precisam mesmo desses dados?". Dê o mínimo necessário (minimização).` },
    { h: 'Pegada digital e OSINT', p: `Tudo o que você publica forma uma "pegada digital". OSINT (inteligência de fontes abertas) é o uso de informações públicas — redes sociais, fotos, perfis — para descobrir coisas sobre alguém, inclusive golpistas preparando um golpe sob medida.

Cuidados:
• Perfis privados e revisão de quem pode ver suas publicações.
• Não poste documentos, boletos, cartões, passagens (com código de reserva) e a rotina da casa.
• Fotos têm metadados (EXIF): câmera, data e às vezes a localização exata. Muitas redes removem, mas nem sempre.
• Cuidado com testes e "brincadeiras" que perguntam nome do pet, escola, primeiro carro: costumam coincidir com perguntas de segurança.` },
    { h: 'Aparelhos e contas no dia a dia', p: `• Bloqueio de tela com PIN longo ou biometria; criptografia do aparelho ligada.
• Atualizações do sistema e dos apps sempre em dia.
• Instale apps só das lojas oficiais e revise permissões (um app de lanterna não precisa dos seus contatos).
• Ative "encontrar meu dispositivo" e saiba apagar o aparelho remotamente.
• Cuidado com Wi-Fi público e com carregadores/USBs desconhecidos.
• Revise de tempos em tempos os dispositivos conectados às suas contas e saia dos que não reconhece.
• Cobertura da webcam e microfone: cuidado com apps que pedem acesso sem motivo.` },
    { h: 'Backup, golpes financeiros e crianças online', p: `• Backup 3-2-1 das fotos e documentos importantes.
• Pix e bancos: confira nome e valor antes de confirmar, ative limites noturnos e use o recurso de bloqueio do app do banco. Desconfie de "pagamentos para liberar prêmio ou empréstimo".
• Compras online: use sites conhecidos, cartão virtual quando possível e desconfie de preços muito abaixo do mercado.
• Crianças e adolescentes: conversem sobre cyberbullying, golpes de jogos (venda de contas, "gift cards"), contato com estranhos e o que nunca se compartilha (endereço, escola, fotos íntimas). Se algo der errado, o caminho é pedir ajuda a um adulto de confiança; ninguém deve ser culpado por ter sido enganado.` }
  ],
  terms: [['Dado pessoal', 'Informação relacionada a uma pessoa identificada ou identificável.'], ['LGPD', 'Lei Geral de Proteção de Dados (Lei 13.709/2018).'], ['ANPD', 'Autoridade Nacional de Proteção de Dados, que fiscaliza a LGPD.'], ['Minimização', 'Princípio de coletar e compartilhar só o mínimo de dados necessário.'], ['OSINT', 'Inteligência a partir de fontes abertas (informações públicas).'], ['Metadados (EXIF)', 'Informações escondidas em arquivos, como câmera, data e localização.']],
  practice: ['Abra as configurações de privacidade de uma rede social e deixe visível só o necessário.', 'Revise as permissões dos apps do seu celular: remova localização, microfone e contatos de quem não precisa.', 'Procure seu próprio nome e e-mail em um buscador e veja o que está público sobre você.'],
  quiz: [
    { q: 'O princípio de "minimização" da LGPD significa...', o: ['Guardar os dados pelo máximo de tempo', 'Coletar e usar só os dados necessários para a finalidade', 'Compartilhar os dados com parceiros', 'Apagar dados todo mês'], a: 1, e: 'Menos dados coletados significa menos risco em caso de vazamento.' },
    { q: 'Qual órgão fiscaliza o cumprimento da LGPD no Brasil?', o: ['Anatel', 'ANPD', 'Banco Central', 'Procon'], a: 1, e: 'A ANPD (Autoridade Nacional de Proteção de Dados) é a responsável.' },
    { q: 'Por que "brincadeiras" que perguntam o nome do pet e o primeiro carro são arriscadas?', o: ['Elas consomem dados', 'Podem revelar respostas de perguntas de segurança', 'Elas instalam vírus sempre', 'São proibidas por lei'], a: 1, e: 'Essas respostas costumam ser usadas para recuperar senhas. Quanto menos você expõe, melhor.' },
    { q: 'Metadados EXIF de uma foto podem conter...', o: ['A senha do celular', 'Modelo da câmera, data e, às vezes, a localização', 'O CPF do dono', 'Os contatos do aparelho'], a: 1, e: 'Por isso é importante remover ou limitar metadados de fotos compartilhadas.' },
    { q: 'Antes de instalar um app, o mais prudente é...', o: ['Aceitar todas as permissões', 'Revisar as permissões e instalar da loja oficial', 'Baixar de qualquer site para economizar', 'Desativar as atualizações'], a: 1, e: 'Permissões demais são um sinal de alerta, e lojas oficiais reduzem (não eliminam) o risco.' }
  ],
  cards: [['O que é um dado pessoal?', 'Informação relacionada a uma pessoa identificada ou identificável (nome, CPF, e-mail, localização...).'], ['Cite 3 direitos do titular na LGPD.', 'Acessar, corrigir, pedir eliminação, revogar consentimento, portabilidade (entre outros).'], ['O que é OSINT?', 'Obtenção de informação a partir de fontes públicas, usada por investigadores e também por golpistas.'],
    ['O que são metadados EXIF?', 'Dados embutidos nas fotos: câmera, data e possivelmente local.'], ['Por que revisar permissões de apps?', 'Apps com acesso demais (contatos, microfone, localização) ampliam o risco de abuso e vazamento.'], ['Primeiro passo se alguém foi enganado online?', 'Acolher, não culpar, e agir rápido: trocar senhas, avisar banco/serviço, guardar provas e denunciar.']]
}
];
